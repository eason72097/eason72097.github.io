<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="台灣資金駕駛艙：錢從哪來、去了哪裡、板塊怎麼輪動。資料截至 2026-09-18。">
<style>:root{color-scheme:light dark}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>台灣資金駕駛艙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F4F0; --surface:#FFFFFF; --surface-2:#E9ECE6; --line:#D5DAD3; --line-strong:#B9C1B8;
  --ink:#1A2529; --ink-2:#4A575B; --muted:#6E7A7D;
  --accent:#A9772A; --accent-ink:#7E571A; --accent-soft:#F2E7CF;
  --flow:#2C6E72; --flow-soft:#D9EBEA;
  --good:#2B7A4B; --good-soft:#DCEEDF; --warn:#96680F; --warn-soft:#F6E9C8; --crit:#B5433B; --crit-soft:#F5DCD9;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
  --pos:#e34948; --neg:#2a78d6; --mid:#f0efec; --heat-ink-strong:#1A2529; --grid:#E3E6E0;
  --shadow:0 1px 2px rgba(26,37,41,.06),0 8px 24px rgba(26,37,41,.06);
  --font-head:"Schibsted Grotesk","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,"Noto Sans TC","PingFang TC",monospace;
  --radius:10px; --reserve:0px; --side:224px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1719; --surface:#162226; --surface-2:#1D2C31; --line:#2A3A40; --line-strong:#3B4E55;
    --ink:#E5EBE8; --ink-2:#B7C3C3; --muted:#8C9B9C;
    --accent:#D9AE55; --accent-ink:#E8C57A; --accent-soft:#3A2F17;
    --flow:#63B3B7; --flow-soft:#1B3538;
    --good:#5DBB82; --good-soft:#173324; --warn:#E0AA3E; --warn-soft:#3A2D12; --crit:#E1746B; --crit-soft:#3E1F1C;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
    --pos:#e66767; --neg:#3987e5; --mid:#2B3A3F; --heat-ink-strong:#0F1719; --grid:#24343A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#162226; --surface-2:#1D2C31; --line:#2A3A40; --line-strong:#3B4E55;
  --ink:#E5EBE8; --ink-2:#B7C3C3; --muted:#8C9B9C;
  --accent:#D9AE55; --accent-ink:#E8C57A; --accent-soft:#3A2F17;
  --flow:#63B3B7; --flow-soft:#1B3538;
  --good:#5DBB82; --good-soft:#173324; --warn:#E0AA3E; --warn-soft:#3A2D12; --crit:#E1746B; --crit-soft:#3E1F1C;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --pos:#e66767; --neg:#3987e5; --mid:#2B3A3F; --heat-ink-strong:#0F1719; --grid:#24343A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
@media (min-width:1280px){:root[data-reserve="on"]{--reserve:340px}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased;text-autospace:normal}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:clamp(1.45rem,2.6vw,1.8rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
h4{font-size:.95rem;font-weight:700;margin:14px 0 6px}
p{margin:0;line-break:strict;text-wrap:pretty;overflow-wrap:anywhere}
a{color:var(--flow);text-decoration-thickness:1px;text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.en{font-family:var(--font-mono);font-size:.84em;color:var(--ink-2)}
.eyebrow{font-family:var(--font-head);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.muted{color:var(--muted)} .small{font-size:.86rem}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:calc(100vw - var(--reserve));padding:9px 20px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--font-head);font-size:1.05rem}
.brand .snap{font-family:var(--font-mono);font-size:.76rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);font-size:.82rem;padding:4px 11px;border-radius:999px;cursor:pointer;line-height:1.4;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.sib{font-size:.82rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line-strong);border-radius:999px;padding:4px 12px;background:var(--surface);white-space:nowrap}
.navbtn{display:none}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);gap:28px;max-width:min(1360px,calc(100vw - var(--reserve)));padding:0 20px;margin:0}
:root[data-reserve="off"] .shell,:root[data-reserve="off"] .top-in{margin-inline:auto;max-width:1360px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;max-height:calc(100vh - 70px);overflow-y:auto;padding:18px 0 24px;scrollbar-width:thin}
.side .grp{margin-bottom:14px}
.side .grp>span{display:block;font-family:var(--font-head);font-size:.68rem;letter-spacing:.14em;color:var(--muted);font-weight:700;padding:0 10px 4px}
.side a{display:block;text-decoration:none;color:var(--ink-2);font-size:.9rem;padding:4px 10px;border-radius:7px;line-height:1.5;border-left:3px solid transparent}
.side a:hover{background:var(--surface-2)}
.side a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;border-left-color:var(--accent);box-shadow:var(--shadow)}
.side a small{display:block;font-family:var(--font-mono);font-size:.68rem;color:var(--muted);font-weight:400;line-height:1.3}
main{padding:22px 0 90px;min-width:0}
.room{display:grid;gap:18px;min-width:0}
.room>*{min-width:0}
.room-head{display:grid;gap:8px;max-width:46em}
.room-head .q{color:var(--ink-2);font-size:1.02rem}
.ctx{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.8rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;text-decoration:none;color:var(--ink-2);padding:2px 10px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);line-height:1.6;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip.node{border-style:dashed}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* generic components */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
.card.lift{box-shadow:var(--shadow)}
.card.grid{align-content:start}
.note{background:var(--surface-2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.93rem}
.mis{padding:9px 13px;background:var(--crit-soft);border-radius:7px;font-size:.92rem}
.mis b{color:var(--crit);margin-right:4px}
.blind{padding:9px 13px;background:var(--flow-soft);border-radius:7px;font-size:.92rem}
.blind b{color:var(--flow);margin-right:4px}
.how{border-top:1px dashed var(--line-strong);padding-top:9px;font-size:.92rem;color:var(--ink-2)}
.how .lbl{display:inline-block;margin-right:8px;font-family:var(--font-head);font-size:.7rem;letter-spacing:.1em;color:var(--accent-ink);font-weight:700}
body.eat .how, body.eat .fish-only{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;padding:1px 9px;border-radius:999px;font-weight:600;line-height:1.7;white-space:nowrap}
.pill::before{font-size:.7em}
.pill.calm{background:var(--good-soft);color:var(--good)} .pill.calm::before{content:"○"}
.pill.watch{background:var(--warn-soft);color:var(--warn)} .pill.watch::before{content:"◐"}
.pill.alert{background:var(--crit-soft);color:var(--crit)} .pill.alert::before{content:"●"}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.hd,.tag{display:inline-block;font-family:var(--font-head);font-size:.66rem;font-weight:700;letter-spacing:.04em;line-height:1.5;padding:0 5px;border-radius:4px;margin:0 2px;vertical-align:.12em;white-space:nowrap}
.hd{border:1px solid var(--line-strong);color:var(--ink-2)}
.hd-sys{border-color:var(--ink-2)} .hd-off{border-color:var(--flow);color:var(--flow)} .hd-mkt{border-color:var(--accent);color:var(--accent-ink)}
.hd-est{border-style:dashed;color:var(--ink-2)} .hd-unc{border-style:dashed;border-color:var(--crit);color:var(--crit)}
.tag.src{background:var(--surface-2);color:var(--muted)} .tag.inf{background:var(--accent-soft);color:var(--accent-ink)} .tag.add{background:var(--flow-soft);color:var(--flow)}
p.src,.srcline{font-size:.78rem;color:var(--muted)} p.src a,.srcline a{color:var(--muted)}
a.ind{color:inherit;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--flow);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer}
a.ind:hover{color:var(--flow);text-decoration-style:solid}
.list,.takeaways{margin:0;padding-left:1.25em;display:grid;gap:5px}
.steps{margin:0;padding-left:1.4em;display:grid;gap:5px}

/* room content */
.room-lede{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:grid;gap:12px;box-shadow:var(--shadow)}
.room-lede .verdict{font-size:1.03rem;font-weight:500}
.room-lede .takeaways{font-size:.94rem;color:var(--ink-2)}
.room-lede .takeaways b{color:var(--ink)}
details.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);scroll-margin-top:72px}
details.blk>summary{list-style:none;cursor:pointer;padding:13px 44px 13px 18px;display:grid;gap:2px;position:relative}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary::after{content:"";position:absolute;right:20px;top:22px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.blk[open]>summary::after{transform:rotate(-135deg);top:26px}
details.blk>summary .h{font-family:var(--font-head);font-weight:700;font-size:1.02rem}
details.blk>summary .sum{font-size:.88rem;color:var(--ink-2);line-height:1.6}
details.blk[open]>summary .h{color:var(--accent-ink)}
details.blk[open]>summary{border-bottom:1px solid var(--line)}
details.blk>.body{padding:16px 18px 18px;display:grid;gap:12px;font-size:.95rem}
details.blk>.body>*,details.sub>.body>*{min-width:0}
details.blk.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
details.sub{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
details.sub>summary{cursor:pointer;padding:8px 12px;font-weight:600;font-size:.92rem}
details.sub[open]>summary{border-bottom:1px solid var(--line);color:var(--accent-ink)}
details.sub>.body{padding:12px;display:grid;gap:10px;font-size:.93rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:grid;gap:1px}
.kpi .k{font-size:.74rem;color:var(--muted);line-height:1.5}
.kpi .v{font-family:var(--font-mono);font-size:1.08rem;font-weight:500;line-height:1.35}
.kpi .d{font-size:.74rem;color:var(--ink-2);line-height:1.5}
.ev3{display:grid;gap:0;margin:0}
.ev3>div{display:grid;grid-template-columns:64px 1fr;gap:10px;font-size:.92rem;padding:7px 0;border-top:1px solid var(--line)}
.ev3 dt{font-family:var(--font-head);font-size:.76rem;font-weight:700;color:var(--accent-ink);padding-top:3px}
.ev3 dd{margin:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.86rem;line-height:1.6}
table.narrow{min-width:0}
th{text-align:left;font-family:var(--font-head);font-size:.74rem;letter-spacing:.04em;color:var(--muted);padding:8px 11px;border-bottom:1px solid var(--line-strong);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
td.name{min-width:130px;font-weight:500}
td.name small,td small{display:block;font-family:var(--font-mono);font-size:.72rem;color:var(--muted);font-weight:400}
.timeline{display:grid;gap:0}
.timeline .ev{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.timeline .ev .dt{font-family:var(--font-mono);color:var(--accent-ink);font-size:.82rem;padding-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-size:.88rem;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);padding:6px 13px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.pane{display:grid;gap:14px;min-width:0}
.pane>*{min-width:0}

/* charts */
figure.chart{margin:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px;display:grid;gap:8px;min-width:0}
.ch-title{font-family:var(--font-head);font-weight:700;font-size:.92rem;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.ch-title .u{font-family:var(--font-mono);font-weight:400;font-size:.74rem;color:var(--muted)}
.ch-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--ink-2)}
.ch-legend span{display:inline-flex;align-items:center;gap:6px}
.ch-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.ch-legend i.ln{height:3px;border-radius:2px;width:16px}
.ch-body{position:relative;min-width:0}
.ch-body svg{display:block;width:100%;height:auto;overflow:visible}
.ch-scroll{overflow-x:auto}
.ch-note{font-size:.84rem;color:var(--ink-2)}
.ch-foot{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:.76rem;color:var(--muted)}
.ch-foot button{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;font-size:.74rem;padding:1px 8px;cursor:pointer;color:var(--ink-2)}
.ch-table{max-height:320px;overflow:auto}
svg text{font-family:var(--font-mono);font-size:10.5px;fill:var(--muted)}
svg .axl{fill:var(--ink-2)}
svg .gridl{stroke:var(--grid);stroke-width:1}
svg .basel{stroke:var(--line-strong);stroke-width:1}
svg .dl{font-family:var(--font-body);font-size:11px;fill:var(--ink-2)}
.hb{display:grid;gap:5px}
.hb-row{display:grid;grid-template-columns:minmax(96px,30%) 1fr;gap:10px;align-items:center;font-size:.84rem}
.hb-row .nm{text-align:right;color:var(--ink-2);line-height:1.35}
.hb-row .nm small{display:block;font-size:.7rem;color:var(--muted)}
.hb-row .tr{position:relative;height:18px}
.hb-row .tr i{position:absolute;top:2px;bottom:2px;border-radius:0 4px 4px 0;background:var(--c1);min-width:2px}
.hb-row .tr i.neg{background:var(--neg);border-radius:4px 0 0 4px}
.hb-row .tr i.posd{background:var(--pos)}
.hb-row .tr b{position:absolute;top:0;font-family:var(--font-mono);font-size:.76rem;font-weight:500;color:var(--ink);line-height:18px;white-space:nowrap;padding:0 6px}
.heat{border-collapse:separate;border-spacing:2px;min-width:0;width:auto;font-size:.76rem}
.heat th{position:static;background:transparent;border:0;padding:2px 6px;font-size:.72rem;letter-spacing:0;color:var(--ink-2);font-weight:600}
.heat th.rot{vertical-align:bottom;text-align:center;padding:4px 0;font-weight:500}
.heat th.rot .vl{display:inline-flex;flex-direction:column;align-items:center;line-height:1.12}
.heat th.rot .vl .lat{writing-mode:vertical-rl;line-height:1;margin:1px 0}
.heat td{border:0;padding:0;text-align:center;font-family:var(--font-mono);border-radius:3px;min-width:34px;height:24px;line-height:24px;color:var(--ink);cursor:default}
.heat td.sm{min-width:17px;width:17px;height:17px;line-height:17px;cursor:pointer;border-radius:2px}
.heat td.strong{color:var(--heat-ink-strong);font-weight:500}
.heat td.sel{outline:2px solid var(--ink);outline-offset:0}
.heat th.rn{text-align:right;white-space:nowrap;font-weight:500}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;line-height:1.55;padding:7px 10px;border-radius:7px;max-width:300px;box-shadow:var(--shadow);opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip b{display:block;font-family:var(--font-head)}
.tip .r{display:flex;gap:10px;justify-content:space-between;font-family:var(--font-mono);font-size:.76rem}
.tip .r i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

/* home */
.hero{display:grid;gap:12px}
.hero .lede{color:var(--ink-2);max-width:44em}
.chain{display:grid;gap:0;counter-reset:ch}
.chain .lk{display:grid;grid-template-columns:128px 1fr;gap:14px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.chain .lk:first-child{border-top:0}
.chain .lk:hover .k{color:var(--accent-ink)}
.chain .lk .k{font-family:var(--font-head);font-weight:700;font-size:.86rem;color:var(--ink-2);padding-top:2px}
.chain .lk .k::before{counter-increment:ch;content:counter(ch);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent-ink);font-size:.72rem;margin-right:7px;font-family:var(--font-mono)}
.chain .lk p{font-size:.95rem}
.chain .lk .nd{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.map-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;overflow-x:auto}
.map-wrap svg{display:block;width:100%;min-width:760px;height:auto}
.map-hint{font-size:.8rem;color:var(--muted)}
.gnode{cursor:pointer}
.gnode rect{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.25;transition:stroke .12s}
.gnode:hover rect,.gnode:focus-visible rect{stroke:var(--accent);stroke-width:2}
.gnode.sel rect{stroke:var(--ink);stroke-width:2.25;fill:var(--accent-soft)}
.gnode.dim{opacity:.35}

<footer>台灣資金駕駛艙・資料截至 2026-09-18（週五收盤）・與「資金流向駕駛艙」（美國版）為同一系列。本頁整理公開資訊供學習判讀，不是投資建議，也不預測價格。</footer>
<template id="tpl-A1-room"><div class="room-lede">
  <p class="verdict">台灣每年靠出口賺進一大筆美元（2025 年<a class="ind" data-ind="ca">經常帳順差</a> 1,844 億美元，約 GDP 的 19.5%），但這筆錢絕大部分以應收帳款、海外設廠、買國外股債的形式留在國外，只有一小部分變成央行的外匯存底。外資買賣台股的金額小一個量級，而且這幾年淨方向是流出（資料至 2026-09-18）。</p>
  <ul class="takeaways">
    <li><b>錢怎麼進來</b>：主要是出口貨款，加上<a class="ind" data-ind="primary_income">海外投資收益</a>。2026 上半年經常帳順差 1,210 億美元，是歷年同期新高。</li>
    <li><b>錢怎麼又出去</b>：同期<a class="ind" data-ind="fa">金融帳淨流出</a> 1,181 億美元，幾乎等於順差。最大的一項是出口後還沒收回的貨款，不是外資。</li>
    <li><b>新台幣為什麼沒升</b>：出口貨款匯回後只有 2.2% <a class="ind" data-ind="fxsettle">當下換成新台幣</a>，其餘先存成<a class="ind" data-ind="fxdep">外匯存款</a>；美元利率比較高，企業不急著換。</li>
    <li><b>外資數字要先問口徑</b>：<a class="ind" data-ind="fini_flow_fsc">金管會</a>說 1–8 月淨匯入 905 億美元，<a class="ind" data-ind="fini_flow_twse">證交所</a>卻是賣超 1.41 兆元。兩個都沒錯，差在獲利與股利匯出算不算。</li>
    <li><b>脆弱點在存量</b>：<a class="ind" data-ind="fini_ratio">外資持有部位相當於外匯存底的 309%</a>（15 個月前是 139%）。外資賣同樣比例的持股，對<a class="ind" data-ind="usdtwd">匯率</a>的衝擊是一年前的兩倍多。</li>
  </ul>
</div>

<details class="blk" id="a1-forms" open>
  <summary><span class="h">流入台灣的錢有哪幾種形式？</span><span class="sum">最大的是出口貨款，其次是海外投資收益；外資買股與來台設廠金額小得多，而且外資這幾年是淨賣出。</span></summary>
  <div class="body">
    <p>直接回答：主要有四種。依 2025 年金額排序：<b>商品出口賺的貨款</b>（貿易順差 1,789 億美元）、<b>海外投資收益</b>（<a class="ind" data-ind="primary_income">初次所得</a>，扣掉外資領走的股利後淨收 264 億美元）、<b>外人來台直接投資</b>（110 億美元）、<b>外資買台灣的股票與債券</b>（買債 +22 億；買股是 −178 億美元，也就是淨賣出）。前兩項是賺來的，後兩項是別人拿來投資的。</p>
    <p>這些進出都記在央行每季編製的國際收支（<span class="en">balance of payments</span>），分三塊：<a class="ind" data-ind="ca">經常帳</a>記賺的，<a class="ind" data-ind="fa">金融帳</a>記錢拿去放哪裡，準備資產記央行收下的（累積起來就是<a class="ind" data-ind="reserves">外匯存底</a>）。</p>
    <details class="sub"><summary>三塊帳各記什麼</summary><div class="body">
      <ul class="list">
        <li><b>經常帳（<span class="en">current account</span>）</b>：商品貿易、服務（運費、出國旅行、權利金）、初次所得（<span class="en">primary income</span>）：投資收益與股利利息；二次所得（移工匯款、捐贈）。</li>
        <li><b>金融帳（<span class="en">financial account</span>）</b>：直接投資（<span class="en">direct investment</span>）：持股 10% 以上、有經營意圖，例如海外設廠；證券投資（<span class="en">portfolio investment</span>）：買股票、基金、債券；衍生金融商品；其他投資（<span class="en">other investment</span>）：國外存款、放款、出口應收帳款。每一項都分「居民往外投」與「非居民往內投」。</li>
        <li><b>準備資產（<span class="en">reserve assets</span>）</b>：央行買賣外匯造成的變動，不含匯率與市價重估。</li>
      </ul>
    </div></details>
    <div class="note">三塊之間有一條恆等式 <span class="hd hd-sys">制度</span>：經常帳＋資本帳－金融帳（淨資產增加）＋誤差與遺漏＝準備資產增加。白話說，賺進來的外匯不是被民間放在國外（金融帳），就是被央行買走（準備資產），沒有第三條路。所以順差愈大，金融帳流出通常也愈大；這不是資金出逃，是同一筆錢的另一面。</div>
    <div class="kpis">
      <div class="kpi"><span class="k">經常帳順差（2025）</span><span class="v">1,844 億美元</span><span class="d">GDP 的 19.5%</span></div>
      <div class="kpi"><span class="k">金融帳淨流出（2025）</span><span class="v">1,594 億美元</span><span class="d">民間放到國外的淨額</span></div>
      <div class="kpi"><span class="k">央行準備資產（2025）</span><span class="v">+200 億美元</span><span class="d">由央行收下的部分</span></div>
      <div class="kpi"><span class="k">外資買台股（2025）</span><span class="v">−178 億美元</span><span class="d">國際收支口徑，負號＝淨賣出</span></div>
    </div>
    <h4>各種形式的量級（流量，億美元）<span class="hd hd-off">官方</span></h4>
    <div class="tbl-wrap"><table>
      <thead><tr><th>形式</th><th>帳目</th><th class="n">2025 全年</th><th class="n">2026 上半年</th><th>方向</th></tr></thead>
      <tbody>
        <tr><td class="name">商品貿易順差<small>出口－進口</small></td><td>經常帳</td><td class="n">+1,789</td><td class="n">+1,112</td><td>流入</td></tr>
        <tr><td class="name">服務<small>旅行、運輸、權利金</small></td><td>經常帳</td><td class="n">−134</td><td class="n">−62</td><td>流出</td></tr>
        <tr><td class="name">初次所得<small>海外投資收益－外資領走的股利利息</small></td><td>經常帳</td><td class="n">+264</td><td class="n">+187</td><td>淨流入</td></tr>
        <tr><td class="name">二次所得<small>匯款、捐贈</small></td><td>經常帳</td><td class="n">−75</td><td class="n">−27</td><td>流出</td></tr>
        <tr><td class="name"><b>經常帳合計</b></td><td></td><td class="n"><b>+1,844</b></td><td class="n"><b>+1,210</b></td><td><b>流入</b></td></tr>

    <figure class="chart" data-chart="a1_ca_fini"></figure>

    <div class="mis"><b>常見誤讀</b>　看到「金融帳 +537.9 億美元」（2026 年第 2 季）以為是錢流進來。 → 央行現行表格的金融帳，正數代表居民的國外資產淨增加，也就是資金淨流出。</div>

<details class="blk" id="a1-surplus">
  <summary><span class="h">順差這麼大，錢為什麼沒有留在國內？</span><span class="sum">出口商收到的美元只有 2.2% 當下換成新台幣；其餘存成外幣、留在海外或還沒收到，記成金融帳流出。</span></summary>
  <div class="body">
    <p>結論：順差賺到的美元大多沒有換成新台幣。2026 上半年<a class="ind" data-ind="ca">經常帳順差</a> 1,210 億美元，同期<a class="ind" data-ind="fa">金融帳淨流出</a> 1,181 億美元，幾乎相等；央行準備資產還減少 39 億美元 <span class="hd hd-off">官方</span>。台灣的國民儲蓄長期大於國內投資，這個差額（<a class="ind" data-ind="excess_saving">超額儲蓄</a>）就等於經常帳順差，多出來的儲蓄最後放在國外。</p>
    <h4>出口商收到美元之後的四條路</h4>
    <ol class="steps">
      <li><b>賣掉換新台幣</b>：要發薪水、付國內供應商、繳稅、發現金股利時才需要，這是新台幣升值壓力的來源。央行覺得升太快會買進美元（<a class="ind" data-ind="reserves">外匯存底</a>增加），再發行<a class="ind" data-ind="ncd">定期存單</a>把放出去的新台幣收回，稱為沖銷（<span class="en">sterilization</span>）。</li>
      <li><b>留在<a class="ind" data-ind="fxdep">外匯存款</a></b>：美元利率（<a class="ind" data-ind="fed">聯準會</a> 3.75–4.00%）高於新台幣（<a class="ind" data-ind="policy_rate">央行政策利率</a> 2.00%），企業不急著換。銀行收到美元後再存放國外、買外債，或借給需要美元的<a class="ind" data-ind="life_fx">壽險業</a>，國際收支上記成「其他投資」增加。</li>
      <li><b>根本沒匯回來</b>：例如台積電（2330）把資金增資到海外子公司、直接付國外設備款，記成<a class="ind" data-ind="fdi_out">對外直接投資</a>或其他投資。海關有出口紀錄，台北外匯市場卻沒看到這筆美元。</li>
      <li><b>預售遠期外匯</b>：出口商先和銀行約定未來用固定匯率賣美元。銀行為了不承擔匯率風險，當天就會在市場上賣出等額美元。所以一旦市場預期新台幣要升，賣壓會提前、集中出現，2025 年 5 月就是這樣。</li>
    </ol>
    <h4>2.2% 是怎麼來的：央行「出進口外匯收支統計」<span class="hd hd-off">官方</span></h4>
    <div class="tbl-wrap"><table>
      <thead><tr><th>項目</th><th class="n">2026 年 8 月</th><th class="n">2026 年 1–8 月</th><th>對照</th></tr></thead>
      <tbody>
        <tr><td class="name">出口外匯收入<small>經銀行匯回國內的出口貨款</small></td><td class="n">423.7 億美元</td><td class="n">3,471.8 億美元</td><td><a class="ind" data-ind="exports">海關出口</a> 824.0 億／5,743.4 億，只有 51%／60% 當期匯回</td></tr>
        <tr><td class="name"><b>其中立即換成新台幣</b></td><td class="n"><b>9.4 億（2.2%）</b></td><td class="n"><b>75.1 億（2.2%）</b></td><td>匯回金額年增三成多，立即結售的金額卻年減 0.5%</td></tr>
        <tr><td class="name">其中未立即結售<small>存入外匯存款或償還外幣借款</small></td><td class="n">414.3 億（97.8%）</td><td class="n">3,396.7 億</td><td>年增 34.8%</td></tr>
        <tr><td class="name">進口外匯支出</td><td class="n">399.3 億美元</td><td class="n">3,105.8 億美元</td><td>用新台幣買匯支付的只有 12.3%／12.8%</td></tr>
        <tr><td class="name">出進口外匯收支差額</td><td class="n">+24.4 億美元</td><td class="n">+366.1 億美元</td><td>海關出超 223.0 億／1,369.1 億</td></tr>
      </tbody>
    </table></div>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/tw/lp-821-1.html" target="_blank" rel="noopener">中央銀行 出進口外匯收支統計</a>（2026 年 8 月）。</p>
    <div class="how"><span class="lbl">怎麼讀</span>第一，海關出超 1,369 億美元，但經銀行匯回、再扣掉進口付款的淨額只有 366 億美元，其餘留在海外、變成應收帳款或在集團內互抵。第二，<a class="ind" data-ind="fxsettle">立即結售比例</a>只有 2.2%，其餘要用錢時才分批換；這份統計抓不到事後才換的部分，那要看外匯存款餘額的增減。第三，進口也有 87% 直接用外幣付。</div>
    <div class="mis"><b>常見誤讀</b>　出口創新高 → 出口商大量賣美元 → 新台幣升值。 → 當期統計上看不到這條因果鏈。2026 年 1–8 月出超年增 57.6%，<a class="ind" data-ind="usdtwd">新台幣</a>今年到 9/18 反而貶約 1.2%。賣美元是事後、分批、看匯率預期決定的。</div>
    <figure class="chart" data-chart="a1_bop"></figure>
    <details class="sub"><summary>錢留在國外的主要管道，十幾年來換過幾次（表）</summary><div class="body">
      <div class="tbl-wrap"><table>
        <thead><tr><th>時期</th><th>順差主要從哪個管道出去</th><th>年流量（美元）</th></tr></thead>
        <tbody>
          <tr><td>2009–2011</td><td>央行買匯，外匯存底累積</td><td>準備資產 +541 億（2009）、+402 億（2010）</td></tr>
          <tr><td>2013–2019</td><td>壽險業買國外債券 <span class="hd hd-unc">未確認</span></td><td>居民買國外債券 +750 億（2016）、+680 億（2017）</td></tr>
          <tr><td>2020</td><td>疫情期間資金湧入，央行再度大買</td><td>準備資產 +483 億</td></tr>
          <tr><td>2021–2024</td><td>個人與 ETF 買國外股債、企業對外直接投資</td><td>居民買國外股權 +270 億、對外直接投資 +320 億（2024）</td></tr>
          <tr><td>2025–2026 上半年</td><td>其他投資暴增、對外直接投資創高；壽險買債降到十幾年低點</td><td>其他投資資產 +722 億（2025）、+663 億（2026 上半年）</td></tr>
        </tbody>
      </table></div>
      <p class="src">來源：<a href="https://www.cbc.gov.tw/public/data/economic/statistics/bop/hist_AY.pdf" target="_blank" rel="noopener">中央銀行 國際收支歷史年表</a>與最新年表。數字是央行的；把 2013–2019 年歸給壽險業，是依央行歷年說明的記憶，未逐年查證。</p>
    </div></details>
    <div class="blind"><b>盲點</b>　2025 年起金融帳最大的一項是「其他投資」，央行說明主因是貿易授信增加。貿易授信（<span class="en">trade credit</span>）就是貨已出海關、記了出口，但客戶還沒付款的應收帳款。它不是錢匯出去，而是錢還沒進來；等出口成長放慢、客戶付款，這一項會反轉成流入 <span class="tag inf">推論</span>。貿易授信與國外存款各占多少，央行沒有拆分 <span class="hd hd-unc">未確認</span>。</div>
  </div>
</details>

<details class="blk" id="a1-exports">
  <summary><span class="h">出口與外銷訂單：源頭的量</span><span class="sum">8 月出口 824 億美元、年增 41%，近八成是電子與資通產品；訂單只有一半多在台灣生產，訂單不等於出口。</span></summary>
  <div class="body">
    <p>結論：對外資金的源頭是出口，現在又大又集中。2026 年 8 月<a class="ind" data-ind="exports">海關出口</a> 824.0 億美元，是歷年單月新高，年增 41.0%，連 34 個月正成長（追平史上最長紀錄）；1–8 月年增 44.2% <span class="hd hd-off">官方</span>。產品近八成是電子零組件與資通產品，市場約三成是美國。</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>項目</th><th class="n">2026 年 8 月</th><th class="n">年增</th><th class="n">1–8 月</th><th class="n">年增</th></tr></thead>
      <tbody>
        <tr><td class="name">出口</td><td class="n">824.0 億美元</td><td class="n">+41.0%</td><td class="n">5,743.4 億</td><td class="n">+44.2%</td></tr>
        <tr><td class="name">進口</td><td class="n">601.0 億</td><td class="n">+44.3%</td><td class="n">4,374.3 億</td><td class="n">+40.4%</td></tr>
        <tr><td class="name">出超</td><td class="n">223.0 億</td><td class="n">+32.9%</td><td class="n">1,369.1 億</td><td class="n">+57.6%</td></tr>
        <tr><td class="name">電子零組件出口</td><td class="n">322.2 億</td><td class="n">+58.0%</td><td class="n">2,004.4 億</td><td class="n">+45.8%</td></tr>
        <tr><td class="name">資通與視聽產品出口</td><td class="n">331.0 億</td><td class="n">+41.8%</td><td class="n">2,518.4 億</td><td class="n">+68.5%</td></tr>
        <tr><td class="name">對美國出口<small>占 8 月 28.7%、1–8 月 31.4%</small></td><td class="n">236.7 億</td><td class="n">+20.7%</td><td class="n">1,803.2 億</td><td class="n">+53.9%</td></tr>
        <tr><td class="name">對中國大陸與香港出口<small>占 8 月 25.7%</small></td><td class="n">211.5 億</td><td class="n">+39.3%</td><td class="n">1,394.7 億</td><td class="n">+28.3%</td></tr>
      </tbody>
    </table></div>
    <p class="src">來源：<a href="https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=61f5437eabfe44bcbe442a02eaeea30a" target="_blank" rel="noopener">財政部 115 年 8 月海關進出口貿易初步統計</a>（2026-09-09）。</p>
    <dl class="ev3">
      <div><dt>機制</dt><dd>貨一出海關就記出口，不管錢收到沒有、有沒有進台灣。<a class="ind" data-ind="capex_csp">雲端大廠的資本支出</a>帶動 AI 伺服器與晶片出貨，是這一波的主因；台灣同時要進口設備與高頻寬記憶體（HBM），進口同步大增，所以出超的增幅沒有出口那麼大。</dd></div>
      <div><dt>現在</dt><dd>電子零組件加資通產品占 8 月出口 79.3%。1–8 月對美出超約 1,407 億美元，比對全球的總出超（1,369 億）還大；對南韓入超約 422 億美元（買記憶體）。財政部預估 9 月出口 770–803 億美元 <span class="hd hd-est">估計</span>。</dd></div>
      <div><dt>判讀</dt><dd>看三個數：年增率有沒有轉負（過去轉負就是景氣轉折）、電子與資通占比（集中度）、對美占比（受<a class="ind" data-ind="tariff">美國關稅</a>影響的程度）。目前動能強、沒有轉向跡象；但集中度是歷史少見的高，單一客群的變化會直接反映在<a class="ind" data-ind="gdp">GDP</a>上。<span class="pill watch">留意</span> <span class="tag inf">推論</span></dd></div>
    </dl>
    <h4>外銷訂單：領先出口，但不等於出口</h4>
    <p><a class="ind" data-ind="orders">外銷訂單</a>（<span class="en">export orders</span>）是台灣公司接到的訂單，不論在哪裡生產，通常領先出口 1–3 個月。2026 年 7 月 979.4 億美元、年增 61.9%，連 18 個月正成長；美國接單 407.9 億美元、年增 88.9% <span class="hd hd-off">官方</span>。經濟部預估 8 月 970–990 億美元，實際數字預定 9/22 公布。</p>
    <div class="mis"><b>常見誤讀</b>　外銷訂單＝出口＝錢進台灣。 → 2025 年外銷訂單只有 52.9% 在台灣生產（2018 年 47.6%），中國大陸 26.2%（2018 年 46.9%）、東協 11.3%、美國 5.0%。2026 年 1–7 月訂單 6,020 億美元，同期海關出口約 4,919 億美元。在台灣生產的部分，貨款也可能留在<a class="ind" data-ind="fxdep">外匯存款</a>或海外子公司。</div>
    <details class="sub"><summary>海關出超和國際收支的商品貿易順差，為什麼不是同一個數</summary><div class="body">
      <p>2025 年海關出超 1,571.4 億美元，國際收支的商品貿易順差是 1,789 億美元，多約 218 億。國際收支以「所有權移轉」為準 <span class="hd hd-sys">制度</span>：進口改用離岸價（不含運費與保險費）、加計三角貿易（台灣接單、海外生產出貨）的淨收入、剔除所有權沒有移轉的加工貨物。各調整項的金額本次未查證。</p>
    </div></details>
  </div>
</details>

<details class="blk" id="a1-fini">
  <summary><span class="h">外資進出：四個口徑、四種答案</span><span class="sum">看方向用證交所、看匯率壓力用央行口頭數字、定案看國際收支；金管會的淨匯入不扣獲利匯出，不能當資金流向。</span></summary>
  <div class="body">
    <p>結論：「外資是進來還是出去」有四個官方數字，算法不同，方向甚至相反。2026 年 1–8 月金管會口徑淨匯入 905 億美元（同期新高），同一段時間<a class="ind" data-ind="fini_flow_twse">證交所口徑</a>卻是大幅賣超（今年以來到 9/18 賣超 1.4134 兆元），國際收支上半年也是 −263 億美元。四個都沒算錯，差別在獲利與股利匯出去算不算。</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>口徑</th><th>算什麼</th><th>不算什麼</th><th>頻率</th><th>適合回答</th><th>最新讀數</th></tr></thead>
      <tbody>
        <tr><td class="name">證交所買賣超 <span class="hd hd-mkt">市場</span></td><td>外資在集中市場買進減賣出的金額（新台幣）</td><td>錢有沒有換匯、有沒有離開台灣；上櫃另計</td><td>每日</td><td>今天外資在買還是賣</td><td>今年以來賣超 1.4134 兆元（至 9/18）</td></tr>
        <tr><td class="name"><a class="ind" data-ind="fini_flow_fsc">金管會淨匯入</a> <span class="hd hd-off">官方</span></td><td>外資匯入的本金減匯出的本金，另含海外可轉換公司債轉成股票、存託憑證換回台股</td><td>盈餘匯出：資本利得與現金股利匯出去都不扣</td><td>每月初</td><td>外資投入的本金累計多少（監理用途）</td><td>8 月 +166.65 億美元；1–8 月 +905 億；累計 4,104 億</td></tr>
        <tr><td class="name">央行外匯局 <span class="hd hd-off">官方</span></td><td>外資實際結匯的淨額，本金與盈餘都算</td><td>沒有書面統計表，只在每月記者會口頭說明</td><td>每月 5 日前後</td><td>這個月外資對新台幣是買壓還是賣壓</td><td>6 月 −170 億、7 月 −280 億、8 月 +12 億美元</td></tr>
        <tr><td class="name"><a class="ind" data-ind="fini_flow_cbc">國際收支</a> <span class="hd hd-off">官方</span></td><td>非居民對台灣股權的淨交易（國際標準）</td><td>落後 2–5 個月</td><td>每季</td><td>長期、可跨國比較的淨流向</td><td>2025 年 −178 億；2026 年第 1 季 −257 億、第 2 季 −6 億美元</td></tr>
      </tbody>
    </table></div>
    <h4>為什麼金管會的數字會一路墊高</h4>
    <p>關鍵在盈餘怎麼算。假設外資多年前以每股 100 元買進台積電（2330），2026-06-02 以收盤價 2,380 元賣掉（成本 100 元是為了說明而假設）。匯出去的錢裡約 96% 是資本利得、4% 是本金，金管會只在本金帳上扣那 4%；但外資買新股票時匯進來的每一塊錢，都算本金匯入。只要股價長期上漲、外資持續換股，「累計淨匯入」就會一路增加，即使外資其實是淨賣出、淨匯出。2025 年三個數字同時成立：證交所賣超 4,744 億元、金管會 +368 億美元、國際收支 −178 億美元。</p>
    <figure class="chart" data-chart="a1_fsc_bop"></figure>
    <div class="how"><span class="lbl">怎麼讀</span>日常看證交所買賣超（方向）；月初看央行口頭數字（對匯率的真實壓力）；每季看國際收支（定案）；金管會累計淨匯入只當「外資投入本金的帳面數」。哪個最接近實際現金流？把證交所買賣超換算成美元去對：2025 年賣超約合 150 億美元，國際收支 −178 億；2026 年 1–6 月賣超約 0.95 兆元、約合 300 億美元，國際收支 −263 億，量級相符 <span class="hd hd-est">估計</span>。所以證交所買賣超累加一季以上，可以當國際收支的即時近似值 <span class="tag inf">推論</span>。</div>
    <details class="sub"><summary>每年 6–9 月：股利匯出的季節性，與 2026 年 7 月的實例</summary><div class="body">
      <p>上市櫃公司多在 7–9 月發放現金股利。外資持有上市股票市值 72.09 兆元、占 48.04%（證交所，至 9/11）<span class="hd hd-mkt">市場</span>，領到的股利要換成美元匯出，每年夏天都形成新台幣貶值壓力。國際收支上看得到：<a class="ind" data-ind="primary_income">初次所得</a>的支出 2025 年第 3 季是 145.4 億美元，第 4 季 74.5 億、2026 年第 1 季 59.2 億、第 2 季 85.2 億；第 3 季多出的 60–90 億美元就是外資領走的股利。2026 年上市櫃現金股利估約 2.5 兆元，依外資持股比重粗估，外資分到約 1 兆元、折合 300 多億美元（未扣稅）<span class="hd hd-est">估計</span>。</p>
      <p>2026 年 7 月：外資單月賣超 7,389 億元，加上股利匯出，央行口徑淨匯出約 280 億美元；<a class="ind" data-ind="usdtwd">新台幣</a> 7/30 收 32.454，是今年最弱；<a class="ind" data-ind="reserves">外匯存底</a>月減 28.8 億美元；<a class="ind" data-ind="m2">M2</a> 月增率轉負，央行新聞稿寫主因是「外資淨匯出」。同月金管會口徑只有 −29 億美元，差了近 10 倍。</p>
    </div></details>
    <div class="blind"><b>盲點</b>　外資賣超不等於錢離開台灣。賣股的錢可以先停在新台幣存款（2026-07 外國人新台幣存款 3,125 億元，是 2021-06 以來最高、年增 63.1%）；借券賣出（借股票來賣）也計入賣超，但不涉及匯出。外資持股占比要搭配<a class="ind" data-ind="tsmc_w">台積電權重</a>看：外資持有台積電約 70%（2026-06-02 為 70.38%），台積電占大盤約四成，光這一檔就解釋了外資持股市值的大半。另外，媒體引用的「前 7 月外資賣超 2.28 兆元」與證交所週報的 1.69 兆元不同，差異原因 <span class="hd hd-unc">未確認</span>。</div>
    <p class="src">來源：<a href="https://www.sfb.gov.tw/ch/home.jsp?id=1024&amp;parentpath=0%2C4%2C109" target="_blank" rel="noopener">金管會證期局 外資及陸資投入我國股市概況表</a>、<a href="https://www.twse.com.tw/zh/trading/foreign/twt38u.html" target="_blank" rel="noopener">證交所 外資及陸資買賣超</a>、<a href="https://www.cbc.gov.tw/public/data/economic/statistics/bop/cAQ.pdf" target="_blank" rel="noopener">央行 國際收支季表</a>；央行外匯局數字為每月記者會口頭說明（<a href="https://news.cnyes.com/news/id/6597931" target="_blank" rel="noopener">鉅亨網 2026-09-04</a>、<a href="https://www.ctee.com.tw/news/20260806700053-430301" target="_blank" rel="noopener">工商時報 2026-08-06</a>）。</p>
  </div>
</details>

<details class="blk" id="a1-fdi">
  <summary><span class="h">直接投資：核准不等於匯出</span><span class="sum">前 8 月核准對外投資 624 億美元，上半年實際發生只有 211 億；2,500 億、2,650 億這類承諾是多年期上限。</span></summary>
  <div class="body">
    <p>結論：直接投資有兩套數字，經濟部投審司的「核准金額」與國際收支的「實際發生」，兩者永遠對不起來。2026 年 1–8 月核准<a class="ind" data-ind="fdi_out">對外直接投資</a> 623.90 億美元（年增 98.37%），但國際收支 2026 上半年實際的對外直接投資是 210.5 億美元 <span class="hd hd-off">官方</span>。企業拿到核准後可以分年匯出，也可能不匯；國際收支另外還包含海外子公司賺了錢沒匯回、留在當地再投資的部分。</p>
    <div class="kpis">
      <div class="kpi"><span class="k">核准對外投資（不含中國大陸）</span><span class="v">623.90 億美元</span><span class="d">投審司，2026 年 1–8 月</span></div>
      <div class="kpi"><span class="k">其中台積電（2330）兩案</span><span class="v">500 億美元</span><span class="d">增資英屬維京群島子公司 300 億、亞利桑那子公司 200 億</span></div>
      <div class="kpi"><span class="k">核准對中國大陸投資</span><span class="v">6.60 億美元</span><span class="d">1–8 月，年減 21.68%</span></div>
      <div class="kpi"><span class="k">核准僑外來台投資</span><span class="v">161.81 億美元</span><span class="d">1–8 月；美光增資 74.50 億為最大案</span></div>
    </div>
    <div class="tbl-wrap"><table class="narrow">
      <thead><tr><th>國際收支口徑（實際發生）</th><th class="n">2025 全年</th><th class="n">2026 上半年</th></tr></thead>
      <tbody>
        <tr><td class="name">居民對外直接投資</td><td class="n">453.7 億美元</td><td class="n">210.5 億美元</td></tr>
        <tr><td class="name">外資來台直接投資</td><td class="n">110.3 億美元</td><td class="n">52.8 億美元</td></tr>
      </tbody>
    </table></div>
    <dl class="ev3">
      <div><dt>機制</dt><dd>台積電兩案就占前 8 月核准對外投資的 80%。其中增資英屬維京群島子公司的 300 億美元，實質上是把資金放到海外子公司做財務操作與轉投資，不是蓋廠。這類資金多半直接用海外的美元，不經過台北外匯市場。</dd></div>
      <div><dt>現在</dt><dd>台美投資合作備忘錄（2026-01-15 簽署）：台灣企業自主投資 2,500 億美元，政府另以信用保證支持最高 2,500 億美元的企業授信，換取<a class="ind" data-ind="tariff">關稅</a>待遇。行政院說明信用保證不是現金支出，兩個金額不能相加 <span class="hd hd-sys">制度</span>。台積電 2026-07-16 宣布在亞利桑那再投資 1,000 億美元，媒體報導總投資額達 2,650 億美元。備忘錄沒有公布分年時程，貿易協定的審議進度 <span class="hd hd-unc">未確認</span>。</dd></div>
      <div><dt>判讀</dt><dd>這些都是多年期的承諾上限，實際每年匯出多少要看國際收支。以目前每年 400–500 億美元的速度，約占<a class="ind" data-ind="ca">經常帳順差</a>的四分之一，台灣的順差付得起；但它已取代壽險買債，成為順差流出的主要管道之一。<span class="pill watch">留意</span> <span class="tag inf">推論</span></dd></div>
    </dl>
    <details class="sub"><summary>怎麼讀：看三個比</summary><div class="body">
      <ul class="list">
        <li>對外與來台的比：2025 年國際收支口徑是 4.1 倍。</li>
        <li>對美與對中國的比：對中國大陸投資占累計對外投資的比重，由 2017 年以前的 58.3% 降到 2018–2025 年的 18.8%；2026 年前 8 月核准對中國只有對其他地區的 1%。美國在 2018–2025 年的累計占比，央行資料兩次擷取得到 18.7% 與 18.3% 兩個值 <span class="hd hd-unc">未確認</span>。</li>
        <li>台積電占比：單一公司占核准額八成，數字的起伏主要反映它的案件時點 <span class="tag inf">推論</span>。</li>
      </ul>
    </div></details>
    <div class="blind"><b>盲點</b>　外資來台直接投資一年約 110 億美元，外資從台灣領走的股利、利息與外商盈餘（<a class="ind" data-ind="primary_income">初次所得</a>支出，2025 年 370 億美元）是它的 3 倍多。外資對台灣是領走的比新投入的多。</div>
    <p class="src">來源：<a href="https://www.moea.gov.tw/MNS/populace/news/News.aspx?kind=1&amp;menu_id=40&amp;news_id=123980" target="_blank" rel="noopener">經濟部投資審議司 2026-09-15 新聞稿</a>、<a href="https://www.cbc.gov.tw/dl-227602-efb374350f4b49e0984456d64c2c7bb2.html" target="_blank" rel="noopener">央行 2026-09-17 理監事會參考資料第 6 章</a>、<a href="https://www.ey.gov.tw/otn/6C43520F4EA0A8D5/acce9636-b048-4504-a1f3-81071d9d71dd" target="_blank" rel="noopener">行政院經貿談判辦公室 2026-02-15 說明</a>。</p>
  </div>
</details>

<details class="blk" id="a1-reserves">
  <summary><span class="h">外匯存底，以及「外資部位相當於存底 309%」代表什麼</span><span class="sum">存底一年多來幾乎沒動，外資持有的市值卻翻倍；比率升高是股價漲出來的，代表外資賣股對匯市的衝擊變大。</span></summary>
  <div class="body">
    <p>結論：2026-08 底<a class="ind" data-ind="reserves">外匯存底</a> 6,019 億美元，月增 76.33 億 <span class="hd hd-off">官方</span>。2025 年 6 月以來存底一直在 5,950–6,050 億美元之間；同一段時間，外資持有的台股、台債與新台幣存款按市價計算翻了一倍，所以<a class="ind" data-ind="fini_ratio">外資持有部位相對外匯存底</a>的比率從 2025-05 底的 139% 升到 2026-08 底的 309%。<span class="pill alert">警訊</span> <span class="tag inf">推論</span>（依據：15 個月內翻倍，央行 2026 年 7 月也公開點名這個風險。）</p>
    <figure class="chart" data-chart="a1_ratio"></figure>
    <p>309% 回答的問題是：如果外資把部位全部賣掉、換成美元匯出，央行的美元夠不夠付。答案是只夠付三分之一。實際上不會全部賣光，因為一起賣時股價與新台幣會先跌，能換到的美元變少。但它說明三件事：</p>
    <ul class="list">
      <li><b>比率上升幾乎全是股價造成的</b>。加權指數 2025-05-02 收 20,787.64 點，2026-08 底收 46,128.47 點，漲了一倍多；同期國際收支口徑外資還是淨賣出。分子跟著<a class="ind" data-ind="mcap">台股市值</a>走。</li>
      <li><b>分母沒動、分子翻倍</b>，所以外資同樣賣掉 1% 的持股，對匯市的衝擊是一年前的兩倍多。央行 2026 年 7 月指出外資「多以短期、鉅額及集中方式進出，增加國內匯市波動」，並列出即時通報、專案金檢等管理工具。</li>
      <li><b>2026 年 7 月是實例</b>：比率由 6 月底 316% 降到 7 月底 280%，當月<a class="ind" data-ind="fini_flow_twse">外資賣超</a> 7,389 億元、匯出約 280 億美元，<a class="ind" data-ind="usdtwd">新台幣</a>貶到今年最低 32.454。</li>
    </ul>
    <figure class="chart" data-chart="a1_reserves"></figure>
    <div class="how"><span class="lbl">怎麼讀</span>存底的月變動混了三樣東西：存底自己的投資收益、非美元資產（歐元、日圓等）折算成美元的匯率變動、央行進場買賣美元。月增減超過 ±50 億美元，通常代表央行有明顯進出；再對照當月歐元、日圓升貶，把換算效果扣掉。例如 8 月增加 76 億美元，同月歐元、日圓、人民幣都對美元升值，有一部分只是換算。</div>
    <div class="mis"><b>常見誤讀</b>　外匯存底增加＝央行買美元阻止新台幣升值。 → 2025 年國際收支的準備資產增加 200 億美元，但美國財政部認定央行全年淨買匯只有 77 億美元（GDP 的 0.8%），集中在 2025 年 5 月，其餘主要是約 6,000 億美元資產自己產生的利息。央行也會反向操作：2026 年第 1 季淨賣匯 125.9 億美元，6、7 月外資大量匯出時同樣是賣美元。</div>
    <details class="sub"><summary>央行買匯之後：新台幣怎麼收回來</summary><div class="body">
      <p>央行買美元會放出新台幣，之後再發行<a class="ind" data-ind="ncd">央行定存單</a>把錢收回（餘額 6.57 兆元，2026-08）。2026 年 6–8 月銀行體系的<a class="ind" data-ind="excess">超額準備</a>平均只有 520 餘億元，相對於數十兆元的存款很小，表示多出來的資金持續被收回。所以「央行買匯＝市場上的錢變多」不一定成立。細節見<a href="#/local">本地有多少</a>。</p>
    </div></details>
    <div class="blind"><b>盲點</b>　外匯存底不是台灣美元部位的全部。民間另有約 5,170 億美元的<a class="ind" data-ind="fxdep">外幣存款</a>（銀行局口徑，2026-06 底）與 3 兆 2,670 億美元的對外資產（2025 年底），但危機時民間的美元不一定會賣。央行在存底之外，還有一筆 760.87 億美元的遠期與換匯部位（2026-03-31），央行表上列在「短倉」，經濟意義本站無法判定 <span class="hd hd-unc">未確認</span>；每月 5 日公布的存底數字看不到這一塊。</div>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/tw/cp-302-192817-7c782-1.html" target="_blank" rel="noopener">中央銀行 2026-09-04 外匯存底新聞稿</a>、<a href="https://www.cbc.gov.tw/tw/lp-644-1.html" target="_blank" rel="noopener">央行重要指標頁</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-192632-e0964-1.html" target="_blank" rel="noopener">央行 2026-07-24 對美國財政部匯率報告的說明</a>、<a href="https://www.cbc.gov.tw/tw/lp-6294-1.html" target="_blank" rel="noopener">央行 國際準備與外幣流動性</a>。</p>
  </div>
</details>

<details class="blk" id="a1-fx">
  <summary><span class="h">匯率：央行怎麼管，以及 2025 年 5 月暴升的教訓</span><span class="sum">央行壓低波動但不守價位；決定新台幣的是資金進出與民間未換的美元，不是貿易順差。</span></summary>
  <div class="body">
    <p>結論：<a class="ind" data-ind="usdtwd">美元兌新台幣</a> 9/18 收 31.808，落在 2026 年區間 31.251（2/26，最強）到 32.454（7/30，最弱）的中段；全年區間約 1.2 元、3.8%，今年到 9/18 貶約 1.2% <span class="hd hd-mkt">市場</span>。<span class="pill calm">平穩</span> <span class="tag inf">推論</span>（依據：位置在區間中段，9/16 聯準會升息後沒有貶反而小升。）央行的說法是，匯率現在主要由資金進出決定，不是貿易：2024 年外資與本國資金進出的金額，是商品貿易外匯收支的 19.3 倍。</p>
    <h4>央行怎麼管 <span class="hd hd-sys">制度</span></h4>
    <p>央行每季決議都有同一段文字：匯率原則上由市場供需決定，但若短期資金大量進出造成過度波動，央行會進場維持秩序。做法有三種：升太快買美元、貶太快賣美元；買美元放出去的新台幣，用發行定存單收回；以及行政管理（大額結匯即時通報、外資匯入須依申報用途投資、查核遠匯是否有實際需求）。央行不守特定價位，只壓低波動。</p>
    <h4>2025 年 5 月：兩個交易日升值約 6%</h4>
    <ul class="list">
      <li><b>急升的來源是存量，不是當期流量。</b>台灣民間有幾千億美元沒有換成新台幣（出口商的<a class="ind" data-ind="fxdep">外匯存款</a>、<a class="ind" data-ind="life_fx">壽險</a>沒避險的海外資產、個人的美元存款）。預期一翻轉，其中幾個百分點同時要賣，就超過一個日成交量只有 20–30 億美元的市場能承受的量。所以平常要盯的是外匯存款餘額與壽險避險比率。</li>
      <li><b>導火線是政治預期，不是基本面。</b>當時沒有任何官方協議要求新台幣升值。</li>
      <li><b>央行是減速，不是擋住。</b>5 月買了約百億美元（<a class="ind" data-ind="reserves">外匯存底</a>月增 101.16 億），匯率仍然兩天升約 6%。</li>
      <li><b>不要線性外推。</b>當時市場喊 28 元、25 元，結果 8 個月後回到原點。集中拋售的美元賣完就沒有了，而美元利率高於新台幣的利差一直都在。</li>
      <li><b>同一件事對不同人相反。</b>出口商與壽險受傷，進口商與出國的人受惠。</li>
    </ul>
    <details class="sub"><summary>事件時間線（2025-04 至 2025 年底）</summary><div class="body">
      <div class="timeline">
        <div class="ev"><span class="dt">2025-04</span><span>4/7 加權指數單日跌 9.7%；4/9 美國對台灣 32% 對等關稅生效，4/10 宣布暫緩 90 天、降為 10%，進入談判。</span></div>
        <div class="ev"><span class="dt">2025-05-02</span><span>新台幣由 4/30 的 32.017 升到 31.064，單日升 3.07%。央行列出三個原因：市場預期美國會要求貿易對手貨幣升值、外資買超 429 億元並匯入、央行已進場調節。</span></div>
        <div class="ev"><span class="dt">2025-05-05</span><span>再升 9.19 角收 30.145，盤中一度升破 30 元。央行總裁記者會說明：台美談判沒有談匯率，呼籲廠商不要非理性拋售美元。</span></div>
        <div class="ev"><span class="dt">2025-05 整月</span><span>外匯存底月增 101.16 億美元；本國銀行外匯存款單月減少 6,707 億元，史上最大（出口商與民眾賣美元）。</span></div>
        <div class="ev"><span class="dt">2025-06</span><span>6/12 收 29.66。<a class="ind" data-ind="reer">實質有效匯率</a>由 4 月的 96.30 升到 7 月的 105.04，三個月升 9%。</span></div>
        <div class="ev"><span class="dt">2025 年底</span><span>回到 31.438；2026-09-18 為 31.808。整段升幅在 8 個月內全部回吐。</span></div>
      </div>
      <p class="src">來源：<a href="https://www.cbc.gov.tw/tw/cp-302-181423-cc30d-1.html" target="_blank" rel="noopener">央行 2025-05-02 說明</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-181429-e46a9-1.html" target="_blank" rel="noopener">央行 2025-05-05 說明</a>、<a href="https://www.ctee.com.tw/news/20250505701557-430503" target="_blank" rel="noopener">工商時報 2025-05-05</a>。壽險業當時的匯損金額沒有一手數字 <span class="hd hd-unc">未確認</span>。</p>
    </div></details>
    <div class="how"><span class="lbl">怎麼讀</span>平常看到的美元兌新台幣報價，要看區間與速度，不看單日：單日變動 1 角以上、成交量放大到 25–30 億美元以上，才代表有事。9/18 成交量 30.38 億美元，當週 9/14 收 31.688、9/17 收 31.881，屬於區間內的波動。</div>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/tw/lp-645-1.html" target="_blank" rel="noopener">中央銀行 新台幣對美元收盤匯率</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html" target="_blank" rel="noopener">央行 2026-09-17 理監事會決議</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-181341-3319b-1.html" target="_blank" rel="noopener">央行 2025-04-18 說明</a>。</p>
  </div>
</details>

<details class="blk" id="a1-rates">
  <summary><span class="h">9/16 聯準會升息、9/17 央行不動：利差怎麼影響資金進出</span><span class="sum">台美利差擴大到 1.75–2.00 個百分點；企業更不急著換新台幣，外資減碼時對匯市的衝擊也比過去大。</span></summary>
  <div class="body">
    <p>結論：<a class="ind" data-ind="fed">聯準會</a> 9/16 升息 1 碼（0.25 個百分點）到 3.75–4.00%，<a class="ind" data-ind="policy_rate">央行</a> 9/17 維持 2.00%，台美利差擴大到 1.75–2.00 個百分點。利差愈大，出口商愈沒有理由把美元換成新台幣，<a class="ind" data-ind="usdtwd">新台幣</a>也愈缺乏自己升值的動力。市場事前已經預期，所以新台幣沒有貶（9/16 收 31.888，9/18 收 31.808）。</p>
    <div class="kpis">
      <div class="kpi"><span class="k">聯準會利率區間</span><span class="v">3.75–4.00%</span><span class="d">9/16 升 1 碼，2023 年以來首次升息</span></div>
      <div class="kpi"><span class="k">央行重貼現率</span><span class="v">2.00%</span><span class="d">9/17 連 10 次不動；2 位理事主張升息</span></div>
      <div class="kpi"><span class="k">美國 10 年期公債殖利率</span><span class="v">約 5%</span><span class="d">9/16 會後</span></div>
    </div>
    <dl class="ev3">
      <div><dt>機制</dt><dd>利差有兩個作用。一是<a class="ind" data-ind="life_fx">壽險</a>避險成本的主要來源；二是出口商寧可持有美元存款的理由。兩者都讓<a class="ind" data-ind="fxdep">外幣存款</a>繼續增加、新台幣的買盤變少。另外，美元無風險利率上升會壓低股票的<a class="ind" data-ind="pe">本益比</a>，影響外資要不要減碼。</dd></div>
      <div><dt>現在</dt><dd>聯準會的預測中位數顯示今年可能再升 1 碼、明年不動 <span class="hd hd-unc">未確認</span>（媒體整理，官網原件未開啟）。央行不升息的理由是傳統產業辛苦、升息加重首購族房貸負擔、成長靠出口而內需沒有同步；同時把 2026 年<a class="ind" data-ind="gdp">經濟成長率</a>預測上修到 11.48%，並放寬<a class="ind" data-ind="credit_ctrl">第二戶房貸成數上限</a>（6 成調為 7 成）。</dd></div>
      <div><dt>判讀</dt><dd>單次升息不是重點，重點是「今年還有一次、明年不降」。<a class="ind" data-ind="fini_ratio">外資持股市值已是外匯存底的 3 倍</a>，若美債殖利率續升引發外資減碼，對匯市的衝擊會比過去大。央行選擇不跟，代價是利差擴大、資金外流的誘因增加；<a class="ind" data-ind="m2">M2</a> 年增率卻因外資匯入與放款成長而偏高（7 月 +7.42%）。要盯的是外資持有對存底的比率，與央行每月口頭公布的外資匯出入。<span class="pill watch">留意</span> <span class="tag inf">推論</span></dd></div>
    </dl>
    <details class="sub"><summary>新台幣現在貴不貴：實質有效匯率怎麼讀</summary><div class="body">
      <p><a class="ind" data-ind="reer">實質有效匯率</a>（<span class="en">real effective exchange rate, REER</span>）把新台幣對主要貿易對手的匯率依貿易比重加權平均，再扣掉物價差異，以 2020 年為 100（國際清算銀行廣義指數）<span class="hd hd-off">官方</span>。2026-07 為 97.77，6 月 99.04；歷史高點 134.08（1994-01）、低點 90.05（2009-02）。高於 105 算偏貴（2021 年、2025-07），低於 95 算偏便宜（2009–2016 年多在 90–95）。現在在過去 15 年區間的中間偏高，沒有特別貴或便宜 <span class="tag inf">推論</span>。它是估值指標，短期沒有訊號。</p>
    </div></details>
    <div class="mis"><b>常見誤讀</b>　央行不升息＝資金寬鬆。 → 鬆緊要看超額準備與央行定存單的發行量，不是只看利率；2026 年 6–8 月超額準備平均只有 520 餘億元。細節見<a href="#/local">本地有多少</a>。</div>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html" target="_blank" rel="noopener">央行 2026-09-17 理監事會決議</a>、<a href="https://www.schwab.com/learn/story/fomc-meeting" target="_blank" rel="noopener">Charles Schwab 聯準會會後評論</a>、<a href="https://www.foxbusiness.com/economy/federal-reserve-interest-rate-decision-september-16-2026" target="_blank" rel="noopener">Fox Business 2026-09-16</a>、<a href="https://fred.stlouisfed.org/series/RBTWBIS" target="_blank" rel="noopener">FRED 轉載國際清算銀行實質有效匯率</a>。</p>
  </div>
</details>

<details class="blk" id="a1-others">
  <summary><span class="h">其他比較少被提到的進出形式</span><span class="sum">壽險避險、個人買海外資產、出國旅行、境外帳戶與國際板債券；多數金額不大，壽險避險比率的變化最值得看。</span></summary>
  <div class="body">
    <p>結論：除了出口、外資與直接投資，還有幾種形式會讓錢跨境移動。多數金額不大或很穩定，影響匯率最大的是壽險業的避險行為。表內國際收支數字是央行統計 <span class="hd hd-off">官方</span>，其餘多為媒體轉述金管會。<span class="tag add">補充</span></p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>形式</th><th>方向</th><th>量級與最新數字</th><th>怎麼看</th></tr></thead>
      <tbody>
        <tr><td class="name"><a class="ind" data-ind="life_fx">壽險海外投資與避險</a></td><td>新增投資為流出</td><td>居民買國外債券 2016 年 750 億美元 → 2025 年 197 億；壽險未避險的淨曝險 8.6 兆元；避險比率 2025-10 為 58.55%，2026 年中 42.94%</td><td>壽險已不是新增流出的主力，但避險比率的升降會影響匯市。詳見<a href="#/dest">錢去哪裡</a></td></tr>
        <tr><td class="name">個人買海外股票與基金<small><a class="ind" data-ind="subbrok">複委託</a>、境外基金、海外 ETF</small></td><td>流出</td><td>居民買國外股權 2024 年 270 億、2025 年 183 億、2026 上半年 89 億美元</td><td>中等、在成長。複委託 2026-07 單月成交 1.38 兆元是成交額，不是淨流出</td></tr>
        <tr><td class="name">出國旅行與留學</td><td>流出</td><td>2025 年旅行收支逆差 114.8 億美元、出國 1,894 萬人次，都創新高</td><td>中等、穩定</td></tr>
        <tr><td class="name">國際金融業務分行（OBU）</td><td>視為境外</td><td>2026-06 底存款 4.15 兆元、放款 2.91 兆元</td><td>台商境外公司放錢的地方，國際收支上算非居民；和國內帳戶之間搬動才影響匯市</td></tr>
        <tr><td class="name">國際板債券</td><td>流出（容易誤解）</td><td>2025 年發行 185 檔、105.79 億美元</td><td>外國機構來台發行的外幣債，買家主要是台灣壽險。雖然在台北掛牌，國際收支上算居民買國外債券</td></tr>
        <tr><td class="name">境外資金匯回專法<small>2019-08 至 2021-08</small></td><td>流入</td><td>累計約 3,351 億元（約 110 億美元）<span class="hd hd-est">估計</span></td><td>不到當時一年經常帳順差的 15%。財政部 2026 年 9 月對再推一次表示有三項疑慮</td></tr>
        <tr><td class="name">誤差與遺漏</td><td>不定</td><td>2025 年 −50 億、2024 年 −83 億美元</td><td>統計抓不到的進出，規模和外資買台債相當</td></tr>
        <tr><td class="name">加密資產跨境</td><td>不明</td><td>沒有可靠的官方統計 <span class="hd hd-unc">未確認</span></td><td>國際收支與央行外匯統計都不含</td></tr>
      </tbody>
    </table></div>
    <div class="blind"><b>盲點</b>　壽險避險比率八個月內從約 59% 降到 43%。壽險避險的做法是賣出遠期美元；少避險就是少賣美元。粗估這段期間少了約 2.5 兆元（約 780 億美元）的遠期美元賣出部位 <span class="hd hd-est">估計</span>，這可能是 2025 下半年以來新台幣偏弱的背景之一，但不是官方說法 <span class="tag inf">推論</span>。反過來，未避險的部位變大，下次新台幣急升時壽險承受的匯損也更大。</div>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/public/data/economic/statistics/bop/cAY.pdf" target="_blank" rel="noopener">央行 國際收支年表</a>；壽險、OBU、國際板債券數字為媒體轉述金管會（<a href="https://udn.com/news/story/7239/9470053" target="_blank" rel="noopener">聯合報 2026-04-28</a>、<a href="https://www.ctee.com.tw/news/20260813701993-430301" target="_blank" rel="noopener">工商時報 2026-08-13</a>、<a href="https://www.ctee.com.tw/news/20260325700174-430301" target="_blank" rel="noopener">工商時報 2026-03-25</a>）；匯回專法金額為銀行主管引述（<a href="https://udn.com/news/story/7239/9601382" target="_blank" rel="noopener">聯合報 2026-07-02</a>）。</p>
  </div>
</details>

<details class="blk" id="a1-blind">
  <summary><span class="h">盲點與常見誤讀</span><span class="sum">最常見的錯：把金管會淨匯入當資金流入、混淆存量與流量、只看外資不看自己人、只看每天的快數字。</span></summary>
  <div class="body">
    <p>結論：對外部門最容易出錯的地方不是數字難找，而是同一個名詞有好幾種算法，以及把存量當成流量。下面每一條都配一個實際數字；除另外標示者外，都是官方統計 <span class="hd hd-off">官方</span>。</p>
    <div class="mis"><b>誤讀 1</b>　金管會說外資淨匯入創新高＝外資的錢一直進來。 → 2018–2025 八年合計，<a class="ind" data-ind="fini_flow_fsc">金管會口徑</a> +1,121 億美元、<a class="ind" data-ind="fini_flow_cbc">國際收支口徑</a> −1,255 億美元，方向相反。原因是金管會不扣資本利得與股利的匯出。</div>
    <div class="mis"><b>誤讀 2</b>　今天外資賣超 500 億元＝今天有 500 億元換成美元離開台灣。 → 賣股的錢可以先停在新台幣存款，借券賣出不涉及匯出。短期的匯市壓力看央行每月口頭數字；拉長到一季，<a class="ind" data-ind="fini_flow_twse">證交所買賣超</a>的累計數才會和國際收支對上。</div>
    <div class="mis"><b>誤讀 3</b>　混淆存量與流量。 → 外資「累計淨匯入」4,104 億美元是歷年本金流量的加總；外資持有的台灣資產市值是 1 兆 8,610 億美元。兩者差約 1.45 兆美元，主要是持股漲出來的未實現利得（涵蓋範圍不完全相同，只能比量級）。<a class="ind" data-ind="fini_ratio">309%</a> 也是存量，靠的是股價不是匯入。</div>
    <div class="mis"><b>誤讀 4</b>　貿易順差暴增，新台幣就該大升。 → 2026 年 1–8 月出超年增 57.6%，<a class="ind" data-ind="usdtwd">新台幣</a>今年到 9/18 卻貶約 1.2%。順差賺到的錢同步經由<a class="ind" data-ind="fa">金融帳</a>出去了，央行準備資產上半年還減少 39 億美元。</div>
    <div class="mis"><b>誤讀 5</b>　核准或承諾的投資金額＝今年會匯出去的錢。 → 投審司 1–8 月核准<a class="ind" data-ind="fdi_out">對外投資</a> 624 億美元，國際收支上半年實際發生 211 億。2,500 億美元投資、2,500 億美元信用保證、台積電（2330）的 2,650 億美元，都是沒有分年時程的多年期上限。</div>
    <div class="blind"><b>盲點 1</b>　忽略<a class="ind" data-ind="primary_income">初次所得</a>。2025 年台灣從海外收了 634 億美元的投資所得，付給外資 370 億，淨賺 264 億美元，比 2006 年以來外資任何一年淨買台股的金額都大（最多的兩年是 2006 年 227 億、2009 年 194 億美元）。</div>
    <div class="blind"><b>盲點 2</b>　只盯外資，沒看自己人。2025 年金融帳裡金額最大的不是外資（−178 億美元），而是出口商的應收帳款與民間國外存款（其他投資資產 +722 億）、企業對外直接投資（+454 億）、居民買國外股債（+380 億）。真正決定新台幣走向的，是這些人什麼時候要把美元換回來 <span class="tag inf">推論</span>。</div>
    <div class="blind"><b>盲點 3</b>　<a class="ind" data-ind="fxdep">外匯存款</a>有兩個口徑，差約 7 兆元：央行貨幣統計口徑 9.59 兆元（2026-07 底），金管會銀行局口徑 16.46 兆元（約 5,170 億美元，2026-06 底；是否包含 OBU 與海外分行 <span class="hd hd-unc">未確認</span>）。6 月創新高的主因是美元升值的換算效果，排除後其實略降，不能直接讀成民眾看貶新台幣。</div>
    <div class="how"><span class="lbl">怎麼讀</span>判讀順序由慢到快 <span class="tag inf">推論</span>：先用慢的數字確認規模（<a class="ind" data-ind="ca">順差</a>、<a class="ind" data-ind="reserves">存底</a>、民間外幣存款、外資持股存量，看 15–20 年）；再用中速的數字確認循環位置（<a class="ind" data-ind="exports">出口</a>年增率、利差、外資持股占比，看 3–5 年）；最後才看這幾週的方向（外資每日買賣超、匯率）。入門者最常犯的錯是只看最後一種。固定發布日在<a href="#/time">時間軸與日曆</a>，練習題在<a href="#/practice">判讀與練習</a>。</div>
  </div>
</details>
