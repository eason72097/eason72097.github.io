:"反映供應鏈搬遷：中國大陸生產比重由 2018 年 46.9% 降到 2025 年 26.2%。"}],"now":{"v":"7 月 979.4 億美元、年增 +61.9%（8 月數字 9/22 公布）","asof":"2026-07","hard":"官方","state":"連18個月正成長","tone":"watch"},"judge":"單月新高、連 18 個月正成長，經濟部預估 8 月 970–990 億美元，短期沒有轉弱訊號。年增六成不是常態，要留意的是增速何時開始放慢，而不是絕對金額。","look":{"min":"4 年","best":"2015 年起","minY":4,"bestFrom":2015,"why":"和出口同一個循環，約 3–4 年一輪；要看海外生產比重的變化，需回看到 2018 年貿易戰之前。"},"misread":["外銷訂單＝出口＝錢進台灣：1–7 月訂單 6,020 億美元，同期海關出口約 4,919 億美元。"],"up":[{"id":"capex_csp","how":"雲端大廠資本支出變成伺服器與晶片訂單，美國接單年增 88.9%"},{"id":"tariff","how":"關稅預期會讓客戶提前或延後下單，扭曲單月數字"},{"id":"fdi_out","how":"產能移到海外後，訂單在海外生產的比重跟著改變"}],"down":[{"id":"exports","how":"約一半多在台灣生產，1–3 個月後變成海關出口"},{"id":"rev_monthly","how":"接單轉成出貨後，反映在電子業月營收"},{"id":"pmi","how":"新增訂單是製造業 PMI 的組成項目，方向通常一致"}],"src":[{"t":"經濟部 新聞稿列表（外銷訂單統計）","u":"https://www.moea.gov.tw/MNS/populace/news/News.aspx?kind=1&menu_id=40"},{"t":"科技新報 2026-08-20：7 月外銷訂單 979.4 億美元","u":"https://cdnfinance.technews.tw/2026/08/20/july-export-orders-record-high-97-94-billion-61-9-growth-18-consecutive-months/"},{"t":"中央銀行 2026-09-17 理監事會參考資料第 6 章","u":"https://www.cbc.gov.tw/dl-227602-efb374350f4b49e0984456d64c2c7bb2.html"}],"rooms":["inflow","aidc","themes"],"ver":{"s":"confirmed","note":"在經濟部統計處首頁指標區塊核到，非新聞稿全文。指標卡列的經濟部新聞稿列表今天只顯示 9/17–9/19，找不到 7 月稿；統計處簡訊頁（Bulletin.aspx?kind=5）回 404。"}},{"id":"fxsettle","zh":"出口貨款結售比例（外匯收支）","en":"Share of export proceeds converted to NT dollars","alias":["立即結售","拋匯","出進口外匯收支統計"],"grp":"ext","speed":"mid","freq":"每月；央行公布「出進口外匯收支統計」","what":"經銀行匯回國內的出口貨款裡，有多少比例當下就換成新台幣。","mech":"出口商收到美元後可以換成新台幣、存成外匯存款、償還外幣借款，或根本不匯回。這份統計只算「匯回當下就換」的部分。美元利率高於新台幣時，企業沒有理由急著換，會等到要發薪、繳稅、配息時才分批換。所以比例低不代表永遠不換，只代表換匯的時間點由企業決定，而且會受匯率預期影響。","read":[{"when":"比例長期只有個位數","means":"出口創新高不會在當期形成新台幣買盤；未換的美元累積在外匯存款裡。"},{"when":"比例或結售金額突然跳升","means":"出口商預期新台幣要升、搶著賣美元；要同時看外匯存款餘額是否驟降。"},{"when":"匯回金額遠低於海關出口","means":"有一部分貨款留在海外、變成應收帳款或在集團內互抵（1–8 月匯回約六成）。"}],"now":{"v":"立即結售 2.2%（1–8 月 75.1 億／匯回 3,471.8 億美元）","asof":"2026-08","hard":"官方","state":"幾乎都沒立即換","tone":"watch"},"judge":"出口外匯收入年增三成多，立即結售的金額卻年減 0.5%，代表新增的美元幾乎全部先留在外幣。短期對匯率是中性；但未換的部位持續變大，預期翻轉時可賣的量也變大，所以標為留意。","look":{"min":"2 年","best":"2022 年起","minY":2,"bestFrom":2022,"why":"至少要涵蓋 2025 年 5 月新台幣急升那一次，才看得到預期翻轉時結售行為有沒有改變。"},"misread":["只有 2.2% 換成新台幣＝其餘 97.8% 永遠不會換：統計抓不到事後從外匯存款分批換回的部分。"],"up":[{"id":"exports","how":"出口貨款是結售的來源，匯回金額隨出口增加"},{"id":"fed","how":"美元存款利率高於新台幣，企業沒有急著換的理由"},{"id":"usdtwd","how":"預期新台幣升值時，出口商會提前賣美元或預售遠匯"},{"id":"policy_rate","how":"新台幣利率低，持有美元的機會成本小"}],"down":[{"id":"fxdep","how":"沒有結售的貨款先存進外匯存款，餘額增加"},{"id":"usdtwd","how":"立即結售少，出口創高對匯率的當期升值壓力就小"},{"id":"m2","how":"換成新台幣的部分才會變成新台幣存款"}],"src":[{"t":"中央銀行 出進口外匯收支統計（2026 年 8 月）","u":"https://www.cbc.gov.tw/tw/dl-227585-f857a0d604e8428caf0eae0a2205fc6a.html"},{"t":"中央銀行 出進口外匯收支統計列表","u":"https://www.cbc.gov.tw/tw/lp-821-1.html"}],"rooms":["inflow","local"],"ver":{"s":"confirmed","note":"央行原始統計（百萬美元）直接讀到：347,181.4→3,471.8 億、7,509.9→75.1 億，單月與累計占比都是 2.2%。8 月出口外匯收入 42,372.5 百萬美元、年增 39.4%。"}},{"id":"fxdep","zh":"外匯存款","en":"Foreign-currency deposits","alias":["外幣存款","美元存款"],"grp":"ext","speed":"mid","freq":"每月；央行 23–25 日金融情況記者會；銀行局約隔月中旬","what":"企業與個人存在銀行裡、還沒換成新台幣的外幣，是民間持有美元的存量。","mech":"出口貨款多數先進外匯存款，個人也會把新台幣換成美元存款賺較高利息。餘額以新台幣表示，所以美元升值時即使外幣沒有增加，數字也會變大。這一大筆未換的美元平常不影響匯率；一旦大家同時預期新台幣要升而搶著賣，就會造成急升。2025 年 5 月本國銀行外匯存款單月減少 6,707 億元，是史上最大。","read":[{"when":"餘額創新高","means":"先分清楚是外幣真的變多，還是美元升值的換算效果（2026 年 6 月主要是後者）。"},{"when":"餘額單月驟降","means":"民間集中賣美元，通常伴隨新台幣急升與央行買匯、外匯存底跳增。"},{"when":"年增率下降","means":"可能是資金匯出去投資海外股權與證券（央行對 2026 年 7 月的解釋）。"}],"now":{"v":"央行口徑 9.59 兆元、年增 10.97%（7 月）；銀行局口徑 16.46 兆元（6 月）","asof":"2026-07","hard":"官方","state":"歷史新高","tone":"watch"},"judge":"銀行局口徑約 5,170 億美元，和央行外匯存底 6,019 億美元差不多大。這和 2025 年 5 月急升時被賣出的是同一種部位，目前以新台幣計的餘額在歷史新高。平常沒事，但它決定了下一次預期翻轉時賣壓可能有多大。","look":{"min":"4 年","best":"2020 年起","minY":4,"bestFrom":2020,"why":"存量慢慢累積、事件時快速釋放；要涵蓋 2020–21 年升值、2022 年貶值與 2025 年 5 月的驟降。"},"misread":["外匯存款創新高＝民眾看貶新台幣：2026 年 6 月創高的主因是美元升值的換算效果，排除後略降。","兩個口徑混用：央行 9.59 兆元與銀行局 16.46 兆元差約 7 兆元，引用時要說明是哪一個。"],"up": ep","how":"民間集中賣美元時央行買進，存底跳增"}],"down":[{"id":"ncd","how":"央行買匯放出的新台幣，用發行定存單收回"},{"id":"m2","how":"買匯放出新台幣；沒有收回的部分會讓 M2 增加"},{"id":"fini_ratio","how":"存底是這個比率的分母；分母不動、分子翻倍"},{"id":"usdtwd","how":"央行進出能壓低波動，但擋不住方向（2025 年 5 月）"}],"src":[{"t":"中央銀行 2026-09-04 外匯存底新聞稿","u":"https://www.cbc.gov.tw/tw/cp-302-192817-7c782-1.html"},{"t":"中央銀行 重要金融指標（外匯存底）","u":"https://www.cbc.gov.tw/tw/lp-644-1.html"},{"t":"中央銀行 2026-07-24 對美國財政部匯率報告的說明","u":"https://www.cbc.gov.tw/tw/cp-302-192632-e0964-1.html"}],"rooms":["inflow","local"],"ver":{"s":"confirmed","note":"央行原始新聞稿直接讀到，兩個數字相符。變動因素原文列三項：投資運用收益、主要貨幣對美元匯率變動、央行進場調節。"}},{"id":"fini_ratio","zh":"外資持有部位相對外匯存底","en":"Foreign holdings relative to FX reserves","alias":["外資持有／外匯存底","309%"],"grp":"ext","speed":"mid","freq":"每月；5 日前後央行外匯存底新聞稿一併公布","what":"外資持有的台股、台債（按市價）加新台幣存款，相當於央行外匯存底的幾倍。","mech":"它回答：如果外資把部位全部賣掉、換成美元匯出，央行的美元夠不夠付。分子按市價計算，台股上漲就會變大，不需要外資匯入新的錢；分母是外匯存底，這一年多幾乎沒動。比率愈高，外資賣出同樣比例的持股，要換的美元愈多，對匯市的衝擊愈大。實際上不會全部賣光，因為一起賣時股價與新台幣會先跌。","read":[{"when":"比率快速升高，但外資沒有淨匯入","means":"是股價上漲造成的存量膨脹，不是資金流入；匯市的脆弱度上升。"},{"when":"比率單月明顯下降","means":"通常是台股下跌加外資賣出，同月新台幣多半走貶（2026-07：316% 降到 280%）。"},{"when":"比率超過 100%","means":"存底不足以支付外資全部部位；台灣 2025-05 已是 139%，重點在變化速度。"}],"now":{"v":"309%（外資持有 1 兆 8,610 億美元 ÷ 存底 6,019 億）","asof":"2026-08","hard":"官方","state":"15個月翻倍","tone":"alert"},"judge":"15 個月由 139% 升到 309%，變化速度極端；央行 2026 年 7 月公開點名外資短期、鉅額、集中進出會增加匯市波動，並列出管理工具。標為警訊不是預測外資會撤，而是同樣的賣壓現在對匯率的影響是一年前的兩倍多。","look":{"min":"2 年","best":"2020 年起","minY":2,"bestFrom":2020,"why":"分子跟著台股市值走，至少要含一次大漲與一次大跌（如 2022 年），才知道比率下降時匯市發生什麼事。"},"misread":["309% 代表外資匯進來的錢是存底的 3 倍：外資累計淨匯入本金只有 4,104 億美元，其餘是持股漲出來的。","比率高＝外資即將撤出：它衡量的是一旦賣出衝擊會有多大，不是會不會發生。"],"up":[{"id":"mcap","how":"分子按市價計算，台股市值上漲就直接推高比率"},{"id":"tsmc_w","how":"外資持有台積電（2330）約七成，其漲跌決定分子的大半"},{"id":"reserves","how":"分母；2025 年 6 月以來在 6,000 億美元上下沒動"},{"id":"fini_flow_twse","how":"外資賣出持股會讓分子變小（2026-07 降到 280%）"}],"down":[{"id":"usdtwd","how":"比率愈高，外資賣同樣比例持股對匯率的衝擊愈大"},{"id":"reserves","how":"外資集中匯出時央行賣美元緩衝，存底下降"}],"src":[{"t":"中央銀行 2026-09-04 外匯存底新聞稿","u":"https://www.cbc.gov.tw/tw/cp-302-192817-7c782-1.html"},{"t":"經濟日報 2026-07-08 引央行","u":"https://money.udn.com/money/story/5616/9615534"},{"t":"工商時報 2026-07-07 引央行","u":"https://www.ctee.com.tw/news/20260707700060-430301"}],"rooms":["inflow","dest"],"ver":{"s":"confirmed","note":"央行 2026-09-04 新聞稿同一頁讀到三個數字。309% 是央行原文給的比率（18,610÷6,019.04＝309.2%，相符）。指標卡另列的兩則 7 月媒體報導與現值無關，未開啟。"}},{"id":"fini_flow_fsc","zh":"外資淨匯入（金管會口徑）","en":"Foreign investors' net inward remittance (FSC basis)","alias":["累計淨匯入","外資匯入"],"grp":"ext","speed":"mid","freq":"每月；5 日前後金管會證期局公布上月","what":"外資為了投資台灣證券匯入的本金，減掉匯出的本金。不扣獲利與股利的匯出。","mech":"這是監理用的本金帳。外資買新股票時匯進來的每一塊錢都算本金匯入；賣股匯出時，只有屬於原始本金的部分會被扣掉，資本利得與現金股利匯出去都不算。股價長期上漲、外資持續換股，累計數就會一路增加，即使外資其實是淨賣出、淨匯出。所以它不能用來判斷資金是否流入台灣。","read":[{"when":"單月淨匯入很大","means":"外資當月有匯入新的本金，但同月匯出的獲利與股利沒有扣；真實淨額要看央行口頭數字。"},{"when":"和證交所買賣超方向相反","means":"常見，不是哪一個算錯；2026 年 1–8 月就是 +905 億美元對上賣超逾兆元。"},{"when":"累計淨匯入創新高","means":"只代表歷年投入的本金帳面數增加，不代表外資持續加碼。"}],"now":{"v":"8 月 +166.65 億、1–8 月 +905 億美元（含陸資）；累計 4,104 億","asof":"2026-08","hard":"官方","state":"同期新高","tone":"watch"},"judge":"數字創同期新高，但同期證交所口徑外資賣超、國際收支上半年 −263 億美元。2026 年 6 月金管會 +116 億、央行口徑卻是淨匯出 170 億美元，方向相反。標為留意是提醒：這個口徑最容易被誤讀成資金湧入。","look":{"min":"5 年","best":"2017 年起","minY":5,"bestFrom":2017,"why":"要和國際收支口徑逐年對照，看過 2021、2024、2025 三次方向相反，才不會把它當成資金流向。"},"misread":["外資淨匯入創新高＝外資看好、錢一直進來：2018–2025 年合計 +1,121 億美元，國際收支卻是 −1,255 億。"],"up":[{"id":"fini_flow_twse","how":"外資買進新部位要匯入本金，買超月份淨匯入通常較大"},{"id":"mcap","how":"股價漲愈多，賣股匯出的錢裡獲利占比愈高、扣掉的本金愈少"}],"down":[{"id":"m2","how":"匯入的本金換成新台幣存款會推高 M2，但此口徑高估淨額"},{"id":"usdtwd","how":"匯入時有新台幣買盤；真實壓力要扣掉盈餘匯出才知道"}],"src":[{"t":"金管會證期局 外資及陸資投入我國股市概況表","u":"https://www.sfb.gov.tw/ch/home.jsp?id=1024&parentpath=0%2C4%2C109"},{"t":"工商時報 2026-09-04：8 月外資淨匯入","u":"https://www.ctee.com.tw/news/20260904701601-430301"},{"t":"風傳媒 2026-01-06：金管會說明口徑不含盈餘匯出","u":"https://www.storm.mg/article/11093132"}],"rooms":["inflow","dest"],"ver":{"s":"secondary","note":"只在工商時報讀到。官方稿為證期局 2026-09-04「115年8月外資新聞稿」PDF，讀回空白；概況表頁只到 2025 年。口徑混用：166.65、905 含陸資，4,104 為外資單計。"}},{"id":"fini_flow_cbc","zh":"外資證券投資（央行國際收支口徑）","en":"Foreign portfolio equity flows (BoP basis)","alias":["證券投資負債—股權","國際收支外資買台股"],"grp":"ext","speed":"slow","freq":"每季；國際收支新聞稿，落後 2–5 個月","what":"非居民對台灣股權的淨交易金額，依國際標準編製，可以跨國比較。","mech":"記在金融帳「證券投資—負債—股權和投資基金」。外資買進台股是正數、賣出是負數，本金與獲利一起算，所以是四種外資口徑中最接近實際現金流的，缺點是每季才公布。把證交所每日買賣超累加並換算成美元，量級與它相符，可以當成即時近似值；短期會因為賣股的錢先停在新台幣存款而有時間差。","read":[{"when":"連續多年為負","means":"外資長期是淨賣出；台股同期仍上漲，代表買盤來自國內資金。"},{"when":"單季大幅為負","means":"對應外資大賣的事件，如 2026 年第 1 季 −256.6 億美元（3 月台股修正）。"},{"when":"與金管會淨匯入方向相反","means":"以本口徑為準；金管會不扣盈餘匯出。"}],"now":{"v":"第 2 季 −6.3 億美元；第 1 季 −256.6 億；2025 年 −178 億","asof":"2026Q2","hard":"官方","state":"多年淨賣出","tone":"watch"},"judge":"2018 年以來 8 個完整年度有 6 年淨賣出，最大是 2022 年 −449 億美元；2026 上半年 −263 億已超過 2025 全年。第 2 季只有 −6 億，賣壓暫時停下。標為留意是因為第 3 季含 7 月的大賣，11 月公布時才知道全貌。","look":{"min":"5 年","best":"2008 年起","minY":5,"bestFrom":2008,"why":"跟著全球風險偏好與升降息循環走；要看過 2008、2011、2018、2020、2022 幾次大賣，才知道單季 −257 億算多大。"},"misread":["外資連年淨賣出＝台股該跌：2024、2025 年外資各淨賣約 180–190 億美元，指數仍上漲。"],"up":[{"id":"fini_flow_twse","how":"每日買賣超累加一季以上，換算美元後量級與本口徑相符"},{"id":"fed","how":"美元利率上升壓低本益比，外資減碼（2022 年 −449 億最大）"},{"id":"tsmc_w","how":"外資持股集中在台積電（2330），調節這一檔就決定整體流向"}],"down":[{"id":"fa","how":"外資淨賣出使金融帳負債面減少，淨流出變大"},{"id":"usdtwd","how":"外資賣股並匯出要買美元，新台幣走貶（2026 年 3 月、7 月）"},{"id":"reserves","how":"外資集中匯出時央行賣美元緩衝，存底減少"}],"src":[{"t":"中央銀行 國際收支新聞稿（2026 年第 2 季）","u":"https://www.cbc.gov.tw/tw/cp-302-192739-2cf64-1.html"},{"t":"中央銀行 國際收支簡表（季）","u":"https://www.cbc.gov.tw/public/data/economic/statistics/bop/cAQ.pdf"},{"t":"中央銀行 國際收支簡表（年）","u":"https://www.cbc.gov.tw/public/data/economic/statistics/bop/cAY.pdf"}],"rooms":["inflow","dest"],"ver":{"s":"confirmed","note":"三個數字都是「證券投資負債—股權」（外資買賣台股）；央行新聞稿本文只寫合計「非居民證券投資淨增加19.0億美元」，股權要看簡表。2025 四季加總與年表相符。"}},{"id":"usdtwd","zh":"美元兌新台幣匯率","en":"USD/TWD exchange rate","alias":["新台幣匯率","台幣","USD/TWD"],"grp":"ext","speed":"fast","freq":"每日；16:00 後央行公布收盤匯率","what":"1 美元可以換多少新台幣。數字變小＝新台幣升值，數字變大＝新台幣貶值。","mech":"短期由資金進出決定，不是貿易：央行統計 2024 年資金進出金額是商品貿易外匯收支的 19.3 倍。外資買股匯入推升新台幣、賣股與股利匯出則貶；出口商與壽險手上未換、未避險的美元平常不動，預期翻轉時會集中賣出。央行不守特定價位，只在波動過大時進場買賣美元，能減速但擋不住方向。","read":[{"when":"單日變動 1 角以上、成交量 25–30 億美元以上","means":"有事件在推動，不是一般波動；看外資買賣超與央行說明。"},{"when":"每年 6–9 月偏弱","means":"外資把領到的現金股利換成美元匯出，是季節性因素，不代表趨勢。"},{"when":"短時間急升","means":"通常是民間未換的美元集中拋售；賣完動能就消失（2025 年 5 月升 6%，8 個月後回到原點）。"},{"when":"接近年內區間的上下緣","means":"2026 年區間 31.251–32.454；靠近邊緣時留意央行調節與外資動向。"}],"now":{"v":"31.808（2026 年區間 31.251–32.454）","asof":"2026-09-18","hard":"市場","state":"區間中段","tone":"calm"},"judge":"位置在今年區間中段，今年以來貶約 1.2%。9/16 聯準會升息後沒有貶、反而小升，顯示市場已事先反映。台美利差擴大到 1.75–2.00 個百分點，新台幣缺乏自己升值的動力；但目前沒有失序波動。","look":{"min":"2 年","best":"2008 年起","minY":2,"bestFrom":2008,"why":"至少要含 2025 年 5 月急升與之後 8 個月回吐，才不會把單一事件外推；看利差循環要 3–5 年以上。"},"misread":["順差大所以新台幣一定升：2026 年 1–8 月出超年增 57.6%，新台幣卻貶約 1.2%。","央行會守住某個價位：2025 年 5 月央行買了約百億美元，匯率仍兩天升 6%。"],"up":[{"id":"fini_flow_twse","how":"外資買股匯入推升新台幣；賣股與股利匯出則走貶"},{"id":"fed","how":"美元利率高於新台幣，資金留在美元，新台幣缺乏升值動力"},{"id":"fxdep","how":"民間未換的美元若集中賣出會造成急升（2025 年 5 月）"},{"id":"life_fx","how":"壽險降低避險＝少賣遠期美元，新台幣的升值壓力減輕"}],"down":[{"id":"reserves","how":"升太快央行買美元、貶太快賣美元，反映在存底月變動"},{"id":"life_fx","how":"新台幣急升時，壽險未避險的海外資產出現匯損"},{"id":"rev_monthly","how":"出口商以美元收款，新台幣升值時換算的營收與毛利變少"},{"id":"cpi","how":"新台幣貶值讓進口品變貴，會推高物價"}],"src":[{"t":"中央銀行 新台幣對美元銀行間成交收盤匯率","u":"https://www.cbc.gov.tw/tw/lp-645-1.html"},{"t":"中央銀行 2025-04-18 說明（資金進出為貿易的 19.3 倍）","u":"https://www.cbc.gov.tw/tw/cp-302-181341-3319b-1.html"},{"t":"中央銀行 2025-05-02 新台幣匯率說明","u":"https://www.cbc.gov.tw/tw/cp-302-181423-cc30d-1.html"}],"rooms":["inflow","dest","themes"],"ver":{"s":"confirmed","note":"三個數值與日期都在央行每日收盤匯率表讀到。今天只讀第 1、2、8 頁（約 60 個交易日），31.251 與 32.454 在所讀頁面內確為最低與最高；第 3–7 頁未讀，「全年極值」未逐日重驗。"}},{"id":"reer","zh":"新台幣實質有效匯率指數","en":"New Taiwan dollar real effective exchange rate (REER)","alias":["REER","實質有效匯率"],"grp":"ext","speed":"slow","freq":"每月；國際清算銀行（BIS）中下旬更新","what":"新台幣對主要貿易對手的匯率加權平均，再扣掉各國物價差異；用來判斷新台幣貴或便宜。","mech":"美元兌新台幣只比一種貨幣，而且沒有考慮物價。實質有效匯率把新台幣對所有主要貿易對手的匯率，依貿易比重加權，再用相對物價調整；以 2020 年為 100。指數上升代表新台幣對整體貿易對手變貴，出口品的價格競爭力下降。它是估值指標，變動很慢，短期沒有訊號。","read":[{"when":"高於 105","means":"偏貴；過去出現在 2021 年與 2025-07（急升事件後為 105.04）。"},{"when":"低於 95","means":"偏便宜；2009–2016 年多在 90–95。"},{"when":"名目匯率貶值但指數沒降","means":"貿易對手的貨幣也在貶，或台灣物價漲得較多，新台幣其實沒有變便宜。"}],"now":{"v":"97.77（2020 年＝100；6 月 99.04）","asof":"2026-07","hard":"官方","state":"不貴不便宜","tone":"calm"},"judge":"97.77 在過去 15 年區間的中間偏高，離歷史高點 134.08（1994-01）與低點 90.05（2009-02）都遠。2025 年 5 月急升推到 105 的部分已經回吐。以這個指標看，現在談不上高估或低估。","look":{"min":"15 年","best":"1994 年起","minY":15,"bestFrom":1994,"why":"估值指標短期沒有訊號；要看到 1994 年高點 134 與 2009 年低點 90，才知道 97.77 在歷史上的位置。"},"misread":["美元兌新台幣貶值＝新台幣變便宜：要看物價與其他貿易對手的匯率，實質有效匯率才是比較基準。"],"up":[{"id":"usdtwd","how":"名目匯率是主要成分；2025 年 5 月急升讓指數三個月升 9%"},{"id":"cpi","how":"台灣物價漲得比貿易對手慢，指數會下降"}],"down":[{"id":"exports","how":"指數偏高代表出口品相對變貴，長期不利價格競爭"},{"id":"ca","how":"匯率長期偏低有利順差累積，是美國匯率報告關注的項目"}],"src":[{"t":"FRED 轉載國際清算銀行：台灣實質廣義有效匯率","u":"https://fred.stlouisfed.org/series/RBTWBIS"},{"t":"國際清算銀行 有效匯率資料","u":"https://data.bis.org/topics/EER"}],"rooms":["inflow"],"ver":{"s":"confirmed","note":"在聖路易聯準銀行 FRED 資料檔讀到（Source 欄為 BIS）。BIS 資料入口 data.bis.org 是 JavaScript 空殼，讀不到數值，原始發布者頁面未核。"}},{"id":"fdi_out","zh":"對外直接投資","en":"Outward direct investment","alias":["核准對外投資","台積電赴美","ODI"],"grp":"ext","speed":"slow","freq":"核准數每月 15–20 日投審司公布；實際數每季國際收支","what":"台灣企業到海外設廠、增資子公司或併購（持股 10% 以上）投出去的錢。","mech":"有兩套數字。投審司是核准金額，企業可以分年匯出、也可能不匯；國際收支是實際發生，還包含海外子公司賺了錢沒匯回、留在當地再投資的部分，兩者對不起來。大型案件多半直接動用海外的美元，不經過台北外匯市場，所以對匯率的直接影響比金額看起來小。它現在是順差流到國外的主要管道之一。","read":[{"when":"核准金額暴增","means":"先看是不是少數大案（2026 年前 8 月台積電（2330）兩案占 80%）；核准不等於當年匯出。"},{"when":"對美國占比升、對中國大陸占比降","means":"供應鏈搬遷的方向；對中國大陸占累計投資由 58.3% 降到 18.8%（2018–2025 年）。"},{"when":"政府或企業宣布數千億美元承諾","means":"是多年期上限，沒有分年時程；信用保證不是現金支出。"}],"now":{"v":"核准 1–8 月 623.9 億美元（+98.4%）；國際收支上半年 210.5 億","asof":"2026-08","hard":"官方","state":"創新高","tone":"watch"},"judge":"國際收支口徑 2025 年 454 億美元、2026 上半年 211 億，每年約 400–500 億美元，約占經常帳順差的四分之一，台灣的順差付得起。標為留意的原因是它已取代壽險買債成為主要流出管道，而且高度集中在台積電（2330）一家。","look":{"min":"15 年","best":"2008 年起","minY":15,"bestFrom":2008,"why":"供應鏈搬遷以十年計；2018 年貿易戰是轉折點，要看到轉折前後各幾年，才看得出目的地的變化。"},"misread":["把核准金額當成當年匯出金額：1–8 月核准 624 億美元，上半年實際只有 211 億。","把「承諾 2,500 億美元」當成國家要付的錢：那是企業自主投資的多年期上限。"],"up":[{"id":"tariff","how":"美國以關稅待遇換取投資承諾（2026-01 備忘錄 2,500 億美元）"},{"id":"tsmc_rev","how":"台積電（2330）海外設廠與增資子公司，是最大的單一來源"},{"id":"ca","how":"順差提供可以往外投資的外匯"}],"down":[{"id":"fa","how":"記為金融帳直接投資資產增加，是順差流出的主要管道之一"},{"id":"primary_income","how":"海外子公司的獲利，日後以投資所得匯回或留在當地再投資"},{"id":"orders","how":"產能外移使外銷訂單在海外生產的比重改變"},{"id":"usdtwd","how":"匯出資金要買美元；但大案多直接用海外美元，不經台北匯市"}],"src":[{"t":"經濟部投資審議司 2026-09-15 新聞稿","u":"https://www.moea.gov.tw/MNS/populace/news/News.aspx?kind=1&menu_id=40&news_id=123980"},{"t":"中央銀行 2026-09-17 理監事會參考資料第 6 章","u":"https://www.cbc.gov.tw/dl-227602-efb374350f4b49e0984456d64c2c7bb2.html"},{"t":"中央銀行 國際收支簡表（年）","u":"https://www.cbc.gov.tw/public/data/economic/statistics/bop/cAY.pdf"}],"rooms":["inflow","dest","aidc"],"ver":{"s":"confirmed","note":"核准數為投審司 2026-09-15 新聞稿原句，98.37% 進位 98.4%，不含對中國大陸。210.5 億為季表兩季加總 21,054 百萬美元；央行新聞稿第 2 季 110.4 億相符。"}},{"id":"primary_income","zh":"初次所得（海外投資收益）","en":"Primary income (investment income)","alias":["投資所得","股利匯出","海外盈餘"],"grp":"ext","speed":"slow","freq":"每季；國際收支新聞稿（經常帳的一項）","what":"台灣從海外收到的投資收益（盈餘、股利、利息），減掉外資從台灣領走的股利、利息與盈餘。","mech":"收入面是台商海外子公司的盈餘與股利、央行外匯存底與壽險海外債券的利息；支出面是外資從台股領走的現金股利、外商在台子公司的盈餘。台灣是淨債權國，所以長期淨收入為正。支出有明顯季節性：上市櫃公司 7–9 月發放現金股利，外資換成美元匯出，第 3 季支出特別大，這也是每年夏天新台幣偏弱的原因之一。","read":[{"when":"第 3 季支出跳增","means":"外資領走股利的季節性：2025 年第 3 季 145.4 億美元，其他季約 60–85 億。"},{"when":"收入面逐年增加","means":"海外資產變多或全球利率較高，台灣的海外利息與盈餘收入增加。"},{"when":"支出面逐年增加","means":"外資持股市值與企業配息變大：2009 年 78 億美元，2025 年 370 億，16 年變 4.7 倍。"}],"now":{"v":"2026 上半年淨 +187 億美元（收 332／付 144）；2025 年 +264 億","asof":"2026Q2","hard":"官方","state":"穩定淨流入","tone":"calm"},"judge":"一年淨流入 264 億美元，比 2006 年以來外資任何一年淨買台股的金額都大，卻很少被提到。走勢穩定、沒有異常。要注意的只有季節性：看到第 3 季支出變大、新台幣偏弱，不要當成趨勢改變。","look":{"min":"5 年","best":"2008 年起","minY":5,"bestFrom":2008,"why":"跟著全球利率與海外獲利走；至少看一個升降息循環，並用逐季資料確認第 3 季的股利季節性。"},"misread":["只看外資買賣超、忽略所得：2025 年初次所得淨收 264 億美元，外人來台直接投資只有 110 億。"],"up":[{"id":"fdi_out","how":"海外子公司的盈餘與股利是收入面的主體"},{"id":"fed","how":"美元利率高，外匯存底與壽險海外債券的利息收入增加"},{"id":"life_fx","how":"壽險海外債券的利息計入收入面"},{"id":"mcap","how":"外資持有近半上市市值，公司配息愈多，支出面愈大"}],"down":[{"id":"ca","how":"淨額是經常帳第二大正項"},{"id":"usdtwd","how":"外資 7–9 月把股利換成美元匯出，新台幣季節性偏弱"},{"id":"reserves","how":"股利匯出旺季央行常賣美元調節，存底月減"}],"src":[{"t":"中央銀行 國際收支簡表（年）","u":"https://www.cbc.gov.tw/public/data/economic/statistics/bop/cAY.pdf"},{"t":"中央銀行 國際收支簡表（季）","u":"https://www.cbc.gov.tw/public/data/economic/statistics/bop/cAQ.pdf"}],"rooms":["inflow","local"],"ver":{"s":"confirmed","note":"季表只列收入、支出，上半年淨額 187.4 億為兩者相減，經常帳恆等式驗算相符。工具首次把 Q1 淨額誤算成 8,033，重讀確認 9,033。其餘為進位。"}},{"id":"m2","zh":"M2 貨幣總計數","en":"M2 monetary aggregate","alias":["廣義貨幣","貨幣供給","M2 成長參考區間"],"grp":"money","speed":"mid","freq":"每月；次月 23–25 日央行發布「金融情況」","what":"全台灣的錢的總量：現金加上所有存款（活存、定存、外幣存款、郵局存款）。","mech":"M2 變多主要靠兩件事：銀行放款（撥貸時借款人帳上多一筆存款）與國外資金淨流入。央行直接控制的只有準備貨幣，M2 約是它的 9.3 倍，其餘是放款創造的存款。外幣存款用當月匯率換算，新台幣升值時 M2 會被動變小，錢其實沒少。","read":[{"when":"年增率高於央行參考區間上限 6.5%","means":"先看央行新聞稿點名的原因是放款、外資還是匯率；超出區間不代表央行一定會動作。"},{"when":"年增率上升，放款年增率也同步走高","means":"錢是銀行放款創造出來的，要再看借給誰：企業週轉金、房貸還是理財週轉金。"},{"when":"年增率下降，同月新台幣大幅升值","means":"可能只是外幣存款換算縮水，例如 2025 年 5–6 月 M2 年增率掉到 3.3–3.4%。"}],"now":{"v":"70.22 兆元，年增 7.42%（參考區間 2.5–6.5%）","asof":"2026-07","hard":"官方","state":"高於參考區間","tone":"watch"},"judge":"年增率連 3 個月高於 6.5% 上限。央行的說明是 AI 供應鏈週轉金與股市交易熱絡所致，而且經濟成長率加 CPI 合計 13.51%，錢的成長沒有快過經濟；央行預估全年 6.75%。要留意的是它若在經濟放慢後仍停在區間之上。","look":{"min":"6 年","best":"2008 年起","minY":6,"bestFrom":2008,"why":"至少要涵蓋 2021–22 年超出區間，以及 2025 年匯率讓 M2 被動縮水的失真；從 2008 年看可多一次 2009 年的對照。"},"misread":["把 M2 成長當成央行印鈔：央行只控制準備貨幣（約 7.6 兆元），其餘是銀行放款創造的存款。","錢多股市就漲：2022 年 M2 年增 7.48% 也高於區間，台股月均指數卻由 16,938 點降到 15,623 點。"],"up":[{"id":"loans","how":"放款撥貸時創造存款，是 M2 成長的最大來源"},{"id":"fini_flow_fsc","how":"外資匯入換成新台幣存款使 M2 增加，匯出則減少"},{"id":"usdtwd","how":"新台幣升值時外幣存款換算金額縮水，M2 被動下降"},{"id":"fxdep","how":"外匯存款約 9.6 兆元是 M2 的一部分，企業留存美元越多占比越高"}],"down":[{"id":"m1b_gap","how":"M2 年增率是比較基準；活存成長快過它時差距轉正"},{"id":"policy_rate","how":"M2 長期高於參考區間且物價升溫時，央行緊縮的機率增加"},{"id":"cpi","how":"錢的成長長期快過經濟成長，才會形成物價上漲壓力"}],"src":[{"t":"中央銀行 金融情況新聞稿列表","u":"https://www.cbc.gov.tw/tw/lp-302-1.html"},{"t":"中央銀行 金融統計月報 重要金融指標","u":"https://www.cbc.gov.tw/public/data/EBOOKXLS/001_EF01_A4L.pdf"},{"t":"中央銀行 2026-09-17 參考資料：M2 之重要性與走勢","u":"https://www.cbc.gov.tw/dl-227600-4c73575ef00a43c5bbfa0e9367497cbd.html"}],"rooms":["local","inflow"],"ver":{"s":"confirmed","note":"口徑為日平均。央行 2026-08-24 新聞稿（115 年 7 月金融情況）與月報表一致；702,248 億元＝70.22 兆元。期底 M2 為 701,550 億元、年增 6.58%，非本卡口徑。"}},{"id":"m1b_gap","zh":"M1B 與 M2 年增率差","en":"M1B–M2 growth gap","alias":["黃金交叉","死亡交叉","M1B","資金動能"],"grp":"money","speed":"mid","freq":"每月；次月 23–25 日央行發布「金融情況」","what":"活期性存款（隨時可動用的錢）的年增率減去全部存款的年增率；看錢是往活存移，還是回到定存。","mech":"定存解約轉活存時 M1B 變大、M2 不變，差距轉正；外資匯入買股、股市成交放大讓交割戶餘額變多，也會推高 M1B。資金回到定存、換成外幣或外資匯出時，差距轉負。它反映資金的動向，是同時或落後指標，不是股價上漲的原因。","read":[{"when":"差距由負轉正（俗稱黃金交叉）","means":"活期資金成長較快，通常伴隨成交放大；要再確認證券劃撥存款有沒有一起增加。"},{"when":"差距由正轉負（俗稱死亡交叉）","means":"活錢成長放慢或外資匯出，不是立刻下跌的訊號；2022-09 起連 40 個月為負，指數仍上漲。"},{"when":"差距連續數月往同一方向移動","means":"這才算趨勢；單月接近零的交叉（如 2026-07 的 −0.08 個百分點）資訊量很低。"}],"now":{"v":"M1B +7.34%、M2 +7.42%，差 −0.08 個百分點","asof":"2026-07","hard":"官方","state":"差距轉負","tone":"watch"},"judge":"1 月才轉正、3 月擴大到 +2.04，7 月回到 −0.08 個百分點。兩者年增率都在 7% 以上，錢的總量仍在快速增加，只是活期部分沒有再加速；央行點名主因是外資淨匯出。要連看 8、9 月是否繼續往負值擴大。","look":{"min":"5 年","best":"2008 年起","minY":5,"bestFrom":2008,"why":"最近一次負值長達 40 個月；要看過 2009–10、2020–21 年的大幅正差距，才知道 2026 年的 +2 個百分點只是溫和。"},"misread":["把黃金交叉當買進訊號：2026-01 轉正時，指數月均已由 2025-04 的 19,558 點漲到 31,223 點。","把死亡交叉當賣出訊號：2022-09 到 2025-12 連 40 個月為負，指數月均由 15,623 點升到 28,070 點。"],"up":[{"id":"policy_rate","how":"利率高時錢留在定存，M1B 成長慢、差距偏負"},{"id":"fini_flow_fsc","how":"外資匯入買股，錢流進賣方交割戶，M1B 增加較快；匯出相反"},{"id":"m2","how":"M2 是減項；放款或匯率 l","how":"放款快速擴張數年後，景氣轉弱時逾放才會浮現"}],"src":[{"t":"中央銀行 金融統計月報 重要金融指標（續）","u":"https://www.cbc.gov.tw/public/data/EBOOKXLS/003_EF03_A4L.pdf"},{"t":"中央銀行 2026-09-17 理監事會後記者會簡報","u":"https://www.cbc.gov.tw/tw/dl-227628-74ae32c955584d8cbe77b43cb3b06fa6.html"},{"t":"銀行局 金融統計指標 115 年 7 月","u":"https://www.banking.gov.tw/webdowndoc?file=/stat/index/11507.pdf"}],"rooms":["local","dest"],"ver":{"s":"confirmed","note":"口徑為央行全體貨幣機構、期底、以成本計價。月報表與 8/24 新聞稿一致。銀行局口徑（國內總分行放款 43.37 兆）不同，非本卡數字。"}},{"id":"ldr","zh":"存放比","en":"Loan-to-deposit ratio (LDR)","alias":["存放比率","LDR"],"grp":"money","speed":"mid","freq":"每月；銀行局「金融統計指標」月中更新上上月資料","what":"放款除以存款：銀行每收 100 元存款，借出去多少元。","mech":"台灣的儲蓄長期多於國內投資，存款長得比合格的放款需求快，存放比只有七成上下，多的錢拿去買央行定存單、公債與海外債券。比率超過 100% 的銀行體系得向市場借錢來放款，資金一緊就脆弱；台灣相反，問題是錢放不出去。","read":[{"when":"比率上升（放款年增率高於存款年增率）","means":"銀行在動用閒置資金；照 2026 年的速度，估計 2–3 年會碰到約 83% 的理論上限。"},{"when":"比率長期在七成上下","means":"是結構性的存款多於放款需求，不是銀行保守不肯借。"},{"when":"看到一個存放比數字卻沒寫口徑","means":"先確認是全行 72.4%、國內總分行 76.9%，還是含郵局的 69.6%。"}],"now":{"v":"76.9%（本國銀行國內總分行，自算）；全行 72.43%（2025 年底）","asof":"2026-07","hard":"估計","state":"緩步上升","tone":"calm"},"judge":"國內總分行口徑 7 個月上升 1.5 個百分點，方向與放款年增 9.85% 高於存款 7.37% 一致。距離扣掉法定準備與流動準備後約 83% 的理論上限還有空間，現在不是放款的限制；要看的是上升速度有沒有加快。","look":{"min":"10 年","best":"2000 年起","minY":10,"bestFrom":2000,"why":"這是變動很慢的結構性指標；要看到長期下降的趨勢，才知道七成是結構性偏低，不是最近才低。"},"misread":["把存放比低解讀成銀行保守不肯借：實際是超額儲蓄太多，存款長得比合格放款需求快。","不同口徑直接比較：含不含 OBU、海外分行與郵局，2026-07 的數字從 68.1% 到 76.9% 都有。"],"up":[{"id":"loans","how":"放款成長快過存款時，比率上升"},{"id":"excess_saving","how":"儲蓄長期多於國內投資，存款長得比放款快，比率偏低"},{"id":"m2","how":"存款是分母；外資匯入或放款創造存款都會讓分母變大"}],"down":[{"id":"ncd","how":"存放比低代表閒置資金多，多的錢停在央行定存單"},{"id":"excess","how":"銀行閒置資金的多寡，決定銀行間拆款利率的鬆緊"}],"src":[{"t":"銀行局 金融統計指標 115 年 7 月","u":"https://www.banking.gov.tw/webdowndoc?file=/stat/index/11507.pdf"},{"t":"銀行局 金融業務統計輯要","u":"https://www.banking.gov.tw/webdowndoc?file=/stat/abs/11507.pdf"}],"rooms":["local"],"ver":{"s":"confirmed","note":"76.9% 非官方直接公布，係 433,695÷563,794＝76.92% 自算，兩個分子分母均在銀行局金融統計指標 115 年 7 月版讀到。72.43% 為金融業務統計輯要表 1-2 全行口徑。"}},{"id":"ncd","zh":"央行定存單餘額","en":"CBC certificates of deposit outstanding","alias":["NCD","央行定期存單","沖銷"],"grp":"money","speed":"mid","freq":"每月；央行資產負債表於次月中旬前更新","what":"央行向銀行借回新台幣所發的定期存單，還有多少沒到期；代表銀行停在央行的閒置資金。","mech":"央行買進美元阻止新台幣升值時，會付出新台幣給銀行。放著不管，銀行間利率會掉到接近零、放款與 M2 膨脹，所以央行發定存單把錢收回來，這叫沖銷。外資匯出、央行賣美元或放款需求強時，央行讓定存單到期不續發，把錢放回銀行。","read":[{"when":"餘額上升","means":"央行在收錢，背景多是外資匯入、出口商賣匯、央行買匯阻升；2025 年 3–6 月增加 5,700 億元。"},{"when":"餘額下降","means":"央行在放錢，背景是外資匯出、央行賣匯、繳稅或放款需求強；2026 年前 8 個月減少約 8,500 億元。"},{"when":"餘額下降，隔夜拆款利率卻沒動","means":"央行補回去的量大致抵銷被抽走的資金，銀行間資金並沒有變緊。"}],"now":{"v":"6.57 兆元（今年以來 −0.85 兆；7 月 6.47 兆為近十年低點）","asof":"2026-08","hard":"官方","state":"持續減少","tone":"watch"},"judge":"今年減少 0.85 兆元，央行自述是持續減發存單來釋出資金，同時放款年增近 10% 也讓銀行把錢拿回去用。餘額已到近十年區間（6.5–9.5 兆元）的底部，代表銀行的閒置資金正在被用掉，但 6 兆多元離用完還很遠。","look":{"min":"6 年","best":"2008 年起","minY":6,"bestFrom":2008,"why":"要跨過幾次外資大進大出：2020–21 年升到 9.5 兆元、2025 年新台幣急升時增發、2026 年減發。"},"misread":["央行收走 6 兆元所以市場缺錢：那是銀行多到沒地方放才停在央行的錢，利率只有 1.2–1.6%。","把它當成可以全部變成放款的錢：7 兆元級的量約是 M2 的 10%，央行不會放任全數釋出。"],"up":[{"id":"reserves","how":"央行買匯使外匯存底增加時，同步增發定存單收回新台幣"},{"id":"fini_flow_fsc","how":"外資匯入時央行買匯並增發，匯出時賣匯並減發"},{"id":"loans","how":"放款需求強，銀行不續作定存單，餘額下降"},{"id":"usdtwd","how":"新台幣升值壓力大時央行買匯，定存單隨之增加"}],"down":[{"id":"excess","how":"定存單把多餘準備金收走，超額準備才會長年只有幾百億元"},{"id":"m2","how":"減發定存單讓銀行有準備金繼續放款，M2 不因外資匯出而收縮"}],"src":[{"t":"中央銀行 金融統計月報 中央銀行資產負債統計表（續）","u":"https://www.cbc.gov.tw/public/data/EBOOKXLS/027_EF25_A4L.pdf"},{"t":"中央銀行 公開市場操作統計","u":"https://www.cbc.gov.tw/tw/lp-1008-1.html"}],"rooms":["local","inflow"],"ver":{"s":"confirmed","note":"金額三個數字均核到。「近十年低點」僅能以月報表列期間（2016 起各年底＋近期各月）佐證為表中最低，表上未列 2016–2024 每一個月，逐月最低無法由此表完全證明。"}},{"id":"excess","zh":"超額準備與銀行間利率","en":"Excess reserves and interbank overnight rate","alias":["隔夜拆款利率","超額準備","資金鬆緊"],"grp":"money","speed":"mid","freq":"每月；拆款利率於次月 5–7 日發布","what":"銀行放在央行、超過法定要求的準備金，以及銀行之間互借一天的利率；用來看銀行間資金鬆或緊。","mech":"銀行依存款種類要提存平均約 6.9% 的法定準備，多出來的叫超額準備。央行每天用定存單把多餘的錢收走，所以超額準備長年只有 400–600 億元，隔夜拆款利率也被穩在 0.82% 附近。要看銀行還有多少閒置資金，得看定存單餘額，不是超額準備。","read":[{"when":"超額準備只有幾百億元","means":"這是央行沖銷後的常態，不代表銀行沒錢可借。"},{"when":"隔夜拆款利率明顯走高","means":"央行有意讓資金變緊，或資金被抽走而央行沒有補；這才是銀行間資金轉緊的訊號。"},{"when":"拆款利率不動，商業本票與公債利率走高","means":"最短天期的資金被央行穩住，但較長天期的借錢成本已由市場推高。"}],"now":{"v":"超額準備 579 億元（7 月）；隔夜拆款利率 0.822%（8 月）","asof":"2026-08","hard":"官方","state":"平穩","tone":"calm"},"judge":"外資今年在集中市場大幅賣超，隔夜拆款利率卻幾乎停在 0.82%，代表央行用減發定存單把被抽走的資金補了回去，銀行間資金沒有變緊。變貴的是較長天期的利率：30 天期商業本票 8 月為 1.71%，月升 0.21 個百分點。","look":{"min":"7 年","best":"2015 年起","minY":7,"bestFrom":2015,"why":"只看近兩年它幾乎不動；要涵蓋 2020 年降息與 2022–24 年升息，才看得到它隨政策利率移動的樣子。"},"misread":["超額準備只有存款的 0.1% 就說銀行沒有多餘的錢：多的錢被央行定存單收走了，隨時可以拿回來。"],"up":[{"id":"ncd","how":"央行增發定存單收走準備金，超額準備就少、拆款利率被撐住"},{"id":"policy_rate","how":"政策利率與定存單發行利率決定拆款利率的大致水準"},{"id":"fini_flow_fsc","how":"外資匯出時央行賣匯收回新台幣，銀行準備金減少"}],"down":[{"id":"loans","how":"拆借成本低、資金寬鬆，銀行放款的資金成本就低"},{"id":"usdtwd","how":"新台幣短期利率遠低於美元利率時，持有美元較有利，結售意願偏低"}],"src":[{"t":"中央銀行 2026-09-07 金融業拆款與商業本票市場統計","u":"https://www.cbc.gov.tw/tw/cp-302-192823-eb386-1.html"},{"t":"中央銀行 金融統計月報 準備金表","u":"https://www.cbc.gov.tw/public/data/EBOOKXLS/070_EF72_A4R.pdf"}],"rooms":["local"],"ver":{"s":"confirmed","note":"57,887 百萬元＝578.87 億元，四捨五入為 579 億元；6 月為 49,787 百萬元。拆款利率出自央行 2026-09-07 新聞稿（115 年 8 月）。"}},{"id":"policy_rate","zh":"央行政策利率","en":"CBC policy rate (discount rate)","alias":["重貼現率","升息","降息","理監事會"],"grp":"money","speed":"slow","freq":"每季；3、6、9、12 月中下旬週四的理監事會","what":"央行借錢給銀行的利率（重貼現率），是全台存放款利率的基準；每季理監事會決定升、降或不動。","mech":"央行調整重貼現率後，銀行的存款與放款牌告利率跟著動，借錢成本改變，放款、房貸與定存的吸引力也跟著變。但市場利率不只看央行：放款需求、外資進出與美債殖利率都會推動公債與商業本票利率，政策利率不動時借錢也可能變貴。","read":[{"when":"升息","means":"借錢變貴、定存變有吸引力，活期資金成長通常放慢；機動利率房貸的每月負擔增加。"},{"when":"利率不動，但調整房貸成數或存款準備率","means":"央行偏好用針對性工具處理房市，不動用影響全體的利率；要讀決議全文。"},{"when":"政策利率不動，公債與公司債利率走高","means":"市場已自行緊縮，企業與建商的融資成本實際上升，只看政策利率會漏掉。"},{"when":"理事出現不同意見（例如有人主張升息）","means":"內部看法開始分歧，下一季會議值得留意，但不等於一定會升息。"}],"now":{"v":"2.00%（9/17 第 10 次不動；2 位理事主張升息）","asof":"2026-09-17","hard":"官方","state":"連 10 次不動","tone":"watch"},"judge":"利率不動、同時把第二戶房貸成數由 6 成放寬到 7 成，但有 2 位理事主張升息，M2 年增率又高於參考區間；10 年期公債殖利率已由 1.357% 升到 1.907%，市場利率先反映了偏緊的方向。12 月會議要看物價與 M2 的走勢。","look":{"min":"7 年","best":"2008 年起","minY":7,"bestFrom":2008,"why":"至少涵蓋 2020 年降息到 2022–24 年升息的完整循環；從 2008 年看起，可多看一次金融海嘯時期的降息。"},"misread":["央行沒升息就是資金環境沒變：2025-12 到 2026-09，5 年期公司債利率由 1.708% 升到 2.230%。","以為利率不動就沒有政策變化：9/17 同一次會議放寬了第二戶房貸成數，央行常用信用管制代替利率。"],"up":[{"id":"cpi","how":"物價上漲壓力大時，央行傾向升息"},{"id":"m2","how":"M2 年增率長期高於參考區間，是央行考慮緊縮的依據之一"},{"id":"fed","how":"美國升息拉大台美利差，資金外流與匯率壓力會影響央行決策"},{"id":"gdp","how":"經濟成長強時，央行較有空間升息或維持偏緊"}],"down":[{"id":"m1b_gap","how":"利率高時錢留在定存，M1B 成長慢、差距偏負"},{"id":"loans","how":"利率高則借款成本高，放款需求降低"},{"id":"hloan","how":"房貸多為機動利率，政策利率調整會直接改變每月還款額"},{"id":"usdtwd","how":"台美利差影響資金進出，進而影響新台幣匯率"}],"src":[{"t":"中央銀行 2026-09-17 理監事會決議新聞稿","u":"https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html"},{"t":"中央銀行 理監事會決議與記者會資料列表","u":"https://www.cbc.gov.tw/tw/lp-357-1.html"},{"t":"中央銀行 金融統計月報 央行利率表","u":"https://www.cbc.gov.tw/public/data/EBOOKXLS/136_EG28_A4R.pdf"}],"rooms":["local","dest","time"],"ver":{"s":"confirmed","note":"2.00% 出自央行決議新聞稿。新聞稿未揭露表決情形；「2 位理事主張升息」「連 10 凍」僅在中央社 9/17 報導（二手）讀到。月報利率表末次調整為 2024/3/22，逐季推算 10 次相符。"}},{"id":"npl","zh":"逾放比","en":"Non-performing loan (NPL) ratio","alias":["逾期放款比率","備抵呆帳覆蓋率","NPL"],"grp":"money","speed":"mid","freq":"每月；金管會於次次月 10 日前後發布","what":"放款當中超過 3 個月沒有正常還款的比例；搭配「覆蓋率」看銀行提的呆帳準備夠不夠。","mech":"借款人還不出錢、逾期達 3 個月以上才列入逾放，所以它是落後指標：景氣轉差後一段時間才會上升。景氣好、放款快速增加時分母變大，比率會自然變低，容易讓人低估風險。覆蓋率是備抵呆帳除以逾期放款，越高代表緩衝越厚。","read":[{"when":"逾放比在 0.2% 以下、覆蓋率達數倍","means":"目前看不到信用風險訊號，銀行不會因為呆帳而縮手放款。"},{"when":"逾放比連續數月上升","means":"信用風險浮現，銀行會自己收緊放款標準，這是「銀行不敢借」的開始。"},{"when":"放款高速成長而逾放比下降","means":"可能只是分母變大；要等景氣轉弱後，才看得到這批放款的真實品質。"}],"now":{"v":"0.14%；備抵呆帳覆蓋率 941.22%","asof":"2026-07","hard":"官方","state":"歷史低檔","tone":"calm"},"judge":"0.14% 是歷史低檔，覆蓋率超過 9 倍，購置住宅貸款與建築貸款的逾放比也只有 0.08%，現在沒有信用風險訊號。但放款年增近 10%、分母快速變大，比率偏低有一部分是算術效果，不能當成未來也安全的保證。","look":{"min":"20 年","best":"2000 年起","minY":20,"bestFrom":2000,"why":"只看近 10 年會以為逾放比永遠在 0.3% 以下；要回到 2000–02 年本土金融風暴與 2005–06 年雙卡風暴才看得到它上升的樣子。"},"misread":["逾放比低就代表放款品質好：它落後景氣，而且放款快速增加時分母變大，比率會自然變低。"],"up":[{"id":"gdp","how":"景氣轉弱後企業與家庭還款能力下降，逾放延後數季上升"},{"id":"policy_rate","how":"利率上升增加借款人的還款負擔，逾放通常延後一段時間上升"},{"id":"unemp","how":"失業增加時家庭還款能力下降，房貸與信用貸款逾放上升"},{"id":"hprice","how":"房價下跌使擔保品價值縮水，房貸與建築貸款的損失風險升高"}],"down":[{"id":"loans","how":"逾放上升時銀行收緊授信標準，放款成長放慢"},{"id":"cloan","how":"建築貸款逾放上升時，銀行對建商的土地與建築融資會先縮手"}],"src":[{"t":"金管會 2026-09-10 本國銀行逾期放款新聞稿","u":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0,2&mcustomize=news_view.jsp&dataserno=202609100001&dtable=News"},{"t":"中央銀行 金融統計月報 重要金融指標（逾放比歷年底值）","u":"https://www.cbc.gov.tw/public/data/EBOOKXLS/007_EF07_A4L.pdf"}],"rooms":["local","dest"],"ver":{"s":"confirmed","note":"金管會 2026-09-10 新聞稿「115年7月底本國銀行逾期放款情形」；同稿放款總餘額 48 兆 8,528 億元、逾期放款 685.86 億元。"}},{"id":"wealth","zh":"國富統計（家庭淨值）","en":"National wealth statistics (household net worth)","alias":["國富","家庭部門淨值","國富淨額"],"grp":"money","speed":"slow","freq":"每年一次；4 月 29 日前後公布前年底數字","what":"全國的資產負債表：土地、房屋、設備與金融資產值多少，家庭、企業、政府各持有多少、欠多少。","mech":"這是某一時點的存量，不是一段期間的流量。數字變大常常只是房價、股價上漲讓帳面價值重估，不代表有新的錢進來。家庭資產中金融資產（股票、保單）比重越高，家庭財富對股市漲跌越敏感，消費隨財富增減的效果也越大。","read":[{"when":"家庭淨值年增率明顯高於薪資成長","means":"多半來自股票與房地產價格重估，不是存下來的新錢。"},{"when":"有價證券占家庭資產的比重上升","means":"家庭財富對股市更敏感，股市大跌時財富縮水的感受也更強。"},{"when":"拿 183.7 兆元和股市市值或成交值比較","means":"先扣掉不能立刻變現的房地產與保險準備；隨時能動的只有 M1B 約 30 兆元。"}],"now":{"v":"家庭部門淨值 183.70 兆元，年增 7.35%","asof":"2024","hard":"官方","state":"資料落後逾一年","tone":"calm"},"judge":"183.7 兆元是 2024 年底的數字，2024 年加權指數全年月均 21,383 點，現在是 47,180 點，家庭持股市值早已不同。這個統計適合看結構與量級，不適合判斷當下資金多寡。每戶、每人平均與資產結構細項這次讀不到官方附表，列為未確認。","look":{"min":"10 年","best":"2010 年起","minY":10,"bestFrom":2010,"why":"一年一筆、結構移動慢，少於 10 年看不出房地產、有價證券與保險準備之間的比重消長。"},"misread":["把 183.7 兆元當成可以拿來買股票的錢：房地產不能直接變現，保險與退休金準備鎖在機構裡。","把家庭的保險準備和壽險海外投資各算一次：那是同一筆錢的兩種記法，不能重複加總。"],"up":[{"id":"hprice","how":"土地按市價重估，房價上漲直接墊高家庭淨值"},{"id":"mcap","how":"股價上漲使家庭持股市值增加，屬於帳面重估而非新存的錢"},{"id":"wages","how":"薪資與儲蓄是新增財富的來源，但每年增量遠小於價格重估"},{"id":"hloan","how":"房貸是家庭最大的負債，是淨值的減項"}],"down":[{"id":"retail","how":"財富增加時消費意願較高，縮水時相反（財富效果）"},{"id":"life_fx","how":"家庭的保險與退休金準備，就是壽險業投資海外的資金來源"}],"src":[{"t":"主計總處 113 年底國富統計新聞稿（2026-04-29）","u":"https://www.stat.gov.tw/News_Content.aspx?n=2777&s=236195"},{"t":"主計總處 國富統計表","u":"https://www.stat.gov.tw/cp.aspx?n=2773"}],"rooms":["local","dest"],"ver":{"s":"confirmed","note":"主計總處 115-04-29 新聞稿（113 年底國富毛額 330.11 兆元、淨額 258.97 兆元）。口徑：土地按市價重評價。"}},{"id":"excess_saving","zh":"超額儲蓄","en":"Excess savings (saving–investment gap)","alias":["超額儲蓄率","儲蓄投資差額"],"grp":"money","speed":"slow","freq":"每季；主計總處 2、5、8、11 月隨經濟預測更新","what":"全國一年存下來的錢（儲蓄）減掉國內蓋廠房、買設備、蓋房子用掉的錢（投資），剩下沒在國內用掉的部分。","mech":"在國民所得帳上，超額儲蓄約等於經常帳順差：出口大於進口賺進來的外匯，就是沒在國內花掉的所得。這些錢最後不是變成央行的外匯存底，就是變成民間的海外資產（壽險海外債、外幣存款、海外基金），所以大部分沒有留在國內的銀行體系。","read":[{"when":"超額儲蓄（或經常帳順差）擴大","means":"出口賺得多或國內投資相對少；要同時看金融帳流出，才知道留在國內的有多少。"},{"when":"金融帳淨流出接近經常帳順差","means":"賺進來的錢大多又投到海外，國內 M2 不會跟著出口同幅成長。"},{"when":"國內投資大增、超額儲蓄縮小","means":"錢用在國內設廠與買設備，對國內景氣與放款需求的帶動比較直接。"}],"now":{"v":"以 2025 年經常帳順差 1,844 億美元（約 5.8 兆元）替代","asof":"2025","hard":"估計","state":"大幅擴大","tone":"watch"},"judge":"主計總處對 2026 年超額儲蓄的預測這次讀不到（未確認），改用經常帳順差替代：2025 年 1,844 億美元、2026 上半年 1,210 億美元，AI 出口讓它大幅跳升。但 2026 上半年金融帳淨流出也有 1,181 億美元，賺的錢多數去了海外。","look":{"min":"5 年","best":"2000 年起","minY":5,"bestFrom":2000,"why":"近 5 年可看出 2025 年的跳升（2021、2023、2024 年順差都在 1,100 億美元上下）；長期結構要從 2000 年代看起。"},"misread":["出口很好所以國內錢一定很多：2025 年順差 1,844 億美元，同年金融帳淨流出 1,594 億美元。","把超額儲蓄和經常帳順差的數字硬對：概念相同，但統計機關、幣別與匯率換算不同，會有出入。"],"up":[{"id":"exports","how":"出口大增使貿易順差與國民儲蓄擴大"},{"id":"ca","how":"帳上約等於經常帳順差，是同一件事的兩種記法"},{"id":"wages","how":"薪資成長慢於 GDP，所得留在企業盈餘，企業儲蓄偏高"},{"id":"tsmc_rev","how":"半導體業在國內大舉設廠時國內投資增加，超額儲蓄縮小"}],"down":[{"id":"fa","how":"沒在國內用掉的錢以買海外資產的形式流出，記在金融帳"},{"id":"life_fx","how":"家庭的長期儲蓄經由壽險保費投向海外債券"},{"id":"reserves","how":"沒有被民間帶出去的部分由央行買下，成為外匯存底"},{"id":"ldr","how":"留在國內的儲蓄變成存款，存款多於放款需求，存放比偏低"}],"src":[{"t":"主計總處 2026-08-14 國民所得統計 值","上櫃總市值"],"grp":"eq","speed":"slow","freq":"市值每週五證交所新聞稿；名目 GDP 每季（2、5、8、11 月下旬）","what":"所有掛牌股票「股數×收盤價」的加總，是存量；除以名目 GDP 就是俗稱的巴菲特指標。","mech":"市值變動＝價格變動＋新股掛牌與增資−下市與減資，絕大部分來自價格。價格由最後幾筆成交決定，所有已發行股票跟著重新定價，所以市值可以在沒有等額資金流入的情況下大增。台積電營收幾乎都在海外，市值卻全算進分子，跨國比較對台灣不公平，要跟自己的歷史比。","read":[{"when":"市值大增，但各類投資人淨買賣只有 1 兆元上下","means":"是重新定價，不是資金流入；去看獲利與預期有沒有跟上（見本益比）。"},{"when":"市值對 GDP 比遠高於自己的歷史","means":"先扣掉台積電再算一次，並對照獲利成長；比值高不等於馬上要跌。"},{"when":"名目 GDP 大幅上修的年份","means":"分母用哪一版預測，結果可以差十幾個百分點，引用時要寫明。"}],"now":{"v":"上市 154.32 兆元（2025 年底 94.36 兆）；上櫃 11.03 兆（8 月底）","asof":"2026-09-18","hard":"市場","state":"九個月增60兆","tone":"watch"},"judge":"上市加上櫃市值約為名目 GDP 的 5 倍（分母用記憶值推算，未確認），扣掉台積電仍約 3 倍。比值創高的主因是台積電與上半年獲利年增 92.88%，不是資金湧入；要追的是獲利成長能不能延續，不是這個比值本身。","look":{"min":"20 年","best":"2000 年起","minY":20,"bestFrom":2000,"why":"估值型指標循環很長，要看到 2000、2007、2021 三個高點與之後的低點；只看 3–5 年會把高檔當常態。"},"misread":["「市值增加 60 兆＝有 60 兆資金流入」：市值是重新定價的結果，沒有任何一類投資人淨買超過 2 兆元。","看到市值對 GDP 比 500% 就說泡沫：先拆掉台積電，再看獲利成長。"],"up":[{"id":"pe","how":"市值＝獲利×本益比；評價倍數提高，市值跟著放大"},{"id":"tsmc_w","how":"台積電一檔約 63.8 兆元，占上市市值約四成，主導市值變動"},{"id":"rev_monthly","how":"營收與獲利成長，是股價被重新定價的主要原因"},{"id":"gdp","how":"名目 GDP 是比值的分母，GDP 上修會讓比值下降"}],"down":[{"id":"margin","how":"融資要除以市值才能跨期比較；市值變大，同金額的槓桿密度變低"},{"id":"turnover","how":"成交值要除以市值，才知道換手是快還是慢"},{"id":"wealth","how":"股票市值上漲，家庭持有的金融資產與帳面淨值跟著增加"},{"id":"settle_dep","how":"市值漲得比交割戶現金快時，場邊現金占市值的比率下降"}],"src":[{"t":"金管會證期局 上市、櫃各年度市值","u":"https://www.sfb.gov.tw/ch/home.jsp?id=1011&parentpath=0%2C4%2C109"},{"t":"證交所 2026-09-18 週新聞稿（市值、成交）","u":"https://www.twse.com.tw/staticFiles/news/news/tsecnews/8a8216d6a066696301a0b3e196170120.pdf"},{"t":"證交所 市值週報","u":"https://www.twse.com.tw/zh/trading/statistics/week.html"}],"rooms":["dest","local"],"ver":{"s":"confirmed","note":"上市兩個數字為官方來源（證期局表 94,358.93，單位應為十億元）。上櫃 11.03 兆只在二手來源（Yahoo 轉載 MoneyDJ／櫃買月報）讀到；櫃買中心官網 403。"}},{"id":"turnover","zh":"成交值與週轉率","en":"Turnover value and turnover ratio","alias":["成交量","日均成交值","當沖占比","周轉率"],"grp":"eq","speed":"fast","freq":"每日盤後 5 日前後央行公布","what":"全體銀行借給個人買住宅、還沒還完的貸款總額。是存量，不是當月新借出去的錢。","mech":"買方付自備款，其餘七八成由銀行撥款給賣方；撥款當下銀行體系多一筆存款，所以房貸成長也是 M2 成長的來源之一。餘額＝舊餘額＋新撥款－還本。貸款年限拉長、寬限期只繳息，還本變慢，餘額年增率就會比實際買氣好看；幾年前賣出的預售屋到交屋才撥款，也讓它落後買氣。","read":[{"when":"年增率在 4.5–6%","means":"近十年的常態區間，房市信用沒有異常擴張。"},{"when":"年增率超過 8%","means":"過熱。2020–21 年與 2024 年都出現過；2024-09 的 11.26% 是 2006 年以來最高。"},{"when":"年增率低於 4.5%","means":"降溫。2025 年底的 4.46% 是 2018 年 1 月以來最低。"},{"when":"新聞說「餘額創新高」","means":"存量幾乎每個月都創新高，不是訊號；要看年增率與月增金額。"}],"now":{"v":"11.89 兆元，年增 4.52%（月增 769 億元）","asof":"2026-07","hard":"官方","state":"常態下緣","tone":"calm"},"judge":"4.52% 落在常態區間的下緣，房市信用沒有擴張。7 月月增 769 億元是逾一年半最大，但主因是青安 2.0 在 7/31 截止前趕件與交屋潮，屬一次性因素；要看 8、9 月是否回落。","look":{"min":"10 年","best":"2006 年起","minY":10,"bestFrom":2006,"why":"房市一輪循環約 7–10 年；要涵蓋 2016 年低點、2020–24 年擴張與 2024-09 之後的降溫，才知道年增率的高低區間。"},"misread":["把餘額成長當成新流入的錢：2025 年五大銀行新承做房貸 −33.85%，餘額仍 +4.46%。","把年增率回升當成買氣回升：交屋潮與寬限期會讓餘額落後買氣很久。"],"up":[{"id":"newmort","how":"新撥款減掉還本，就是餘額的增量"},{"id":"cloan","how":"建商借錢蓋的房子 2–4 年後交屋，才轉成買方的房貸"},{"id":"credit_ctrl","how":"第 2 戶以上成數上限壓低，每筆能借的金額變小"},{"id":"policy_rate","how":"利率低則月付金小，借款意願高，也傾向借長"}],"down":[{"id":"m2","how":"銀行撥款的同時創造一筆新存款，推升 M2"},{"id":"conc","how":"是集中度分子裡最大的一項"},{"id":"r72","how":"計入 72-2 分子（2025-09 起新撥的新青安排除）"},{"id":"npl","how":"寬限期到期後月付金跳升，繳不出來就變逾放"}],"src":[{"t":"中央銀行 消費者貸款及建築貸款餘額（2026 年 7 月）","u":"https://www.cbc.gov.tw/tw/cp-302-192764-93ec6-1.html"},{"t":"中央銀行 金融統計月報表 18","u":"https://www.cbc.gov.tw/public/data/EBOOKXLS/107_EF99_A4L.pdf"},{"t":"中央銀行 新聞稿列表","u":"https://www.cbc.gov.tw/tw/lp-302-1.html"}],"rooms":["dest","local"],"ver":{"s":"confirmed","note":"央行 8/25 新聞稿頁面本文無數字（僅 XLS 附表，WebFetch 未讀），改由月報表 18 讀餘額、由 9/17 參考資料讀年增率，三者相符。月增額為兩月餘額相減自算。"}},{"id":"cloan","zh":"建築貸款","en":"Construction loans","alias":["建融","土建融","土融","建築融資"],"grp":"re","speed":"mid","freq":"每月；次月 24–25 日前後央行公布（與房貸同表）","what":"銀行借給建商買地（土融）與蓋房子（建融）的貸款餘額，反映建商對未來幾年的信心。","mech":"建商先借錢買地、蓋房，等預售款與交屋款進來再還款。建商看好未來才會借錢買地推案，所以它比房貸、比房價都早轉向：上一輪建築貸款年增率 2019 年先升到 12.71%、2020 年 20. （+51.7%）。"},{"when":"單月低於 600 億元","means":"冷。2026 年 1–7 月月均約 543 億元（2025 年月均 641 億元）。"},{"when":"利率走高而政策利率沒動","means":"銀行額度緊或資金成本上升；2026-01 的 2.327% 是 2009 年初以來最高。"},{"when":"政策截止日前單月突然放大","means":"多半是趕件（如 2026-07），要看下個月是否回落。"}],"now":{"v":"7 月 691.09 億元、利率 2.290%；1–7 月月均約 543 億元","asof":"2026-07","hard":"官方","state":"偏冷","tone":"calm"},"judge":"7 月月增 111 億元，但比去年同月仍少約 2.6%，而且主要是青安 2.0 截止前趕件；前 7 個月月均 543 億元低於 600 億元的偏冷門檻。利率由 1 月的 2.327% 小降到 2.290%，與銀行額度變寬的方向一致。","look":{"min":"6 年","best":"2016 年起（利率要比到 2009 年）","minY":6,"bestFrom":2016,"why":"6 年可涵蓋 2021 年利率低點 1.354%、2024 年金額高峰與 2025 年的 −33.85%；從 2016 年看是完整一輪。"},"misread":["把新承做金額當成餘額增量：近 12 個月五大銀行新撥 6,695 億元，全體銀行餘額只淨增 5,139 億元，差額是還本。","以為央行沒升息，房貸利率就不會變。"],"up":[{"id":"transfers","how":"成交過戶（含預售屋交屋）才會撥款，量多撥款就多"},{"id":"r72","how":"銀行比率逼近上限就排隊撥款、停收新件"},{"id":"credit_ctrl","how":"成數上限壓低多屋族與法人每筆可貸金額"},{"id":"policy_rate","how":"政策利率與存款準備率決定銀行資金成本，反映在房貸利率"}],"down":[{"id":"hloan","how":"新撥款減還本＝餘額增量；新撥款縮，年增率隨後下降"},{"id":"m2","how":"每撥一筆房貸，銀行體系同時多一筆存款"},{"id":"hprice","how":"貸得到、貸得多，買方才出得起價；放款縮則價格支撐變弱"}],"src":[{"t":"中央銀行 五大銀行新承做放款（2026 年 7 月）","u":"https://www.cbc.gov.tw/tw/cp-302-192747-5edf4-1.html"},{"t":"中央銀行 金融統計月報表 29-D","u":"https://www.cbc.gov.tw/public/data/EBOOKXLS/145_EH45_A4L.pdf"},{"t":"中央銀行 五大銀行新承做放款統計頁","u":"https://www.cbc.gov.tw/tw/np-528-1.html"}],"rooms":["dest"],"ver":{"s":"unverifiable","note":"未讀到，非不符。央行 8/21 新聞稿本文無購屋貸款數字（在 XLSX 附表）；月報表 29-D PDF 擷取後缺購屋貸款欄；9/17 參考資料亦無。已達 4 次上限，經濟日報 9706192 未試。"}},{"id":"transfers","zh":"建物買賣移轉棟數","en":"Building ownership transfers (sales)","alias":["買賣移轉棟數","房市成交量","六都移轉棟數"],"grp":"re","speed":"mid","freq":"每月；六都次月 1 日，全國約次月中下旬","what":"各地政事務所登記、原因為「買賣」的建物所有權移轉棟數，是房市成交量的官方數字。","mech":"賣方不願降價時，先發生的是成交變少；量縮久了價格才鬆動，所以量通常領先價 2–4 季。預售屋要到交屋過戶才計入，因此它落後預售市場 2–4 年，數字裡有一部分是幾年前賣掉的預售屋。要看現在的買氣，得搭配預售屋實價登錄、推案量與新承做房貸。","read":[{"when":"全國年量 35 萬棟上下","means":"熱（2024 年 35.1 萬棟是這一輪高峰）。"},{"when":"全國年量約 30 萬棟","means":"業界慣用的榮枯分界，屬經驗值（估計）。"},{"when":"全國年量 25–26 萬棟","means":"冷（2001 年 25.9 萬、2016 年 24.5 萬、2025 年 26.1 萬棟）。"},{"when":"單月年增率突然轉正","means":"先查有沒有政策截止日或交屋潮；2026-07 的 +10.4% 是趕件，8 月六都又轉負。"}],"now":{"v":"1–7 月 15.10 萬棟（−2.0%）；2025 年 26.1 萬棟（−25.5%）","asof":"2026-07","hard":"官方","state":"低量盤整","tone":"watch"},"judge":"2025 年量縮四分之一後，2026 年沒有再明顯下滑，也沒有回升；公股銀行估全年 25–26 萬棟（估計），落在歷史上偏冷的區間。要看到連續幾個月、沒有政策截止日因素的年增，才算量回來。","look":{"min":"10 年","best":"2001 年起","minY":10,"bestFrom":2001,"why":"10 年涵蓋 2016 年低點 24.5 萬棟到 2024 年高峰 35.1 萬棟；從 2001 年看起才有兩個完整循環可以對照。"},"misread":["把 2026-07 的 +10.4% 讀成回溫：那是青安 2.0 截止前趕件，8 月六都年減 5.6%。","把移轉棟數當成現在的買氣：其中不少是 2021–23 年賣出的預售屋在交屋。"],"up":[{"id":"credit_ctrl","how":"成數降、寬限期取消，自備款變多，多屋族與法人買不動"},{"id":"r72","how":"銀行沒額度時買方貸不到款，成交卡住（2024 年下半年）"},{"id":"cloan","how":"建商幾年前借錢蓋的房子，現在交屋過戶計入棟數"},{"id":"mcap","how":"股市獲利轉買房；央行官員列為 2026-06 房貸增加原因之一"}],"down":[{"id":"newmort","how":"過戶才撥款，成交量決定銀行當月新撥的房貸"},{"id":"hprice","how":"量先價行：量縮約 2–4 季後，價格才開始鬆動"}],"src":[{"t":"內政部統計通報（2026-06-20）","u":"https://www.moi.gov.tw/News_Content.aspx?n=4&s=339138"},{"t":"內政部不動產資訊平台","u":"https://pip.moi.gov.tw"},{"t":"中央銀行 2026-09-17 理監事會參考資料","u":"https://www.cbc.gov.tw/dl-227599-f5b26526d15c4b40bcc105d611ed3c7a.html"}],"rooms":["dest"],"ver":{"s":"confirmed","note":"2025 年數出自內政部 115-06-20 統計通報，央行參考資料亦載 26.1 萬棟。15.10 萬棟見央行參考資料圖表（上年同期 15.41 萬棟），期間依內文判定為 1–7 月。"}},{"id":"hprice","zh":"房價指數","en":"House price indices","alias":["信義房價指數","國泰房地產指數","住宅價格指數","政大永慶房價指數","房價所得比"],"grp":"re","speed":"slow","freq":"每季；信義、國泰約季後 1 個月，內政部更慢","what":"用成交資料編的房價變動指標。台灣常用四種：信義、政大永慶（成屋）、國泰（預售與新成屋）、內政部住宅價格指數。","mech":"房價是房市裡最慢的指標：賣方不缺錢就不降價，先縮的是成交量。四種指數樣本不同，答案也不同：成屋指數（信義、永慶）反映屋主之間的成交，新案指數（國泰）反映建商的售價；建商成本墊高又不缺資金時，新案價格幾乎不跌。所以要同時看成屋與新案、看年增率，不要只看單一指數的水準。","read":[{"when":"成屋指數回落、新案指數持平或創高","means":"修正初期常見：屋主先讓價，建商不降價。目前就是這個狀態。"},{"when":"年增率由高檔降到低個位數","means":"漲勢停了。房價下跌期少見而且很淺，要看漲幅趨緩，不要等下跌才算轉向。"},{"when":"全國與單一城市方向相反","means":"各地驅動因子不同（如新竹看科技業），全國數字不能直接套用。"}],"now":{"v":"信義全國 168.77、年增 +2.66%；四種指數較高點 −0.4% 至 −5.3%","asof":"2026Q2","hard":"市場","state":"高檔持平","tone":"calm"},"judge":"2025 年成交量少了四分之一，全國房價指數卻只較高點回落 0.4–5.3%，台北市與新竹縣市的新案還在創高。價格沒有明顯下跌，是因為持有者不缺錢、不急賣；要觀察議價率、待售量與預售解約數有沒有惡化。","look":{"min":"12 年","best":"2006 年起","minY":12,"bestFrom":2006,"why":"要涵蓋 2014–16 年那次修正，才知道台灣房價下跌期少而淺；只看 3–5 年會以為房價只漲不跌。"},"misread":["只看房價、不看量：2025 年移轉棟數 −25.5%，信義指數 2025Q4 年跌僅約 3.7%。","拿單一指數下結論：同一個新竹，信義、永慶較高點約 −6%，國泰與內政部卻是創新高。","房價所得比下降＝房子變便宜：主要是所得更新與房價小跌，台北市仍 14.7 倍。"],"up":[{"id":"transfers","how":"量先價行：成交量縮約 2–4 季後價格才鬆動"},{"id":"newmort","how":"銀行放款多、成數高，買方出得起價；放款縮則支撐變弱"},{"id":"policy_rate","how":"扣掉通膨後利率偏低時，存款變薄、借款划算，資金轉向資產"},{"id":"wages","how":"所得決定買方負擔能力；新竹房價主要看科技業薪資與分紅"}],"down":[{"id":"credit_ctrl","how":"房價與民眾預期是央行調整管制的參考（央行稱重點在信用集中）"},{"id":"wealth","how":"國富統計的土地按市價重估，房價變動直接改變家庭淨值"},{"id":"cloan","how":"房價看漲時建商搶地推案，建築貸款需求上升"},{"id":"wm_loans","how":"房屋估值高，可拿來擔保借出的額度也大（定義未確認）"}],"src":[{"t":"信義房價指數（季報）","u":"https://www.sinyinews.com.tw/quarterly"},{"t":"國泰房地產指數 2026Q2","u":"https://www.cathay-red.com.tw/Content/Upload/files/about/about-house/news/2026/115news_Q2.pdf"},{"t":"中央銀行 2026-09-17 理監事會參考資料","u":"https://www.cbc.gov.tw/dl-227599-f5b26526d15c4b40bcc105d611ed3c7a.html"}],"rooms":["dest"],"ver":{"s":"confirmed","note":"信義為編製者自家頁面。央行表 1 的信義全國值 150.9 與官網 168.77 基期不同（央行另行換算），非不符；較高點跌幅區間相符。國泰 PDF 未另開。"}},{"id":"credit_ctrl","zh":"央行選擇性信用管制","en":"Selective credit controls (LTV caps)","alias":["信用管制","貸款成數上限","LTV","打房","限貸"],"grp":"re","speed":"slow","freq":"每季；央行理監事會（3、6、9、12 月）檢討","what":"央行直接規定哪一類借款人買房最多能借幾成、能不能有寬限期。對象是多屋族、法人、豪宅、建商購地與餘屋，首購不受限。","mech":"台灣央行管房市主要不靠升息，而是限制貸款成數（loan-to-value, LTV）。成數壓低，自備款就變多、槓桿變小；取消寬限期，一開始就要還本金，持有成本變高。它壓的是多屋族與建商的借款能力，不是利率，所以只盯政策利率會漏掉這一塊。央行調整的依據是不動產放款集中度與房貸年增率，不是房價本身。","read":[{"when":"央行調低成數或取消寬限期","means":"收緊。2020-12 到 2024-09 共七度；2024-09 第 7 次最嚴，之後量才明顯縮。"},{"when":"央行調高第 2 戶成數","means":"有限度放寬，受惠的是換屋與自住置產；2026-03、2026-09 各放寬一成。"},{"when":"央行動到第 3 戶、法人、餘屋的 3 成","means":"才算全面放寬；目前沒動，是 12/17 會議的觀察點。"},{"when":"央行開始放寬","means":"上一輪經驗：放寬是房市已冷的確認，不是反轉的領先訊號（上一輪細節未確認）。"}],"now":{"v":"第 2 戶上限 6→7 成（9/18 生效）；第 3 戶、法人、豪宅、餘屋仍 3 成","asof":"2026-09-18","hard":"制度","state":"逐季放寬","tone":"watch"},"judge":"2026 年 3 月、9 月各放寬第 2 戶一成，央行總裁說逐季檢討、有副作用會回頭。放寬的理由是集中度降到 34.44%，但這個下降有一大半來自企業放款大增的分母效應，放寬空間取決於它能否維持。","look":{"min":"6 年","best":"2010 年起","minY":6,"bestFrom":2010,"why":"6 年涵蓋 2020-12 起收緊、2024-09 最嚴、2026 年放寬的一整輪；從 2010 年看可對照上一輪由收緊到退場。"},"misread":["「央行放寬＝房市要回升」：9/18 生效日營建類股只漲 2.45%，餘屋貸款 3 成沒動。","「央行沒升息＝沒有緊縮」：2020–2024 年七度收緊管制，還兩度調升存款準備率。"],"up":[{"id":"conc","how":"央行決定收緊或放寬的頭號依據；降到 34.44% 是放寬理由"},{"id":"hprice","how":"房價漲幅與民眾預期是參考；央行稱重點在信用集中"}],"down":[{"id":"transfers","how":"成數降、寬限期取消，自備款變多，多屋族與法人買不動"},{"id":"newmort","how":"成數上限壓低每筆可貸金額，新撥款變少"},{"id":"hloan","how":"第 2 戶以上能借的變少，房貸餘額成長放慢"},{"id":"cloan","how":"購地貸款 5 成、餘屋貸款 3 成，壓低建商借款能力"}],"src":[{"t":"中央銀行 2026-09-17 理監事會新聞稿","u":"https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html"},{"t":"中央銀行 對金融機構辦理不動產抵押貸款業務規定","u":"https://www.cbc.gov.tw/tw/cp-4217-192880-d9bde-1.html"},{"t":"中央銀行 2024-09-19 第 7 次調整新聞稿","u":"https://www.cbc.gov.tw/tw/cp-1123-175328-50554-1.html"}],"rooms":["dest","time"],"ver":{"s":"confirmed","note":"均出自央行 2026-09-17 決議新聞稿本文與修正重點對照表。同表：購地貸款 5 成、刪除切結動工規定；工業區閒置土地 4 成不變。規定頁僅有 PDF 連結，未另開。"}},{"id":"r72","zh":"銀行法 72-2 比率","en":"Banking Act Art. 72-2 ratio (construction lending cap)","alias":["72-2","不動產放款比率","限貸令","銀行法第 72 條之 2"],"grp":"re","speed":"mid","freq":"每月；金管會銀行局例行記者會（月底至次月初）","what":"商業銀行的住宅建築及企業建築放款，不得超過存款加金融債券的 30%。這是每一家銀行各自的法定上限。","mech":"這是房貸供給面的上限：買方再想借、利率再高，銀行比率滿了就借不到。存款流失時比率會被動上升，所以銀行在 27–28% 就自我設限。分子、分母都要看：比率下降可能是不動產放款少了，也可能只是存款多了。分子另有排除項（都更危老、社宅、2025-09 起新撥的新青安）。","read":[{"when":"全體平均超過 26%","means":"偏緊。2024-08 有 21 家銀行超過 26%，隨後出現排隊撥款。"},{"when":"個別銀行超過 28%","means":"那家銀行幾乎停收新件；要看超過 27%、28% 的家數分布。"},{"when":"比率下降","means":"先分辨是分子（放款）減少還是分母（存款）增加；這一輪主要是存款暴增。"}],"now":{"v":"24.19%（上限 30%）；超過 28% 的銀行 0 家、27–28% 1 家","asof":"2026-07","hard":"官方","state":"額度寬鬆","tone":"calm"},"judge":"連 14 個月下滑、2011 年 1 月以來最低，距上限約 5.8 個百分點、約 3.8 兆元（估計）。銀行額度已不是限制；現在限制房市放款的是央行的成數管制、對集中度的要求與買方信心。","look":{"min":"3 年","best":"2010 年起","minY":3,"bestFrom":2010,"why":"至少要包含 2024 年下半年它真正卡住放款的那一次；從 2010 年底（23.99%）看起，才知道 24% 算低、26% 以上算緊。"},"misread":["把 72-2 的 24% 和央行集中度的 34% 混為一談：前者分母是存款＋金融債，後者分母是總放款。","以為比率下降＝房貸減少：7 月不動產放款餘額月增 0.45%，存款＋金融債月增 1.15%。"],"up":[{"id":"hloan","how":"房貸是分子的主要部分，撥款越多比率越高"},{"id":"cloan","how":"建築放款計入分子"},{"id":"m2","how":"分母是存款＋金融債；出口與股市帶進存款，比率被動下降"}],"down":[{"id":"newmort","how":"個別銀行逼近上限就排隊撥款、提高利率、停收新件"},{"id":"transfers","how":"買方有意願也貸不到款，成交量跟著縮（2025 年 −25.5%）"}],"src":[{"t":"銀行法第 72 條之 2（全國法規資料庫）","u":"https://law.moj.gov.tw/LawClass/LawSingle.aspx?media=print&pcode=G0380001&flno=72-2"},{"t":"經濟日報 2026-09-01（引金管會銀行局）","u":"https://money.udn.com/money/story/5613/9716341"},{"t":"金管會銀行局","u":"https://www.banking.gov.tw"}],"rooms":["dest","local"],"ver":{"s":"secondary","note":"僅在經濟日報（據金管會統計）讀到；該文日期 2026-08-26，非清單所列 9/1。全國法規資料庫被 robots.txt 擋下，30% 條文未能由官方頁核對；銀行局無此比率公開頁。"}},{"id":"conc","zh":"不動產放款集中度","en":"Real estate loan concentration","alias":["不動產貸款集中度","集中度"],"grp":"re","speed":"slow","freq":"每季；隨央行理監事會參考資料揭露，可按月自行估算","what":"全體銀行的不動產貸款（購置住宅＋房屋修繕＋建築貸款）占總放款的比重。央行口徑。","mech":"銀行借給房地產的比重越高，借給產業的就越少，房市反轉時銀行的損失也越集中。央行用它判斷信用資源是否過度集中在房市，是決定收緊或放寬信用管制的頭號依據。它是比率：分子是不動產貸款，分母是總放款；企業放款大增時，即使不動產貸款還在增加，集中度也會下降。","read":[{"when":"接近 37–38%","means":"歷史高檔（高點 37.9%；2024-06 為 37.61%），央行會收緊並約談銀行。"},{"when":"持續下降","means":"央行有放寬空間；但要拆開看是分子變小還是分母變大。"},{"when":"企業放款年增率回落","means":"分母成長放慢，集中度可能自己回升，央行放寬空間縮小。"}],"now":{"v":"34.44%（不動產貸款 15.35 兆 ÷ 總放款 44.57 兆元）","asof":"2026-07","hard":"官方","state":"降到多年低點","tone":"watch"},"judge":"由 2024-06 高點 37.61% 降了 3.17 個百分點，是央行 3 月、9 月放寬的理由。但 2026 年 3–7 月不動產貸款仍增加 1,718 億元，只是其他放款增加 1 兆 7,082 億元；下降有一大半是 AI 景氣帶來的分母效應，列為留意。","look":{"min":"7 年","best":"2009 年起","minY":7,"bestFrom":2009,"why":"7 年涵蓋 2020 年初 35.34% 升到 37.61% 再降到 34.44%；從 2009 年起可看到歷史高點 37.9% 與兩輪管制。"},"misread":["集中度下降＝房貸在減少：不動產貸款 15.35 兆元是歷史新高，下降是因為分母膨脹。","把它和 72-2 比率混用：兩者分母不同，水準差約 10 個百分點。"],"up":[{"id":"hloan","how":"分子裡最大的一項"},{"id":"cloan","how":"分子的一部分；建商縮手使分子成長放慢"},{"id":"loans","how":"分母是總放款；AI 供應鏈企業週轉金放款大增，比率被動下降"},{"id":"wm_loans","how":"屬於其他放款、只進分母；年增三成也在把比率往下拉"}],"down":[{"id":"credit_ctrl","how":"央行收緊、放寬管制與約談銀行的頭號依據"},{"id":"npl","how":"比重越高，房市反轉時銀行的壞帳越集中"}],"src":[{"t":"中央銀行 2026-09-17 理監事會參考資料","u":"https://www.cbc.gov.tw/dl-227599-f5b26526d15c4b40bcc105d611ed3c7a.html"},{"t":"中央銀行 2026-06-18 理監事會新聞稿","u":"https://www.cbc.gov.tw/tw/cp-357-192416-38c80-1.html"},{"t":"中央銀行 2024-09 參考資料（約談 34 家銀行）","u":"https://www.cbc.gov.tw/dl-208899-2545f928a4d342c5b5b2f33e36b620c8.html"}],"rooms":["dest","local"],"ver":{"s":"confirmed","note":"153,503÷445,679＝34.44%，與央行公布值一致。WebFetch 模型誤標列名，依 153,503＋292,175≈445,679 判定該列為不動產貸款。高點 37.61% 見同文件。"}},{"id":"wm_loans","zh":"個人理財週轉金貸款","en":"Personal wealth-management working-capital loans","alias":["個人理財週轉金","理財週轉金","借錢買股"],"grp":"re","speed":"slow","freq":"每季；隨央行理監事會參考資料揭露年增率","what":"個人向銀行借的理財用週轉金，多半以房子等擔保品借出（定義細節未確認）。央行把它的快速成長和股市交易熱絡連在一起。","mech":"房貸的用途是買房；理財週轉金是拿既有資產向銀行借出一筆可自由運用的錢。股市熱、借款利率又低於預期報酬時，借錢投入股市的誘因變強，這項貸款就加速。它不算不動產貸款，所以房市信用看起來降溫的同時，家庭槓桿可能正從這條路增加。股市大跌時，壓力會經由還款能力與擔保品傳回銀行與房市。","read":[{"when":"年增率 7–11%","means":"2020–2022 年的水準；當時便宜資金主要流向房市（房貸年增 7.08–9.57%）。"},{"when":"年增率超過 20% 且持續上升","means":"個人借錢投入金融市場的槓桿在累積；要和融資餘額一起看。"},{"when":"年增率由高檔快速回落","means":"可能是股市降溫、個人去槓桿，也可能是銀行收緊；要對照成交值與融資餘額。"}],"now":{"v":"年增 32.35%（1–7 月平均 27.60%；2025-12 為 24.38%）","asof":"2026-07","hard":"官方","state":"快速擴張","tone":"alert"},"judge":"2020–22 年只有 6.89–10.73%，2026-07 已到 32.35%，同期房貸年增只有 4.52%，屬極端值。央行 9/17 直接寫「股市交易熱絡帶動個人理財週轉金大幅成長」。這一輪便宜資金的去處是股市而不是房市；餘額與定義未確認，先看年增率的方向。","look":{"min":"6 年","best":"2020 年起（央行揭露範圍）","minY":6,"bestFrom":2020,"why":"央行揭露的年增率從 2020 年起；要包含 2020–21 年錢去房市、2022 年股市下跌與這一輪，才有對照。"},"misread":["只看融資餘額就以為掌握了股市槓桿：向銀行借的理財週轉金與信貸不在融資餘額裡。","把它當成房市指標：央行是把它和股市熱絡連在一起，不是和買房。"],"up":[{"id":"turnover","how":"股市成交熱絡時，借錢投入的需求增加（央行 9/17 說法）"},{"id":"hprice","how":"房屋估值高，可拿來擔保借出的額度也大（定義未確認）"},{"id":"policy_rate","how":"借款利率低於預期報酬時，借錢投資的誘因變強"}],"down":[{"id":"loans","how":"計入銀行的其他放款，推升放款年增率"},{"id":"conc","how":"只進總放款這個分母，讓不動產放款集中度被動下降"},{"id":"settle_dep","how":"借出的錢若投入股市，會先進證券劃撥帳戶（推論）"},{"id":"npl","how":"股市大跌時還款壓力上升，風險回到銀行與擔保的房子"}],"src":[{"t":"中央銀行 2026-09-17 M2 說明（個人理財週轉金）","u":"https://www.cbc.gov.tw/dl-227600-4c73575ef00a43c5bbfa0e9367497cbd.html"},{"t":"中央銀行 金融穩定報告第 20 期新聞稿","u":"https://www.cbc.gov.tw/tw/cp-302-191322-0bf1d-1.html"}],"rooms":["dest","local"],"ver":{"s":"confirmed","note":"出自央行 115 年 9 月理監事會後記者會參考資料（M2 說明章節）圖 9 與表 4；以不含數字的提問重讀一次，結果相同。金融穩定報告新聞稿未另開。"}},{"id":"life_fx","zh":"壽險國外投資與避險","en":"Life insurers' foreign investment & FX hedging","alias":["避險比率","外價金","外匯價格變動準備金","換匯交易 CS","NDF"],"grp":"dest","speed":"mid","freq":"每月；金管會月底至次月初公布上上月數字","what":"壽險公司把保費拿去買了多少國外資產（多為美元債），其中多少有買匯率避險、多少靠準備金承擔。","mech":"家庭買儲蓄型保單，保費進壽險公司。國內公債只有約 6 兆元、殖利率不到 2%，不夠買也付不起保單成本，壽險只好把約三分之二資金換成美元買長天期債券。負債是新台幣、資產是美元，新台幣升值時未避險部位會出現匯損、侵蝕淨值；買避險則要付接近台美利差的成本。2026 年起改用會計攤銷與外匯價格變動準備金承擔，避險比率因此下降。","read":[{"when":"避險比率下降、外價金上升","means":"壽險少付避險成本，改用準備金承擔匯率風險；真實曝險變大，要同時看可承受的升值幅度。"},{"when":"新台幣短期升幅接近可承受幅度（7 月約 12%）","means":"準備金可能用完，壽險淨值與壽險型金控股價會先反應；2025 年 5 月單月升 6.98% 就幾乎用完。"},{"when":"國外投資餘額單月大減","means":"先查是不是會計重分類或匯率換算；2026 年 1 月少 8,306 億元是接軌 IFRS 17，不是賣債。"},{"when":"美國升息、台灣利率不動","means":"台美利差擴大，換匯避險變貴（7 月 CS 年化成本 2.23%），壽險更沒有誘因提高避險比率。"}],"now":{"v":"國外投資 22.2 兆元（4 月底）；避險比率 42.94%、外價金 7,182 億元","asof":"2026-07","hard":"官方","state":"避險降、緩衝增","tone":"watch"},"judge":"避險比率由 2 月 45% 降到 7 月 42.94%，淨曝險約 9 兆元；外價金加特別盈餘公積 1.08 兆元可承受約 12% 升值。目前新台幣在 31.8 元附近、美國利率走高，壓力不大；但 2025 年 5 月單月就升了 6.98%，所以列為留意。","look":{"min":"2 年","best":"2019 年起","minY":2,"bestFrom":2019,"why":"至少要包含 2025 年 5 月準備金幾乎用完那一次；看到 2019 年可涵蓋 2020 年升值、2022 年升息。2026 年起會計口徑改變，新舊要分開看。"},"misread":["把國外投資減少當成壽險在賣美債：2026 年 1 月少 8,306 億元是會計重分類。","以為新台幣貶值壽險就賺匯差：新制下兌換利益要攤銷、還要提存準備金，2026 年首季貶值卻帳列淨匯損 855 億元。","66%（占資金運用總額）與 58.7%（占總資產）講的是同一筆錢，只是分母不同。"],"up":[{"id":"usdtwd","how":"新台幣升值，未避險的美元資產換回新台幣變少，出現匯損並消耗準備金"},{"id":"fed","how":"美國利率比台灣高越多，換匯避險成本越貴，壽險越不願意買避險"},{"id":"fyp","how":"傳統型保費進壽險一般帳戶，是可以拿去買國外債券的新資金"},{"id":"excess_saving","how":"國內儲蓄多於投資、公債又少，壽險的錢在國內放不完，只能出海"}],"down":[{"id":"usdtwd","how":"升值時壽險急著加做避險（賣遠期美元），會再推升新台幣"},{"id":"fa","how":"壽險買國外債券記入金融帳的居民對外證券投資，是淨流出的一部分"},{"id":"bond_etf","how":"壽險是債券 ETF 的大買家，它的配置需求左右 ETF 規模"},{"id":"rs_line","how":"匯損侵蝕壽險淨值時，壽險型金控轉弱，金融類股相對大盤走低"}],"src":[{"t":"金管會保險局 保險市場重要指標","u":"https://www.ib.gov.tw/ch/home.jsp?id=48&parentpath=0,4"},{"t":"金管會 新聞稿（保險業損益、外價金）","u":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0,2"},{"t":"工商時報 2026-09-02 壽險 7 月損益與避險","u":"https://www.ctee.com.tw/news/20260902700074-439901"}],"rooms":["dest","inflow"],"ver":{"s":"partial","note":"數字皆相符。22.2 兆為保險局官方 PDF（22 兆 1,947 億），清單頁最新仍是 115 年 4 月。42.94% 與 7,182 億只在工商時報讀到；金管會新聞稿列表首頁找不到對應稿。"}},{"id":"subbrok","zh":"複委託（海外股票）","en":"Sub-brokerage (overseas securities trading)","alias":["受託買賣外國有價證券","美股複委託"],"grp":"dest","speed":"mid","freq":"每月；券商公會約次月中下旬更新統計表","what":"國人透過台灣券商下單買賣美股、海外 ETF 與海外債的成交金額，代表散戶對海外股票的交易熱度。","mech":"投資人在台灣券商開複委託帳戶，券商再委託國外券商下單；錢先從新台幣換成外幣再出去，買到的是外國資產。公布的是成交值，買進和賣出都算，同一筆錢一年買賣十次就算十次，所以它量的是交易熱度，不是淨流出。真正的淨流出併在國際收支的「居民對外證券投資」裡，和壽險、銀行、基金合計。","read":[{"when":"成交值年增率大幅上升（2026 年 1–7 月 +109%）","means":"散戶對海外股票的交易熱度升高，通常跟著美股行情走；不代表有等額的錢離開台灣。"},{"when":"成交值年減（例：2022 年 −14.8%）","means":"升息、美股走空時交易降溫；要對照同年美股表現，不要直接解讀成資金回流台股。"},{"when":"複委託年增率遠高於台股成交值年增率","means":"散戶的注意力往海外移；淨流出多少，要等每季國際收支的居民對外證券投資。"}],"now":{"v":"2026 年 1–7 月成交 11.3 兆元（年增 109%）；2025 全年 10.75 兆元","asof":"2026-07","hard":"官方","state":"成交倍增","tone":"watch"},"judge":"七個月就超過去年全年，是 2018 年有數字以來最熱，媒體描述資金轉向半導體個股與槓桿型 ETF。年增 109% 明顯偏離常態，所以列為留意；但它不等於等額的資金外流：2025 年成交 10.75 兆元，同年全台居民對外證券投資淨增加只有約 1.15 兆元。","look":{"min":"5 年","best":"2018 年起","minY":5,"bestFrom":2018,"why":"要包含 2022 年升息時唯一一次年減，才知道這條線會跟著美股行情縮回去，不是只會往上。"},"misread":["把成交值 10.75 兆元當成流出金額：它是買加賣的合計，同一筆錢轉幾次就算幾次。","拿複委託成交值和境外基金持有金額比大小：一個是成交值、一個是存量，不能放在同一根軸上。"],"up":[{"id":"sox_rel","how":"美國半導體與 AI 股走強時，複委託買賣跟著放大（2026 年轉向半導體個股）"},{"id":"fed","how":"升息、美股走空的年份成交值萎縮（2022 年年減 14.8%）"},{"id":"excess_saving","how":"家庭的錢多於國內可投資標的，散戶直接出海的部分走複委託"}],"down":[{"id":"fa","how":"淨買進的部分記入金融帳的居民對外證券投資（和壽險、銀行、基金合計）"},{"id":"usdtwd","how":"買海外股票要先把新台幣換成外幣，淨買進時增加美元需求"}],"src":[{"t":"券商公會 受託買賣外國有價證券統計","u":"https://www.twsa.org.tw/E01/E011.html"},{"t":"中央社 2026-08-23 複委託前 7 月成交","u":"https://www.cna.com.tw/news/afe/202608230027.aspx"},{"t":"旺得富 2026-02-04 複委託 2025 全年","u":"https://wantrich.chinatimes.com/news/20260204900273-420101"}],"rooms":["dest"],"ver":{"s":"secondary","note":"兩組數字都只在新聞（轉述券商公會統計）讀到且相符。券商公會統計頁只有 Excel 檔連結（115年外國買賣彙總統計表.xlsx），WebFetch 回傳二進位資料無法解析，官方原始數字今天讀不到。"}},{"id":"bond_etf","zh":"債券 ETF","en":"Bond ETFs (TWD-listed, holding USD bonds)","alias":["債券型 ETF","美債 ETF","存債"],"grp":"dest","speed":"fast","freq":"每週（櫃買、集保）；投信公會每月中旬公布月底數","what":"台灣投信發行、用新台幣交易，但買的是美元計價海外債券的 ETF；看規模、受益人數與每月淨申購贖回。","mech":"投資人付新台幣，投信換成美元去買美國公債與公司債，所以它是用新台幣交易的美元債。淨值同時受兩件事影響：美債殖利率上升，債券價格下跌；新台幣升值，換算回新台幣的淨值縮水。買家有一大半是壽險（法規把它視為國內投資，不占海外投資額度），其餘是領配息的散戶，所以規模變動主要反映債券價格與壽險的配置，不是散戶情緒。","read":[{"when":"規模下降，但淨贖回金額很小","means":"縮水主要來自債券價格下跌（評價），不是資金出走；2026 年 1–8 月淨贖回不到規模的 2%。"},{"when":"受益人數連續減少","means":"散戶熱度退燒；2025 年全年少了約 22 萬人，這比規模更能代表散戶動向。"},{"when":"新台幣快速升值","means":"即使美債價格不動，新台幣計價的淨值也等幅縮水；2025 年 5 月單月升約 7% 就是例子。"},{"when":"美國長天期公債殖利率創新高","means":"債券價格下跌、規模縮水；同時壽險的避險成本上升，兩件事常一起出現。"}],"now":{"v":"規模 2.81 兆元、103 檔；2026 年 1–8 月淨贖回 503 億元","asof":"2026-08","hard":"官方","state":"評價縮水","tone":"watch"},"judge":"櫃買口徑的規模從 6/26 的 2.93 兆元七週內降到 2.69 兆元（−8.2%），主因是美國 30 年期公債殖利率升到 5.3% 以上壓低債券價格，淨贖回只占小部分。聯準會 9/16 又升息，價格壓力還在，所以列為留意；8 月已轉為小幅淨申購。","look":{"min":"4 年","best":"2017 年起","minY":4,"bestFrom":2017,"why":"要看過 2019–20 年壽險主導、2023–24 年散戶存債、2025 年起反轉三個階段，才分得出規模變動是誰造成的。"},"misread":["把規模當成散戶的避險情緒：買家一大半是法人，規模主要反映壽險配置與債券價格。","只看配息率、不算匯率：它同時承擔利率與匯率兩種風險。","看到規模縮水就說資金出走：2026 年縮水的大頭是評價，淨贖回不到規模的 2%。"],"up":[{"id":"fed","how":"美債殖利率上升使持有的債券價格下跌，淨值與規模縮水"},{"id":"usdtwd","how":"新台幣升值，美元債換算回新台幣的淨值等幅縮水"},{"id":"life_fx","how":"壽險是最大買家，它的配置需求與法規額度決定法人端的買盤"}],"down":[{"id":"fa","how":"投信拿申購款換美元買海外債，記入金融帳的居民對外證券投資"},{"id":"usdtwd","how":"淨申購時投信要買美元，淨贖回時賣美元換回新台幣"},{"id":"funds","how":"債券 ETF 2.81 兆元是投信跨國投資基金約 5.33 兆元裡最大的一塊"}],"src":[{"t":"投信投顧公會 境內基金統計","u":"https://www.sitca.org.tw/ROC/Industry/IN2001.aspx?PGMID=IN0201"},{"t":"經濟日報 2026-08-19 債券 ETF 規模（櫃買口徑）","u":"https://money.udn.com/money/story/5612/9701148"},{"t":"工商時報 2026-09-18 ETF 資金流","u":"https://www.ctee.com.tw/news/20260918701655-430403"}],"rooms":["dest"],"ver":{"s":"partial","note":"數字皆相符。規模、檔數為投信投顧公會官方頁（2 兆 8,060 億；預設最新月，下拉選單最新 2026/08，表上未標月份）。淨贖回 503 億只在工商時報讀到，屬二手。"}},{"id":"fyp","zh":"壽險初年度保費","en":"Life insurance first-year premium (FYP)","alias":["新契約保費","FYP","投資型保單","利變型保單"],"grp":"dest","speed":"mid","freq":"每月；壽險公會約每月中旬公布上月累計","what":"壽險業當期新賣出保單收到的第一年保費，代表家庭有多少「新錢」進到保險這個管道。","mech":"台灣人買保險有很大一部分是在存錢。傳統型與利變型的保費進壽險公司的一般帳戶，約三分之二會被拿去買國外債券，所以它是「家庭儲蓄→壽險→美元債」的起點。投資型的保費進保戶自己選基金的專設帳簿，不歸壽險公司運用，銷售量跟著股市熱度走。續年度保費只是舊保單的分期款，不算新錢。","read":[{"when":"傳統型（含利變型）保費成長","means":"壽險一般帳戶有新資金要配置，國外投資與避險的需求跟著增加。"},{"when":"投資型保費暴增（2026 年 1–8 月 +135%）","means":"反映股市熱度；錢進的是保戶選的基金，不等於壽險公司有更多錢買美債。"},{"when":"初年度保費大減（例：2022 年）","means":"升息使舊保單相對不划算，出現解約潮；壽險的現金流變緊。"}],"now":{"v":"2026 年 1–8 月 1 兆 542 億元（年增 60%）；投資型占 58%","asof":"2026-08","hard":"官方","state":"投資型大增","tone":"watch"},"judge":"8 個月就超過 2025 全年（1 兆 74 億元），年增 60% 明顯偏離常態，所以列為留意。帶動成長的商品從美元利變型換成投資型（6,102 億元、年增 135%），代表新錢是跟著股市熱度進來、進的是基金專設帳簿；對壽險買美債的意義不大，對判斷股市熱度比較有用。","look":{"min":"5 年","best":"2016 年起","minY":5,"bestFrom":2016,"why":"要包含 2022 年升息造成的解約潮與保費大減，才知道保費會隨利率與股市大起大落。"},"misread":["把總保費 2.6 兆元當成每年新流入：其中續年度保費是舊保單分期款，還要扣掉給付與解約金。","以為投資型保單大賣，壽險就有更多錢買美債：投資型的錢進保戶自選的基金，不進壽險一般帳戶。"],"up":[{"id":"fed","how":"美國利率決定美元利變型保單的宣告利率；升息太快時舊保單被解約（2022 年）"},{"id":"mcap","how":"股市大漲時投資型保單熱賣（2026 年 1–8 月占新契約 58%）"},{"id":"policy_rate","how":"定存利率低（一年期約 1.7%），儲蓄型保單的利率相對有吸引力"},{"id":"excess_saving","how":"家庭儲蓄多，買儲蓄型保單是主要的存錢方式之一"}],"down":[{"id":"life_fx","how":"傳統型保費進壽險一般帳戶，約三分之二被拿去買國外債券"},{"id":"funds","how":"投資型保費進專設帳簿、連結基金，出現在基金統計的法人帳戶裡"}],"src":[{"t":"壽險公會","u":"https://www.lia-roc.org.tw/"},{"t":"中央社 2026-09-16 前 8 月新契約保費","u":"https://www.cna.com IN0201"},{"t":"工商時報 2026-09-16 8 月底基金規模","u":"https://www.ctee.com.tw/news/20260916701778-430503"}],"rooms":["dest","local"],"ver":{"s":"confirmed","note":"兩個規模數字為投信投顧公會官方頁（16.4457 兆、5.3196 兆）。單月增 8,065 億只在工商時報讀到（公會頁查他月需送表單）。工商時報寫 16.44 兆為捨去，屬進位差。"}},{"id":"sec_share","zh":"類股成交占比","en":"Sector turnover share","alias":["成交比重","電子成交比重","成交比重 ÷ 市值比重"],"grp":"sector","speed":"fast","freq":"每個交易日收盤後，證交所公布各類指數成交量值","what":"個股成交金額裡，每個產業類別各占幾成；代表錢正在哪裡換手。","mech":"錢在哪裡換手，占比就在哪裡高；題材熱、短線交易多的地方，成交占比會遠高於它的市值占比。所以要除以市值比重來讀：比值遠大於 1 是擁擠，遠小於 1 是乏人問津。現在電子市值本身就約八成，過去「電子成交超過八成就過熱」的固定門檻已不適用。它告訴你哪裡擠，不告訴你何時散。","read":[{"when":"某類「成交占比 ÷ 市值比重」長期大於 1.5 且續創高","means":"換手過熱、短線資金集中，是擁擠訊號；但擁擠可以維持很久，要搭配相對強弱線的轉折。"},{"when":"比值很低的類股開始放量、占比回升","means":"可能有資金開始流入；看它的相對強弱線有沒有同步轉強。"},{"when":"單一類股占比衝到歷史極端（如 2021 年航運 42.9%）","means":"常見於題材狂熱的後段；占比回落時，相對強弱線多半一起轉弱。"}],"now":{"v":"電子類 85.6%（9/14 當週）；9/18 單日 84.5%","asof":"2026-09-18","hard":"市場","state":"歷史高檔區","tone":"watch"},"judge":"電子整體的比值只有 1.05，不算離譜；真正擁擠的是電子不含半導體（成交 40.5% 對市值約 25.7%，比值 1.57），金融只有 0.53。電子類週占比在 2020 年以來第 93 百分位，最高是 2026-05-11 當週的 90.2%；2021 年平均只有 59.9%。","look":{"min":"5 年","best":"2020 年起","minY":5,"bestFrom":2020,"why":"要同時看到 2021 年航運、鋼鐵占比異常升高，與 2023 年後電子占比長期偏高這兩種樣本，才知道什麼叫極端。"},"misread":["用固定門檻（電子超過八成就過熱）：門檻要跟著市值比重調整，看比值、不看絕對數。","沒注意分母：含不含 ETF 與權證，9/18 的電子占比可以是 78.9% 或 84.5%。"],"up":[{"id":"rev_monthly","how":"營收連續創高的族群吸引買賣雙方換手，成交占比上升"},{"id":"margin","how":"融資與當沖資金集中在熱門族群，把該類占比推高"},{"id":"tsmc_w","how":"台積電市值大但周轉慢，使半導體成交占比低於市值占比"},{"id":"capex_csp","how":"雲端大廠上修資本支出，AI 供應鏈交易變熱、電子占比升高"}],"down":[{"id":"rs_line","how":"占比先升、強弱線常跟著走高；占比續高而線走平是擁擠徵兆"},{"id":"dispersion","how":"成交集中在單一族群時，類股之間的報酬差距通常拉大"}],"src":[{"t":"證交所 各類指數日成交量值","u":"https://www.twse.com.tw/zh/page/trading/exchange/BFIAMU.html"},{"t":"財經 M 平方 產業類別指數成交比重","u":"https://www.macromicro.me/charts/149381/taiwan-sector-index-trading-value-share"}],"rooms":["sectors","explorer"],"ver":{"s":"site","note":"本站用 346 週的類股週資料計算；已用同一份資料獨立重算，數值相符。原始週資料抽查對過證交所官方收盤值。"}},{"id":"rs_line","zh":"相對強弱線","en":"Relative strength line","alias":["類股 ÷ 加權","相對大盤強弱","RS 線"],"grp":"sector","speed":"fast","freq":"每日可算；判讀用週線","what":"把類股指數除以加權指數畫成一條線，線往上＝跑贏大盤。不是技術指標裡的 RSI。","mech":"大盤漲 2% 時某類股只漲 1%，看漲跌是「漲」，其實資金正在離開它。把類股除以大盤、扣掉整體漲跌後，才看得出資金是偏好還是嫌棄這個板塊；輪動就是這些線此起彼落。注意加權指數四成是台積電，任何類股相對大盤的強弱，都混了台積電那一週的表現，可另外對等權平均算一條來交叉看。","read":[{"when":"線創高後連續數週走低","means":"資金正在離開這個板塊；即使類股本身還在漲，也是漲輸大盤。"},{"when":"長期低檔後連續 2–4 週走高","means":"可能有資金輪動進來；單日或單週的反彈不算。"},{"when":"線在高檔但已走平","means":"相對強不代表會繼續強，走平常常是最後一段。"}],"now":{"v":"半導體 1.80、電子零組件 1.87、金融 0.68（2020 年初＝1）","asof":"2026-09-18","hard":"估計","state":"5 月底後換邊","tone":"watch"},"judge":"2026-05-25 當週是轉折：電子零組件相對大盤見高點（2.19），金融（0.53）與傳產整體見低點。之後 13 週，電子零組件相對落後 14.1%、金融相對領先 10.0%，半導體持平在歷史高檔。營建、食品仍在相對低點，還看不到輪到它們的證據。","look":{"min":"3 年","best":"2020 年起","minY":3,"bestFrom":2020,"why":"要看過 2021 年航運的線一年內升到 3.82、之後跌回 1 以下，和 2023 年 7 月電腦及週邊的高點，才知道相對強可以多快反轉。"},"misread":["把「相對強」當成「會繼續漲」：線在高檔走平，常常是最後一段。","和 RSI 搞混：RSI 是單一標的的技術指標，這條線是兩個指數相除。","用單日判斷：連續 2–4 週同方向，才比較像真的輪動。"],"up":[{"id":"rev_monthly","how":"營收與獲利預估被上修的族群，相對大盤走強"},{"id":"tsmc_w","how":"台積電占大盤四成，它大漲的那週，其他類股的線都往下"},{"id":"usdtwd","how":"台幣急升時外銷電子與壽險的線轉弱，內需與進口原料股轉強"},{"id":"fini_flow_twse","how":"外資買賣集中在大型權值股，左右半導體與金融的相對強弱"}],"down":[{"id":"dispersion","how":"各條強弱線分歧得越開，當週的離散度就越高"},{"id":"etf","how":"相對漲多的股票殖利率下降，高股息 ETF 換股時容易被剔除"}],"src":[{"t":"證交所 每日收盤行情（類股價格指數）","u":"https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?type=IND&response=json"},{"t":"TradingView（疊圖比較）","u":"https://tw.tradingview.com"}],"rooms":["sectors","explorer","practice"],"ver":{"s":"site","note":"本站用 346 週的類股週資料計算；已用同一份資料獨立重算，數值相符。原始週資料抽查對過證交所官方收盤值。"}},{"id":"dispersion","zh":"類股報酬離散度","en":"Cross-sectional dispersion of sector returns","alias":["橫斷面標準差","輪動劇烈程度"],"grp":"sector","speed":"fast","freq":"每週；沒有現成網站，本站探索器每週計算","what":"同一週裡，各類股報酬率彼此差多少（標準差）。高＝各走各的，低＝齊漲齊跌。","mech":"離散度低的時候，類股齊漲齊跌，看大盤就夠了；離散度高的時候，選對板塊與選錯板塊的差距很大，輪動才是重點。它只量「分歧」，不量方向：大漲的週與大跌的週，離散度都可能很高。極端高點常出現在題材狂熱，或單一事件重擊特定板塊的那一週。","read":[{"when":"離散度從低點持續升高","means":"輪動加劇，只看大盤會漏掉大部分資訊，要逐條看相對強弱線。"},{"when":"單週出現極端高值","means":"多半是題材狂熱，或政策、事件只打到特定板塊；查當週哪一類漲跌最大。"},{"when":"年平均回到 2% 上下","means":"回到齊漲齊跌的常態（2020–2025 各年平均 1.97–2.64%）。"}],"now":{"v":"2026 年平均 3.71%（2020–2025 各年 1.97–2.64%）","asof":"2026-09-18","hard":"估計","state":"樣本內最高","tone":"alert"},"judge":"2026 年的年平均，比過去六年的最高值（2021 年 2.64%）還高四成，是樣本裡輪動最劇烈的一年。這不是漲跌方向的訊號，而是提醒：今年「選哪個板塊」造成的差距，遠大於往年。","look":{"min":"5 年","best":"2020 年起","minY":5,"bestFrom":2020,"why":"要有 2021 年航運鋼鐵狂熱與 2023 年的低點（1.97%）當對照，才知道 3.71% 在歷史上算多高。"},"misread":["把它當成漲跌方向的指標：它只量分歧，不量方向。","以為是個股之間的分歧：類股指數是市值加權，量到的其實是各類龍頭股之間的分歧。"],"up":[{"id":"capex_csp","how":"AI 題材獨強時，電子與其他類股的報酬拉開，離散度升高"},{"id":"credit_ctrl","how":"房市管制只打到營建類，當週類股報酬差距擴大"},{"id":"usdtwd","how":"台幣急升時受惠與受害類股反向變動，離散度跳高"},{"id":"oil","how":"油價、運價事件只影響特定類股，拉開類股之間的報酬"}],"down":[{"id":"rs_line","how":"離散度高，代表各條相對強弱線正在拉開，要逐條看是誰在動"},{"id":"sec_share","how":"離散度極端高的週，常伴隨單一族群成交占比暴增，要一起看"}],"src":[{"t":"證交所 每日收盤行情（類股價格指數）","u":"https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?type=IND&response=json"}],"rooms":["sectors","explorer"],"ver":{"s":"site","note":"本站用 346 週的類股週資料計算；已用同一份資料獨立重算，數值相符。原始週資料抽查對過證交所官方收盤值。"}},{"id":"otc_ratio","zh":"櫃買相對加權（中小型股強弱）","en":"TPEx index relative to TAIEX","alias":["櫃買 ÷ 加權","中小型相對強弱"],"grp":"sector","speed":"fast","freq":"每日可算；判讀用週線","what":"櫃買指數除以加權指數；代表中小型、內資偏好的股票，相對大型權值股的表現。","mech":"外資與被動資金主要買大型權值股；投信、散戶與融資資金偏好中小型股。比值上升，代表行情擴散到中小型、內資與風險偏好主導；比值下降，代表資金集中在台積電等權值股。資金撤出股市時，中小型股與融資部位先被賣，櫃買通常跌得比加權重。","read":[{"when":"比值走高","means":"行情擴散到中小型股，內資與風險偏好主導。"},{"when":"比值走低、加權卻創高","means":"資金集中在少數權值股；指數漲不代表多數股票在漲。"},{"when":"急跌時櫃買跌得比加權重、融資連續大減","means":"比較像資金撤出股市，而不是板塊輪動。"}],"now":{"v":"0.71（2020 年初＝1）；低點 0.66（2026-07-27 當週）","asof":"2026-09-18","hard":"估計","state":"歷史低檔回升","tone":"watch"},"judge":"今年櫃買 +49.4%、加權 +62.9%，是大型權值股贏中小型的一年，只看加權看不出來。比值 7 月底見低點 0.66 後回升到 0.71，但近 13 週仍相對落後 9.1%，還不能說行情已經擴散到中小型。","look":{"min":"5 年","best":"2017 年起","minY":5,"bestFrom":2017,"why":"比值長期走低，和台積電權重由 2017 年底 17% 升到 41% 是同 。年增幅度只在彙整網站讀到，改寫為約兩倍。"}},{"id":"gdp","zh":"GDP 成長率","en":"Real GDP growth","alias":["經濟成長率","國內生產毛額"],"grp":"macro","speed":"slow","freq":"每季；1、4、7、10 月底概估，2、5、8、11 月修正並更新預測","what":"一季之內台灣境內生產的商品與服務總值，扣掉物價後，比去年同季多了幾 %。","mech":"GDP＝民間消費＋投資＋政府支出＋（出口－進口）。台灣出口占比高，AI 伺服器與晶片出口暴增時，淨出口和廠商擴產的投資會直接把成長率拉高；消費占比大但變動慢。成長率高代表企業營收、就業與稅收都在增加；但它是季資料、公布又晚，股市通常早已反映。讀的時候要分清楚成長來自外需還是內需。","read":[{"when":"年增率連續幾季明顯高於過去多年的平均","means":"景氣在擴張期；要再拆來源，如果只有出口與投資在拉，內需產業未必有感。"},{"when":"年增率仍為正，但季調後的季增率轉負","means":"動能已經轉弱；年增率是跟去年同季比，會比較晚才反映。"},{"when":"主計總處或央行上修、下修全年預測","means":"官方對後面幾季的看法改變，對市場的影響常大於已公布的那一季。"}],"now":{"v":"第 1 季 15.43%、第 2 季 12.93%；2026 全年預測 11.05%","asof":"2026Q2","hard":"官方","state":"兩位數成長","tone":"watch"},"judge":"第 2 季比第 1 季放慢，但仍遠高於主計總處對 2027 年的預測 6.04%，偏離常態很多，所以標為留意。成長主要來自 AI 相關出口與投資，內需類股今年多為負報酬，就是央行說的「外熱內溫」。明年年增率會因基期墊高而下降，不等於衰退。","look":{"min":"10 年","best":"2000 年起","minY":10,"bestFrom":2000,"why":"要涵蓋 2001 年、2008–09 年、2020–21 年三次大起伏，才知道兩位數成長有多罕見、之後通常怎麼回落。"},"misread":["把年增率高當成股市會漲的理由：GDP 是落後公布的季資料，股價反映的是未來幾季的預期。","把明年成長率下降當成衰退：基期墊高後年增率自然變小，要看季增率有沒有轉負。"],"up":[{"id":"exports","how":"出口減進口是 GDP 的一項，出口年增四成會直接拉高成長率"},{"id":"orders","how":"外銷訂單領先出口，訂單增加預告之後幾個月的生產"},{"id":"capex_csp","how":"雲端大廠擴大資本支出 → 台灣 AI 硬體出口與擴產投資增加"},{"id":"retail","how":"民間消費是 GDP 最大的一項，零售餐飲是它的月頻線索"}],"down":[{"id":"policy_rate","how":"成長過熱時央行較難降息，會傾向升息或收緊信用"},{"id":"unemp","how":"產出增加 → 廠商增聘 → 失業率下降，通常落後幾季"},{"id":"wages","how":"企業產出與獲利增加 → 調薪與獎金，薪資落後反映"},{"id":"mcap","how":"GDP 是市值對 GDP 比的分母，成長快會讓比值沒那麼高"}],"src":[{"t":"行政院主計總處（國民所得統計與經濟預測）","u":"https://www.dgbas.gov.tw/"},{"t":"Trading Economics 台灣指標彙整頁（站方 2026-09-20 讀取）","u":"https://tradingeconomics.com/taiwan/indicators"},{"t":"中央社 2026-09-17 央行理監事會（GDP 預測 11.48%）","u":"https://www.cna.com.tw/news/afe/202609170348.aspx"}],"rooms":["themes","inflow"],"ver":{"s":"confirmed","note":"主計總處 115-08-14 新聞稿（官方）逐字相符；第 1 季是修正後數字、第 2 季是初步統計。Trading Economics 同列 12.93／前值 15.43。"}},{"id":"cpi","zh":"消費者物價（CPI）","en":"Consumer Price Index (CPI), year-on-year","alias":["通膨","核心 CPI","物價年增率"],"grp":"macro","speed":"mid","freq":"每月；次月上旬主計總處公布","what":"一籃子日常商品與服務的價格，比去年同月貴了幾 %；核心 CPI 再扣掉蔬果與能源。","mech":"主計總處每月查同一籃子商品與服務的價格，編成指數。物價會動的常見原因有三個：進口成本（油價、匯率）、國內需求強到廠商敢漲價、薪資與房租上升。央行把 2% 當警戒線：年增率長期高於 2%，央行就難降息，甚至要升息或收緊信用；利率一動，存款、房貸、股票評價都跟著動。核心 CPI 扣掉波動大的蔬果與能源，較能看出漲價有沒有擴散。","read":[{"when":"總指數與核心 CPI 年增率都高於 2%","means":"漲價已擴散到一般商品與服務，央行較難降息，主張升息的理事會變多。"},{"when":"總指數上升、核心持平","means":"多半是油價或蔬果造成的短期波動，央行通常先觀察，不急著動利率。"},{"when":"年增率低於 1% 甚至轉負","means":"需求偏弱，央行有降息空間；對債券這類固定收益資產較有利。"}],"now":{"v":"8 月年增 2.04%（核心 2.3%）","asof":"2026-08","hard":"官方","state":"略高於 2%","tone":"watch"},"judge":"總指數與核心都在 2% 警戒線上方，所以標為留意。布蘭特原油在 100 美元以上，電價又凍漲到 12 月（應調幅 12.83% 尚未反映），物價壓力是被延後、不是消失。9/17 央行不動利率，但有 2 位理事主張升息，12 月理監事會是下一個觀察點。","look":{"min":"5 年","best":"2005 年起","minY":5,"bestFrom":2005,"why":"至少看完 2021–2023 年通膨升溫到回落的全程；往前到 2008 年油價暴漲那次，可比較油價帶動的通膨怎麼收場。"},"misread":["把年增 2% 當成所有東西只漲 2%：它是一籃子平均，房租、外食的漲幅可能高很多。","只看總指數：颱風讓菜價大漲也會拉高總指數，要同時看核心 CPI。"],"up":[{"id":"oil","how":"油價漲 → 油料、運輸、電力成本上升，數月內傳到物價"},{"id":"usdtwd","how":"新台幣貶值 → 進口品換算成台幣變貴"},{"id":"wages","how":"薪資上升 → 服務業成本與消費力增加，推高服務類價格"},{"id":"m2","how":"貨幣成長長期快於產出時，物價比較容易上漲"}],"down":[{"id":"policy_rate","how":"CPI 年增率高於 2% → 央行較難降息、可能升息"},{"id":"pe","how":"通膨推高利率 → 未來獲利折現變小 → 本益比下修"},{"id":"bond_etf","how":"通膨高 → 利率走高 → 債券價格下跌，債券 ETF 淨值下降"},{"id":"retail","how":"物價上漲會墊高零售金額，但實際買到的量未必增加"}],"src":[{"t":"行政院主計總處（物價統計）","u":"https://www.dgbas.gov.tw/"},{"t":"Trading Economics 台灣指標彙整頁（站方 2026-09-20 讀取）","u":"https://tradingeconomics.com/taiwan/indicators"}],"rooms":["themes","local"],"ver":{"s":"partial","note":"2.04% 在主計總處 9/8 新聞稿讀到（官方）。核心 2.3% 只在 Trading Economics 讀到；官方 PDF 因 robots／SSL 錯誤讀不到，指標頁需 JavaScript。"}},{"id":"unemp","zh":"失業率","en":"Unemployment rate (seasonally adjusted)","alias":["季調失業率","就業"],"grp":"macro","speed":"mid","freq":"每月；次月 22 日前後主計總處公布","what":"想工作、正在找工作卻還沒找到的人，占勞動力（有工作加上正在找工作的人）的比例。","mech":"景氣好時廠商增聘，失業率下降；景氣轉差時，廠商通常先減加班、放無薪假，撐不住才裁員，所以失業率是落後指標，轉折比股市和訂單晚好幾個月。每年 6–8 月畢業生投入職場會讓數字季節性上升，要看季調後的數字。失業率很低時企業找不到人，薪資較容易上漲，進而支撐消費，也讓服務類物價有上漲壓力。","read":[{"when":"季調失業率連續 3 個月以上上升","means":"勞動市場轉弱，通常在出口與訂單轉差幾個月後才出現；用來確認，不是預警。"},{"when":"失業率在低檔，但無薪假人數增加","means":"廠商先用減班因應訂單減少，這是比失業率更早的線索。"},{"when":"失業率低、薪資年增率同步走高","means":"缺工推升薪資，有利消費，但服務類物價也較難降下來。"}],"now":{"v":"7 月 3.33%（季調）；8 月數字 9/22 公布","asof":"2026-07","hard":"官方","state":"低檔","tone":"calm"},"judge":"3.33% 屬於低水準，和出口、GDP 的高成長方向一致，看不到勞動市場轉弱的訊號，所以標為平穩。要留意的是這次成長集中在資本密集的 AI 硬體，帶動的就業有限；觀光、食品、汽車等內需類股今年是負報酬，這些產業的聘僱要看後續數字。","look":{"min":"10 年","best":"2000 年起","minY":10,"bestFrom":2000,"why":"失業率變動慢，要涵蓋 2001 年、2008–09 年兩次衰退時的上升與之後多年的回落，才知道它落後景氣多久。"},"misread":["把低失業率當成股市利多：它是落後指標，景氣高峰時失業率往往最低。","拿未季調的 6–8 月數字說失業惡化：那是畢業季的季節性上升。"],"up":[{"id":"gdp","how":"產出增加 → 廠商增聘；成長放慢幾季後失業率才上升"},{"id":"exports","how":"出口接單決定製造業產線開工與人力需求"},{"id":"pmi","how":"PMI 的人力僱用分項領先失業率幾個月"},{"id":"retail","how":"內需服務業僱用人數多，零售餐飲轉弱會減少職缺"}],"down":[{"id":"wages","how":"失業率低 → 企業搶人 → 薪資上漲"},{"id":"retail","how":"有工作、收入穩定的人多 → 消費支出增加"},{"id":"npl","how":"失業增加 → 還不出房貸與信貸的人變多 → 逾放比上升"}],"src":[{"t":"行政院主計總處（人力資源調查）","u":"https://www.dgbas.gov.tw/"},{"t":"Trading Economics 台灣指標彙整頁（站方 2026-09-20 讀取）","u":"https://tradingeconomics.com/taiwan/indicators"}],"rooms":["themes"],"ver":{"s":"confirmed","note":"3.33% 在主計總處 8/24 新聞稿讀到（官方；未季調 3.39%）。9/22 發布日只在 Trading Economics 行事曆讀到；主計總處發布時間表頁需 JavaScript。"}},{"id":"signal","zh":"景氣對策信號與領先指標","en":"Business cycle signal & leading indicators","alias":["景氣燈號","紅燈","領先指標"],"grp":"macro","speed":"mid","freq":"每月；次月 27 日前後國發會公布","what":"國發會用 9 項月資料打分數（9–45 分），以五種燈號表示景氣冷熱；另有領先指標看方向。","mech":"9 個構成項目（含貨幣 M1B、股價指數、工業生產、海關出口、批發零售及餐飲業營業額等）各依變動率給 1–5 分，加總 38 分以上是紅燈（過熱）、32–37 黃紅燈、23–31 綠燈、17–22 黃藍燈、16 分以下藍燈（低迷）。它把多個同時指標合成一個分數，告訴你「現在熱不熱」，不是預測；要看未來幾個月的方向，要看同一份新聞稿裡的領先指標（含外銷訂單動向、股價等）。","read":[{"when":"分數 38 分以上、紅燈","means":"官方定義的景氣過熱；紅燈可以連續很多個月，本身不是轉折訊號。"},{"when":"燈號由紅燈降為黃紅燈、領先指標連續下滑","means":"熱度開始退，是轉向的線索；要再看出口與外銷訂單有沒有同步轉弱。"},{"when":"分數 16 分以下、藍燈","means":"官方定義的景氣低迷；政府通常會推出刺激措施，央行偏向寬鬆。"}],"now":{"v":"7 月 41 分、紅燈（連 8 個月）","asof":"2026-07","hard":"官方","state":"連 8 個月紅燈","tone":"alert"},"judge":"41 分已超過紅燈門檻 38 分，而且連續 8 個月，觸發官方定義的過熱，所以標為警訊。分數裡有股價、M1B、出口等項目，AI 出口與股市大漲本身就會把分數推高；它確認的是「現在很熱」，無法告訴你還會熱多久，要看領先指標與外銷訂單是否轉弱。","look":{"min":"10 年","best":"2000 年起","minY":10,"bestFrom":2000,"why":"要看過幾次紅燈與藍燈各持續多久、之後景氣怎麼走，例如 2021 年的連續紅燈與 2022–23 年的藍燈。"},"misread":["把「紅燈賣、藍燈買」當口訣：紅燈可以連續很多個月，分數裡又含股價，等於用股價確認股價。","把燈號當預測：它是同時指標的合成分數，要看未來請看領先指標。"],"up":[{"id":"exports","how":"海關出口值是構成項目之一，出口暴增直接加分"},{"id":"m1b_gap","how":"M1B 是構成項目之一，活期資金成長快會加分"},{"id":"retail","how":"批發零售及餐飲業營業額是構成項目之一"},{"id":"orders","how":"外銷訂單動向是領先指標的構成項目，決定領先指標的方向"}],"down":[{"id":"policy_rate","how":"連續紅燈代表過熱，央行較難降息、會傾向收緊"},{"id":"gdp","how":"燈號每月公布，連續高分通常預告該季 GDP 高成長"}],"src":[{"t":"國發會 景氣指標查詢系統","u":"https://index.ndc.gov.tw/"},{"t":"Trading Economics 台灣指標彙整頁（站方 2026-09-20 讀取）","u":"https://tradingeconomics.com/taiwan/indicators"}],"rooms":["themes","sectors"],"ver":{"s":"partial","note":"41 分、紅燈在國發會 8/27 新聞稿讀到（官方）。「連 8 個月」新聞稿沒寫，今天未讀到（底稿出處聯合新聞網，已達讀取上限）。國發會首頁寫下次發布 9/29 16:00。"}},{"id":"pmi","zh":"製造業 PMI","en":"Manufacturing PMI (S&P Global)","alias":["採購經理人指數"],"grp":"macro","speed":"mid","freq":"每月；次月初公布","what":"問製造業採購經理人：新訂單、生產、僱用、交期、存貨比上個月增加還是減少，合成一個 0–100 的指數。","mech":"它是問卷調查，不是金額統計。回答「增加」的比例高於「減少」，指數就在 50 以上，代表製造業比上個月擴張；低於 50 代表收縮。因為問的是「這個月比上個月」，又在月初就公布，所以是最早能看到的景氣數字，比出口、GDP 早。台灣有兩個版本：S&P Global（本站採用）與中華經濟研究院，樣本與算法不同，數值不能互比。分項中的新訂單與存貨最有領先性。","read":[{"when":"指數高於 50 且連續上升","means":"製造業擴張加速；之後一到兩個月的出口與工業生產通常也會好。"},{"when":"指數仍高於 50 但連續下滑","means":"還在擴張、但速度放慢；常是景氣高峰附近最早出現的線索。"},{"when":"指數跌破 50","means":"製造業比上月收縮；要看是否連續 2–3 個月，單月可能是假期或天災。"}],"now":{"v":"8 月 54.7（S&P Global 台灣製造業）","asof":"2026-08","hard":"估計","state":"擴張","tone":"calm"},"judge":"54.7 明顯高於 50，製造業仍在擴張，和出口年增 41.0%、外銷訂單年增 61.9% 的方向一致，所以標為平穩。要看的是方向而不是水準：如果之後連續幾個月下滑、特別是新訂單分項轉弱，會比出口統計更早反映 AI 訂單動能放慢。它是民間問卷調查，硬度標為估計。","look":{"min":"5 年","best":"2012 年起","minY":5,"bestFrom":2012,"why":"要涵蓋一次完整的庫存循環：2020 年跌破 50、2021 年衝高、2022–23 年再跌破 50 的全程。"},"misread":["把 54.7 當成成長 54.7%：它是擴散指數，50 是分界，只代表覺得變好的廠商比變差的多。","把兩個版本混著比：S&P Global 與中經院的樣本、權重不同，要各自跟自己的上月比。"],"up":[{"id":"orders","how":"外銷訂單增加 → 廠商回報新訂單增加 → PMI 上升"},{"id":"capex_csp","how":"雲端大廠擴大資本支出 → 台灣電子業接單增加"},{"id":"tariff","how":"關稅生效前客戶提前拉貨會短暫推高，之後回落"},{"id":"oil","how":"油價與原料上漲 → 投入成本分項上升、獲利被壓縮"}],"down":[{"id":"exports","how":"PMI 新訂單分項通常領先出口統計一到兩個月"},{"id":"gdp","how":"製造業占台灣 GDP 比重高，PMI 連續走高預告該季成長"},{"id":"unemp","how":"人力僱用分項走弱 → 幾個月後失業率上升"},{"id":"rev_monthly","how":"擴張期廠商出貨增加 → 上市櫃公司月營收年增率走高"}],"src":[{"t":"Trading Economics 台灣指標彙整頁（站方 2026-09-20 讀取）","u":"https://tradingeconomics.com/taiwan/indicators"},{"t":"S&P Global PMI 發布頁","u":"https://www.pmi.spglobal.com/"},{"t":"國發會 景氣指標查詢系統（中經院版 PMI）","u":"https://index.ndc.gov.tw/"}],"rooms":["themes","sectors"],"ver":{"s":"confirmed","note":"S&P Global 官方新聞稿（2026-09-01，原始發布者）逐字相符；Trading Economics 同列 54.7（前值 55.1）。這是 S&P Global 版，不是中經院版。"}},{"id":"retail","zh":"零售與餐飲營業額","en":"Retail & food-service sales","alias":["零售業營業額","內需消費","消費者信心"],"grp":"macro","speed":"mid","freq":"每月；次月 23 日前後經濟部統計處公布","what":"全台零售業（百貨、超商、汽車、網購等）與餐飲業一個月做了多少生意，跟去年同月比增減幾 %。","mech":"這是內需消費最即時的月資料。消費的錢來自薪資、獎金、股利，以及資產增值帶來的信心；所以就業穩、薪資漲、股市大漲時，零售與餐飲通常會增加，但幅度遠小於出口的波動。它是金額、沒有扣掉物價：物價漲 2% 時營業額增 2%，等於實際沒成長。農曆年落在 1 月或 2 月會讓單月年增率大幅跳動，要把 1–2 月合併看。汽車與燃料占比高，車市與油價會明顯影響總數。","read":[{"when":"年增率高於 CPI 年增率","means":"扣掉物價後消費量仍在增加，內需有實質成長。"},{"when":"年增率低於 CPI 年增率或轉負","means":"實際買的量在減少；如果同時出口很強，就是「外熱內溫」。"},{"when":"餐飲、百貨強，汽車、家電弱","means":"小額消費還在、大額耐久財縮手，常見於利率偏高或信心轉弱的時候。"}],"now":{"v":"零售業 7 月年增 +7.7%；消費者信心指數 8 月 65.01","asof":"2026-07","hard":"官方","state":"溫和成長","tone":"calm"},"judge":"零售 +7.7% 高於 CPI 的 2.04%，內需實質上有成長，所以標為平穩；但和出口年增四成相比差距很大。股市也反映這個落差：觀光、食品、汽車、貿易百貨類股今年以來在 −7.6% 到 +0.5% 之間，大盤是 +62.9%。消費者信心指數 65.01 也顯示信心沒有跟上股市。","look":{"min":"5 年","best":"2008 年起","minY":5,"bestFrom":2008,"why":"要涵蓋 2021 年三級警戒的急跌與之後的報復性消費，才知道內需正常波動多大；往前到 2008–09 年可對照衰退時的樣子。"},"misread":["拿營業額年增率直接當消費量成長：要先扣掉物價漲幅。","看 1 月或 2 月單月暴增暴減就下結論：那是農曆年月份不同造成的。"],"up":[{"id":"wages","how":"薪資與獎金增加 → 可支配所得增加 → 消費增加"},{"id":"unemp","how":"失業率低、工作穩定，家庭才敢花錢"},{"id":"mcap","how":"股市大漲的財富效果會帶動精品、汽車、餐飲等消費"},{"id":"cpi","how":"物價上漲會墊高營業額金額，也會壓縮實際購買量"}],"down":[{"id":"gdp","how":"民間消費是 GDP 最大的一項，零售餐飲是它的月頻線索"},{"id":"signal","how":"批發零售及餐飲業營業額是景氣燈號的構成項目之一"},{"id":"rev_monthly","how":"內需型上市櫃公司（百貨、超商、餐飲）的月營收跟著它走"}],"src":[{"t":"經濟部統計處（批發、零售及餐飲業營業額統計）","u":"https://www.moea.gov.tw/Mns/dos/"},{"t":"Trading Economics 台灣指標彙整頁（站方 2026-09-20 讀取）","u":"https://tradingeconomics.com/taiwan/indicators"}],"rooms":["themes","sectors"],"ver":{"s":"partial","note":"零售 +7.7% 在經濟部統計處首頁讀到（官方）。消費者信心 65.01 只在 Trading Economics 讀到；中央大學台經中心只列 8 月新聞稿 PDF，達讀取上限未開。"}},{"id":"fed","zh":"聯準會利率與美債殖利率","en":"Fed funds rate & US 10-year Treasury yield","alias":["Fed","FOMC","升息","美國 10 年期公債殖利率","點陣圖"],"grp":"macro","speed":"fast","freq":"利率：每年 8 次會議；殖利率：每個交易日","what":"美國央行設定的短期利率區間，以及市場交易出來的美國 10 年期公債殖利率；後者是全球資產定價的基準。","mech":"聯準會調的是隔夜利率；10 年期公債殖利率由市場決定，反映未來十年的利率與通膨預期。股票的價值是未來獲利折現回來的總和，折現用的利率跟著美債殖利率走：殖利率越高，越遠的獲利越不值錢，所以本益比高、獲利在未來的科技股最受影響。對台灣還有兩條路：美元利率高 → 資金留在美元、新台幣偏弱、外資偏向賣超；壽險手上的舊債券價格下跌。","read":[{"when":"會前市場已預期、會後照預期升息","means":"常見會前跌、會後漲：9/11–15 台股三天跌 1,429 點，9/16–18 三天漲 1,669 點。"},{"when":"點陣圖或主席談話比預期更偏緊","means":"市場上調未來利率 → 美債殖利率上升 → 高本益比股票先跌。"},{"when":"10 年期殖利率升破 5% 並停留","means":"（作者設的觀察線）折現率在高位，股票相對債券的吸引力下降，評價較難再擴張。"}],"now":{"v":"9/16 升 1 碼至 3.75–4.00%；10 年期殖利率約 5%","asof":"2026-09-16","hard":"官方","state":"轉為升息","tone":"watch"},"judge":"9/16 是三年來首次升息，18 位官員有 16 位預期年內再升，瑞銀估 12 月再升 1 碼；日本、歐洲同週也升息。政策方向正在轉向，所以標為留意。對台股的影響在評價面：今年漲最多的是高本益比的 AI 零件股，對利率最敏感。9 月這次市場已先反映，下一次看 12 月。殖利率為市場讀數。","look":{"min":"10 年","best":"1994 年起","minY":10,"bestFrom":1994,"why":"至少看完 2015–19 升息、2020 降息、2022–23 急升息兩輪循環；往前到 1999–2000 年，可看升息期間科技股先漲後跌的例子。"},"misread":["以為升息當天股市一定跌：市場交易的是「和預期差多少」，9/16 升息後台股反而連漲三天。","只看聯準會利率、不看 10 年期殖利率：影響股票評價的是後者，兩者可以走不同方向。"],"up":[{"id":"oil","how":"油價上漲 → 美國通膨升溫 → 聯準會更傾向升息"},{"id":"tariff","how":"關稅墊高美國進口物價 → 通膨壓力 → 利率較難下降"}],"down":[{"id":"pe","how":"殖利率上升 → 未來獲利折現變小 → 本益比下修，高本益比股最明顯"},{"id":"usdtwd","how":"美元利率高於台幣 → 資金偏向美元 → 新台幣有貶值壓力"},{"id":"fini_flow_twse","how":"美債利率上升、風險偏好下降時，外資較常賣超台股"},{"id":"policy_rate","how":"美國升息拉大台美利差，台灣央行升息的壓力變大"}],"src":[{"t":"Kiplinger 2026 年 9 月聯準會會議即時整理","u":"https://www.kiplinger.com/investing/live/fed-meeting-updates-and-commentary-september-2026"},{"t":"工商時報 2026-09-17 聯準會升息 1 碼","u":"https://www.ctee.com.tw/news/20260917700407-430701"},{"t":"經濟日報 瑞銀對後續利率的預估","u":"https://money.udn.com/money/story/5616/9762204"}],"rooms":["themes","inflow","aidc"],"ver":{"s":"confirmed","note":"聯準會 2026-09-16 聲明（官方，12 比 0）與 FRED DGS10 讀到。10 年期 9/15–16 為 5.00–5.01%，9/17 回到 4.94%，「約 5%」成立。"}},{"id":"oil","zh":"油價","en":"Crude oil price (Brent)","alias":["布蘭特原油","WTI","國際油價"],"grp":"macro","speed":"fast","freq":"每個交易日（期貨報價）","what":"國際原油期貨價格，常用布蘭特（Brent）當基準；台灣的原油幾乎全靠進口。","mech":"油價是成本，也是通膨的源頭。油價上漲 → 汽柴油、運輸、發電、塑化原料成本上升 → 幾個月內傳到消費者物價 → 各國央行較難降息甚至升息 → 高本益比股票的評價被壓。對台灣另有三個直接影響：進口金額增加、順差縮小；台電與中油的虧損擴大，電價調漲壓力累積；類股上，煉油的台塑化受惠（低價庫存增值、煉油利差擴大），航空與用電大戶受害。","read":[{"when":"布蘭特站上 100 美元並持續數週","means":"通膨與升息預期升溫；9 月油電燃氣類 +15.9%，電子零組件、光電各 −6.0%。"},{"when":"戰事消息造成單日暴漲","means":"7/13–14 川普宣布再度封鎖伊朗港口，布蘭特單日 +9.6%；這類漲幅常隨停火消息反轉。"},{"when":"油價回落到 100 美元以下並持續走低","means":"通膨壓力減輕，央行升息的理由變少；油電燃氣類的漲幅通常也會回吐。"}],"now":{"v":"布蘭特 103.87 美元（9/18，期貨報價）","asof":"2026-09-18","hard":"市場","state":"油價破百","tone":"alert"},"judge":"布蘭特由 9/2 的 95 美元漲到 9/18 的 103.87 美元，站上市場普遍關注的 100 美元關卡，所以標為警訊。它是「戰事 → 油價 → 通膨 → 升息 → 科技股評價」這條因果鏈的起點。台灣電價凍漲到 12 月（應調幅 12.83%），成本暫時由台電吸收，壓力往後移。停火消息一出，方向就會反轉。","look":{"min":"5 年","best":"2005 年起","minY":5,"bestFrom":2005,"why":"要涵蓋 2022 年俄烏戰爭時破百再回落的全程；往前到 2008 年與 2014–16 年，才知道暴漲、暴跌之後通膨與利率怎麼走。"},"misread":["以為油價漲、整個塑化族群都受惠：受惠的主要是煉油的台塑化；下游塑膠原料因中國產能過剩漲不上去。","把塑膠類指數今年 +170.3% 歸因於油價：那幾乎是南亞一檔，靠的是電子材料。"],"up":[{"id":"fed","how":"聯準會升息 → 美元走強、全球需求降溫 → 油價通常受壓抑"},{"id":"tariff","how":"關稅壓抑全球貿易與需求 → 原油需求預期下降"}],"down":[{"id":"cpi","how":"油價漲 → 油料、運輸、電力成本上升 → 數月內推高物價"},{"id":"fed","how":"油價推高美國通膨 → 聯準會更傾向升息"},{"id":"ca","how":"原油進口金額增加 → 貿易順差與經常帳順差縮小"},{"id":"scfi","how":"燃油成本上升與戰事繞道，同時推高海運運價"}],"src":[{"t":"Trading Economics 布蘭特原油期貨報價","u":"https://tradingeconomics.com/commodity/brent-crude-oil"},{"t":"21 經濟網（新華財經）2026-09-18 國際油價","u":"https://www.21jingji.com/article/20260919/herald/79aea6a6d316c7beaaa1be64dc0c9dd4.html"},{"t":"中央社 2026-09-18 電價凍漲（經濟部說明油價波動）","u":"https://www.cna.com.tw/news/afe/202609180272.aspx"}],"rooms":["themes","sectors"],"ver":{"s":"secondary","note":"Trading Economics 與新華財經（21 經濟網轉載）兩個二手來源都是 103.87（11 月期貨、9/18 收盤）。ICE 官網報價頁需 JavaScript，讀不到原始結算價。"}},{"id":"tariff","zh":"美國關稅與 232 條款","en":"US tariffs: reciprocal, Section 232 & Section 301","alias":["對等關稅","232 條款","301 條款","半導體關稅"],"grp":"macro","speed":"mid","freq":"不定期；看美國公告與行政院臺美關稅談判專區","what":"美國對台灣商品課的進口稅：一般商品的對等關稅、按產業別課的 232 條款、針對特定行為的 301 條款。","mech":"關稅由美國進口商繳，但會透過砍價、轉單或漲價，分攤到台灣出口商與美國消費者。三種稅各管各的：對等關稅管一般商品（台灣 15% 且不疊加）；232 條款以國家安全為由按產業課（半導體、伺服器、無人機、多晶矽），台灣靠赴美投資換到免稅配額與最優惠稅率；301 條款針對特定行為（強迫勞動，台灣 10%；結構性產能過剩，尚未公布）。稅率本身不高，風險在原產地認定變嚴，以及豁免和赴美投資綁在一起。","read":[{"when":"美國公布新的 232 產業別關稅","means":"先看台灣是否沿用最優惠待遇、豁免範圍多大；目前各項都取得 15% 或更低。"},{"when":"出現原產地查核或產地標示案件","means":"個別公司風險：欣興 8/28 遭搜索後急跌、8/31 跌停；未來可能要交料號清單。"},{"when":"關稅生效日前出口暴增","means":"可能是客戶提前拉貨，之後幾個月會回落；要和外銷訂單一起看。"}],"now":{"v":"對等 15% 不疊加；強迫勞動 301 為 10%；半導體 232 新方案未確認","asof":"2026-09","hard":"制度","state":"新方案待定","tone":"watch"},"judge":"台灣的稅率在各國中偏低，已公布的部分對出口的直接衝擊有限（1–8 月出口年增 44.2%）。標為留意，是因為有兩件事還沒定案：美國商務部長 9 月初說的新半導體關稅方案（細節未確認），以及川習會後才可能公布的 301「結構性產能過剩」調查。兩者都會先反映在台積電與 AI 供應鏈。","look":{"min":"2 年","best":"2018 年起","minY":2,"bestFrom":2018,"why":"這一輪從 2025 年對等關稅開始，至少要看完整輪談判；往前到 2018 年美中貿易戰，可對照轉單與提前拉貨怎麼影響出口數字。"},"misread":["只比稅率高低：台灣稅率偏低，真正的風險是原產地認定變嚴，以及豁免和赴美投資進度綁在一起。","把半導體 232 條款的 25% 當成所有晶片都課：AI 資料中心、研發、消費與車用電子等有廣泛豁免。"],"up":[{"id":"exports","how":"對美出口與順差暴增，是美國要求談判、課稅的主要理由"},{"id":"capex_csp","how":"美國 AI 資料中心仰賴台灣伺服器，232 條款因此給廣泛豁免"}],"down":[{"id":"orders","how":"客戶為避稅提前下單或轉單，訂單數字短期會失真"},{"id":"fdi_out","how":"免稅配額與赴美投資綁定 → 廠商加大對美直接投資"},{"id":"tsmc_rev","how":"半導體 232 新方案影響台積電成本與美國廠投資進度
