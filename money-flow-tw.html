<details class="blk" id="b2-answer" open>
  <summary><span class="h">多少錢流進房地產</span><span class="sum">銀行借給房地產 15.35 兆元（存量）；一年只淨增約 0.51 兆元；2026 年 3–7 月新增放款約 9% 去不動產。</span></summary>
  <div class="body">
    <p>直接回答，分三個數字。<b>存量</b>：到 2026-07 底，全體銀行的不動產貸款餘額是 <span class="num">15.35 兆元</span><span class="hd hd-off">官方</span>（央行口徑），其中<a class="ind" data-ind="hloan">購置住宅貸款</a> 11.89 兆元、<a class="ind" data-ind="cloan">建築貸款</a> 3.43 兆元，其餘是房屋修繕貸款。<b>流量</b>：房貸餘額近 12 個月淨增 5,139 億元（+4.52%），建築貸款減少 65 億元，合計一年約 0.51 兆元，只有 2020 年（約 1.06 兆元）的一半。<b>比例</b>：2026 年 3 月底到 7 月底這 4 個月，不動產貸款增加 1,718 億元，其他放款增加 1 兆 7,082 億元，新增放款只有約 9% 去了不動產。</p>
    <div class="kpis">
      <div class="kpi"><span class="k">銀行不動產貸款餘額</span><span class="v">15.35 兆元</span><span class="d">2026-07，央行口徑，歷史新高</span></div>
      <div class="kpi"><span class="k">房貸近 12 個月淨增</span><span class="v">5,139 億元</span><span class="d">年增 4.52%；近十年常態 4.5–6%</span></div>
      <div class="kpi"><span class="k">五大銀行單月新撥房貸</span><span class="v">691 億元</span><span class="d">2026-07；2024 年月均 969 億元</span></div>
      <div class="kpi"><span class="k">新增放款去不動產的比例</span><span class="v">約 9%</span><span class="d">2026-03 底至 07 底，4 個月</span></div>
    </div>
    <figure class="chart" data-chart="b2_split"></figure>
    <p>另外九成主要去了企業週轉金與個人理財週轉金：AI 相關製造業 2026 上半年週轉金放款增加 9,113 億元；<a class="ind" data-ind="wm_loans">個人理財週轉金</a> 7 月年增 32.35%，央行把它和股市交易熱絡連在一起。<a class="ind" data-ind="loans">銀行放款</a>的全貌見<a href="#/local">本地有多少</a>。</p>
    <div class="note"><b>「錢流進房市」是什麼意思</b>　買方的自備款（存款、股市獲利、父母資助）加上銀行新撥的房貸，付給賣方（建商或前屋主）；賣方拿到錢後還建築貸款、買地、換屋，或轉回存款與股市。錢始終留在銀行體系，只是換了主人。所以沒有「房市裡停了多少錢」這個數字，能量的是三件事：銀行為房市新創造了多少信用（房貸與建築貸款的增量）、一年換手多少金額（<a class="ind" data-ind="transfers">成交量</a> × <a class="ind" data-ind="hprice">價格</a>）、銀行還能再放多少（<a class="ind" data-ind="r72">72-2 比率</a>與<a class="ind" data-ind="credit_ctrl">央行管制</a>）。</div>
    <div class="how"><span class="lbl">怎麼讀</span>看壓力用「餘額」（存量，欠銀行的總數）；看這個月有多少新錢借出去用「<a class="ind" data-ind="newmort">新承做金額</a>」（流量）；看銀行的信用往哪裡去，用「新增放款裡不動產占幾成」。三個數字回答的是不同問題，不能互相代替。</div>
    <div class="mis"><b>常見誤讀</b>　「房貸餘額又創新高，代表錢大舉流入房市」→ 餘額是存量，幾乎每個月都創新高；要看年增率（4.52%，常態區間下緣）與新承做金額（1–7 月月均約 543 億元，偏冷）。</div>
    <details class="sub"><summary>順帶回答：銀行有多少錢、多少錢可以借貸</summary><div class="body">
      <p>本國銀行存款加金融債 64.84 兆元、全體銀行總放款 44.57 兆元、<a class="ind" data-ind="m2">M2</a> 70.22 兆元（皆 2026-07）<span class="hd hd-off">官方</span>。銀行不是先有一堆錢才借出去，放款本身會創造存款；限制放款的是資本、流動性、法定比率與央行的態度。借給房地產的上限見下方「銀行端的上限」，銀行整體的狀況見<a href="#/local">本地有多少</a>。</p>
    </div></details>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/tw/cp-302-192764-93ec6-1.html" target="_blank" rel="noopener">中央銀行 2026 年 7 月消費者貸款及建築貸款餘額</a>；<a href="https://www.cbc.gov.tw/dl-227599-f5b26526d15c4b40bcc105d611ed3c7a.html" target="_blank" rel="noopener">中央銀行 2026-09-17 理監事會參考資料</a>。一年增量與 9% 為研究報告依央行金融統計月報計算。</p>
  </div>
</details>

<details class="blk" id="b2-loans">
  <summary><span class="h">房貸與建築貸款的信用循環</span><span class="sum">建築貸款（建商端）比房貸早 1–2 年轉向；現在建築貸款年增率已轉負，房貸 4.52% 在常態區間的下緣。</span></summary>
  <div class="body">
    <p>結論：房市的銀行信用處在降溫後的低成長期，而且建商比買方更保守。2026-07 底<a class="ind" data-ind="hloan">購置住宅貸款</a>年增 4.52%<span class="hd hd-off">官方</span>，剛好在近十年常態（4.5–6%）的下緣；<a class="ind" data-ind="cloan">建築貸款</a>年增 −0.19%，餘額連 5 個月下滑，央行官員的說法是「建商開案仍相當保守」。</p>
    <p>機制：建商先向銀行借錢買地、蓋房（建築貸款），房子用預售賣出，2–4 年後交屋，買方的房貸才撥款。所以建築貸款反映建商對未來幾年的看法，會比房貸、比房價早轉向；房貸餘額是最後才動的存量。</p>
    <figure class="chart" data-chart="b2_growth"></figure>
    <ul class="list">
      <li>上一輪：建築貸款年增率 2019 年先升到 12.71%、2020 年 20.51% 見頂，房貸到 2021 年才見到 9.46%。</li>
      <li>這一輪：建築貸款 2023 年就降到 4.09%，房貸卻在 2024 年再衝到 10.42%（9 月高點 11.26%，2006 年以來最高）。那一波靠的是新青安貸款，不是建商看好。<span class="tag inf">推論</span></li>
    </ul>
    <div class="how"><span class="lbl">怎麼讀</span>房貸年增率：4.5–6% 是常態，8% 以上過熱，低於 4.5% 是降溫。建築貸款年增率：由高檔快速下滑代表建商縮手，2–3 年後新供給變少；轉負很少見；要確認建商回來，看它由負轉正並連續 3 個月上升。</div>
    <h4>流量：五大銀行新承做房貸</h4>
    <p><a class="ind" data-ind="newmort">五大銀行新承做房貸</a>是台銀、合庫、土銀、華銀、一銀當月新撥出去的金額。2026-07 是 691 億元、利率 2.290%<span class="hd hd-off">官方</span>；1–7 月月均約 543 億元，低於 2025 年月均 641 億元與 2024 年月均 969 億元。研究報告用的門檻是單月 900 億元以上算熱、600 億元以下算冷。<span class="tag inf">推論</span></p>
    <figure class="chart" data-chart="b2_newmort"></figure>
    <div class="blind"><b>盲點</b>　餘額年增率會比實際買氣好看很久。近 12 個月光五大銀行就新撥 6,695 億元，全體銀行餘額卻只淨增 5,139 億元，差額是還本；貸款年限拉長、新青安有 5 年寬限期，又讓還本變慢；現在撥款的有很多是 2021–23 年賣掉的預售屋在交屋。所以 2025 年<a class="ind" data-ind="transfers">買賣移轉</a>減少 25.5%，房貸餘額仍成長 4.46%。<span class="tag add">補充</span></div>
    <details class="sub"><summary>細節：月度年增率、口徑差異、建築貸款結構</summary><div class="body">
      <div class="tbl-wrap"><table class="narrow">
        <thead><tr><th>月底</th><th class="n">購置住宅貸款</th><th class="n">建築貸款</th></tr></thead>
        <tbody>
          <tr><td>2024-09</td><td class="n">11.26%（本波高點）</td><td class="n">—</td></tr>
          <tr><td>2024-10</td><td class="n">—</td><td class="n">4.72%（本波高點）</td></tr>
          <tr><td>2025-01</td><td class="n">9.86%</td><td class="n">3.70%</td></tr>
          <tr><td>2025-11</td><td class="n">4.81%</td><td class="n">0.68%</td></tr>
          <tr><td>2025-12</td><td class="n">4.46%</td><td class="n">0.27%</td></tr>
          <tr><td>2026-02</td><td class="n">4.5%</td><td class="n">1.5%</td></tr>
          <tr><td>2026-04</td><td class="n">4.46%</td><td class="n">0.48%</td></tr>
          <tr><td>2026-06</td><td class="n">4.36%</td><td class="n">−0.07%</td></tr>
          <tr><td>2026-07</td><td class="n">4.52%</td><td class="n">−0.19%</td></tr>
        </tbody>
      </table></div>
      <ul class="list">
        <li>2016 年底到 2026-07，房貸餘額增加 87%、建築貸款增加 108%。</li>
        <li>金管會口徑（36 家本國銀行）：7 月底購置住宅貸款 11.8 兆元、年增 4.51%；建築貸款 3.88 兆元、年增 0.15%。分類範圍比央行寬，方向一致。</li>
        <li>金融穩定報告有時把房屋修繕貸款併入購置住宅貸款，高點寫成 11.15%，與央行新聞稿的 11.26% 差約 0.1 個百分點。</li>
        <li>建築貸款的結構在變：都更危老（都市更新與危險老舊建築）重建貸款占比由 2020-12 的 5.94%（1,250 億元）升到 2026-07 的 25.25%（8,659 億元）。總量持平，代表買素地推新案的部分縮得更多。</li>
        <li>聯徵中心資料：新增房貸平均期數十年間多了近 78 期（逾 6 年）；2025 年建物第一次登記 17.67 萬棟，近 10 年最高。</li>
      </ul>
    </div></details>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/public/data/EBOOKXLS/107_EF99_A4L.pdf" target="_blank" rel="noopener">中央銀行金融統計月報表 18</a>（年增率由年底餘額計算）；<a href="https://www.cbc.gov.tw/tw/cp-302-192747-5edf4-1.html" target="_blank" rel="noopener">五大銀行新承做放款</a>；<a href="https://www.cbc.gov.tw/public/data/EBOOKXLS/145_EH45_A4L.pdf" target="_blank" rel="noopener">月報表 29-D</a>。</p>
  </div>
</details>

<details class="blk" id="b2-ctrl">
  <summary><span class="h">央行選擇性信用管制時間線</span><span class="sum">央行管房市主要不靠升息，而是規定誰最多能借幾成；2020–2024 年七度收緊，2026 年 3 月、9 月兩度放寬。</span></summary>
  <div class="body">
    <p>結論：管制正在由最嚴往回放，但只放了一小段。2026-09-17 理監事會利率連續第 10 次不動（2.00%），同時把自然人第 2 戶購屋貸款的成數上限由 6 成調到 7 成（3 月才由 5 成調到 6 成），9/18 生效<span class="hd hd-sys">制度</span>；理由是<a class="ind" data-ind="conc">不動產放款集中度</a>已由 2024-06 高點 37.61% 降到 34.44%。第 3 戶、公司法人、高價住宅、餘屋貸款的 3 成上限都沒動。下一次會議是 2026-12-17。</p>
    <p>機制：<a class="ind" data-ind="credit_ctrl">選擇性信用管制</a>直接規定「哪一類借款人最多能借幾成、能不能有寬限期」。成數（loan-to-value, LTV）壓低，自備款就變多、槓桿（用借來的錢放大購買力）變小；取消寬限期，一開始就要還本金，持有成本變高。對象只鎖多屋族、法人、豪宅、建商買地與餘屋（蓋好還沒賣掉的房子），首購不受限。只盯<a class="ind" data-ind="policy_rate">政策利率</a>，會漏掉台灣央行管房市的主要工具。</p>
    <div class="timeline">
      <div class="ev"><span class="dt">2020-12-07</span><span>第 1 次：公司法人購置住宅第 1 戶 6 成、第 2 戶以上 5 成；自然人第 3 戶以上 6 成；購地貸款 6.5 成並保留 1 成動工款；餘屋貸款 5 成。</span></div>
      <div class="ev"><span class="dt">2021-03-18</span><span>第 2 次：公司法人一律 4 成；自然人第 3 戶 5.5 成、第 4 戶以上 5 成；高價住宅 5.5 成；新增工業區閒置土地抵押貸款 5.5 成。</span></div>
      <div class="ev"><span class="dt">2021-09-23</span><span>第 3 次：六都與新竹縣市的第 2 戶購屋貸款不得有寬限期；購地貸款降到 6 成。</span></div>
      <div class="ev"><span class="dt">2021-12-16</span><span>第 4 次：高價住宅、第 3 戶以上一律 4 成；購地貸款 5 成，並須切結一定期間內動工；餘屋貸款 4 成。</span></div>
      <div class="ev"><span class="dt">2023-06-15</span><span>第 5 次：特定地區第 2 戶新增成數上限 7 成（原本只限制寬限期）。</span></div>
      <div class="ev"><span class="dt">2023-08-01</span><span>新青安貸款上路（財政部政策，非央行措施）：40 年期、5 年寬限期、額度 1,000 萬元，抵銷了管制的效果。</span></div>
      <div class="ev"><span class="dt">2024-06-13</span><span>第 6 次：特定地區第 2 戶 7 成降到 6 成；存款準備率（銀行收到存款後必須存放在央行的比例）調升 0.25 個百分點，等於收走一部分可貸資金。</span></div>
      <div class="ev"><span class="dt">2024-08-12</span><span>至 8/21：央行約談 34 家本國銀行，要求自主管理不動產貸款總量一年（2024Q4–2025Q4）。</span></div>
      <div class="ev"><span class="dt">2024-09-19</span><span>第 7 次，歷來最嚴：名下有房者的第 1 戶不得有寬限期；第 2 戶降到 5 成並擴大到全國；公司法人、高價住宅、第 3 戶以上 3 成；餘屋貸款 3 成；存款準備率再升 0.25 個百分點。</span></div>
      <div class="ev"><span class="dt">2024-10-09</span><span>補充：先買後賣的換屋族切結 1 年內賣舊屋，可不受成數與寬限期限制；繼承取得的房屋不計入戶數。</span></div>
      <div class="ev"><span class="dt">2025-09-08</span><span>換屋切結的出售期限由 1 年延長為 18 個月。</span></div>
      <div class="ev"><span class="dt">2025-12-18</span><span>管制不變；但 2026 年起不動產貸款總量回歸各銀行內部控管，銀行須按月報送，央行持續專案金檢。</span></div>
      <div class="ev"><span class="dt">2026-03-19</span><span>第 8 次，第一次放寬：第 2 戶由 5 成調高到 6 成（3/20 生效）。</span></div>
      <div class="ev"><span class="dt">2026-06-18</span><span>不動，續檢視各銀行內部控管情形。</span></div>
      <div class="ev"><span class="dt">2026-09-17</span><span>第 9 次，第二次放寬：第 2 戶由 6 成調高到 7 成（仍無寬限期）；購地貸款刪除「切結一定期間內動工」，仍維持 5 成並保留 1 成動工款。9/18 生效；1 位理事不同意放寬。</span></div>
    </div>
    <h4>怎麼讀這條時間線 <span class="tag inf">推論</span></h4>
    <ul class="list">
      <li>2020-12 到 2021-12 一年內四度收緊，房市照漲：當時扣掉通膨後的利率是負的、資金多、首購不受限。</li>
      <li>2024 年 6 月、9 月連兩次加碼；9 月那次剛好碰上銀行的 <a class="ind" data-ind="r72">72-2 比率</a>逼近上限、銀行自己也不敢放，成交量才真正降下來（2025 年<a class="ind" data-ind="transfers">買賣移轉</a> −25.5%）。</li>
      <li>2026 年轉為逐季小幅放寬。要看 12/17 會不會動第 3 戶、法人、餘屋的 3 成；動了才算全面放寬。</li>
    </ul>
    <div class="mis"><b>常見誤讀</b>　「央行放寬＝房市要回升」→ 9/18 生效當天建材營造類股只漲 2.45%；放寬第 2 戶幫到的是換屋與自住置產，建商在意的餘屋貸款 3 成沒動。央行總裁也說會「逐季檢討」，放寬若出現副作用「會回頭」收緊。</div>
    <details class="sub"><summary>現行規定一覽（2026-09-18 起）</summary><div class="body">
      <div class="tbl-wrap"><table>
        <thead><tr><th>貸款類別</th><th>成數上限</th><th>寬限期</th></tr></thead>
        <tbody>
          <tr><td class="name">名下有房屋者的第 1 戶購屋貸款</td><td>央行不設上限</td><td>不得有（切結 18 個月內賣舊屋的換屋族除外）</td></tr>
          <tr><td class="name">自然人第 2 戶（全國）</td><td>7 成</td><td>不得有（換屋切結者除外）</td></tr>
          <tr><td class="name">自然人第 3 戶以上</td><td>3 成</td><td>不得有</td></tr>
          <tr><td class="name">高價住宅<small>台北市 7,000 萬、新北市 6,000 萬、其他 4,000 萬元以上</small></td><td>3 成</td><td>不得有</td></tr>
          <tr><td class="name">公司法人購置住宅</td><td>3 成</td><td>不得有</td></tr>
          <tr><td class="name">購地貸款（住宅區、商業區）</td><td>5 成，其中 1 成動工後才撥；須附興建計畫</td><td>—</td></tr>
          <tr><td class="name">餘屋貸款</td><td>3 成</td><td>—</td></tr>
          <tr><td class="name">工業區閒置土地抵押貸款</td><td>4 成（1 年內動工開發者除外）</td><td>—</td></tr>
          <tr><td class="name">都更、危老等配合政策的重建</td><td>排除適用</td><td>—</td></tr>
        </tbody>
      </table></div>
      <p class="src"><span class="hd hd-sys">制度</span>　中央銀行「對金融機構辦理不動產抵押貸款業務規定」。</p>
    </div></details>
    <details class="sub"><summary>上一輪的經驗，與央行自己列的「管制有效」證據</summary><div class="body">
      <ul class="list">
        <li>上一輪（2010–2016 年）：從最嚴到退場約 1.5–2 年，退場時房市已經冷了約 2 年。央行放寬是房市冷卻的確認，不是反轉的領先訊號。<span class="hd hd-unc">未確認</span>（上一輪細節為研究報告憑記憶整理）<span class="tag inf">推論</span></li>
        <li>無自用住宅者購屋貸款占比由 2020-12 的 50.35% 升到 2026-07 的 65.09%（7 兆 7,388 億元）。</li>
        <li>都更危老重建貸款占建築貸款 25.25%；預售屋解約率 2.24%；購置住宅與建築貸款逾放比率均為 0.08%；看跌房價的民眾比率（36%）高於看漲（27%）。</li>
        <li>高價住宅門檻不隨房價調整；近一年符合門檻的成交只占 1.55%（台北市 4.70%、台中市 3.07%、新竹縣市 2.64%）。</li>
        <li>央行總裁 9/17 說法：房價「確實有下降，但幅度有限」；央行關注的是信用資源不要過度集中，不是房價本身。</li>
      </ul>
    </div></details>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html" target="_blank" rel="noopener">中央銀行 2026-09-17 新聞稿</a>；<a href="https://www.cbc.gov.tw/tw/cp-4217-192880-d9bde-1.html" target="_blank" rel="noopener">對金融機構辦理不動產抵押貸款業務規定</a>；<a href="https://www.cbc.gov.tw/tw/cp-1123-175328-50554-1.html" target="_blank" rel="noopener">2024-09-19 新聞稿</a>；<a href="https://www.cbc.gov.tw/tw/cp-971-190952-05430-1.html" target="_blank" rel="noopener">2026-03-19 新聞稿</a>；<a href="https://www.cbc.gov.tw/tw/cp-357-189508-c6f08-1.html" target="_blank" rel="noopener">2025-12-18 新聞稿</a>。</p>
  </div>
</details>

<details class="blk" id="b2-cap">
  <summary><span class="h">銀行端的上限：72-2、集中度與 2024 年限貸令</span><span class="sum">法定上限還有約 3.8 兆元空間（估計），真正的約束是央行盯的集中度；2024 年成交急縮是因為銀行沒有額度。</span></summary>
  <div class="body">
    <p>結論：銀行借給房地產的錢有兩道上限。法律那一道（<a class="ind" data-ind="r72">銀行法 72-2 比率</a>）現在很寬：24.19%<span class="hd hd-off">官方</span>，離 30% 還有約 5.8 個百分點，約等於 <span class="num">3.8 兆元</span>的法定空間<span class="hd hd-est">估計</span>（64.84 兆元 ×（30%−24.19%））。真正在管的是央行那一道：<a class="ind" data-ind="conc">不動產放款集中度</a>與<a class="ind" data-ind="credit_ctrl">成數管制</a>。銀行不缺存款，缺的是央行願意讓它放給房市的額度。</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>比較項目</th><th>銀行法 72-2 比率</th><th>不動產放款集中度</th></tr></thead>
      <tbody>
        <tr><td class="name">分子</td><td>住宅建築及企業建築放款（排除都更危老、社宅、2025-09 起新撥的新青安等）</td><td>購置住宅＋房屋修繕＋建築貸款</td></tr>
        <tr><td class="name">分母</td><td>存款＋金融債（64.84 兆元）</td><td>總放款（44.57 兆元）</td></tr>
        <tr><td class="name">誰在管</td><td>法律上限 30%，每家銀行各自計算；金管會每月公布</td><td>央行沒有公布目標值，用約談與道德勸說（不是正式規定，但銀行會配合）</td></tr>
        <tr><td class="name">2026-07 讀數</td><td>24.19%，連 14 個月下滑，2011-01 以來最低</td><td>34.44%</td></tr>
        <tr><td class="name">近期高點</td><td>26.82%（2024-09）</td><td>37.61%（2024-06）；歷史高點 37.9%</td></tr>
        <tr><td class="name">分子金額</td><td>15.69 兆元（36 家本國銀行）</td><td>15.35 兆元（全體銀行）</td></tr>
      </tbody>
    </table></div>
    <figure class="chart" data-chart="b2_conc"></figure>
    <p><b>兩個比率下降，主要都是分母變大。</b>72-2 的分母是存款：<a class="ind" data-ind="exports">出口</a>暢旺、股市大漲帶進大量存款（7 月不動產放款月增 0.45%，存款加金融債月增 1.15%）。集中度的分母是總<a class="ind" data-ind="loans">放款</a>：2026 年 3 月底到 7 月底不動產貸款還增加 1,718 億元，但其他放款增加 1 兆 7,082 億元（年增率由 1 月 7.56% 升到 7 月 14.31%）。哪天企業放款需求降下來，集中度會自己回升，央行的放寬空間就變小。<span class="tag inf">推論</span></p>
    <div class="how"><span class="lbl">怎麼讀</span>72-2：全體平均 26% 以上偏緊；個別銀行 28% 以上幾乎停收新件，實務上 27–28% 就自我設限，因為存款流失時比率會被動上升。現在超過 28% 的銀行 0 家、27–28% 只有 1 家。集中度：接近 37–38% 是歷史高檔；下降時要拆開看分子與分母。</div>
    <div class="note"><b>2024 年「限貸令」的教訓</b>　2024 年讓成交量急縮的不是升息，也不只是第 7 次管制，而是銀行沒有額度可放：當年 8 月有 21 家銀行的 72-2 比率超過 26%。這是供給面的衝擊，買方有錢、有意願也貸不到，從房價與利率事前看不出來，只能從 72-2 超過 26%、28% 的家數與集中度看出來。<span class="tag inf">推論</span></div>
    <details class="sub"><summary>2024 年下半年「限貸令」的經過（5 步）</summary><div class="body">
      <ol class="steps">
        <li>2023-08 新青安上路後房貸暴增。2024-08 底<a class="ind" data-ind="hloan">房貸</a>年增 11.0%、集中度 37.5%；33 家本國銀行中有 21 家的 72-2 比率超過 26%。</li>
        <li>2024-08 中旬，央行逐一約談 34 家銀行，要求提出 2024Q4–2025Q4 的不動產貸款總量自主管理方案。銀行隨即排隊撥款、提高利率、降低成數、優先承作首購，媒體稱為「限貸令」（各銀行具體措施為媒體整理<span class="hd hd-est">估計</span>）。</li>
        <li>2024-09-19 第 7 次信用管制加調升存款準備率。隔天建材營造類股指數單日 −6.26%，同日加權指數 +0.53%<span class="hd hd-mkt">市場</span>。</li>
        <li>2025-09 起，新撥的新青安貸款自 72-2 分子排除；到 2026-06 排除額 2,397 億元。把 2025-09 至 2026-07 累計約 2,800 億元的排除額加回去，7 月比率約 24.63%。</li>
        <li>2025-12-18 央行宣布 2026 年起總量管理回歸銀行內部控管，但要月報、持續金檢。</li>
      </ol>
      <p>72-2 歷史對照：2010 年底 23.99%、2019 年底 26.6%、2024-09 高點 26.82%、2025-01 為 26.44%、2025-08 為 25.89%、2026-01 為 25.29%、2026-07 為 24.19%。</p>
    </div></details>
    <p>銀行整體有多少錢、總共可以借多少（存放比、資本、央行定存單），見<a href="#/local">本地有多少</a>。</p>
    <p class="src">來源：<a href="https://law.moj.gov.tw/LawClass/LawSingle.aspx?media=print&amp;pcode=G0380001&amp;flno=72-2" target="_blank" rel="noopener">銀行法第 72 條之 2</a>；金管會銀行局（<a href="https://money.udn.com/money/story/5613/9716341" target="_blank" rel="noopener">經濟日報 2026-09-01 報導</a>）；<a href="https://www.cbc.gov.tw/dl-208899-2545f928a4d342c5b5b2f33e36b620c8.html" target="_blank" rel="noopener">中央銀行 2024-09 參考資料</a>；<a href="https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20260918&amp;type=IND&amp;response=json" target="_blank" rel="noopener">證交所每日收盤指數</a>。</p>
  </div>
</details>

<details class="blk" id="b2-qingan">
  <summary><span class="h">新青安到青安 3.0</span><span class="sum">新青安 3 年撥出約 1.34 兆元，是 2023–24 年房市再升溫的最大單一推力；3.0 加了排富與房價上限，推力變小。</span></summary>
  <div class="body">
    <p>結論：政策性優惠房貸是這一輪房貸成長的主要來源，而且條件已經收緊。新青安（青安 2.0）從 2023-08 到 2026-07 共撥出 17 萬 1,705 戶、約 <span class="num">1 兆 3,411 億元</span><span class="hd hd-off">官方</span>（財政部，約 2026-07），占<a class="ind" data-ind="hloan">房貸餘額</a>的 13.62%（2026-06，央行）。2024 年<a class="ind" data-ind="newmort">五大銀行新承做房貸</a>年增 51.7%，主要就是它。<span class="tag inf">推論</span></p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>項目</th><th>新青安（青安 2.0）</th><th>青安 3.0</th></tr></thead>
      <tbody>
        <tr><td class="name">期間</td><td>2023-08-01 至 2026-07-31（已屆期）</td><td>2026-08-01 至 2029-07-31</td></tr>
        <tr><td class="name">額度</td><td>1,000 萬元</td><td>一般 1,000 萬元；新婚 2 年內 1,200 萬元；育有未成年子女 1,500 萬元</td></tr>
        <tr><td class="name">年限／寬限期／成數</td><td>40 年／5 年／最高 8 成</td><td>相同</td></tr>
        <tr><td class="name">利率</td><td>補貼後最低 1.775%</td><td>前 3 年 1.775%；第 4 年 1.9%、第 5 年 2.025%、第 6 年 2.15%；第 7 年起回到 2.275%</td></tr>
        <tr><td class="name">門檻</td><td>無排富</td><td>未滿 50 歲且年齡加貸款年限不超過 80；本人年所得 200 萬元以下；房價上限台北市 3,500 萬、新北市與新竹縣市 2,500 萬、其他縣市 2,000 萬元；限貸一次、自住切結</td></tr>
        <tr><td class="name">成果</td><td>17 萬 1,705 戶、約 1 兆 3,411 億元</td><td>上路首月（2026-08）：一銀逾 31 億元、合庫約 39 億元</td></tr>
      </tbody>
    </table></div>
    <p>機制：40 年期加 5 年寬限期，讓月付金在前 5 年只有利息，買方能負擔的總價因此變高；補貼利率又低於一般房貸。3.0 改成補貼逐年退場、排富、設房價上限、一生一次，能適用的買方與產品都變少。以新竹為例，2,500 萬元房價上限對上竹北預售均價每坪約 69 萬元，約 36 坪（含車位更少）就超過；房仲也說符合 3.0 條件的買方多在中南部。<span class="tag inf">推論</span></p>
    <div class="blind"><b>盲點</b>　新青安的 5 年寬限期，最早一批在 2028-08 起陸續到期、開始還本（研究報告依上路日推算<span class="hd hd-est">估計</span>）；2023–24 年高點進場、只付利息的買方，屆時月付金會跳升。目前的訊號：2026-07 底購置住宅貸款的逾放（逾期沒繳的貸款）餘額 94.25 億元、月增 7.8 億元，是 2021-04 以來新高；逾放比率 0.08%，仍很低。金管會的說法是沒有證據顯示逾放增加與台股震盪有關。趨勢比水準重要，見<a class="ind" data-ind="npl">逾放比</a>。<span class="tag add">補充</span></div>
    <p>另一個連動：2025-09 起，新撥的新青安貸款不計入 <a class="ind" data-ind="r72">72-2 比率</a>的分子，到 2026-06 排除額 2,397 億元。這讓銀行的法定比率下降，但不代表房貸變少。</p>
    <p class="src">來源：<a href="https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=482aa9c142b34abc83750cb64c15cb11" target="_blank" rel="noopener">財政部 2026-07-16 新聞稿</a>；<a href="https://www.cw.com.tw/article/5142027" target="_blank" rel="noopener">天下雜誌（引財政部）</a>；<a href="https://money.udn.com/money/story/5613/9716250" target="_blank" rel="noopener">經濟日報（金管會逾放說明）</a>；<a href="https://www.ctee.com.tw/news/20260913700033-430601" target="_blank" rel="noopener">工商時報 2026-09-13</a>。</p>
  </div>
</details>

<details class="blk" id="b2-volprice">
  <summary><span class="h">量、價、庫存</span><span class="sum">量先動、價最慢：2025 年買賣移轉 26.1 萬棟（−25.5%），房價只小跌；成屋回檔、新案幾乎沒跌。</span></summary>
  <div class="body">
    <p>結論：成交量在歷史上偏冷的區間已經停了一年多，價格卻只小幅回落，而且成屋與新案走向不同。2025 年全國<a class="ind" data-ind="transfers">建物買賣移轉棟數</a> 261,308 棟、年減 25.5%<span class="hd hd-off">官方</span>，近 9 年最低（2024 年 35.1 萬棟是高峰）；同一年信義房價指數 2025Q4 年跌僅約 3.7%，2026Q2 年增率又轉正為 +2.66%<span class="hd hd-mkt">市場</span>。</p>
    <p>機制：賣方不缺錢就不降價，先縮的是成交量；量縮久了價格才鬆動，通常領先 2–4 季。所以判讀順序是先看量，再看議價率與待售量，最後才是<a class="ind" data-ind="hprice">房價指數</a>。</p>
    <h4>量</h4>
    <ul class="list">
      <li>門檻：全國年量 30 萬棟是業界慣用的分界<span class="hd hd-est">估計</span>；35 萬棟算熱；25–26 萬棟算冷（2001 年 25.9 萬、2016 年 24.5 萬、2025 年 26.1 萬棟）。</li>
      <li>2026 年 1–7 月 15.10 萬棟（−2.0%）；7 月 26,404 棟（+10.4%）是青安 2.0 截止前趕件，8 月六都 15,723 棟又轉為年減 5.6%。公股銀行估全年 25–26 萬棟<span class="hd hd-est">估計</span>。</li>
      <li>移轉棟數含幾年前賣掉的預售屋交屋。現在的買氣要看推案與預售：國泰房地產指數 2026Q2 推案戶數年減 31.6%、議價率 7.17%<span class="hd hd-mkt">市場</span>；預售屋解約 2026 年 1–7 月 3,457 件，高於上年同期 1,906 件<span class="hd hd-off">官方</span>。</li>
    </ul>
    <h4>價：四種指數，四種答案</h4>
    <div class="tbl-wrap"><table>
      <thead><tr><th>較高點跌幅</th><th class="n">信義（成屋）</th><th class="n">永慶（成屋）</th><th class="n">內政部</th><th class="n">國泰（新案）</th></tr></thead>
      <tbody>
        <tr><td class="name">全國</td><td class="n">−0.4%</td><td class="n">−5.3%</td><td class="n">−4.7%</td><td class="n">−0.5%</td></tr>
        <tr><td class="name">台北市</td><td class="n">創新高</td><td class="n">−5.1%</td><td class="n">創新高</td><td class="n">創新高</td></tr>
        <tr><td class="name">新北市</td><td class="n">−3.3%</td><td class="n">−4.5%</td><td class="n">−1.9%</td><td class="n">−2.3%</td></tr>
        <tr><td class="name">桃園市</td><td class="n">−3.8%</td><td class="n">−5.9%</td><td class="n">−3.2%</td><td class="n">−2.9%</td></tr>
        <tr><td class="name">新竹縣市</td><td class="n">−6.2%</td><td class="n">−6.4%</td><td class="n">創新高</td><td class="n">創新高</td></tr>
        <tr><td class="name">台中市</td><td class="n">−8.4%</td><td class="n">−7.9%</td><td class="n">−7.9%</td><td class="n">−8.7%</td></tr>
        <tr><td class="name">台南市</td><td class="n">−6.9%</td><td class="n">−8.6%</td><td class="n">−5.6%</td><td class="n">−3.7%</td></tr>
        <tr><td class="name">高雄市</td><td class="n">−9.6%</td><td class="n">−9.5%</td><td class="n">−8.3%</td><td class="n">創新高</td></tr>
      </tbody>
    </table></div>
    <p class="src">2026Q2（內政部為 2026Q1），央行 9/17 參考資料整理<span class="hd hd-mkt">市場</span>。</p>
    <p>同一個城市，四個指數說法不同，這本身就是重點：各都會區的成屋指數多已較高點回落約 3–10%，新案幾乎沒跌，因為建商成本墊高、又不缺資金。央行統計 2020Q4 到 2026Q2 新推案價格漲 71.4%，營造工程物價只漲 29.3%。</p>
    <h4>庫存</h4>
    <p>眼前供給多、三年後供給少。<span class="tag inf">推論</span>待售新成屋（建商蓋好還沒賣掉的）2025Q4 為 11 萬 2,501 宅<span class="hd hd-off">官方</span>，統計以來最高；但 2025 年建照面積 −17.45%、土地移轉 −24.44%，建商已經少蓋。餘屋貸款只能貸 3 成（見<a class="ind" data-ind="credit_ctrl">信用管制</a>），資金壓力集中在中南部與重劃區的中小建商，是價格最可能先鬆動的地方。</p>
    <details class="sub"><summary>庫存與負擔能力的細項</summary><div class="body">
      <ul class="list">
        <li>待售新成屋 11 萬 2,501 宅，比 2021Q4 多 61.4%；2025 年建物第一次登記 176,690 棟，近 10 年最高；2026Q2 推案戶數年減 31.6%、30 天銷售率 5.95%。</li>
        <li>低度使用（用電）住宅：2025 下半年 89 萬 4,582 宅、9.4%，比 2024 年同期低 0.4 個百分點。量縮而空屋沒增加，代表持有者不缺錢、不急賣。<span class="tag inf">推論</span></li>
        <li>新建案加中古屋的市場待售量：2026-05 底約 30 萬戶，歷史新高<span class="hd hd-est">估計</span>（樂居網）。</li>
        <li>全國房價所得比由 2024Q3 高點 10.8 倍降到 2026Q1 的 9.5 倍，台北市 14.7 倍；全國貸款負擔率 2025Q4 為 40.75%、台北市 63.92%<span class="hd hd-off">官方</span>。下降主要來自所得更新與房價小跌，不是房子便宜了很多。</li>
      </ul>
    </div></details>
    <details class="sub"><summary>稅制：短期買賣的路幾乎都封了</summary><div class="body">
      <ul class="list">
        <li>囤房稅 2.0<span class="hd hd-sys">制度</span>：2024-07-01 施行、2025-05 首次開徵。非自住住家用房屋改全國歸戶、稅率 2%–4.8%；全國單一自住降為 1%；建商餘屋在 2 年合理銷售期間內 2%–3.6%。</li>
        <li>房地合一稅 2.0<span class="hd hd-sys">制度</span>：2021-07-01 起，個人持有 2 年內稅率 45%、2–5 年 35%；預售屋與實質移轉房地的股權交易納入。持有 5–10 年 20%、超過 10 年 15% 這兩個稅率<span class="hd hd-unc">未確認</span>。</li>
        <li>平均地權條例修正（2023-07-01 起預售屋禁止換約轉售、私法人購屋許可制）<span class="hd hd-unc">未確認</span>（研究報告憑記憶，未查證條文）。</li>
        <li>讀法：投機退場後，賣壓不會來自短線客拋售，而是來自交屋時貸不到款的預售買方（看解約數）與餘屋壓力大的建商。<span class="tag inf">推論</span></li>
      </ul>
    </div></details>
    <details class="sub"><summary>新竹與竹北：全國數字不能直接套用</summary><div class="body">
      <p>2026Q2 信義指數全國年增 +2.66%、新竹 +3.16%、台中 −4.47%、高雄 −3.25%。信義指數以 2016Q1 為 100，新竹 248.67 是各都最高（台北 144.48）。國泰指數新竹縣市新案每坪 63.80 萬元、單季 +9.72%，創新高；591 新建案統計 2026 上半年竹北預售均價每坪 68.85 萬元、年增 23.4%，十大預售熱區漲幅第一<span class="hd hd-est">估計</span>。但同一時間信義、永慶的新竹成屋指數已較高點回落約 6%。新竹是「新案創高、成屋回檔」的市場，主要看科技業<a class="ind" data-ind="wages">薪資</a>與就業，和全國的信用循環只有部分同步。<span class="tag inf">推論</span></p>
    </div></details>
    <p class="src">來源：<a href="https://www.moi.gov.tw/News_Content.aspx?n=4&amp;s=339138" target="_blank" rel="noopener">內政部統計通報 2026-06-20</a>；<a href="https://www.sinyinews.com.tw/quarterly" target="_blank" rel="noopener">信義房價指數</a>；<a href="https://www.cathay-red.com.tw/Content/Upload/files/about/about-house/news/2026/115news_Q2.pdf" target="_blank" rel="noopener">國泰房地產指數 2026Q2</a>；<a href="https://www.cna.com.tw/news/afe/202607200302.aspx" target="_blank" rel="noopener">中央社 2026-07-20（待售新成屋、低度使用住宅）</a>；<a href="https://www.mof.gov.tw/house/multiplehtml/fb9a2a1b9efa426bb0cc7802e1a8da91" target="_blank" rel="noopener">財政部房屋稅 2.0 專區</a>。</p>
  </div>
</details>

<details class="blk" id="b2-pool">
  <summary><span class="h">房地產的規模有多大：跟股市、存款比</span><span class="sum">存量上與股市同一量級；流量上房市一年成交約 4 兆元（估計），只等於台股 4–5 個交易日。</span></summary>
  <div class="body">
    <p>結論：房地產是存量很大、換手很慢的資產。存量上，全國土地加房屋是國富毛額 330.11 兆元（2024 年底）<span class="hd hd-off">官方</span>裡最大的一塊，研究報告估計在百兆元以上<span class="hd hd-est">估計</span>；2026 年台股大漲後，上市<a class="ind" data-ind="mcap">總市值</a> 154.32 兆元（2026-09-18）已經追到同一個量級。流量上差很多：房市一年的成交金額約 4 兆元<span class="hd hd-est">估計</span>，只相當於台股 4–5 個交易日的<a class="ind" data-ind="turnover">成交值</a>（9 月日均約 8,750 億元）。</p>
    <figure class="chart" data-chart="b2_pool"></figure>
    <p>機制：流量小不代表不重要。買房的每一塊自備款，幾乎都帶著 3–4 倍的銀行貸款（貸 7–8 成），而且一借就是 20–40 年，賣不掉也不能很快停損。股市的錢一天可以換手近兆元，房市的錢進去就很難出來，所以房市對銀行體系的影響比股市大，央行才用<a class="ind" data-ind="conc">集中度</a>來管。<span class="tag inf">推論</span></p>
    <ul class="list">
      <li>成交金額怎麼估的：2025 年 26.1 萬棟 × 聯徵中心新增房貸樣本平均鑑估值約 1,500 萬元 ≈ 4 兆元；2024 年熱絡期約 5 兆元。沒有用實價登錄總額驗證。</li>
      <li>家庭部門持有的房地產金額<span class="hd hd-unc">未確認</span>（主計總處國富統計表 6 未能讀取）；家庭部門淨值 183.70 兆元（2024 年底）見<a class="ind" data-ind="wealth">國富統計</a>。</li>
      <li>房貸 11.89 兆元 ÷ <a class="ind" data-ind="m2">M2</a> 70.22 兆元 ≈ 17%；不動產貸款 ÷ M2 ≈ 22%。</li>
      <li>銀行端粗估<span class="hd hd-est">估計</span>：總放款 44.57 兆元 ÷ 本國銀行存款加金融債 64.84 兆元 ≈ 69%（口徑不同，只看量級）；沒貸出去的部分主要放在<a class="ind" data-ind="ncd">央行定存單</a>、債券與準備金。整體的<a class="ind" data-ind="ldr">存放比</a>見<a href="#/local">本地有多少</a>。</li>
    </ul>
    <p>所有去向放在一起比的圖，在<a href="#/dest">錢去哪裡</a>的總覽分頁。</p>
    <details class="sub"><summary>營建類股：大盤漲 62.9% 的一年，它是負報酬</summary><div class="body">
      <div class="tbl-wrap"><table>
        <thead><tr><th>日期</th><th class="n">建材營造類指數</th><th class="n">加權指數</th><th>備註</th></tr></thead>
        <tbody>
          <tr><td>2023-12-29</td><td class="n">430.66</td><td class="n">17,930.81</td><td></td></tr>
          <tr><td>2024-08-21</td><td class="n">651.36</td><td class="n">—</td><td>2024 年高檔區</td></tr>
          <tr><td>2024-09-20</td><td class="n">589.73（−6.26%）</td><td class="n">22,159.42（+0.53%）</td><td>第 7 次管制生效日</td></tr>
          <tr><td>2024-12-31</td><td class="n">541.98</td><td class="n">23,035.10</td><td>營建全年 +25.8%</td></tr>
          <tr><td>2025-12-31</td><td class="n">489.47</td><td class="n">28,963.60</td><td>營建全年 −9.7%；大盤 +25.7%</td></tr>
          <tr><td>2026-09-18</td><td class="n">467.39（+2.45%）</td><td class="n">47,180.75</td><td>今年以來營建 −4.5%；大盤 +62.9%；金融 +51.1%</td></tr>
        </tbody>
      </table></div>
      <p>營建類股反映的是利率、信用管制與推案認列，不是整體景氣：<a class="ind" data-ind="gdp">GDP</a> 兩位數成長的年份它仍是負報酬，自 2024-08-21 高檔以來約 −28%<span class="hd hd-mkt">市場</span>。它對政策事件很敏感（2024-09-20 單日 −6.26%），也比房價早 1–2 年見頂。類股之間的關係見<a href="#/sectors">板塊怎麼分</a>。<span class="tag inf">推論</span></p>
    </div></details>
    <p class="src">來源：<a href="https://www.stat.gov.tw/News_Content.aspx?n=2777&amp;s=236195" target="_blank" rel="noopener">主計總處國富統計（2026-04-29）</a>；<a href="https://www.cbc.gov.tw/tw/cp-302-191322-0bf1d-1.html" target="_blank" rel="noopener">中央銀行金融穩定報告第 20 期</a>；證交所每日收盤指數；總市值、成交值用本站共用數字。</p>
  </div>
</details>

<details class="blk" id="b2-lever">
  <summary><span class="h">家庭負債與理財週轉金：房子的錢會不會流去股市</span><span class="sum">會，而且是今年的淨方向：個人理財週轉金年增 32.35%，房貸只有 4.52%；央行把它和股市熱絡連在一起。</span></summary>
  <div class="body">
    <p>結論：房子與股市之間的錢是雙向流動的，今年的淨方向是從房子這一端往股市。<span class="tag inf">推論</span>依據是央行 9/17 的原話：「疫情期間資金多流向房市，房貸年增率達 7.08%～9.57%；本年房貸年增率已明顯降溫至 4.46%，惟股市交易熱絡帶動個人理財週轉金大幅成長。」</p>
    <div class="kpis">
      <div class="kpi"><span class="k">個人理財週轉金年增率</span><span class="v">32.35%</span><span class="d">2026-07；1–7 月平均 27.60%</span></div>
      <div class="kpi"><span class="k">同一項，2025-12</span><span class="v">24.38%</span><span class="d">央行 9/17 說明</span></div>
      <div class="kpi"><span class="k">同一項，2020–2022 年</span><span class="v">6.89%–10.73%</span><span class="d">2020 年 6.89%、2021 年 8.57%、2022 年 10.73%</span></div>
      <div class="kpi"><span class="k">對照：房貸年增率</span><span class="v">4.52%</span><span class="d">2026-07</span></div>
    </div>
    <p>機制：<a class="ind" data-ind="wm_loans">個人理財週轉金</a>是個人拿既有資產（多半是房子）當擔保，向銀行借出一筆可自由運用的錢<span class="hd hd-unc">未確認</span>（定義細節與餘額都沒查到）。它不算不動產貸款，所以<a class="ind" data-ind="hloan">房貸</a>看起來降溫的同時，家庭的槓桿可能正從這條路增加。反方向也有：央行官員說 2026-06 房貸增加的原因之一是「民眾股市獲利轉向買房」。</p>
    <div class="how"><span class="lbl">怎麼讀</span>和<a class="ind" data-ind="margin">融資餘額</a>（上市 5,940 億元，9/18）一起看，才是完整的股市槓桿：融資是向券商借，理財週轉金與信用貸款是向銀行借。其他個人消費性貸款（信貸等）1 兆 6,076 億元、年增 9.58%（2025 年底 7.24%），也在加速<span class="hd hd-off">官方</span>。央行金融穩定報告（2026-05）已把「融資餘額急增」列為風險來源。</div>
    <div class="blind"><b>盲點</b>　如果股市大幅修正，拿房子借錢買股的那一段槓桿會把壓力傳回房市與銀行：股票跌價使還款能力下降，擔保的房子就成為銀行的風險，會反映在<a class="ind" data-ind="npl">逾放比</a>。金管會目前的說法是房貸逾放上升「無證據與台股震盪有關」；是否另有正式示警<span class="hd hd-unc">未確認</span>。<span class="tag add">補充</span></div>
    <details class="sub"><summary>家庭負債的整體數字</summary><div class="body">
      <ul class="list">
        <li>家庭部門借款 25.29 兆元（2025 年底）、年增 6.68%，相當於 <a class="ind" data-ind="gdp">GDP</a> 的 88.06%（前一年 92.10%）；60.13% 用於購置不動產<span class="hd hd-off">官方</span>。</li>
        <li>還本付息 ÷ 可支配所得 49.63%；借款 ÷ 可支配所得 1.56 倍；逾放比率 0.15%。</li>
        <li>家庭淨值超過 GDP 的 7 倍（2024 年），高於美、英、星、韓，是央行認為風險可控的主要理由。</li>
        <li>消費者貸款合計 13 兆 9,452 億元（2026-07，年增 5.13%），購置住宅貸款占 85%；信用卡循環信用 1,179 億元、汽車貸款 2,593 億元。</li>
      </ul>
      <div class="mis"><b>常見誤讀</b>　「家庭負債 ÷ GDP 從 92% 降到 88%，家庭在還債」→ 是分母（GDP）變大。還本付息占可支配所得 49.63% 更貼近家戶的實際負擔：每賺 100 元有近 50 元在還債，國際上偏高。</div>
    </div></details>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/dl-227600-4c73575ef00a43c5bbfa0e9367497cbd.html" target="_blank" rel="noopener">中央銀行 2026-09-17 M2 說明</a>；<a href="https://www.cbc.gov.tw/tw/cp-302-191322-0bf1d-1.html" target="_blank" rel="noopener">金融穩定報告第 20 期</a>；中央銀行金融統計月報表 18。</p>
  </div>
</details>

<details class="blk" id="b2-rate">
  <summary><span class="h">利率環境</span><span class="sum">政策利率 2.00% 連續第 10 次不動，扣掉通膨後接近零；但新承做房貸利率已升到 2.29%，房市又受成數管制限制。</span></summary>
  <div class="body">
    <p>結論：借錢的成本扣掉通膨後仍然很低，這是資產價格容易上漲的環境；但這一輪低利率推升的是股市，不是房市，因為房市這條路被<a class="ind" data-ind="credit_ctrl">成數管制</a>與集中度要求限制住。<span class="tag inf">推論</span></p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>利率</th><th>讀數</th><th class="n">扣掉 8 月 CPI 年增 2.04% 後</th></tr></thead>
      <tbody>
        <tr><td class="name">央行重貼現率（即政策利率）<small>discount rate</small></td><td>2.00%（2026-09-17，2024-03 升半碼後連續第 10 次不動）</td><td class="n">−0.04%</td></tr>
        <tr><td class="name">台灣銀行一年期定存（固定）</td><td>1.700%（2026-09-19 牌告，2024-08-01 起未變）</td><td class="n">−0.34%</td></tr>
        <tr><td class="name">五大銀行新承做房貸利率</td><td>2.290%（2026-07）；2026-01 的 2.327% 是 2009 年初以來最高</td><td class="n">+0.25%</td></tr>
        <tr><td class="name">青安 3.0 補貼後利率</td><td>1.775%（前 3 年）</td><td class="n">−0.27%</td></tr>
      </tbody>
    </table></div>
    <p class="src">實質利率＝名目利率－通膨，為研究報告計算<span class="hd hd-est">估計</span>；名目利率為<span class="hd hd-off">官方</span>或銀行牌告。</p>
    <p>機制：實質利率（real interest rate）偏低會推升資產價格，原因有三。存款保不住購買力，錢會去找資產；房貸的實質負擔會被通膨與<a class="ind" data-ind="wages">薪資</a>成長稀釋，借得到的人傾向借滿、借長；資產價格是未來現金流的折現，折現率低，價格就高。2020–21 年是例子：五大銀行房貸利率 1.35–1.42%、<a class="ind" data-ind="cpi">CPI</a> 年增 2–3%，實質房貸利率為負，當時房貸年增 8.5–9.5%、建築貸款年增 14–20%。</p>
    <p>現在的不同：利率決定借錢的誘因有多強，信用管制決定房市這條路能借多少。誘因一樣強、房市被限制，資金就往別的去處走：<a class="ind" data-ind="wm_loans">個人理財週轉金</a>年增 32%、<a class="ind" data-ind="margin">融資餘額</a>急增、<a class="ind" data-ind="m2">M2</a> 年增 7.42%，超過央行 2.5–6.5% 的參考區間。<span class="tag inf">推論</span></p>
    <div class="mis"><b>常見誤讀</b>　「央行沒升息＝資金環境沒變」→ <a class="ind" data-ind="policy_rate">政策利率</a> 30 個月沒動，但<a class="ind" data-ind="newmort">新承做房貸利率</a>由 2023 年平均 2.064% 升到 2.3% 上下（銀行額度緊、存款準備率兩度調升墊高資金成本）、信用管制七度收緊再兩度放寬。台灣央行主要用「量」與選擇性管制做事，只盯重貼現率會漏掉大半訊息。</div>
    <p>接下來看什麼：9/17 會議已有 2 位理事主張升息；<a class="ind" data-ind="fed">聯準會</a> 9/16 升息 1 碼到 3.75–4.00%。央行預測 2026 年 CPI 2.03%、<a class="ind" data-ind="gdp">GDP</a> 成長 11.48%，2027 年 CPI 1.83%、GDP 5.82%。政策利率若上調，新承做房貸利率會跟著墊高；若只動成數，影響的是多屋族與建商。<span class="tag inf">推論</span></p>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html" target="_blank" rel="noopener">中央銀行 2026-09-17 新聞稿</a>；<a href="https://rate.bot.com.tw/twd?Lang=zh-TW" target="_blank" rel="noopener">台灣銀行牌告利率</a>；<a href="https://www.dgbas.gov.tw/News_Content.aspx?n=3602&amp;s=236675" target="_blank" rel="noopener">主計總處 2026-09-08 物價新聞稿</a>。</p>
  </div>
</details>

<details class="blk" id="b2-blind">
  <summary><span class="h">盲點與常見誤讀</span><span class="sum">八個最容易看錯的地方：存量與流量、分子與分母、全國與單一城市、放寬與全面放寬。</span></summary>
  <div class="body">
    <p>這一頁的數字大多是比率與存量，最常見的錯誤是沒分清楚「分子在動還是分母在動」「存量還是流量」。前七條整理自研究報告，第八條是使用者沒問到、但不看會誤判的事。</p>
    <div class="mis"><b>只看房價、不看量</b>　2025 年買賣移轉 −25.5%，信義房價指數 2025Q4 年跌僅約 3.7%。價格調整很慢：先看<a class="ind" data-ind="transfers">移轉棟數</a>，再看議價率與待售量，最後才是<a class="ind" data-ind="hprice">房價指數</a>。</div>
    <div class="mis"><b>把房貸餘額成長當成新流入的錢</b>　餘額＝新撥款－還本。2025 年五大銀行<a class="ind" data-ind="newmort">新承做房貸</a> −33.85%，<a class="ind" data-ind="hloan">房貸餘額</a>仍 +4.46%。看流量用新承做金額，看壓力才用餘額。</div>
    <div class="blind"><b>忽略建築貸款是領先指標</b>　這一輪<a class="ind" data-ind="cloan">建築貸款</a>年增率高點只有 4.72%（2024-10），2026-07 已是 −0.19%。要判斷房市回升，先看建築貸款與土地交易回升，不是看央行放寬。</div>
    <div class="blind"><b>忽略 72-2 是供給面的上限</b>　2024-08 有 21 家銀行的 <a class="ind" data-ind="r72">72-2 比率</a>超過 26%，買方有錢有意願也貸不到，從房價與利率看不出來。2026-07 沒有銀行超過 28%，額度已不是限制。</div>
    <div class="mis"><b>把集中度下降讀成房貸減少</b>　<a class="ind" data-ind="conc">集中度</a> 34.44%，媒體稱約 20 年低點<span class="hd hd-est">估計</span>，但不動產貸款 15.35 兆元是歷史新高。下降是因為分母（企業週轉金放款）膨脹；分母成長放慢時，比率會自己回升。</div>
    <div class="mis"><b>把全國數字套到單一城市</b>　2026Q2 信義指數全國 +2.66%、新竹 +3.16%、台中 −4.47%；竹北預售均價年增 23.4%，新竹成屋指數卻已較高點回落約 6%。各地的驅動因子不同。</div>
    <div class="mis"><b>以為放寬第 2 戶＝全面放寬</b>　9/17 只動了第 2 戶（6 成到 7 成，仍無寬限期）與購地貸款的動工切結；第 3 戶、法人、豪宅、餘屋仍是 3 成。受惠的是換屋與自住置產，不是投資客與建商。見<a class="ind" data-ind="credit_ctrl">信用管制</a>。</div>
    <div class="blind"><b>只看房市，沒看到錢已經換了去處</b>　<a class="ind" data-ind="wm_loans">個人理財週轉金</a>年增 32.35%，房貸年增 4.52%。2020–21 年的便宜資金去了房市，2025–26 年去了股市。房市信用指標現在的用途，是確認房市不是這一輪資金的主要去處，並盯兩個後續風險：2028-08 起新青安寬限期到期，以及預售屋交屋潮的解約與逾放（7 月房貸逾放餘額是 5 年新高，比率仍只有 0.08%）。<span class="tag add">補充</span><span class="tag inf">推論</span></div>
  </div>

<details class="blk" id="b3-ov-stock" open>
  <summary><span class="h">存量：每個去向現在放了多少錢</span><span class="sum">股票 154 兆、對外資產約 104 兆、存款 69 兆、壽險 39 兆元；TISA 與黃金 ETF 只有百億元級。</span></summary>
  <div class="body">
    <p>結論：用某一天的餘額（存量，<span class="en">stock</span>）來比，台灣的錢放最多的三個地方是股票、海外資產和銀行存款，接下來才是壽險、外幣存款、房貸與政府基金。常上新聞的 TISA 與黃金 ETF 小到在圖上幾乎看不見，這正是這張圖要傳達的事。圖上多數是官方統計 <span class="hd hd-off">官方</span>；全台對外資產的新台幣金額與投信跨國基金合計是本站換算或加總 <span class="hd hd-est">估計</span>。</p>

<details class="blk" id="b3-ov-flow">
  <summary><span class="h">流量：一年有多少錢在移動</span><span class="sum">放款一年增 5.2 兆、出海約 5 兆；房貸只增約 0.5 兆、普發現金 0.24 兆。排名和存量完全不同。</span></summary>
  <div class="body">
    <p>結論：一年的淨移動（流量，<span class="en">flow</span>）排名和存量不一樣。最大的兩條是<a class="ind" data-ind="loans">銀行放款</a>（本國銀行一年增加 5.2 兆元，至 2026-07）與民間把錢送到海外（2025 年<a class="ind" data-ind="fa">金融帳</a>淨流出 1,594 億美元，約 5 兆元）。<a class="ind" data-ind="hloan">房貸</a>一年只增加約 0.5 兆元（由餘額 11.89 兆元、年增 4.52% 反推 <span class="hd hd-est">估計</span>），普發現金約 0.24 兆元，TISA 上路第一年只有約 0.01 兆元。</p>

    <figure class="chart" data-chart="b3_flow"></figure>

    <div class="how"><span class="lbl">怎麼讀</span>各列的期間不一致（有的是 2025 全年，有的是 2026 年以來），所以只用來比數量級。錢的方向寫在每一列的名稱裡（買超、賣超、流出、贖回），長條只代表金額大小。各列有重疊，不可相加。美元項目用 1 美元＝31.8 元換算 <span class="hd hd-est">估計</span>。</div>

    <h4>為什麼存量和流量要分開看</h4>
    <p>存量的變動＝這段期間的淨流入＋價格變動＋匯率換算＋會計口徑調整。只有第一項是真的有錢移動。看到一個餘額變大或變小，要先問是哪一項造成的。下面五個都是 2025–2026 年的實例。</p>

    <div class="tbl-wrap"><table>
      <thead><tr><th>例子</th><th>存量怎麼變</th><th>真正的流量</th><th>差別來自</th></tr></thead>
      <tbody>
        <tr><td class="name">上市總市值</td><td>2025 年底 94.36 兆 → 2026-09-18 154.32 兆元，多約 60 兆元</td><td>同期<a class="ind" data-ind="fini_flow_twse">外資賣超</a> 1.41 兆元；<a class="ind" data-ind="inst">三大法人</a>以外買超約 1.61 兆元 <span class="hd hd-est">估計</span></td><td>價格：總市值＝最後成交價×全部股數</td></tr>
        <tr><td class="name"><a class="ind" data-ind="bond_etf">債券 ETF</a></td><td>6/26 的 2 兆 9,339 億 → 8/17 的 2 兆 6,929 億元，少 2,411 億元（櫃買口徑）</td><td>6 月淨贖回 602 億、7 月 444 億元；1–8 月累計淨贖回 503 億元</td><td>價格：美債殖利率走高，債券價格下跌</td></tr>
        <tr><td class="name"><a class="ind" data-ind="fxdep">外幣存款</a>（金管會口徑）</td><td>2026 上半年帳面增加 1.07 兆元</td><td>以美元計幾乎沒增加</td><td>匯率：美元升值，同一筆美元換算成更多新台幣</td></tr>
        <tr><td class="name"><a class="ind" data-ind="life_fx">壽險國外投資</a></td><td>2026 年 1 月單月少 8,306 億元</td><td>不是賣出海外債券</td><td>會計：接軌 IFRS 17 時的資產重分類</td></tr>
        <tr><td class="name">勞動基金</td><td>2026 年 1–7 月收益 1 兆 9,560 億元</td><td>不是現金流入；7 月單月回吐約 2,460 億元 <span class="hd hd-est">估計</span></td><td>價格：未實現的評價收益</td></tr>
      </tbody>
    </table></div>

    <h4>第三種數字：成交值</h4>
    <p>成交值既不是存量，也不是淨流量：買進和賣出都算，同一筆錢一年轉十次就算十次。<a class="ind" data-ind="subbrok">複委託</a> 2025 年成交 10.75 兆元，同年全台居民對外證券投資淨增加只有約 1.15 兆元 <span class="hd hd-est">估計</span>，而且那還包含壽險、銀行與基金。台股<a class="ind" data-ind="turnover">成交值</a>今年以來日均 1.0056 兆元，也是同一類數字：代表交易熱度，不代表有多少錢流進來。</p>

    <h4>2026 年流量的三個變化</h4>
    <ul class="list">
      <li><b>出海沒有變慢</b>：2026 上半年金融帳淨流出 1,181 億美元（約 3.76 兆元），幾乎等於同期<a class="ind" data-ind="ca">經常帳順差</a> 1,210 億美元；央行準備資產反而減少 38.7 億美元。<span class="hd hd-off">官方</span></li>
      <li><b>企業直接投資倍增</b>：1–8 月核准<a class="ind" data-ind="fdi_out">對外直接投資</a> 623.9 億美元（約 1.98 兆元），是 2025 全年的 1.6 倍，約八成是台積電（2330）兩筆增資。</li>
      <li><b>保費大增，但賣的商品換了</b>：1–8 月<a class="ind" data-ind="fyp">初年度保費</a> 1 兆 542 億元，已超過 2025 全年；其中投資型保單年增 135%，這些錢進的是基金，不是壽險公司的一般帳戶。</li>
    </ul>

    <p class="src">來源：<a href="https://www.cbc.gov.tw/tw/cp-302-192739-2cf64-1.html" target="_blank" rel="noopener">央行 2026 年第 2 季國際收支</a>、<a href="https://www.ctee.com.tw/news/20260911700589-430301" target="_blank" rel="noopener">工商時報轉述金管會 7 月存放款</a>、<a href="https://money.udn.com/money/story/10869/9756269" target="_blank" rel="noopener">經濟日報 1–8 月核准對外投資</a>、<a href="https://www.cna.com.tw/news/afe/202609160352.aspx" target="_blank" rel="noopener">中央社 1–8 月壽險保費</a>、<a href="https://www.ctee.com.tw/news/20260918701655-430403" target="_blank" rel="noopener">工商時報 ETF 資金流</a>。</p>
  </div>
</details>

<details class="blk" id="b3-ov-chain">
  <summary><span class="h">哪些去向其實是同一筆錢</span><span class="sum">出口賺的錢只有三個去處；保費、壽險、海外債券是同一筆錢的三個階段，所以各列不能相加。</span></summary>
  <div class="body">
    <p>結論：圖上的每一列不是互相獨立的池子。要分兩層看：總量層是國際收支的金融帳（流量）與國際投資部位（<span class="en">international investment position, IIP</span>，存量），代表全台灣對外投資的合計；管道層是「誰在買」——壽險、基金與 ETF、複委託、銀行、企業、政府基金。管道之間會重疊，所以不能相加。</p>

    <h4>一筆出口貨款的去處</h4>
    <ol class="steps">
      <li>出口商收到美元，這是<a class="ind" data-ind="ca">經常帳順差</a>的來源。收到的貨款只有約 2.2% 會立刻換成新台幣（<a class="ind" data-ind="fxsettle">出口貨款結售比例</a>）。</li>
      <li>這筆外匯只有三個去處：央行買走，變成<a class="ind" data-ind="reserves">外匯存底</a>；民間拿去買外國資產，記在<a class="ind" data-ind="fa">金融帳</a>；留在國內，成為新台幣存款或<a class="ind" data-ind="fxdep">外匯存款</a>。</li>
      <li>2025 年的實際分配：順差 1,844 億美元，民間送出 1,594 億美元，外匯存底只增加約 200 億美元（三者的差額是資本帳與統計誤差）。<span class="hd hd-off">官方</span></li>
    </ol>

    <h4>一筆家庭儲蓄的去處</h4>
    <ol class="steps">
      <li>家庭買儲蓄型保單，第一年繳的保費就是<a class="ind" data-ind="fyp">初年度保費</a>（2025 年 1 兆 74 億元）。</li>
      <li>傳統型與利變型的保費進壽險公司的一般帳戶；投資型的保費進保戶自己選基金的專設帳簿，會出現在<a class="ind" data-ind="funds">基金</a>的統計裡。</li>
      <li>壽險把約三分之二的可運用資金換成美元買長天期債券（<a class="ind" data-ind="life_fx">壽險國外投資</a> 22.2 兆元，2026-04）。壽險另外還買在台灣掛牌、用新台幣計價的<a class="ind" data-ind="bond_etf">債券 ETF</a>：統計上算國內投資，但錢最後一樣是去買美元債。</li>
      <li>這些買進，連同銀行、基金、<a class="ind" data-ind="subbrok">複委託</a>的淨買進，合計記為金融帳的「居民對外證券投資」，再累積成全台對外資產（2025 年底 3 兆 2,670 億美元）。</li>
    </ol>
    <div class="note">同一筆錢會依序出現在「保費」「壽險總資產」「壽險國外投資」「居民對外證券投資」「全台對外資產」五個統計裡。把它們相加，就是把同一筆錢算了五次。</div>

    <div class="tbl-wrap"><table>
      <thead><tr><th>大的一列</th><th>裡面已經包含</th></tr></thead>
      <tbody>
        <tr><td class="name">全台對外資產 約 104 兆元</td><td>央行外匯存底（6,019 億美元，2026-08）、壽險國外投資、基金與複委託的海外部位、企業的海外子公司與應收帳款</td></tr>
        <tr><td class="name">壽險業總資產 38.7 兆元</td><td>壽險國外投資 22.2 兆元；壽險手上的債券 ETF（估約四到六成的債券 ETF 在壽險手上 <span class="hd hd-unc">未確認</span>）</td></tr>
        <tr><td class="name">國人持有境外基金 5.32 兆元</td><td>投資型保單連結的部位（帳上掛在法人名下的 2 兆 712 億元的一部分）</td></tr>
        <tr><td class="name">投信跨國投資基金 約 5.33 兆元</td><td>債券 ETF 2.81 兆元</td></tr>
        <tr><td class="name">外幣存款 16.5 兆元（金管會口徑）</td><td>外匯存款 9.6 兆元（央行口徑）；多出來的是國際金融業務分行（OBU）與海外分行</td></tr>
        <tr><td class="name">金融帳淨流出（流量）</td><td>居民對外證券投資、<a class="ind" data-ind="fdi_out">對外直接投資</a>、其他投資（企業的海外應收帳款與存款）</td></tr>
      </tbody>
    </table></div>

    <h4>把去向分成三層 <span class="tag inf">推論</span></h4>
    <p>主要去向只有一個：出海，一年約 5 兆元；過去主要靠壽險買美元債，2025–2026 年新增的流量改由企業與銀行承接。第二層留在國內：政府基金、外幣存款、<a class="ind" data-ind="settle_dep">證券劃撥存款</a>、公債。第三層金額很小、但常上新聞：普發現金、TISA、黃金 ETF、加密資產；這一層值得追的是制度會不會讓它變大，而不是現在的金額。</p>
    <p>每一條管道的細節在本房間的「海外・保險・其他」分頁；錢怎麼進來見<a href="#/inflow">錢從哪來</a>，國內各個資金池見<a href="#/local">本地有多少</a>。</p>
  </div>
</details>

<template id="tpl-B3-room"><div class="room-lede">
  <p class="verdict">股市、房市、銀行之外，最大的去向是海外。2025 年民間經<a class="ind" data-ind="fa">金融帳</a>送到國外 <span class="num">1,594 億美元</span>（約 5 兆元），2026 年上半年又送出 1,181 億美元。壽險、基金與 ETF、複委託、銀行買外國債券、企業直接投資，都是「錢怎麼出海」的不同管道，彼此重疊，不能相加。</p>
  <ul class="takeaways">
    <li><b>最大的管道是壽險，但它不再變大</b>：<a class="ind" data-ind="life_fx">壽險國外投資</a> 22.2 兆元（2026-04），2024 年底是 23.03 兆元；2026 年新增的出海主力換成銀行與企業。</li>
    <li><b>新台幣急升會傷到壽險</b>：負債是新台幣、資產六成多是美元。<a class="ind" data-ind="usdtwd">匯率</a>在 2025 年 5 月單月升 6.98%，壽險當月淨匯損 1,455 億元。</li>
    <li><b>散戶看得到的管道成長最快，量級小一級</b>：<a class="ind" data-ind="subbrok">複委託</a> 2026 年 1–7 月成交 11.3 兆元，但那是成交值；<a class="ind" data-ind="funds">境外基金</a>與投信跨國基金各約 5.3 兆元。</li>
    <li><b>企業也在出海</b>：2026 年 1–8 月核准<a class="ind" data-ind="fdi_out">對外直接投資</a> 623.9 億美元，約八成是台積電（2330）兩筆增資。</li>
    <li><b>常上新聞的項目金額很小</b>：普發現金約 0.24 兆元（預算案）、TISA 210.6 億元、黃金 ETF 約 140 億元（均為 2026 年 8–9 月）；加密資產沒有官方統計。</li>
  </ul>
</div>

  <div class="body">
    <p>直接回答你的問題：股市、房地產、銀行之外，還有三層去向。第一層是海外，量級最大；第二層留在國內，但不在那三塊裡；第三層金額很小，只是常上新聞。<span class="tag add">補充</span></p>
    <p>海外為什麼最大：台灣出口賺進來的外匯，遠多於國內花掉和投資掉的錢。這個差額在國民所得帳上叫<a class="ind" data-ind="excess_saving">超額儲蓄</a>，在國際收支（<span class="en">balance of payments</span>）上叫<a class="ind" data-ind="ca">經常帳順差</a>，講的是同一筆錢。它只有三個去處：央行買走變成<a class="ind" data-ind="reserves">外匯存底</a>、民間拿去買外國資產（記在金融帳）、留在國內變成存款。2025 年順差 1,844 億美元，民間送出 1,594 億美元，外匯存底只增加約 200 億美元 <span class="hd hd-off">官方</span>。所以看到「出口創新高」，就要同時想到：有差不多等量的錢必須在海外找地方放。</p>

<details class="blk" id="b3-life">
  <summary><span class="h">壽險業：台灣最大的海外投資人</span><span class="sum">國外投資 22.2 兆元，占可運用資金 66%，是境外基金的四倍多；但 2024 年底以來不增反減。</span></summary>
  <div class="body">
    <p>結論：台灣最大的對外證券投資人不是散戶、也不是投信，而是壽險。<a class="ind" data-ind="life_fx">壽險國外投資</a> 22 兆 1,947 億元（2026-04 月底），是國人持有<a class="ind" data-ind="funds">境外基金</a> 5.32 兆元的四倍多、<a class="ind" data-ind="bond_etf">債券 ETF</a> 2.81 兆元的八倍。但這個部位近兩年沒有再變大。</p>

    <div class="kpis">
      <div class="kpi"><span class="k">國外投資</span><span class="v">22.2 兆元</span><span class="d">占資金運用總額 66.03%；保險局，2026-04</span></div>
      <div class="kpi"><span class="k">資金運用總額</span><span class="v">33.6 兆元</span><span class="d">壽險可以拿去投資的錢；2026-04</span></div>
      <div class="kpi"><span class="k">壽險業資產總額</span><span class="v">38.7 兆元</span><span class="d">全站共用，2026 年中；保險局 4 月底為 38.2 兆元</span></div>
    </div>

    <dl class="ev3">
      <div><dt>機制</dt><dd>家庭買儲蓄險、利變型、美元保單，保費進壽險公司。壽險需要期限長、利率高於保單成本的資產，但國內的中央政府債務只有 5.97 兆元、10 年期公債殖利率約 1.92%（2026-09-18），國內的債不夠買、利率也不夠，只能換成美元去買美國公司債、金融債、公債，以及在台灣掛牌的外幣計價國際板債券（<span class="en">Formosa bonds</span>）。</dd></div>
      <div><dt>現在</dt><dd>2024 年底 23.03 兆元（占 70.47%）→ 2025 年底 22.77 兆元（68.33%）→ 2026-04 月底 22.19 兆元（66.03%）。其中 2026 年 1 月單月少 8,306 億元，主因是接軌 IFRS 17 的資產重分類，不是賣債。<span class="hd hd-off">官方</span></dd></div>
      <div><dt>判讀</dt><dd>壽險仍是存量最大的一條出海管道，但已經不是新增資金的主力。要判斷「錢是不是還在往外走」，不能只看壽險，要看<a class="ind" data-ind="fa">金融帳</a>的合計。<span class="tag inf">推論</span></dd></div>
    </dl>

    <div class="mis"><b>常見誤讀</b>　66% 和媒體常用的 58.7% 互相矛盾 → 講的是同一筆錢，只是分母不同：66% 是占資金運用總額，58.7%（2026-01）是占總資產。</div>

    <details class="sub"><summary>保費：錢從哪裡進壽險</summary><div class="body">
      <p>台灣人買保險，很大一部分其實是在存錢。<a class="ind" data-ind="fyp">初年度保費</a>（<span class="en">first-year premium, FYP</span>）是新賣出保單的第一年保費，代表進到保險這個管道的「新錢」，一年約 1 兆元；續年度保費只是舊保單的分期款。</p>
      <div class="tbl-wrap"><table class="narrow">
        <thead><tr><th>項目</th><th class="n">2025 全年</th><th class="n">2026 年 1–8 月</th></tr></thead>
        <tbody>
          <tr><td class="name">初年度保費</td><td class="n">1 兆 74 億元（+19.7%）</td><td class="n">1 兆 542 億元（+60%）</td></tr>
          <tr><td class="name">其中：傳統型（含利變型）</td><td class="n">5,840 億元（+16.5%）</td><td class="n">約 4,440 億元（+11%）</td></tr>
          <tr><td class="name">其中：投資型</td><td class="n">4,233 億元（+24.4%）</td><td class="n">6,102 億元（+135%）</td></tr>
          <tr><td class="name">總保費收入</td><td class="n">2 兆 6,239 億元（+7.5%）</td><td class="n">2 兆 1,953 億元（+28%）</td></tr>
        </tbody>
      </table></div>
      <p>2025 年的成長靠美元利變型保單；2026 年換成投資型保單帶動，1–8 月占新契約 58%，跟著股市熱度走。投資型的錢進的是保戶自己選基金的專設帳簿，不進壽險公司的一般帳戶，所以投資型大賣，不等於壽險有更多錢買美債。美元保單占新契約的比重 <span class="hd hd-unc">未確認</span>。</p>
      <div class="mis"><b>常見誤讀</b>　把總保費 2.6 兆元當成每年新流入 → 裡面包含舊保單的續年度保費（2026 年 1–8 月為 1 兆 1,410 億元），還要再扣掉保險給付與解約金；扣完之後的淨流入金額本次未查到。</div>
    </div></details>

    <p class="src">來源：<a href="https://www.ib.gov.tw/ch/home.jsp?id=48&amp;parentpath=0,4" target="_blank" rel="noopener">保險局 保險市場重要指標</a>、<a href="https://money.udn.com/money/story/5613/9381755" target="_blank" rel="noopener">經濟日報 2026-03-15（1 月國外投資）</a>、<a href="https://www.cna.com.tw/news/afe/202609160352.aspx" target="_blank" rel="noopener">中央社 2026-09-16（1–8 月保費）</a>、<a href="https://money.udn.com/money/story/5613/9270882" target="_blank" rel="noopener">經濟日報 2026-01-17（2025 全年保費）</a>。</p>
  </div>
</details>

<details class="blk" id="b3-lifefx">
  <summary><span class="h">新台幣升值為什麼會傷到壽險</span><span class="sum">負債是新台幣、資產是美元。避險比率降到 42.94%，改靠 1.08 兆元準備金，可承受約 12% 升值。</span></summary>
  <div class="body">
    <p>結論：壽險要賠給保戶的錢是新台幣，資產卻有六成多是美元，所以<a class="ind" data-ind="usdtwd">新台幣</a>急升就會出現匯損。2026 年起壽險少買避險，改用會計攤銷和準備金承擔匯率風險（見<a class="ind" data-ind="life_fx">壽險國外投資與避險</a>）。<span class="pill watch">留意</span> 依據：準備金可承受約 12% 升值、目前匯率在 31.8 元附近，壓力不大；但 2025 年 5 月單月就升了 6.98%，而且淨曝險比過去大。<span class="tag inf">推論</span></p>

    <div class="kpis">
      <div class="kpi"><span class="k">避險比率</span><span class="v">42.94%</span><span class="d">2026-07；2 月 45%、5 月 43.66%</span></div>
      <div class="kpi"><span class="k">海外投資淨曝險</span><span class="v">9 兆 417 億元</span><span class="d">2026-07</span></div>
      <div class="kpi"><span class="k">匯率準備金合計</span><span class="v">1 兆 833 億元</span><span class="d">外價金 7,182 億＋特別盈餘公積 3,651 億；2026-07</span></div>
      <div class="kpi"><span class="k">可承受的升值幅度</span><span class="v">約 12%</span><span class="d">約 3.8 元；3 月 10.6%、5 月 11.2%</span></div>
    </div>

    <p>機制：買美元債之前要把新台幣換成美元，做法有三種：換匯交易（<span class="en">currency swap, CS</span>，到期換回、要付成本）、無本金交割遠期外匯（<span class="en">NDF</span>），或不避險、靠外匯價格變動準備金（外價金）承擔。新台幣一升值，沒有避險的美元資產換回新台幣變少，帳上出現匯損、淨值下降；淨值掉，金控的獲利與配息能力下修，壽險型金控股價下跌。升值期間壽險若急著加做避險（賣遠期美元），又會再推升新台幣，形成自我加強。</p>
    <p>2025 年 5 月就是這樣：新台幣單月升 6.98%，壽險未避險部分兌換損失 9,327 億元，避險工具回沖 6,051 億元、再沖抵外價金 2,091 億元之後，淨匯損 1,455 億元（單月史上最大），淨值單月縮水 8.26%。<span class="hd hd-off">官方</span>（金管會數字，媒體轉述）</p>
    <figure class="chart" data-chart="b3_fxres"></figure>

    <div class="how"><span class="lbl">怎麼讀</span>先看避險比率（買了多少保護），再拿可承受的升值幅度和新台幣短期升幅比。粗估：淨曝險約 9 兆元，新台幣每升 1%，在攤銷與準備金沖抵之前的帳面兌換損失約 900 億元 <span class="hd hd-est">估計</span>。CS 成本大約等於台美利差（7 月年化 2.23%），所以<a class="ind" data-ind="fed">聯準會</a>升息、<a class="ind" data-ind="policy_rate">台灣央行</a>不動，避險就變貴。</div>

    <div class="mis"><b>常見誤讀</b>　新台幣貶值，壽險就賺匯差 → 新制下兌換利益要分年攤銷、還要提存外價金、再扣避險成本。2026 年第 1 季新台幣貶 1.69%，未避險兌換利益 965 億元，扣掉避險工具成本 380 億元、提存外價金 255 億元等之後，帳上反而是淨匯損 855 億元。</div>

    <details class="sub"><summary>2026 年起的三個制度改變，以及為什麼要改</summary><div class="body">
      <ul class="list">
        <li><b>IFRS 17 與新清償能力制度（TIS）</b>：2026-01-01 接軌，接軌時做了一次資產重分類。<span class="hd hd-sys">制度</span></li>
        <li><b>匯率會計新制</b>：長期持有、以攤銷後成本衡量的外幣債券，未實現兌換差額改成按剩餘年限直線攤銷，不再每月用即期匯率全額認列。金管會估每年可省約 900 億元避險成本。</li>
        <li><b>外價金 2.0</b>（2026-02-12）：負債項下分成波動準備金（有兌換利益就提存、有損失就沖抵，不設上限）與固定準備金（上限為淨曝險的 10%）；權益項下的特別盈餘公積也分成兩種。媒體估四種準備存足約需 7–8 年。</li>
      </ul>
      <p>為什麼要改：2019 年到 2025 年 10 月，壽險累計付出避險成本約 1.6 兆元，比同期稅後淨利 1.4 兆元還多；光 2025 年就是 2,922 億元，2026 年全年估 1,400–1,500 億元 <span class="hd hd-est">估計</span>。新制降低了這筆成本，結果是約 9 兆元的匯率曝險留在壽險的資產負債表上。因為會計口徑改變，2026 年前後的數字不能直接相比。</p>
    </div></details>

    <p class="src">來源：<a href="https://www.ctee.com.tw/news/20260902700074-439901" target="_blank" rel="noopener">工商時報 2026-09-02（7 月壽險損益與避險）</a>、<a href="https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202602120001&amp;dtable=News" target="_blank" rel="noopener">金管會 外價金新制</a>、<a href="https://www.ctee.com.tw/news/20250627700619-430301" target="_blank" rel="noopener">工商時報 2025-06-27（5 月匯損）</a>、<a href="https://udn.com/news/story/7239/9484044" target="_blank" rel="noopener">聯合報 2026-05-06（首季匯損）</a>。</p>
  </div>
</details>

<details class="blk" id="b3-person">
  <summary><span class="h">個人直接買海外：複委託與基金</span><span class="sum">複委託 2026 年 1–7 月成交 11.3 兆元，但那是成交值；境外基金與投信跨國基金各約 5.3 兆元。</span></summary>
  <div class="body">
    <p>結論：散戶直接出海有兩條路。一條是<a class="ind" data-ind="subbrok">複委託</a>（<span class="en">sub-brokerage</span>）買海外股票，成長最快，但公布的數字是成交值，不是流出金額。另一條是買<a class="ind" data-ind="funds">基金</a>：境外基金與投信發的跨國基金各約 5.3 兆元，近年新增的錢幾乎都去了投信發的 ETF。</p>

    <h4>複委託</h4>
    <p>投資人透過台灣券商下單，券商再委託國外券商買賣美股、海外 ETF 與海外債；錢從新台幣帳戶換匯後出去。2026 年 1–7 月成交 11.3 兆元（工商時報報導為 11.4 兆元），年增 109%，七個月就超過 2025 全年的 10.75 兆元；美國市場約占七成。<span class="hd hd-off">官方</span>（券商公會統計，媒體轉述）</p>
    <figure class="chart" data-chart="b3_subbrok"></figure>
    <div class="how"><span class="lbl">怎麼讀</span>看年增率，並和台股<a class="ind" data-ind="turnover">成交值</a>的年增率比，判斷散戶的注意力往哪邊移。2018 到 2025 年放大到近五倍，中間只有 2022 年（升息、美股走空）年減 14.8%，代表這條線會跟著美股行情縮回去。</div>
    <div class="mis"><b>常見誤讀</b>　複委託一年流出 10 兆元 → 10.75 兆元是買進加賣出的成交值，同一筆錢一年轉十次就算十次。真正的淨流出併在<a class="ind" data-ind="fa">金融帳</a>的「居民對外證券投資」裡：2025 全年約 362.6 億美元（約 1.15 兆元 <span class="hd hd-est">估計</span>），而且還包含壽險、銀行與基金。</div>
    <div class="blind"><b>盲點</b>　複委託沒有官方公布的庫存金額，只能把成交值當成「熱度」，不能和境外基金的持有金額放在同一根軸上比。股票、ETF、債券各占多少也 <span class="hd hd-unc">未確認</span>。<span class="tag add">補充</span></div>

    <h4>境外基金與投信發的基金</h4>
    <p>境外基金（<span class="en">offshore funds</span>）是國外資產管理公司發行、在台灣銷售的基金，2026-08 月底國人持有 5 兆 3,196 億元。投信發行的境內基金共 16 兆 4,457 億元，其中投資海外的類別合計約 5.33 兆元 <span class="hd hd-est">估計</span>（本站加總），最大的一塊是<a class="ind" data-ind="bond_etf">債券 ETF</a>。兩邊規模相當，但新增資金幾乎都進了投信發的 ETF（光是國內股票 <a class="ind" data-ind="etf">ETF</a> 就有 6.4 兆元），境外基金靠的是既有部位與配息再投入。</p>
    <figure class="chart" data-chart="b3_funds"></figure>
    <div class="mis"><b>常見誤讀</b>　境外基金的自然人持有只有 352 億元，所以散戶不買 → 散戶大多透過銀行的特定金錢信託買，帳上掛在銀行「綜合帳戶」名下的 3 兆 2,132 億元裡。</div>
    <div class="blind"><b>盲點</b>　帳上屬於「非綜合帳戶法人」的 2 兆 712 億元，有一大塊是<a class="ind" data-ind="fyp">投資型保單</a>的專設帳簿與全權委託帳戶，和保險重疊，不能和壽險的數字相加。<span class="tag add">補充</span></div>
    <p class="src">來源：<a href="https://www.twsa.org.tw/E01/E011.html" target="_blank" rel="noopener">券商公會 複委託統計</a>、<a href="https://www.cna.com.tw/news/afe/202608230027.aspx" target="_blank" rel="noopener">中央社 2026-08-23</a>、<a href="https://www.sitca.org.tw/ROC/Industry/IN3001.aspx?PGMID=IN0301" target="_blank" rel="noopener">投信投顧公會 境外基金統計</a>、<a href="https://www.sitca.org.tw/ROC/Industry/IN2001.aspx?PGMID=IN0201" target="_blank" rel="noopener">境內基金統計</a>。</p>
  </div>
</details>

<details class="blk" id="b3-bondetf">
  <summary><span class="h">債券 ETF：用新台幣買的美元債</span><span class="sum">規模 2.81 兆元（2026-08）；今年縮水主要是美債價格下跌，1–8 月淨贖回 503 億元，不到規模的 2%。</span></summary>
  <div class="body">
    <p>結論：2025–2026 年<a class="ind" data-ind="bond_etf">債券 ETF</a> 確實被贖回，但幅度要放對比例。2026 年 1–8 月累計淨贖回 503 億元，占 2.8 兆元規模不到 2%；規模縮水的大頭是美債價格下跌，不是資金出走。</p>

    <dl class="ev3">
      <div><dt>機制</dt><dd>台灣投信發行、在櫃買中心掛牌、用新台幣交易，但買的是美元計價的海外債券。所以它同時受兩件事影響：美債殖利率上升，債券價格下跌；<a class="ind" data-ind="usdtwd">新台幣</a>升值，換算回新台幣的淨值縮水。買家不只散戶，<a class="ind" data-ind="life_fx">壽險</a>是大買家（法規把新台幣計價的債券 ETF 視為國內投資，不占海外投資額度）。</dd></div>
      <div><dt>現在</dt><dd>投信公會口徑 2 兆 8,060 億元、103 檔（2026-08 月底）。櫃買口徑由 6/26 的 2 兆 9,339 億元降到 8/17 的 2 兆 6,929 億元，七週少 8.2%。資金流：6 月淨贖回 602 億元、7 月淨贖回 444 億元、8 月轉為淨申購 226 億元；對照同期股票 <a class="ind" data-ind="etf">ETF</a> 1–8 月淨申購 1 兆 3,483 億元。<span class="hd hd-mkt">市場</span></dd></div>
      <div><dt>判讀</dt><dd><span class="pill watch">留意</span> 美國 30 年期公債殖利率 9/10 到 5.37%，是 2007 年 6 月以來最高，<a class="ind" data-ind="fed">聯準會</a> 9/16 又升息 1 碼，債券價格的壓力還在；但淨贖回金額小、8 月已轉為淨申購，沒有看到散戶集中離場。<span class="tag inf">推論</span></dd></div>
    </dl>

    <div class="how"><span class="lbl">怎麼讀</span>看三件事：規模（兆元）、受益人數（散戶熱度）、單月淨申購贖回（資金方向），再搭配美國 10 年與 30 年期公債殖利率和匯率。受益人數 2025-12-26 為 179 萬 8,960 人，比 2024 年底少 22 萬 3,256 人。</div>
    <div class="mis"><b>常見誤讀</b>　把債券 ETF 的規模當成散戶的避險情緒 → 買家有一大半是法人，規模變動主要反映壽險的配置需求與債券價格。散戶熱度要看受益人數。</div>
    <div class="blind"><b>盲點</b>　債券 ETF 同時承擔利率和匯率兩種風險。2025 年 5 月新台幣一個月升約 7%，即使美債價格不動，新台幣計價的淨值也會少約 7%。只看配息率，會漏掉匯率。<span class="tag add">補充</span></div>
    <p>還不知道的事 <span class="hd hd-unc">未確認</span>：壽險現在持有多少債券 ETF（2023-04 為 1.286 兆元；現況估約四到六成，未查證）；歷史最高規模的精確數字；2025 年 5 月那個月的贖回金額。</p>
    <p class="src">來源：<a href="https://www.sitca.org.tw/ROC/Industry/IN2001.aspx?PGMID=IN0201" target="_blank" rel="noopener">投信投顧公會 境內基金統計</a>、<a href="https://money.udn.com/money/story/5612/9701148" target="_blank" rel="noopener">經濟日報 2026-08-19（櫃買口徑）</a>、<a href="https://www.ctee.com.tw/news/20260918701655-430403" target="_blank" rel="noopener">工商時報 2026-09-18（資金流）</a>、<a href="https://www.ctee.com.tw/news/20260106700321-430403" target="_blank" rel="noopener">工商時報 2026-01-06（受益人數）</a>、<a href="https://www.cbc.gov.tw/dl-227601-bb67e4c53d2b40e6b1e89723056f3c38.html" target="_blank" rel="noopener">央行 9/17 參考資料</a>。</p>
  </div>
</details>

<details class="blk" id="b3-corp">
  <summary><span class="h">企業的錢：對外投資、資本支出、現金股利</span><span class="sum">2026 年 1–8 月核准對外投資 623.9 億美元，約八成是台積電；其中 300 億美元是把美元留在海外子公司。</span></summary>
  <div class="body">
    <p>結論：企業賺的錢有四條路：再投資（資本支出）、發股利、買回庫藏股、留在帳上（含海外子公司的美元）。2026 年變化最大的是出海：1–8 月核准<a class="ind" data-ind="fdi_out">對外直接投資</a> 623.9 億美元（約 1.98 兆元 <span class="hd hd-est">估計</span>），已是 2025 全年的 1.6 倍，幾乎都是台積電（2330）。</p>

    <div class="tbl-wrap"><table>
      <thead><tr><th>期間</th><th class="n">核准對外投資（不含中國大陸）</th><th class="n">年增率</th><th class="n">對中國大陸</th></tr></thead>
      <tbody>
        <tr><td class="name">2025 全年</td><td class="n">384.3 億美元</td><td class="n">−14.47%</td><td class="n">15.0 億美元</td></tr>
        <tr><td class="name">2026 年 1–6 月</td><td class="n">362.57 億美元</td><td class="n">+98.01%</td><td class="n">4.0 億美元</td></tr>
        <tr><td class="name">2026 年 1–7 月</td><td class="n">612.55 億美元</td><td class="n">+208.43%</td><td class="n">5.72 億美元</td></tr>
        <tr><td class="name">2026 年 1–8 月</td><td class="n">623.9 億美元</td><td class="n">+98.37%</td><td class="n">6.6 億美元</td></tr>
      </tbody>
    </table></div>
    <p>機制：企業把資金匯到國外設廠、增資子公司，要經濟部投審司核准，核准金額每月公布；核准不等於當月匯出，但方向一致。2026 年的金額集中在兩筆台積電增資：英屬維京群島的 TSMC Global 300 億美元、美國的 TSMC Arizona 200 億美元（7/2 通過），合計約占 1–8 月核准額的八成。<span class="hd hd-off">官方</span></p>

    <div class="blind"><b>盲點</b>　TSMC Global 那 300 億美元的用途是「一般投資業務、降低外匯避險成本」（央行文件原文），也就是把美元留在海外子公司，不換回新台幣。這和設廠不同：它是「順差很大、<a class="ind" data-ind="usdtwd">新台幣</a>卻沒有同幅升值」的原因之一，可以和<a class="ind" data-ind="fxsettle">出口貨款結售比例</a>只有約 2.2% 一起看。<span class="tag add">補充</span></div>
    <div class="mis"><b>常見誤讀</b>　台美協議（見<a class="ind" data-ind="tariff">美國關稅</a>）的 2,500 億美元信用保證＝政府要拿 2,500 億美元出去 → 那是保證額度。國發基金與銀行實際出資的保證專款約 60–100 億美元、分 5 期；另一個 2,500 億美元是企業自主投資。協定是否已完成立法院審議 <span class="hd hd-unc">未確認</span>。</div>

    <h4>留在國內的部分：資本支出、股利、借款</h4>
    <ul class="list">
      <li><b>資本支出</b>：台積電 2026 年指引 600–640 億美元（約 1.9–2.0 兆元 <span class="hd hd-est">估計</span>），是國內實體投資最大的單一來源（見<a class="ind" data-ind="tsmc_rev">台積電月營收與資本支出</a>）。其中很大一部分付給國外設備商，在國際收支上算商品進口，不算金融帳。</li>
      <li><b>現金股利</b>：台積電 2025 年發放約 4,670 億元（每股 18 元），2026 年每股 24 元。股利每年 6–9 月集中發放；外資股東領到的那一份會換成美元匯出，是夏天新台幣偏弱的季節性原因之一。全體上市櫃公司的股利總額 <span class="hd hd-unc">未確認</span>。</li>
      <li><b>一邊賺、一邊借</b>：AI 供應鏈擴產與備料需要週轉金，AI 相關製造業 2026 上半年<a class="ind" data-ind="loans">放款</a>增加 9,113 億元，本國銀行 7 月單月放款增加 1 兆 399 億元、首次破兆。結果是<a class="ind" data-ind="ldr">存放比</a>上升、<a class="ind" data-ind="m2">M2</a> 成長超過央行參考區間的上緣。</li>
    </ul>
    <p class="src">來源：<a href="https://money.udn.com/money/story/10869/9756269" target="_blank" rel="noopener">經濟日報 2026-09-15（1–8 月核准對外投資）</a>、<a href="https://www.moea.gov.tw/Mns/populace/news/News.aspx?kind=1&amp;menu_id=40&amp;news_id=123330" target="_blank" rel="noopener">經濟部 2026-07-15</a>、<a href="https://www.cbc.gov.tw/dl-227602-efb374350f4b49e0984456d64c2c7bb2.html" target="_blank" rel="noopener">央行〈美中衝突後台灣投資貿易結構分析〉</a>、<a href="https://www.cna.com.tw/news/aipl/202601200201.aspx" target="_blank" rel="noopener">中央社 2026-01-20（台美投資合作）</a>、<a href="https://pr.tsmc.com/chinese/news/3332" target="_blank" rel="noopener">台積電 2026-08-11 董事會</a>。</p>
  </div>
</details>

<details class="blk" id="b3-deposit">
  <summary><span class="h">停在原地的錢：定存與外幣存款</span><span class="sum">外幣存款有 9.6 兆與 16.5 兆元兩個口徑，帳面增加多半是匯率換算；一年期定存約 1.7%，美元定存約 2%。</span></summary>
  <div class="body">
    <p>結論：沒有拿去投資的錢，以新台幣或外幣存款的形式留在銀行。這一塊要看的不是總額，而是三個結構：活存和定存的比重、外幣存款是真的增加還是匯率換算、銀行收到存款後放出去多少。存款總量與 <a class="ind" data-ind="m2">M2</a> 的完整說明在<a href="#/local">本地有多少</a>。</p>

    <div class="tbl-wrap"><table>
      <thead><tr><th>指標</th><th class="n">數值 <span class="hd hd-off">官方</span></th><th>日期與口徑</th></tr></thead>
      <tbody>
        <tr><td class="name">本國銀行存款</td><td class="n">66 兆 9,591 億元</td><td>2026-07，金管會口徑（全站共用的 69.4 兆元是全體銀行口徑）</td></tr>
        <tr><td class="name">本國銀行放款／存放比</td><td class="n">48 兆 8,528 億元／72.96%</td><td>2026-07，金管會口徑</td></tr>
        <tr><td class="name"><a class="ind" data-ind="fxdep">外匯存款</a>（央行口徑）</td><td class="n">9 兆 5,922 億元</td><td>2026-07，國內貨幣機構；歷史新高</td></tr>
        <tr><td class="name">外幣存款（金管會口徑）</td><td class="n">16 兆 4,604 億元</td><td>2026-06，約 5,170 億美元；含國際金融業務分行（OBU）與海外分行</td></tr>
        <tr><td class="name"><a class="ind" data-ind="settle_dep">證券劃撥存款</a></td><td class="n">4 兆 1,823 億元</td><td>2026-07，單月少 2,413 億元</td></tr>
        <tr><td class="name">台銀一年期定存（固定）</td><td class="n">1.700%</td><td>2026-09-19 牌告；500 萬元以上大額為 0.770% <span class="hd hd-mkt">市場</span></td></tr>
        <tr><td class="name">台銀美元一年期定存</td><td class="n">2.05%</td><td>2026-09-19 牌告；各銀行的新資金優惠利率 <span class="hd hd-unc">未確認</span></td></tr>
        <tr><td class="name">定期性存款餘額（定存＋定儲）</td><td class="n">—</td><td>央行附表無法解析 <span class="hd hd-unc">未確認</span></td></tr>
      </tbody>
    </table></div>

    <div class="how"><span class="lbl">怎麼讀</span>四個讀法，都是看結構、不看總額。</div>
    <ul class="list">
      <li><b>活存對定存</b>：股市熱的時候，定存解約轉活存、再轉進證券戶，M1B 年增率會追上甚至超過 M2（見 <a class="ind" data-ind="m1b_gap">M1B 與 M2 年增率差</a>）。2026 年 7 月 M1B 7.34%、M2 7.42%，兩者貼在一起。</li>
      <li><b>證券劃撥存款</b>：已經轉進證券戶、隨時可以買股票的現金。7 月台股重挫，單月少 2,413 億元。</li>
      <li><b>外幣存款</b>：先分開匯率換算和真的有新錢。金管會口徑 2026 上半年帳面增加 1.07 兆元，主因是美元升值（見<a class="ind" data-ind="usdtwd">匯率</a>）；以美元計，6 月反而比前一個月少 13 億美元。</li>
      <li><b>存放比 73%</b>：銀行每收 100 元存款只放出 73 元，其餘拿去買債券（含外國債券）或轉存<a class="ind" data-ind="ncd">央行定存單</a>。7 月由 72.26% 升到 72.96%，因為 AI 供應鏈借錢很多（見<a class="ind" data-ind="ldr">存放比</a>）。</li>
    </ul>
    <div class="mis"><b>常見誤讀</b>　外幣存款創新高＝民眾搶換美元 → 很多時候只是美元升值，同一筆美元換算成更多新台幣；而且金管會口徑有一大塊是企業與 OBU 的錢。</div>
    <div class="blind"><b>盲點</b>　兩個「外幣存款」差了快 7 兆元：央行的 9.6 兆元是國內貨幣機構的外匯存款，金管會的 16.5 兆元多了 OBU 與海外分行。引用時要寫清楚是哪一個。<span class="tag add">補充</span></div>
    <div class="note"><b>利差就是價格訊號</b>　台灣 10 年期公債殖利率 1.92%（2026-09-18）只比一年期定存高不到 0.3 個百分點，比美國 30 年期公債 5.37%（2026-09-10，見<a class="ind" data-ind="fed">聯準會利率與美債殖利率</a>）低 3 個百分點以上。錢留在國內的報酬和換成美元資產的報酬差這麼多，是資金往海外移動的主要誘因。<span class="tag inf">推論</span></div>
    <p class="src">來源：<a href="https://www.ctee.com.tw/news/20260911700589-430301" target="_blank" rel="noopener">工商時報 2026-09-11（金管會 7 月存放款）</a>、<a href="https://news.cnyes.com/news/id/6585478" target="_blank" rel="noopener">鉅亨網（央行 7 月金融情況）</a>、<a href="https://money.udn.com/money/story/5613/9702071" target="_blank" rel="noopener">經濟日報 2026-08-19（國銀外幣存款）</a>、<a href="https://rate.bot.com.tw/twd?Lang=zh-TW" target="_blank" rel="noopener">台灣銀行 牌告利率</a>。</p>
  </div>
</details>

<details class="blk" id="b3-gov">
  <summary><span class="h">政府這一端：稅收、普發現金、政府基金</span><span class="sum">稅收 1–8 月年增 25.2%，政府少借錢、公債更少；政府基金約 10 兆元是長期買盤；普發現金僅約 0.24 兆元。</span></summary>
  <div class="body">
    <p>結論：政府這一端有三件事影響資金去向。稅收大增讓政府少發公債，國內可買的安全資產變少；勞退、勞保等政府基金約 10 兆元，是國內外股債的長期買家；普發現金最常上新聞，金額卻最小。</p>
    <p>機制：企業獲利與股市<a class="ind" data-ind="turnover">成交值</a>大，營所稅、證交稅、綜所稅（股利所得）就大增，實徵數超過預算數（俗稱超徵）。政府有三種處理：還債或少借、編追加預算或特別預算花掉、直接發現金。後兩種把錢放回民間；第一種讓公債的供給變少。</p>

    <div class="kpis">
      <div class="kpi"><span class="k">全國賦稅收入</span><span class="v">3 兆 749 億元</span><span class="d">2026 年 1–8 月，年增 25.2%（官方）；超出同期分配預算約 4,000 億元（估計）</span></div>
      <div class="kpi"><span class="k">中央政府債務未償餘額</span><span class="v">5 兆 9,664 億元</span><span class="d">2026-09-11 國債鐘</span></div>
      <div class="kpi"><span class="k">2027 年度預算案</span><span class="v">淨舉債 0</span><span class="d">制度（預算案）：還本與舉債同為 1,790 億元；債務比率估 23.4%，歷史新低</span></div>
      <div class="kpi"><span class="k">普發現金每人 1 萬元</span><span class="v">2,357 億元</span><span class="d">2027 年度預算案，尚未三讀</span></div>
    </div>

    <div class="blind"><b>盲點</b>　超徵的另一面是國內更缺債。中央政府債務不到 6 兆元，只有<a class="ind" data-ind="life_fx">壽險海外投資</a>的四分之一；2026-09-01 標售的 5 年期公債（得標利率 1.779%），銀行拿走 80.80%、保險業得標 0%。國內最安全的長天期資產不夠買、利率也不夠高，間接把壽險與銀行的資金再往海外推。<span class="tag inf">推論</span> <span class="tag add">補充</span></div>

    <h4>政府基金：約 10 兆元的長期買盤</h4>
    <div class="tbl-wrap"><table class="narrow">
      <thead><tr><th>基金</th><th class="n">規模（億元，2026-07-31）</th><th class="n">2026 年 1–7 月收益率</th></tr></thead>
      <tbody>
        <tr><td class="name">新制勞退基金</td><td class="n">59,718.9</td><td class="n">24.58%</td></tr>
        <tr><td class="name">舊制勞退基金</td><td class="n">12,013.9</td><td class="n">35.02%</td></tr>
        <tr><td class="name">勞保基金</td><td class="n">16,566.2</td><td class="n">23.65%</td></tr>
        <tr><td class="name">整體勞動基金（含就保、職災等）</td><td class="n">90,827</td><td class="n">25.03%</td></tr>
        <tr><td class="name">國保基金（受託管理）</td><td class="n">8,862.5</td><td class="n">24.54%</td></tr>
        <tr><td class="name">農退基金（受託管理）</td><td class="n">312.0</td><td class="n">31.53%</td></tr>
      </tbody>
    </table></div>
    <p>機制：雇主每月替勞工提繳薪資的 6%（加上勞工自提）進新制勞退，勞保、國保的保費進各自的基金。這些錢有法定的長期性，不會因為行情不好被贖回，是台股的長期買盤，同時透過國外委託經營投到全球股債。連同國保、農退合計約 10 兆 1 億元 <span class="hd hd-est">估計</span>（本站加總）；國內外各配置多少、退撫基金與郵政儲金的規模 <span class="hd hd-unc">未確認</span>。</p>
    <div class="mis"><b>常見誤讀</b>　勞動基金上半年賺 2 兆 2,024 億元＝多了 2.2 兆元現金 → 這是未實現的評價收益。7 月台股重挫，單月就回吐約 2,460 億元（估計，兩個月相減）。</div>
    <div class="mis"><b>常見誤讀</b>　普發現金會明顯推升資金面 → 2,357 億元約 0.24 兆元；對照壽險一年的<a class="ind" data-ind="fyp">初年度保費</a>約 1 兆元、本國銀行 7 月單月<a class="ind" data-ind="loans">放款</a>增加 1.04 兆元。對個人有感，對整體資金面很小，而且多數會回到消費與存款。</div>
    <p class="src">來源：<a href="https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=8cda4784b5f643bd9d59b884769e66db" target="_blank" rel="noopener">財政部 1–8 月賦稅收入</a>、<a href="https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=a4cce887670e435986c22db0615fef77" target="_blank" rel="noopener">財政部 2027 年度總預算案</a>、<a href="https://www.nta.gov.tw/singlehtml/17?cntId=nta_7906_17" target="_blank" rel="noopener">國庫署 國債鐘</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-192797-82b85-1.html" target="_blank" rel="noopener">央行 公債標售結果</a>、<a href="https://www.blf.gov.tw/49200/49255/49259/lpsimplelist" target="_blank" rel="noopener">勞動基金運用局 月報</a>。</p>
  </div>
</details>

<details class="blk" id="b3-alt">
  <summary><span class="h">黃金與加密資產</span><span class="sum">黃金 ETF 約 140 億元、加密資產沒有官方統計；現在能追的是制度時間表，不是資金量。</span></summary>
  <div class="body">
    <p>結論：這兩項常被問到，但目前都量不出大的金額。黃金看得到的部分只有百億元級；加密資產沒有任何官方的持有金額或交易量統計，能追的只有制度進度。</p>
    <h4>黃金</h4>
    <p>期元大 S&amp;P 黃金（00635U）規模 139.9 億元（2026-09-17）<span class="hd hd-mkt">市場</span>。台灣銀行黃金存摺的開戶數與交易量沒有固定公布的官方統計，2025–2026 年金價行情下散戶是買進還是獲利了結，都 <span class="hd hd-unc">未確認</span>。量級判斷：就算把黃金存摺加進來，整體也只是百億到千億元級，和兆元級的去向差兩個數量級 <span class="tag inf">推論</span>。要追的話，回看 3–5 年，看金價急漲時 ETF 規模與受益人數是同步放大（追價）還是縮小（獲利了結）。</p>
    <h4>加密資產</h4>
    <div class="timeline">
      <div class="ev"><span class="dt">2024-11-30</span><span>洗錢防制法第 6 條施行：虛擬資產服務商（<span class="en">VASP</span>）沒完成洗錢防制登記不得營業，違者有刑責。</span></div>
      <div class="ev"><span class="dt">2025-03-25</span><span>金管會預告《虛擬資產服務法》草案。</span></div>
      <div class="ev"><span class="dt">2026-06-30</span><span>立法院三讀通過：七類業者改採許可制；在台發行穩定幣須經央行同意並取得金管會許可、維持十足準備並交付信託。施行日期由行政院另定，既有業者須在施行後 12 個月內申請。</span></div>
      <div class="ev"><span class="dt">2026-09-03</span><span>證期局名單：完成洗錢防制登記的業者 10 家。</span></div>
    </div>
    <div class="blind"><b>盲點</b>　加密資產的資金進出大多走銀行的新台幣出入金，在銀行統計裡就是一般活存的轉出轉入，不會出現在任何「對外投資」統計，也不在<a class="ind" data-ind="fa">金融帳</a>的證券投資裡。等專法施行、業者取得許可後，金管會才可能有彙總的申報資料。<span class="tag add">補充</span></div>
    <p class="src">來源：<a href="https://www.moneydj.com/etf/x/basic/basic0004.xdjhtm?etfid=00635u.tw" target="_blank" rel="noopener">MoneyDJ 00635U</a>、<a href="https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202606300002&amp;dtable=News" target="_blank" rel="noopener">金管會 2026-06-30 新聞稿</a>、<a href="https://www.sfb.gov.tw/ch/home.jsp?id=1053&amp;parentpath=0,8" target="_blank" rel="noopener">證期局 VASP 名單</a>。</p>
  </div>
</details>

<details class="blk" id="b3-policy">
  <summary><span class="h">可能改變資金去向的新制度</span><span class="sum">TISA、亞洲資產管理中心、引導壽險資金回台、虛擬資產專法：方向明確，但目前金額都還小。</span></summary>
  <div class="body">
    <p>結論：這幾項制度的共同方向，是把原本直接出海的錢留在台灣的機構手上管理，或引導回國內投資。到 2026 年 9 月為止，實際金額都還小；要追的是進度，不是現在的規模。表中「可能改變什麼」一欄是作者的判讀 <span class="tag inf">推論</span>。</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>制度</th><th>內容與進度</th><th>目前量級</th><th>可能改變什麼</th></tr></thead>
      <tbody>
        <tr><td class="name">個人投資儲蓄帳戶<small>TISA</small></td><td>2025 年 7 月上路；定期定額買 TISA 級別<a class="ind" data-ind="funds">基金</a>、連續扣款滿 24 個月。第二階段的租稅優惠還在跨部會溝通。<span class="hd hd-sys">制度</span></td><td>244,218 戶、帳戶資產 210.6 億元（2026-08-21）</td><td>有租稅優惠才可能變成大管道</td></tr>
        <tr><td class="name">亞洲資產管理中心</td><td>高雄專區 2025 年 7 月設立，開放 38 項試辦業務；到 2026-08-20 進駐 21 家銀行、19 家投信投顧、13 家證券商、6 家保險公司。</td><td>資產管理業管理規模 20.02 兆元（2026-04）</td><td>高資產客戶的錢改由在台機構管理；最後買的可能還是海外資產，但管理費與交易留在台灣</td></tr>
        <tr><td class="name">引導壽險資金回台</td><td>2025 年 10 月專案運用與公共投資上限由可運用資金 10% 提高到 15%；2026-06-16 開放投資 AI 新十大建設的策略性產業；2026-08-20 擴大公建標的（AI 算力中心、儲能、海底電纜等）。</td><td>目前 1,800 億元、占資金運用 0.54%（2026-04）；15% 上限約 5 兆元</td><td>瓶頸不在法規額度，在可投資的案源與報酬率</td></tr>

        <tr><td class="name">虛擬資產服務法</td><td>2026-06-30 三讀；施行日由行政院另定。</td><td>沒有統計</td><td>業者取得許可後才可能有官方彙總數字</td></tr>
        <tr><td class="name"><a class="ind" data-ind="subbrok">複委託</a>外幣融資</td><td>報導稱最快 2027 年第 2 季上路（僅見標題 <span class="hd hd-unc">未確認</span>）。</td><td>—</td><td>可用海外持股再借美元買股，會放大複委託的波動</td></tr>
        <tr><td class="name">央行放寬房貸管制</td><td>2026-09-18 起第二戶購屋貸款成數上限由 6 成調為 7 成（見<a class="ind" data-ind="credit_ctrl">選擇性信用管制</a>）。</td><td>—</td><td>制度變動會改變各去向的相對吸引力</td></tr>
      </tbody>
    </table></div>
    <p class="src">來源：<a href="https://www.sfb.gov.tw/ch/home.jsp?id=95&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202609030001&amp;dtable=News" target="_blank" rel="noopener">證期局 TISA 一週年</a>、<a href="https://www.aamc.tw" target="_blank" rel="noopener">金管會 亞洲資產管理中心專網</a>、<a href="https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202608200003&amp;dtable=News" target="_blank" rel="noopener">金管會 2026-08-20 新聞稿</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html" target="_blank" rel="noopener">央行 9/17 理監事會決議</a>。</p>
  </div>
</details>

<details class="blk" id="b3-blind">
  <summary><span class="h">盲點與常見誤讀</span><span class="sum">九個最容易看錯的地方：誰是最大買家、成交值與流量的差別、匯率造成的帳面變動、避險比率的真正意義。</span></summary>
  <div class="body">
    <p>這一頁的內容都是你沒有直接問、但不看會誤判的部分 <span class="tag add">補充</span>。下面九條是濃縮版。</p>
    <div class="blind"><b>盲點</b>　台灣最大的對外證券投資人是壽險，不是散戶。<a class="ind" data-ind="life_fx">壽險國外投資</a> 22.2 兆元（2026-04），是國人持有<a class="ind" data-ind="funds">境外基金</a> 5.32 兆元的四倍多。</div>
    <div class="blind"><b>盲點</b>　<a class="ind" data-ind="excess_saving">超額儲蓄</a>與海外投資是同一件事的兩面。2025 年<a class="ind" data-ind="ca">經常帳順差</a> 1,844 億美元，<a class="ind" data-ind="reserves">外匯存底</a>只增加約 200 億美元，其餘由民間送出去。看到「出口創新高」，要同時想到有差不多等量的錢必須在海外找地方放。</div>
    <div class="blind"><b>盲點</b>　主力買家已經換人。壽險海外部位由 2024 年底 23.03 兆元降到 2026-04 的 22.19 兆元；2026 年上半年的主力是銀行買外國債券、企業的海外應收帳款與存款，以及台積電的<a class="ind" data-ind="fdi_out">直接投資</a>（其中 300 億美元是把美元留在海外子公司）。</div>
    <div class="mis"><b>常見誤讀</b>　<a class="ind" data-ind="subbrok">複委託</a>一年流出 10 兆元 → 10.75 兆元是成交值。2025 年全台居民對外證券投資淨增加約 1.15 兆元，還包含壽險、銀行與基金（見<a class="ind" data-ind="fa">金融帳</a>）。</div>
    <div class="mis"><b>常見誤讀</b>　<a class="ind" data-ind="bond_etf">債券 ETF</a> 規模縮水＝散戶逃離 → 有一大半金額在壽險手上（現況未確認），規模變動主要反映債券價格與壽險配置。散戶熱度看受益人數：2025 年少了約 22 萬人。</div>
    <div class="mis"><b>常見誤讀</b>　<a class="ind" data-ind="fxdep">外幣存款</a>創新高＝大家在換美元 → 有央行 9.6 兆元、金管會 16.5 兆元兩個口徑；2026 上半年金管會口徑增加 1.07 兆元，以美元計幾乎沒動。</div>
    <div class="mis"><b>常見誤讀</b>　避險比率下降＝風險下降 → 正好相反。避險比率由年初 45% 降到 42.94%，每年省下上千億元成本，但淨曝險約 9 兆元；1.08 兆元準備金可承受約 12% 升值，而<a class="ind" data-ind="usdtwd">新台幣</a> 2025 年 5 月單月就升了約 7%。</div>
    <div class="mis"><b>常見誤讀</b>　普發現金會推升資金面 → 2,357 億元約 0.24 兆元；本國銀行 2026 年 7 月一個月的<a class="ind" data-ind="loans">放款</a>增量就有 1.04 兆元。</div>
    <div class="blind"><b>盲點</b>　稅收超徵會讓國內更缺債。2027 年度預算案淨舉債為零、債務比率 23.4% 創新低；9 月的 5 年期公債保險業得標 0%。國內安全資產不夠，是資金出海的推力之一。<span class="tag inf">推論</span></div>

<template id="tpl-C1-room"><div class="room-lede">
<p class="verdict">台股現在是「一檔股票加一個產業」撐起來的市場：台積電（2330）占加權指數 41.48%（2026-08-31）、電子類約占 80.7%；今年以來（至 2026-09-18）指數漲 62.9%，32 個產業類股卻有 9 個下跌。要看懂錢在板塊之間怎麼移動，得把三種分法疊著用，並且看「相對大盤」的強弱，而不是只看漲跌。</p>
<ul class="takeaways">
<li><b>三種分法</b>：官方類股有現成指數，適合每天追蹤；族群是新聞用的語言；「對什麼敏感」用來推想利率、匯率、油價變動時，誰受惠、誰受害。</li>
<li><b>類股指數常常不是你以為的族群</b>：半導體類約 75% 是台積電，塑膠類大漲其實是南亞（1303）被當成 AI 材料股；先看<a class="ind" data-ind="tsmc_w">台積電權重</a>有多高。</li>
<li><b>錢換邊有三層原因</b>：獲利預期變了（<a class="ind" data-ind="rev_monthly">月營收</a>）、利率匯率讓評價變了、有人必須買或賣（<a class="ind" data-ind="etf">ETF 換股</a>、<a class="ind" data-ind="margin">融資</a>、日曆）。入門者最常漏掉第三層。</li>
<li><b>相關性找得到，但不能當交易規則</b>：扣掉類股平均後，類股分成內需防禦、電子、原物料三群；<a class="ind" data-ind="dispersion">離散度</a>顯示 2026 年是 2020 年以來輪動最劇烈的一年。可到<a href="#/explorer">輪動探索器</a>自己算。</li>
<li><b>先分清楚是輪動還是撤出</b>：輪動是錢留在股市換位置，撤出是錢離開股市。看成交值、漲跌家數、<a class="ind" data-ind="otc_ratio">櫃買相對加權</a>、融資與匯率。</li>
</ul>
</div>

<details class="blk" id="c1-three" open>
<summary><span class="h">板塊的三種分法，各有用途</span><span class="sum">官方類股用來量、族群用來看懂新聞、敏感度用來推想方向；三套要疊著用。</span></summary>
<div class="body">
<p>台股的「板塊」沒有唯一的分法。實務上有三套，各自回答不同的問題：官方產業分類回答「今天錢在哪一類換手、今年哪一類漲最多」；市場慣用的族群回答「新聞說的散熱、CPO、重電到底是哪些公司」；依敏感度分類回答「利率、匯率、油價動了，誰受惠、誰受害」。只用其中一套都會看錯，下面幾個區塊依序說明。</p>
<div class="tbl-wrap"><table>
<thead><tr><th>分法</th><th>誰定的</th><th>適合做什麼</th><th>主要限制</th></tr></thead>
<tbody>
<tr><td class="name">官方產業分類</td><td>證交所與櫃買中心，依營收比重最高的業務歸類 <span class="hd hd-sys">制度</span></td><td>量化追蹤：每天有類股指數與<a class="ind" data-ind="sec_share">成交統計</a></td><td>一條指數常被一檔龍頭主導；同一族群被拆到好幾類</td></tr>
<tr><td class="name">族群／題材</td><td>券商報告與新聞，依供應鏈位置或共同題材</td><td>看懂資金在追什麼；一檔股票可同時屬於好幾個族群</td><td>沒有官方指數與固定名單，要自己把代表股放在一起看</td></tr>
<tr><td class="name">敏感度分類</td><td>依各產業的成本與收入結構推導 <span class="tag inf">推論</span></td><td>某個總體變數變動時，推想資金可能往哪邊移</td><td>是典型方向，不是統計保證；幅度與時點要看當時的評價與預期</td></tr>
</tbody>
</table></div>
<p>媒體常說的三大類，是把官方分類再合併：<b>電子</b>（半導體、電腦及週邊、光電、通信網路、電子零組件、電子通路、資訊服務、其他電子，共 8 類）、<b>金融</b>（金融保險）、<b>傳產</b>（其餘全部）。證交所另編「未含金融電子指數」，就是傳產整體的表現。</p>
<div class="how"><span class="lbl">怎麼疊著用</span>例：看到「電機機械類大漲」，先用官方成交資料查是哪幾檔在漲（9/18 成交前三大是大量、中砂、高力（8996））；再對照族群表，發現它們是 PCB 設備、半導體耗材與散熱，不是重電；最後用敏感度去想：帶動它們的是 AI 資本支出，不是台電標案。<span class="tag inf">推論</span></div>
<div class="note">2023-07-03 起，上市與上櫃同步新增綠能環保、數位雲端、運動休閒、居家生活四類，上市類別由 29 類增為 33 類，其中每天編有產業類股指數的是 32 類。<span class="hd hd-sys">制度</span> 本頁的類股漲跌幅都是價格指數（不含股息），金融、電信、高股息類的實際報酬會比表上數字高一些。</div>
<p class="src">來源：<a href="https://www.ctee.com.tw/news/20230328701077-439803" target="_blank" rel="noopener">工商時報 2023-03-28〈上市公司產業類別新增四項〉</a></p>
</div>
</details>

<details class="blk" id="c1-limits">
<summary><span class="h">官方分類的限制</span><span class="sum">同一族群被拆到三四類、龍頭一檔決定整條指數、分類調整慢；類股大漲不等於那個產業景氣好。</span></summary>
<div class="body">
<p>官方類股指數方便，但有三個結構性限制，會讓「某類股大漲」和「那個產業景氣好」變成兩回事。以下都用證交所 2026-09-18 的類股成分與成交資料核對。<span class="hd hd-mkt">市場</span></p>
<ol class="steps">
<li><b>同一個族群被拆到三四個官方類別。</b>以散熱為例：奇鋐（3017）在電腦及週邊，健策（3653）、建準（2421）在電子零組件，高力（8996）在電機機械，雙鴻（3324）在上櫃。只看任何一條官方指數，都看不到散熱族群的強弱。</li>
<li><b>類股指數是市值加權，龍頭一檔可以決定整條指數。</b>半導體類約 75% 是台積電（2330），見<a class="ind" data-ind="tsmc_w">台積電權重與集中度</a>。9/18 電機機械類成交前三大是大量 58.7 億、中砂 52.7 億、高力 34.7 億元（PCB 設備、半導體耗材、散熱），重電龍頭華城（1519）只有 9.9 億元；所以「電機機械類大漲」很可能跟重電無關。</li>
<li><b>分類依營收比重認定，調整慢。</b>南亞（1303）的電子材料營收占比由 2025 年 46% 升到 2026 年 57%，仍歸在塑膠類；大立光（3008）跨進共同封裝光學（CPO）仍在光電類。轉型最劇烈的公司，剛好是官方分類最失真的地方。</li>
</ol>
<div class="tbl-wrap"><table>
<thead><tr><th>官方類別</th><th class="n">檔數</th><th>裡面其實是這些很不一樣的生意</th></tr></thead>
<tbody>
<tr><td class="name">半導體</td><td class="n">約 96–100</td><td>晶圓代工、IC 設計、ASIC／矽智財、封測，還有記憶體與模組、ABF 載板的景碩（3189）、設備的辛耘（3583）、測試介面的穎崴（6515）與鴻勁（7769）、矽晶圓</td></tr>

<details class="blk" id="c1-groups">
<summary><span class="h">市場慣用的族群／題材分法</span><span class="sum">新聞用的是「族群」：照供應鏈位置或共同題材分；下表是作者整理的分組，不是官方分類。</span></summary>
