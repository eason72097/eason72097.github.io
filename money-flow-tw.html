財報申報期限","why":"證交法第 36 條；金融業期限略有不同（未逐條查證）。","ind":["rev_monthly"],"kind":"rule","key":"C1"},{"when":null,"rule":"5、6、11、12 月（以各檔公開說明書為準）","what":"高股息 ETF 定期換成分股","why":"報告憑記憶：0056 在 6、12 月，00878 在 5、11 月，00919 在 5、12 月；生效日前後中型股有集中買賣。","ind":["etf","rs_line"],"kind":"rule","key":"B1"},{"when":null,"rule":"6 月、11 月前後（不固定）","what":"美國財政部匯率政策報告","why":"台灣因對美順差與經常帳占 GDP 19.5% 兩項超標，續列觀察名單；央行會發回應稿。","ind":["ca","reserves"],"kind":"policy","key":"A1"},{"when":null,"rule":"9 月下旬（確切日期未確認）","what":"美光（Micron）財報","why":"看記憶體漲價是否延續、公司對 2027 年供需的說法；上季毛利率 84.9%，稱吃緊延續到 2027 年之後。","ind":["dram"],"kind":"event","key":"C3"},{"when":null,"rule":"9 月底（預計）","what":"美國 301 條款（強迫勞動）關稅最終稅率定案","why":"7/24 方案台灣列最低的 10% 級距；影響機械、傳產與產地在東南亞的紡織製鞋。細節未確認。","ind":["tariff"],"kind":"policy","key":"C1"},{"when":null,"rule":"9/28 前後（逢假日，確切公布日未查）","what":"8 月景氣對策信號","why":"7 月為 41 分、連 8 個月紅燈；若再亮紅燈，就追平 2021 年連 9 紅的紀錄。","ind":["signal"],"kind":"data","key":"C1"},{"when":null,"rule":"日期未定；待立法院審議 2027 年度總預算","what":"普發現金每人 1 萬元（預算 2,357 億元）","why":"預算完成法定程序後才發放；約 0.24 兆元，對整體資金面影響有限。","ind":[],"kind":"policy","key":"B3"},{"when":null,"rule":"日期未定；由行政院另定施行日","what":"《虛擬資產服務法》施行","why":"施行後既有業者須在 12 個月內申請許可；之後才可能有官方彙總統計。","ind":[],"kind":"policy","key":"B3"},{"when":null,"rule":"日期未定；跨部會溝通中","what":"TISA 第二階段租稅優惠","why":"目前帳戶資產 210.6 億元；有租稅優惠才可能變成大的資金管道。","ind":["funds"],"kind":"policy","key":"B3"},{"when":null,"rule":"次次月 10 日前後","what":"金管會本國銀行逾放比與覆蓋率","why":"落後指標；連續數月上升才是信用風險浮現的訊號。","ind":["npl"],"kind":"rule","key":"A2"},{"when":null,"rule":"農曆年封關前一兩週","what":"長假前資金退場","why":"融資與短線資金先減碼、成交量縮；2025-02-03 春節後開盤加權 −3.53% 是長假風險的例子。","ind":["margin","turnover"],"kind":"rule","key":"C1"}],"practice":[{"id":"a1-jun-aug","title":"判讀練習：把 2026 年 6、7、8 月的數字拼起來","kind":"exercise","intro":"同一個月，金管會、央行、證交所對外資的說法可能相反。這題用三個月的實際數字，練習判斷「這個月是誰在推動匯率」。先自己排表、寫下判斷，再看每一步的解答思路。","items":[{"t":"第 1 步：每個月收集六個數字","d":"外資買賣超（新台幣）、金管會外資淨匯入、央行口頭公布的外資匯出入（本金＋盈餘）、外匯存底月變動、月底美元兌新台幣、M2 月增率。前三個是同一件事的不同口徑，後三個是結果。","ind":["fini_flow_twse","fini_flow_fsc","reserves","usdtwd","m2"]},{"t":"6 月：金管會 +116.34 億、央行淨匯出 170 億美元，信哪個？","d":"看結果站哪邊：新台幣由 31.384 貶到 31.837（約 1.4%）、存底月減 79.22 億美元，都和央行口徑一致。金管會不扣獲利與股利匯出，所以方向相反。另外存底減少有一部分是美元指數升 2.27% 的換算損失。","ind":["fini_flow_fsc","reserves","usdtwd"]},{"t":"7 月：外資主導的月份長什麼樣？","d":"外資賣超 7,389 億元加股利匯出，央行口徑淨匯出約 280 億美元，比當月出超（約 172 億美元，估計）還多。新台幣貶到 32.292、存底減 28.81 億美元、M2 月增率 −0.09%，四個結果同方向。金管會同月只有 −29.26 億。","ind":["fini_flow_twse","reserves","m2","usdtwd"]},{"t":"8 月：外資買超 2,222 億元，為什麼央行口徑只有 +12 億美元？","d":"買超約合 70 億美元，但同月外資還在把股利換成美元匯出，兩者相抵只剩淨匯入 12 億美元。金管會同月是 +166.65 億美元；只看它會以為外資大舉匯入，實際上外資對匯率幾乎中性。","ind":["fini_flow_fsc","primary_income"]},{"t":"8 月：新台幣升約 2%、存底增 76.33 億，美元賣壓從哪來？","d":"不是外資。可能來源有三：出口商從外匯存款分批換回新台幣（當月出超 223 億美元）、7 月搶買美元的人回頭賣、國際美元走弱（歐元、日圓、人民幣同月都升）。這是依數字做的推論；哪一項為主，要等 8 月外匯存款增減公布才能判斷。","ind":["fxdep","fxsettle","usdtwd"]},{"t":"量級檢查：6、7 月合計匯出 450 億美元算大嗎？","d":"拿來比：2026 上半年國際收支外資淨賣台股 263 億美元；2025 年第 3 季外資領走的所得約比其他季多 60–90 億美元。450 億包含每年固定的股利匯出季，加上這一次外資的調節，不能全部當成外資撤出。","ind":["fini_flow_cbc","primary_income"]},{"t":"帶走的規則","d":"判斷外資對匯率的壓力，用央行每月口頭數字；判斷買賣方向，用證交所買賣超；金管會淨匯入只當本金帳。每年 6–9 月先扣掉股利匯出的季節性，再下結論。結果數字（匯率、存底、M2）同方向時，判斷才算成立。","ind":["fini_flow_twse","fini_flow_fsc","usdtwd"]}]},{"id":"a1-monthly","title":"對外部門每月例行檢查：由慢到快","kind":"routine","intro":"先用慢的數字確認規模，再用中速的數字確認循環位置，最後才看每天的方向。每個月照發布日走一遍，每項只記一到兩個數，和上個月、去年同月比。","items":[{"t":"每月 5 日前後：外匯存底與外資持有對存底比率","d":"記月變動是否超過 ±50 億美元，並對照當月歐元、日圓升貶扣掉換算效果；比率較上月升或降（8 月底 309%）。","ind":["reserves","fini_ratio"]},{"t":"同一天：央行口頭的外資匯出入，對照金管會淨匯入","d":"兩個數字並排記。方向相反時以央行口徑判斷匯率壓力；金管會數字只當本金帳。","ind":["fini_flow_fsc","usdtwd"]},{"t":"每月 7–9 日：海關出口","d":"記三個數：年增率（有沒有放慢或轉負）、電子零組件加資通產品占比（8 月 79.3%）、對美占比（1–8 月 31.4%）。","ind":["exports"]},{"t":"央行公布出進口外匯收支時：立即結售比例","d":"看比例是否仍在 2% 左右、立即結售金額有沒有突然跳升。跳升代表出口商預期新台幣要升、開始搶著賣美元。","ind":["fxsettle"]},{"t":"每月 20 日前後：外銷訂單","d":"記整體年增率與美國接單年增率（7 月 61.9%、88.9%）。連續數月放慢，是 1–3 個月後出口放慢的先行訊號。","ind":["orders"]},{"t":"每月 23–25 日：外匯存款","d":"記餘額與年增率，先分辨是外幣真的變多還是美元升值的換算；說明用的是央行口徑（9.59 兆元）還是銀行局口徑（16.46 兆元）。","ind":["fxdep","m2"]},{"t":"每季（2、5、8、11 月 20 日前後）：國際收支","d":"記經常帳順差、金融帳淨流出、其他投資資產、外資買台股、初次所得支出五個數。留意首次發布數之後會修正，不要混著比。","ind":["ca","fa","fini_flow_cbc","primary_income"]},{"t":"每天只看兩件事","d":"外資買賣超的連續性與級距（單週 ±1,000 億元算大）；美元兌新台幣是否單日變動 1 角以上且成交量放大到 25–30 億美元以上。其餘都是雜訊。","ind":["fini_flow_twse","usdtwd"]}]},{"id":"a2-monthly","title":"每月讀一次央行「金融情況」（八個步驟）","kind":"routine","intro":"央行每月 23–25 日發布上個月的金融情況。照這個順序讀，約 15 分鐘；重點是把每個數字和上個月比、和另一個數字連起來看。","items":[{"t":"先讀新聞稿「主要係……」那一句","d":"央行會直接說這個月 M1B、M2 變動的主因是放款、外資進出還是匯率。先知道原因，再看數字。2026-07 的說法是外資淨匯出。","ind":["m2","m1b_gap"]},{"t":"M2 年增率對照 2.5–6.5% 參考區間","d":"記下年增率與是否超出區間。超出時看原因：放款創造的存款、外資匯入，還是匯率換算。2026-07 是 7.42%，連 3 個月高於上限。","ind":["m2"]},{"t":"算 M1B 減 M2 的差距，和前 3 個月比方向","d":"只記差距（百分點）。連續幾個月同方向才算趨勢；單月接近零的交叉先不下結論。2026 年 3 月 +2.04、6 月 +1.27、7 月 −0.08。","ind":["m1b_gap"]},{"t":"放款與投資年增率對照存款年增率","d":"放款快過存款，代表銀行在動用閒置資金。再看央行說明借給誰：2026-07 放款年增 9.85%、存款 7.37%，成長來自企業週轉金而非房貸。","ind":["loans","ldr"]},{"t":"找媒體轉述的證券劃撥存款","d":"這個數字只在記者會口頭公布。看月增減是否與成交值、指數同方向；它是結果不是原因。2026-07 底 4.18 兆元、月減 2,413 億元。","ind":["settle_dep","turnover"]},{"t":"月中補看央行定存單餘額與隔夜拆款利率","d":"定存單減少而拆款利率不動，代表央行把被抽走的資金補回去了；兩個一起動，才是銀行間資金真的變緊或變鬆。","ind":["ncd","excess"]},{"t":"確認口徑：日平均還是期底","d":"新聞稿主要數字是日平均。月底資金流動快的月份，期底年增率會差很多：2026-07 的 M2 日平均 7.42%、期底 6.58%。","ind":["m2"]},{"t":"每季加讀央行理監事會決議全文","d":"除了利率，還要看存款準備率與房貸成數有沒有調整，以及簡報對 M2、放款、市場利率的說明。9/17 利率不動、第二戶房貸成數放寬到 7 成。","ind":["policy_rate","credit_ctrl"]}]},{"id":"a2-july","title":"練習：讀一次 2026 年 7 月的數字","kind":"exercise","intro":"用已經公布的 2026 年 7 月資料練習。先自己回答每一題，再看解答思路。重點是分清楚原因與結果、存量與流量。","items":[{"t":"M1B 7.34% 低於 M2 7.42%，該緊張嗎","d":"差距只有 −0.08 個百分點，兩者都在 7% 以上，錢的總量仍在快速增加。要看 8、9 月差距是否連續往負值擴大；2022-09 起連 40 個月為負，指數仍上漲。","ind":["m1b_gap"]},{"t":"外資大幅賣超，M2 為什麼還有 7.42%","d":"M2 最大的來源是銀行放款：放款年增 9.85% 在創造存款；央行又減發定存單把被抽走的新台幣補回去。另外金管會口徑 1–8 月外資仍是淨匯入，口徑要分清楚。","ind":["m2","loans","ncd","fini_flow_fsc"]},{"t":"超額準備只有 579 億元，銀行沒錢了嗎","d":"不是。多的準備金每天被央行定存單收走：定存單餘額 6.57 兆元、流動準備比率 23.19%（法定 10%）。看銀行閒置資金要看定存單，不是超額準備。","ind":["excess","ncd"]},{"t":"證券劃撥存款月減 2,413 億元，是資金撤出股市嗎","d":"它跟著成交量與股價走：7 月指數回檔、成交縮小，餘額自然下降。4.18 兆元約占上市總市值 3%、約 4–5 天成交值（估計），不能單獨當成撤出的證據。","ind":["settle_dep","turnover","mcap"]},{"t":"央行沒升息，借錢成本有變嗎","d":"有。2025-12 到 2026-09，10 年期公債殖利率由 1.357% 升到 1.907%，5 年期公司債由 1.708% 升到 2.230%；364 天期定存單得標利率 4 月 1.285%、9/3 為 1.643%。","ind":["policy_rate"]},{"t":"放款年增近 10%，是房市過熱嗎","d":"不是。不動產貸款年增只有 3.40%（購置住宅貸款 4.52%、建築貸款 −0.19%），其他放款年增 14.31%，主要是 AI 供應鏈週轉金與個人理財週轉金。","ind":["loans","hloan","cloan","wm_loans"]}]},{"id":"a2-scope","title":"引用「資金很多」之前的七項檢查","kind":"checklist","intro":"看到新聞、或自己要引用一個資金數字時，逐項問一次。任何一項答不出來，就先不要用這個數字下結論。","items":[{"t":"它是存量還是流量","d":"家庭淨值 183.7 兆元、定存單 6.57 兆元是某一天的餘額，不會整筆流進市場。要比的是月變動量，以及它相對成交值的大小。","ind":["wealth","ncd"]},{"t":"它是原因還是結果","d":"證券劃撥存款、M1B 與 M2 的差距都跟著成交與股價走，是同時或落後指標，不能拿來預測下個月的漲跌。","ind":["settle_dep","m1b_gap"]},{"t":"口徑與時點寫清楚了嗎","d":"存放比有 72.4%、76.9%、69.6% 三種；放款有 48.85 兆、47.27 兆、43.37 兆元三種；M2 有日平均與期底。沒寫口徑的數字不能互相比較。","ind":["ldr","loans","m2"]},{"t":"有沒有被匯率換算影響","d":"外匯存款 9.59 兆元以當月匯率換算。新台幣大幅升值的月份，M2 年增率會被動下降，錢其實沒少（2025 年 5–6 月）。","ind":["fxdep","usdtwd","m2"]},{"t":"央行有沒有在反方向操作","d":"外資大進大出時，央行會用增發或減發定存單抵銷對銀行間資金的影響。只看外資進出金額，會高估國內資金鬆緊的變化。","ind":["ncd","excess"]},{"t":"這些池子有沒有重複計算","d":"銀行的負債是大家的存款，壽險的負債是家庭的保單，ETF 的持有人主要是家庭與壽險。規模可以比量級，不能相加。","ind":["wealth","life_fx","etf"]},{"t":"額度不等於實際金額","d":"國安基金額度上限 5,000 億元，但 2025-04 到 2026-01 的護盤實際只買了 122.50 億元。看政策工具要看實際動用多少。","ind":[]}]},{"id":"b1-crowd","title":"股市擁擠度檢查（13 項，上櫃另列一項）","kind":"checklist","intro":"想知道股市現在擠不擠時用。每一項只回答「跟它自己的歷史比，現在在哪」，最後數偏熱的項目；單一項偏熱不代表什麼，三四項同時偏熱才需要提高警覺。各項判讀是研究報告的推論（至 2026-09-18），不是官方分類。","items":[{"t":"融資餘額的金額與增速","d":"上市 5,940 億元（9/18），是 7/6 歷史高點 6,313 億的 94%；較去年底 +73.0%、年增 +122.6%，略快於市值（+63.5%）。判讀：偏熱。","ind":["margin"]},{"t":"融資占上市市值","d":"0.385%（高點 0.41%，7/6）；去年底 0.364%，2000 年約 4–5%。判讀：不熱，槓桿密度約為 2000 年的十分之一；但這只算看得見的融資。","ind":["margin","mcap"]},{"t":"上櫃融資占上櫃市值、上櫃日換手","d":"1.76%、1.91%（8 月）；上市同期 0.378%、0.63%。判讀：偏熱，中小型股的槓桿與換手密度是權值股的 3–5 倍，擁擠在這裡。","ind":["margin","otc_ratio"]},{"t":"融資維持率","d":"官方整戶約 175%（7/27）；民間推估 189.8%（9/18），民間版低點 130.3%（2025-04-09）、138.7%（2022-10-26）。判讀：離追繳線遠，但新部位還沒遇過下跌。只跟同一來源比。","ind":["maint"]},{"t":"當沖成交值占比","d":"40.99%（8 月）；9/18 單日約 31%；4–7 月在 36.9–39.0%。判讀：偏熱，約四成成交是當天沖掉的。","ind":["turnover"]},{"t":"成交值相對市值（上市日換手）","d":"9 月至 9/18 約 0.57%；6 月高峰 0.94%；2025 年 12 月約 0.51%。判讀：已降溫，指數在高檔，換手回到去年底的水準。","ind":["turnover","mcap"]},{"t":"有交易戶數與台積電股東人數","d":"有交易戶數 669 萬（7 月），高峰 693 萬（6 月），4 月 570 萬；台積電股東 305 萬人（去年底 186 萬）。判讀：偏熱，但進場速度已過高峰。","ind":["tdcc"]},{"t":"ETF 申購與定期定額","d":"定期定額 364 億元（7 月；4 月 291 億）；投信 7 月買超 2,569 億元，是今年單月最高，出現在大跌月。判讀：固定買盤仍在；全市場單月淨申購金額未確認。","ind":["etf","inst"]},{"t":"主動式與槓桿型 ETF 的擴張","d":"主動式 30 檔約 9,487 億元（16 個月從 0 開始）；台股正 2 約 3,899 億元；投信期貨淨多單 7.5 萬口（年初 2.7 萬口）。判讀：偏熱，是今年最明確的擁擠訊號。","ind":["etf","fut_oi"]},{"t":"大盤本益比與淨值比","d":"25.62 倍、4.03 倍（8 月底）；近 60 個月區間 9.39–31.78 倍、中位數 18.89 倍，現值約第 88 百分位。判讀：偏貴但在下降，前提是獲利不轉弱。","ind":["pe"]},{"t":"外資期貨淨空單（扣掉投信淨多單）","d":"外資 −76,110 口、投信 +75,110 口（9/18），相減約 1,000 口；7/17 約 1.1 萬口。判讀：中性，方向性空單很少。","ind":["fut_oi"]},{"t":"台指 VIX 與 P/C 比","d":"VIX 21.22（9/18），季線約 33；P/C 未平倉比 76.32%。判讀：中性，恐慌已退但還沒回到平靜；P/C 比用 5 日或 10 日平均看。","ind":["pcr_vix"]},{"t":"證券劃撥存款","d":"4.18 兆元（7 月底），約占上市市值 3.0%；5 月高點 4.50 兆元，2024 年底占 4.5%；6、7 月連兩月減少。判讀：中性偏弱。","ind":["settle_dep"]},{"t":"指數集中度","d":"台積電 41.48%、前十大 59.05%（8/31）。判讀：結構性風險，一家公司的法說與美國科技股就能決定指數方向。","ind":["tsmc_w"]}]},{"id":"b1-eight","title":"如果只能盯八個數","kind":"routine","intro":"時間有限時的最小組合：八個數涵蓋誰在買、用什麼錢買、槓桿多高、錢有沒有離開台灣。每個數都寫了更新頻率與現況（至 2026-09-18）；照頻率更新，跟上一筆比方向。","items":[{"t":"三大法人買賣超，以及三者合計的相反數","d":"每日。合計的相反數就是散戶、壽險、政府基金等國內買方的淨買賣。現況：今年三大法人以外的人約淨買 1.61 兆元（估計）。","ind":["inst","fini_flow_twse"]},{"t":"投信買賣超＋ETF 規模與發行單位數","d":"每日／每月。散戶的錢主要經 ETF 進成分股；規模要拆成新申購與淨值上漲。現況：投信今年 +7,636 億元；台股 ETF 約 7.87 兆元。","ind":["etf","inst"]},{"t":"融資餘額（上市、上櫃）÷市值，與增減速度","d":"每日約 21:00 後。上櫃要分開看。現況：上市 0.385%、上櫃約 1.8%；9/18 上市融資 5,940 億元，回到高點的 94%。","ind":["margin"]},{"t":"證券劃撥存款月增減","d":"每月 24 日前後。看停在交割戶的現金是增是減，並對照三大法人以外的人當月是淨買還是淨賣。現況：6、7 月連兩月減少。","ind":["settle_dep"]},{"t":"外資期貨淨空單−投信期貨淨多單","d":"每日 15:00 後。扣掉正 2 ETF 的對手部位，才是外資真正的方向性空單。現況：9/18 約 1,000 口；7/17 約 1.1 萬口。","ind":["fut_oi"]},{"t":"成交值÷市值，加上當沖占比","d":"每日／每月。換手的快慢，以及成交值裡有多少是當天沖銷。現況：日換手 0.57%（6 月 0.94%）；當沖約 39%（7 月）。","ind":["turnover"]},{"t":"台積電外資持股比與股東人數","d":"每日／每週。外資賣的就是它，散戶買的也是它。現況：69.22%（年初 72.76%）；305 萬人（年初 186 萬）。","ind":["tsmc_w","tdcc"]},{"t":"金管會外資淨匯入／匯出","d":"每月初。與買賣超是不同的統計，而且不扣盈餘匯出；要判斷錢有沒有離開台灣，還要看央行口徑與匯率。現況：1–8 月淨匯入約 905 億美元。","ind":["fini_flow_fsc","usdtwd"]}]},{"id":"b1-july","title":"練習：用六個步驟讀一次 2026 年 7 月","kind":"exercise","intro":"7 月有史上最大跌點（7/17）與最大漲點（7/31），適合練習把幾個指標串起來讀。每一步先看數字、自己回答，再看解答思路；解答是作者的推論，不是標準答案。","items":[{"t":"第一步：誰在賣、誰在買？","d":"7 月外資 −7,389 億、自營商避險 −2,975 億、投信 +2,569 億，三大法人合計 −7,951 億元。解答：合計的相反數是 +7,951 億元，買方是三大法人以外的人，加上經 ETF 進場的散戶。","ind":["inst"]},{"t":"第二步：買的人用什麼錢？","d":"7 月底證券劃撥存款月減 2,413 億元；上市融資從 7/6 的 6,313 億減到 7/30 的 4,939 億元。解答：買盤用的是交割戶的現金，不是融資；槓桿是減少的。","ind":["settle_dep","margin"]},{"t":"第三步：下跌有沒有清掉槓桿？","d":"7/6–7/30 指數跌約 14%，融資減 21.8%。解答：減幅大於跌幅，有強制賣出與認賠；民間維持率推估落到約 140–143%，接近過去波段低點時的區間（口徑有爭議）。","ind":["margin","maint"]},{"t":"第四步：賣壓在現貨還是期貨？","d":"7/17 外資現貨賣超 1,890 億元，期貨淨空單只增 1,736 口；外資空單超出投信多單的部分約 1.1 萬口。解答：賣壓在現貨，期貨沒有明顯的方向性放空。","ind":["fut_oi","fini_flow_twse"]},{"t":"第五步：散戶是進場還是退場？","d":"有交易戶數 6 月 693 萬 → 7 月 669 萬；自然人成交比重 51.5% → 48.9%；台積電股東 7/17 294 萬 → 7/31 310 萬人。解答：短線交易的人變少，逢跌買台積電的人變多。","ind":["tdcc","turnover"]},{"t":"第六步：之後要確認什麼？","d":"8 月外資買超 3,568 億元、指數漲 7%；融資七週加回七成。解答：風險偏好沒有被改變；等 9/24 前後的 8 月底劃撥存款，確認反彈有沒有場外新錢。","ind":["settle_dep","margin"]}]},{"id":"b2-monthly","title":"房市與銀行放款：每月檢查表（15 項）","kind":"checklist","intro":"每月底依「量、信用、政策、價」的順序看一遍。門檻是研究報告的經驗值（推論），用來分辨冷熱，不是買賣訊號。數字為 2026-09-20 時點的最新讀數。","items":[{"t":"六都買賣移轉棟數（每月 1 日）","d":"8 月 15,723 棟（−5.6%）。全國年化低於 27 萬棟算冷、高於 33 萬棟算熱；先排除政策截止日與交屋潮。","ind":["transfers"]},{"t":"五大銀行新承做房貸金額與利率","d":"7 月 691 億元、2.290%。單月超過 900 億元算熱、低於 600 億元算冷；利率走高而政策利率沒動，代表銀行額度緊。","ind":["newmort"]},{"t":"購置住宅貸款年增率","d":"7 月 4.52%。超過 8% 過熱、低於 4.5% 偏冷；餘額創新高不是訊號。","ind":["hloan"]},{"t":"建築貸款年增率（領先）","d":"7 月 −0.19%。由負轉正並連續 3 個月上升，才算建商重新借錢推案。","ind":["cloan"]},{"t":"個人理財週轉金年增率","d":"7 月 32.35%（央行每季揭露）。和融資餘額一起看股市槓桿；超過 20% 且續升代表槓桿在累積。","ind":["wm_loans","margin"]},{"t":"其他個人消費性貸款年增率","d":"7 月 9.58%（2025 年底 7.24%）。信用貸款加速，代表個人槓桿升溫。","ind":["loans"]},{"t":"72-2 比率與超過 27% 的銀行家數","d":"7 月 24.19%、27–28% 只有 1 家。全體超過 26% 且多家超過 28%，才有排隊撥款的風險。","ind":["r72"]},{"t":"不動產放款集中度","d":"7 月 34.44%（高點 37.61%，2024-06）。下降時拆開看：是不動產貸款變少，還是企業放款變多。","ind":["conc","loans"]},{"t":"央行理監事會（下次 12/17）","d":"看是否動到第 3 戶、法人、餘屋的 3 成；只動第 2 戶屬有限度放寬。","ind":["credit_ctrl","policy_rate"]},{"t":"房貸逾放餘額與比率","d":"7 月 94.25 億元、0.08%。比率很低，但餘額是 5 年新高；趨勢比水準重要。","ind":["npl"]},{"t":"房價指數（每季）","d":"同時看成屋（信義、永慶）與新案（國泰）；看年增率與各都的分歧，不要只看全國。","ind":["hprice"]},{"t":"房價所得比與貸款負擔率（每季）","d":"全國 9.5 倍（2026Q1）、負擔率 40.75%（2025Q4）。負擔率超過 40% 偏重、超過 50% 過重。","ind":["hprice"]},{"t":"待售新成屋與預售屋解約","d":"待售新成屋 11.25 萬宅（2025Q4）；2026 年 1–7 月解約 3,457 件，高於上年同期 1,906 件。是交屋潮的壓力指標。","ind":["transfers"]},{"t":"房地合一稅收（每月）","d":"6 月 45 億元、年增 6.3%。比移轉棟數更接近成交金額。","ind":["transfers"]},{"t":"建材營造類指數相對加權指數","d":"今年以來 −4.5% 對大盤 +62.9%。看政策事件日的反應幅度：2024-09-20 為 −6.26%，2026-09-18 為 +2.45%。","ind":["credit_ctrl","rs_line"]}]},{"id":"b2-ex-ratio","title":"練習：集中度下降，是房貸變少了嗎？","kind":"exercise","intro":"用 2026 年 3 月底到 7 月底的數字，練習把一個比率拆成分子與分母。每題先自己想，再看解答思路。","items":[{"t":"題目：集中度由 35.56% 降到 34.44%，先猜原因","d":"多數人會猜房貸變少。先不要下結論：比率下降有兩種可能，分子（不動產貸款）變小，或分母（總放款）變大。","ind":["conc"]},{"t":"第一步：看分子","d":"這 4 個月不動產貸款增加 1,718 億元，7 月底 15.35 兆元是歷史新高。分子沒有變小。","ind":["hloan","cloan"]},{"t":"第二步：看分母","d":"其他放款增加 1 兆 7,082 億元，年增率由 1 月 7.56% 升到 7 月 14.31%；AI 相關製造業上半年週轉金放款增加 9,113 億元。","ind":["loans"]},{"t":"第三步：算比例","d":"1,718 ÷（1,718＋17,082）≈ 9%。新增放款只有約一成去不動產，所以比率下降。結論：是分母效應。","ind":["conc"]},{"t":"延伸一：用同樣方法看 72-2 比率","d":"7 月不動產放款月增 0.45%、存款＋金融債月增 1.15%，比率由分母帶動下降。再想：企業放款成長放慢時，集中度會怎麼走？","ind":["r72","m2"]},{"t":"延伸二：新承做與餘額","d":"近 12 個月五大銀行新撥 6,695 億元，全體銀行房貸餘額只淨增 5,139 億元。差額是什麼？解答：還本與提前清償。","ind":["newmort","hloan"]}]},{"id":"b3-sfq","title":"存量、流量還是成交值？七個數字的分類練習","kind":"exercise","intro":"看到一個大數字，先分清楚它是哪一種，再決定能不能拿來比大小。每題先自己判斷，再看解答思路。數字都出自「錢去哪裡」這個房間。","items":[{"t":"複委託 2025 年 10.75 兆元","d":"成交值：買進加賣出都算。同年全台居民對外證券投資淨增加約 1.15 兆元（估計），那才是淨流出，而且還包含壽險、銀行與基金。","ind":["subbrok","fa"]},{"t":"國銀外幣存款 2026 上半年增加 1.07 兆元","d":"存量變動，但主要是匯率換算：美元升值，同一筆美元換成更多新台幣；以美元計幾乎沒增加。","ind":["fxdep","usdtwd"]},{"t":"債券 ETF 規模七週少 2,411 億元","d":"存量變動＝淨贖回＋債券價格下跌。2026 年 1–8 月累計淨贖回只有 503 億元，縮水的大頭是美債殖利率上升造成的評價損失。","ind":["bond_etf","fed"]},{"t":"壽險國外投資 2026 年 1 月少 8,306 億元","d":"會計口徑改變：接軌 IFRS 17 時做了資產重分類，不是壽險賣出海外債券。遇到口徑改變，新舊數字要分開看。","ind":["life_fx"]},{"t":"勞動基金 2026 上半年收益 2.2 兆元","d":"未實現的評價收益，不是現金流入；7 月台股重挫，單月就回吐約 2,460 億元（估計）。","ind":[]},{"t":"壽險總保費 2.6 兆元與初年度保費 1 兆元","d":"初年度保費才是新錢；總保費還包含舊保單的續年度分期款。真正的淨流入還要扣掉給付與解約金（金額未確認）。","ind":["fyp"]},{"t":"上市總市值今年多了約 60 兆元","d":"價格重估：總市值＝最後成交價×全部股數。同期外資賣超 1.41 兆元、三大法人以外買超約 1.61 兆元（估計），和 60 兆元差了幾十倍。","ind":["mcap","fini_flow_twse"]}]},{"id":"b3-monthly","title":"每月一次：檢查錢有沒有改道","kind":"routine","intro":"每月中旬資料到齊後花 15 分鐘看一遍。重點不是單一數字的高低，而是幾個方向有沒有同時改變。最後一項每季看一次。","items":[{"t":"壽險：避險比率與可承受升值幅度","d":"避險比率（7 月 42.94%）續降，而可承受升值幅度（約 12%）沒有跟著上升，代表曝險增加得比準備金快。","ind":["life_fx"]},{"t":"新台幣本月升貶幅","d":"拿單月升幅和壽險可承受的約 12% 比；2025 年 5 月單月升 6.98%，就把外價金由約 2,200 億元用到剩 188 億元。","ind":["usdtwd","life_fx"]},{"t":"初年度保費：傳統型與投資型分開看","d":"傳統型成長＝壽險有新錢要配置到國外債券；投資型成長＝跟著股市熱度，錢進的是保戶自選的基金。","ind":["fyp"]},{"t":"債券 ETF：規模、受益人數、淨申贖","d":"三個一起看，才分得出是價格下跌、散戶離開，還是法人調整；再對照美國 30 年期公債殖利率與匯率。","ind":["bond_etf","fed"]},{"t":"複委託成交值年增率","d":"和台股成交值年增率比，看散戶的注意力往哪邊移；不要把成交值當成流出金額。","ind":["subbrok","turnover"]},{"t":"基金：國內股票 ETF 與跨國類別誰在增加","d":"兩者的錢去向相反：前者進台股，後者換成外幣出海。規模變動要先扣掉價格漲跌。","ind":["funds","etf"]},{"t":"核准對外直接投資有沒有大案","d":"2026 年 1–8 月 623.9 億美元，約八成是台積電兩筆增資；核准不等於當月匯出。","ind":["fdi_out"]},{"t":"每季：金融帳淨流出對經常帳順差","d":"流出小於順差，差額進外匯存底、新台幣有升值壓力；流出大於順差（如 2026 上半年）代表錢出去得比賺進來快。","ind":["fa","ca","reserves"]}]},{"id":"b3-twdup","title":"新台幣急升時，先檢查這六件事","kind":"checklist","intro":"依 2025 年 5 月單月升值 6.98% 的經驗整理，是作者的推論。用途是判斷升值會不會從匯市傳到壽險與金融股，不是交易訊號。","items":[{"t":"單月升幅相對於壽險可承受幅度","d":"2026 年 7 月底，壽險的準備金可承受約 12% 升值（約 3.8 元）。升幅越接近這個數字，壓力越大。","ind":["usdtwd","life_fx"]},{"t":"外價金餘額還剩多少","d":"2025 年 5 月由約 2,200 億元降到 188 億元；2026 年 7 月底為 7,182 億元，另有特別盈餘公積 3,651 億元。","ind":["life_fx"]},{"t":"壽險有沒有急著加做避險","d":"避險比率突然上升，代表壽險在賣遠期美元，會再推升新台幣，形成自我加強。","ind":["life_fx","usdtwd"]},{"t":"債券 ETF 的新台幣淨值","d":"即使美債價格不動，新台幣升多少、淨值就少多少；再看受益人數有沒有跟著減少。","ind":["bond_etf"]},{"t":"外幣存款的新台幣金額","d":"升值時帳面金額會縮水，不代表有人把美元換回來；要看以美元計的金額。","ind":["fxdep"]},{"t":"居民對外證券投資有沒有轉為淨賣出","d":"2025 年第 2 季罕見淨減少 70.1 億美元，央行說明是保險公司與投資人減持美元與美債；要等季後約 50 天才看得到。","ind":["fa"]}]},{"id":"c1-daily","title":"每天 5 分鐘：收盤後看錢今天在哪裡（5 步）","kind":"routine","intro":"判讀輪動不是背知識，而是每天用同一套表格看同一批數字、寫下歸因、過一段時間回頭對答案。收盤後做，每步不超過 1 分鐘。","items":[{"t":"大盤三個數：漲跌、成交值、漲跌家數","d":"成交值跟自己記的 20 日均量比；上漲對下跌家數看出是大家漲，還是只有權值股漲。9/18 為 +1.93%、1 兆 1,423 億元、748 家對 251 家。","ind":["turnover"]},{"t":"類股漲跌幅排行：最強 3 類、最弱 3 類","d":"記下來，跟昨天比是不是同一批。連續幾天同一批，才是輪動；每天換一批，多半是雜訊。","ind":["rs_line"]},{"t":"成交值前 20 名個股屬於哪些族群","d":"這比類股指數更接近「今天的錢在哪」，因為官方類股常被一檔龍頭主導。對照族群表找出它們的族群。","ind":["sec_share"]},{"t":"三大法人買賣超與外資期貨淨部位","d":"外資決定大型權值股方向，投信決定中小型股方向；連續性比單日重要。9/18 外資買超 869.94 億元、台指期淨空單 76,110 口。","ind":["inst","fut_oi","fini_flow_twse"]},{"t":"寫一行歸因","d":"「今天錢從＿＿到＿＿；我猜是第＿類原因（對照十二類原因）。」不確定就寫不確定；重點是留下紀錄，之後才能對答案。","ind":[]}]},{"id":"c1-weekly","title":"每週 30 分鐘：週末畫相對強弱、看擁擠與日曆（7 步）","kind":"routine","intro":"週末做。重點是把「漲跌」換成「相對大盤的強弱」，並且先想好下週的事件。本站輪動探索器已算好第 1–3 步，可以直接對照。","items":[{"t":"類股週報酬排序表","d":"32 類加上櫃買、中型 100、高股息指數，由高到低排；標出連續 3 週在前 5 名或後 5 名的類股。","ind":["dispersion"]},{"t":"畫 5 條相對強弱線","d":"半導體、電子零組件、金融、櫃買、未含金融電子，各除以加權指數。線往上＝跑贏大盤；轉折比絕對位置重要，連續 2–4 週同方向才算數。","ind":["rs_line","otc_ratio"]},{"t":"成交占比 ÷ 市值比重","d":"看電子（不含半導體）、電子零組件、金融三個比值。9/18 分別約 1.57、1.5–1.6、0.53；比值創高是擁擠訊號。","ind":["sec_share"]},{"t":"籌碼：融資餘額週變化","d":"上市加上櫃。融資增幅大於指數漲幅＝槓桿在加速；今年以來融資 +73%、加權 +62.9%。","ind":["margin","maint"]},{"t":"ETF：規模變化與主動式 ETF 的加減碼","d":"0050 與三檔高股息 ETF 的規模、主動式 ETF 每日揭露的持股方向。它們照規則買賣，不看價格。","ind":["etf"]},{"t":"看下週日曆，先想好兩種結果","d":"例如聯準會、月營收、指數調整生效日：先寫下「如果結果是 A 或 B，哪些板塊會怎麼動」，事後才知道自己錯在哪。","ind":["fed","rev_monthly"]},{"t":"對答案","d":"把兩週前寫的預測拿出來打分：對、錯、或對了但理由錯。","ind":[]}]},{"id":"c1-monthly","title":"每月 1 小時：營收與訂單出完之後（5 步）","kind":"routine","intro":"每月 11–12 日月營收出完做一次，20 日後外銷訂單出完再補一次。目的是檢查基本面換手的方向有沒有改變。","items":[{"t":"月營收：每個關心的族群挑 3 檔代表股","d":"記年增率，看哪個族群在加速、哪個在減速。到公開資訊觀測站查，財報狗與 Goodinfo 有整理好的圖。","ind":["rev_monthly"]},{"t":"外銷訂單與出口的產品別年增率","d":"對照類股：資通訊→伺服器鏈；電子產品→半導體；機械→工具機與自動化；基本金屬→鋼鐵；塑橡膠→塑化。","ind":["orders","exports"]},{"t":"期交所權重表（月底更新）","d":"看台積電權重，以及前 20 大換了誰。名單變動就是輪動的結果：8/31 前 15 大裡只有 2 檔金融、1 檔傳產（南亞）。","ind":["tsmc_w"]},{"t":"類股月報酬對照上月的看法","d":"把猜錯的歸因重寫一次；三個月後統計哪一類原因最常看錯。","ind":["rs_line"]},{"t":"每季重算一次相關矩陣","d":"到輪動探索器切換期間，看三個群組（內需防禦、電子、原物料）有沒有改變。相關結構不固定，兩段期間的相關矩陣只有 0.43 相關。","ind":["dispersion"]}]},{"id":"c1-log","title":"輪動觀察記錄範本（一張試算表，7 欄）","kind":"template","intro":"工程師做實驗怎麼記錄，這裡就怎麼記錄。每天一列；重點是寫下可以被否證的預測，之後回頭檢驗。","items":[{"t":"日期","d":"交易日。","ind":[]},{"t":"現象（只寫數字）","d":"例：「電子零組件 +3.26%、金融 −0.96%、成交 1.14 兆元、上漲 748 家」。不要寫形容詞。","ind":["turnover"]},{"t":"歸因（十二類選一到兩類）","d":"例：「⑥ 聯準會結果確定後反彈，加上 ② 電子跌多反彈」。","ind":[]},{"t":"證據強度","d":"三選一：有數字支持／只是新聞說法／純猜。","ind":[]},{"t":"預測：方向＋期間＋否證條件","d":"例：「兩週內電子零組件相對強弱線續創高；若跌破 9/15 低點就算錯」。沒有否證條件的預測無法檢驗。","ind":["rs_line"]},{"t":"回頭檢驗（2 週、1 個月後）","d":"對／錯／對了但理由錯。","ind":[]},{"t":"學到什麼","d":"一句話。三個月後統計：多數人會發現自己高估基本面（①），低估被動資金、籌碼、日曆（④⑩⑪）。","ind":["etf","margin"]}]},{"id":"c1-exit-check","title":"輪動還是撤出：六項檢查","kind":"checklist","intro":"大盤下跌或某個板塊急跌時用。勾到「撤出」那一側的項目越多，越像錢離開股市，而不是換位置。這是作者的判讀框架＝推論。","items":[{"t":"大盤成交值","d":"輪動：持平或放大。撤出：急縮（沒人買），或恐慌爆量大跌。參考：9 月總成交值平均約 8,750 億元、最低 6,347 億元（9/15）。","ind":["turnover"]},{"t":"漲跌家數","d":"輪動：漲跌互見，有明確的上漲類股。撤出：下跌家數壓倒性多、跌停家數多。","ind":[]},{"t":"類股是否同向","d":"輪動：有類股逆勢上漲。撤出：全部類股同向下跌，只有防禦股跌得少（2025-04-07 多數類股跌 9% 以上）。","ind":["rs_line","dispersion"]},{"t":"櫃買對加權","d":"撤出時櫃買通常跌得比加權重，因為中小型股與融資部位先被賣。","ind":["otc_ratio"]},{"t":"融資餘額","d":"輪動：緩步變動。撤出：連續大減。2025 年 4 月不到兩週由 2,990 億元降到 2,140 億元（−28%）；現在是 5,940 億元。","ind":["margin","maint"]},{"t":"外資、匯率、期貨","d":"撤出時常見外資大賣超、台幣同步貶值、外資期貨淨空單增加三者同時出現。","ind":["fini_flow_twse","usdtwd","fut_oi"]}]},{"id":"c1-four-days","title":"練習題：四個交易日，各是輪動、觀望還是撤出？","kind":"exercise","intro":"先遮住解答，用上面的六項檢查自己判斷，再對照。資料都來自證交所當日的類股指數與成交統計。","items":[{"t":"2025-04-07：加權 −9.70%，多數類股跌 9% 以上","d":"解答思路：全部類股同向、接近跌停，只有通信網路 −5.90%、貿易百貨 −7.99% 稍微抗跌；之後不到兩週融資 −28%。這是撤出，而且是槓桿被迫出場。","ind":["margin"]},{"t":"2026-09-15：加權 −0.77%，成交 6,347 億元","d":"解答思路：成交值是 9 月最低，32 類只有 5 類小漲；沒人追也沒人賣，是等聯準會結果的觀望，不是撤出。隔天起連漲三天。","ind":["turnover","fed"]},{"t":"2026-09-11：加權 −1.61%，金融 +1.12%","d":"解答思路：電子 −1.93%，但金融、航運、數位雲端逆勢上漲，有明確的上漲類股，所以是輪動：電子獲利了結，部分資金移到金融。","ind":["rs_line"]},{"t":"2026-09-18：加權 +1.93%，成交 1 兆 1,423 億元","d":"解答思路：電子零組件 +3.26%、金融 −0.96%，上漲 748 家、外資買超 870 億元。量增價漲，錢從金融回到電子，是回流加上反向輪動。","ind":["inst","sec_share"]}]},{"id":"c2-rotation","title":"自己追蹤題材輪動的最小作法","kind":"routine","intro":"每週五與每月底各花十分鐘，抄幾個數字就能看出資金現在在主線、在中小型股，還是在避險。判讀規則是作者的歸納，屬於推論。","items":[{"t":"每週五：抄證交所週統計的三個數字","d":"中央社每週五傍晚會轉述證交所週統計：漲最多的類股、跌最多的類股、成交值前三大產業的比重。9/18 當週是半導體 39.36%、電子零組件 21.88%、光電 7.68%。","ind":["sec_share"]},{"t":"每月最後一個交易日：抄類股指數","d":"把證交所每日收盤的類股指數抄下來，和上月底相比，算出各類股當月漲跌幅；本頁「類股表現」的圖就是這樣算出來的。","ind":["rs_line"]},{"t":"情況一：半導體類漲幅大於大盤","d":"主線在走，指數會動。台積電一檔占 41.48%，它漲、指數就漲。","ind":["tsmc_w"]},{"t":"情況二：半導體輸大盤，電子零組件、光電贏大盤","d":"主線休息、中小型股輪動：指數不太動，但個股很熱、處置股變多。8 月就是這種情況（半導體 +2.7%、電子零組件 +25.1%）。","ind":["otc_ratio","dispersion"]},{"t":"情況三：金融與油電燃氣領漲、電子領跌","d":"避險式輪動，通常伴隨利率或油價事件。9 月至 9/18 就是這種情況（油電燃氣 +15.9%、金融 +8.2%、電子零組件 −6.0%）。","ind":["oil","fed"]},{"t":"每月 10 日前：對一次月營收","d":"挑你關心的題材，各看一到兩家代表公司的月營收年增率與月增率。營收還在加速、股價卻不漲，代表市場預期已經更高。","ind":["rev_monthly","tsmc_rev"]}]},{"id":"c2-newtheme","title":"看到一個新題材時先問的六個問題","kind":"checklist","intro":"對應本頁的六個評分維度。用來分辨「會影響大盤的題材」和「只是新聞很多的題材」，不是用來判斷會不會漲。這是作者的框架，屬於推論。","items":[{"t":"代表股在加權指數的權重合計多少？","d":"查期交所每月的成分股權重表。合計不到 0.5% 的題材（資安、量子、綠能）再熱也動不了指數；上櫃公司不在表內，要另外看櫃買。","ind":["tsmc_w","otc_ratio"]},{"t":"成交值占大盤多少？","d":"資訊服務類 9/18 成交值 24.7 億元，只占大盤 0.2%；半導體一週就占 39.36%。成交占比小，代表進出的資金少、價格容易被少量資金推動。","ind":["sec_share","turnover"]},{"t":"已經反映在營收上了嗎？","d":"分三級：已在營收（CCL、AI 伺服器代工、記憶體）、有訂單能見度但還沒認列（CPO、800V 高壓直流）、還沒有營收（人形機器人、量子）。","ind":["rev_monthly"]},{"t":"代表公司最近一個月營收年增多少？","d":"年增 100% 以上（CCL、AI 伺服器代工、記憶體）和個位數（重電）是兩種題材；年增率高但月增轉負，要留意動能是否到頂。","ind":["rev_monthly"]},{"t":"會帶動幾個類股？","d":"只帶動一個類股的題材（生技、資安）對輪動影響小；台積電、CCL 這類會同時帶動材料、設備、封測等多個次產業。","ind":["dispersion"]},{"t":"代表股有沒有進處置名單？","d":"8/1–9/18 上市共 48 筆處置公告、38 檔。處置期間改成隔一段時間才撮合一次，流動性驟降；處置多，通常代表這個題材的短線資金已經很擁擠。","ind":["margin"]}]},{"id":"c2-sept-ex","title":"練習：把 9 月中旬的總體事件和類股表現對起來","kind":"exercise","intro":"用本頁已有的數字練習一次：事件發生時，哪些類股先動、往哪個方向、事後怎麼確認。每一步先自己想，再看解答思路。","items":[{"t":"第 1 步：列出事件","d":"9/2 布蘭特 95 美元、9/18 漲到 103.87 美元；9/11–15 台股三天跌 1,429 點；9/16 聯準會升息 1 碼；9/17 央行不動利率並放寬房貸；9/16–18 台股三天漲 1,669 點。","ind":["oil","fed","policy_rate"]},{"t":"第 2 步：先猜哪些類股受惠、哪些受害","d":"思路：油價漲 → 煉油受惠；升息 → 銀行利差受惠、高本益比股票評價受壓。所以應該是油電燃氣、金融領漲，今年漲最多、本益比最高的 AI 零件股領跌。","ind":["pe"]},{"t":"第 3 步：對答案","d":"9 月至 9/18：油電燃氣 +15.9%、金融 +8.2%；電子零組件 −6.0%、光電 −6.0%、生技 −8.0%。方向和推論一致，屬於避險式輪動。","ind":["sec_share"]},{"t":"第 4 步：為什麼升息後反而漲？","d":"會前三天已先跌 1,429 點，市場事前反映；9/16 結果沒有比預期更差，9/18 外資單日買超 869.9 億元，買的是南亞科、台積電、聯發科。股價反映的是「和預期差多少」。","ind":["fini_flow_twse","fut_oi"]},{"t":"第 5 步：哪些數字會推翻這個解讀？","d":"如果油價回到 100 美元以下、油電燃氣卻續漲，或升息預期降溫、AI 零件股仍續跌，就代表原因不在利率與油價，要回頭檢查訂單與營收。","ind":["rev_monthly","capex_csp"]}]},{"id":"c3-dash","title":"AIDC 命題失效訊號檢查（15 項）","kind":"checklist","intro":"每月或每季更新一次。領先指標 8 項裡有 3 項以上到警訊，才算股價那一半出現失效風險；同時指標開始轉弱，才算需求那一半失效。門檻都是研究報告建議的估計值，燈號是判讀，請依自己的觀察調整。","items":[{"t":"L1 雲端大廠資本支出指引的修正方向（領先）","d":"現在：3 家上修、1 家持平（扣除會計變更）＝平穩。門檻：任一家因非會計因素下修＝留意；兩家以上，或出現「2027 年持平／放緩」＝警訊。","ind":["capex_csp"]},{"t":"L2 資本支出÷營運現金流、自由現金流（領先）","d":"現在：Alphabet 115%、亞馬遜 105%、甲骨文 124%＝留意。門檻：三家以上連兩季超過 100%，且信用利差同時轉壞。","ind":["credit_spread","capex_csp"]},{"t":"L3 美國公司債信用利差（領先）","d":"現在：投資級 0.78%、高收益 2.70%（9/17）＝平穩。門檻：投資級升破 1.2%、高收益升破 4.5%。看的是由低點快速走高，不是水準高低。","ind":["credit_spread"]},{"t":"L4 輝達下季指引、存貨、收款天數（領先）","d":"現在：指引 1,080 億美元（隱含季增約 12%）、收款 60 天＝平穩，收款天數單項留意。門檻：隱含季增低於 5% 或低於共識；收款超過 70 天；存貨增速連兩季高於營收。","ind":["nvda"]},{"t":"L5 美國 10 年期殖利率與聯準會利率（領先）","d":"現在：4.94%（9/17），9/15–16 碰到 5%；9/16 升 1 碼至 3.75–4.00%＝留意。門檻：10 年期站穩 5% 以上，或聯準會再增加預告的升息次數。","ind":["fed"]},{"t":"L6 記憶體合約價（領先）","d":"現在：伺服器 DRAM 合約價 2026 年估漲約 270%＝留意（極端值，且擠壓下游毛利）。失效門檻：出現第一次季減，目前沒有觸發。","ind":["dram"]},{"t":"L7 費半相對 S&P 500（領先）","d":"現在：SOXX 距 52 週高點 −18.7%、SPY −2.3%（9/18）＝留意，接近警訊。門檻：比值線跌破自己的 200 日均線超過一個月。","ind":["sox_rel"]},{"t":"L8 外資買賣超與台積電 ADR 溢價（領先）","d":"現在：7 月外資 −7,389 億、9/1–18 −801 億；ADR 溢價約 +11.8%（估計）＝留意。門檻：單月賣超逾 5,000 億元，且溢價同步縮到 5% 以下。","ind":["fini_flow_twse","adr"]},{"t":"C1 台積電月營收年增率三個月平均（同時）","d":"現在：55.3%（6–8 月）＝平穩。門檻：三個月平均掉到 25% 以下，且月增連兩個月為負。下次公布 10/8。","ind":["tsmc_rev"]},{"t":"C2 代工廠月營收年增率與其變化（同時）","d":"現在：廣達 +177%、緯創 +166%、鴻海 +52%、緯穎 +50%、英業達 +36%＝平穩。門檻：非世代交替期間連 2–3 個月月減，且公司說法出現「遞延」。","ind":["rev_monthly"]},{"t":"C3 零組件營收廣度（同時）","d":"現在：19 家中 17 家年增超過 30%＝平穩。門檻：比例掉到一半以下。掉出去的公司若集中在同一族群，就去查那個族群發生什麼事。","ind":["rev_monthly"]},{"t":"C4 出口與外銷訂單（同時）","d":"現在：電子零組件 +58.0%、資通 +41.8%、對美 +20.7%＝平穩，對美單項留意。門檻：資通產品出口年增掉到 +10% 以下；外銷訂單資通類轉負。","ind":["exports","orders"]},{"t":"C5 電子類成交占比（同時）","d":"現在：9/14 當週 85.6%（本站計算）、9/18 單日 84.5%（報告計算）＝留意。門檻：連續多日超過 85%，且成交量放大、股價不漲。","ind":["sec_share"]},{"t":"G1 供應鏈毛利率（落後）","d":"現在：輝達 75.0%、預告降到 71–72%；台達電第 2 季毛利率季減 1.36 個百分點＝留意。門檻：營收創高，但毛利「金額」不再成長。","ind":["nvda"]},{"t":"G2 主計總處 GDP 與出口預測的修正（落後）","d":"現在：2026 年 11.05%（上修）、第 4 季 5.37%、2027 年 6.04%＝平穩。門檻：出現下修，且理由提到雲端資本支出。","ind":["gdp"]},{"t":"最後：數一數領先指標有幾個到警訊","d":"領先 8 項有 3 項以上到警訊＝問題 B（股價）出現失效風險；同時指標轉弱＝問題 A（需求）失效。2026-09-18：警訊 0、留意 7、平穩 8。","ind":[]}]},{"id":"c3-diy","title":"八個可以自己動手做的探索","kind":"exercise","intro":"回答「有辦法探索嗎」：八個用公開資料就能做的練習，每個都附判讀方式與最常踩的陷阱。第 2、3、4 項在輪動探索器已有現成的圖，可以先從那裡看起。","items":[{"t":"探索 1：各族群月營收年增率，看誰先轉折","d":"自訂 6–8 個籃子，每籃用「營收加總」算年增率，取三個月平均，再看它和三個月前的差。最早見頂的籃子最值得追。陷阱：基期、農曆年、記憶體漲價墊高代工廠營收。","ind":["rev_monthly","tsmc_rev"]},{"t":"探索 2：族群相對大盤的強弱線","d":"族群指數÷加權指數，加畫 50 日與 200 日均線；線往上＝贏大盤。陷阱：加權指數四成是台積電，建議同時用未含電子股指數或等權重籃子當分母；類股指數不含上櫃股。","ind":["rs_line","tsmc_w"]},{"t":"探索 3：電子類成交占比是否過度集中","d":"電子類成交金額÷各大類加總，再拆半導體、電子零組件、電腦及週邊。逼近 85% 且指數漲不動＝擁擠；子類消長＝電子內部輪動。陷阱：股價上漲會自動推高占比，用 5 日或 20 日平均。","ind":["sec_share"]},{"t":"探索 4：扣掉大盤後的族群相關性","d":"各族群日報酬減掉大盤報酬，算 60 日滾動相關係數。平常不高；突然一起升到接近 1 且同步下跌，代表市場在賣 AI 這個共同因子，或在降槓桿。陷阱：扣大盤幾乎等於扣台積電。","ind":["dispersion"]},{"t":"探索 5：雲端大廠指引修正表","d":"公司×季度：當季資本支出、全年指引上下緣、修正方向、營運現金流、自由現金流、新增舉債、財報隔日股價反應。陷阱：會計年度不同、融資租賃口徑、會計變更、記憶體漲價占比。","ind":["capex_csp","credit_spread"]},{"t":"探索 6：「好消息、壞反應」日誌","d":"追蹤 20–30 檔個股，記錄營收創高或指引上修後，隔日相對大盤為負的比例；比例升高＝預期已經飽和。陷阱：單日雜訊大，要看比例的趨勢；除權息日要還原。","ind":["rev_monthly"]},{"t":"探索 7：本益比對營收年增率的散佈圖","d":"橫軸放近三個月營收年增率、縱軸放本益比。右下角多半是低毛利代工；左上角是市場預付未來的規格升級。離同成長率同業最遠的族群，預期最滿。陷阱：除權後本益比會失真。","ind":["pe","rev_monthly"]},{"t":"探索 8：台積電 ADR 溢價對外資買賣超","d":"溢價＝ADR 價格×匯率÷5÷台積電收盤價−1，和外資 20 日累計買賣超畫在一起。溢價擴大而外資賣超＝海外資金偏好買 ADR；兩者同步回落＝海外熱度降溫。陷阱：兩地收盤時間差。","ind":["adr","fini_flow_twse"]}]},{"id":"c3-routine","title":"AIDC 命題的追蹤節奏","kind":"routine","intro":"把失效訊號儀表板拆成固定節奏。每次只回答兩個問題：這個新數字是在回答需求（A）還是股價（B）？它有沒有靠近門檻？","items":[{"t":"每個交易日（一分鐘）","d":"看四個數：公司債信用利差、美國 10 年期公債殖利率、SOXX÷SPY 比值、電子類成交占比。看的是由低點快速走高或跌破長期均線，不是單日漲跌。","ind":["credit_spread","fed","sox_rel","sec_share"]},{"t":"每月 7–10 日","d":"財政部出口（電子零組件、資通產品、對美三個年增率）、台積電月營收（三個月平均）、代工廠與零組件月營收（年增超過 30% 的家數）。","ind":["exports","tsmc_rev","rev_monthly"]},{"t":"每月 20 日前後","d":"經濟部外銷訂單：看資訊通信類與電子產品的年增率。外銷訂單含海外生產，不等於台灣出口。","ind":["orders"]},{"t":"每季財報季","d":"1、4、7、10 月底看四大雲端的資本支出指引、自由現金流、發債；2、5、8、11 月下旬看輝達的下季指引、存貨、收款天數。記下修正方向與財報隔日的股價反應。","ind":["capex_csp","credit_spread","nvda"]},{"t":"每季季報後","d":"季報期限（5/15、8/14、11/14、隔年 3/31）之後，比較供應鏈公司的營收成長與毛利「金額」成長；2、5、8、11 月看主計總處預測有沒有下修。","ind":["gdp","rev_monthly"]}]}],"unconf":[{"item":"2026 年 8 月外銷訂單","note":"研究時（9/20）經濟部尚未發布，報告推測 9/21 公布，本站共用日曆列 9/22；頁面只用 7 月實際值與經濟部對 8 月的預估 970–990 億美元。","key":"A1"},{"item":"壽險避險比率 42.94%（報告為 42.89%）與國外投資總額","note":"報告的 42.89%（2026-06）取自使用者既有頁面、未重查，本站共用數字為 42.94%（2026 年中）；2025 年 5 月壽險匯損金額與金管會因應措施也沒有一手數字。","key":"A1"},{"item":"央行遠期與換匯部位 760.87 億美元（2026-03-31）的經濟意義","note":"央行表上列在短倉（未來一年的外幣交付義務），與「央行用換匯提供美元給銀行與壽險」的常見說法如何對應，無法判定。","key":"A1"},{"item":"前 7 月外資賣超 2.28 兆元 對 證交所週報 1.69 兆元","note":"媒體引用的 2.28 兆元推測含上櫃或外資自營商，差異原因未確認；8 月買超也有 3,568 億、約 3,700 億、2,222 億元三個口徑並存。","key":"A1"},{"item":"金管會「本國銀行外幣存款」16.46 兆元的涵蓋範圍","note":"推測包含國際金融業務分行與海外分行，所以比央行貨幣統計口徑的 9.59 兆元多約 7 兆元；口徑定義未確認。","key":"A1"},{"item":"2025 年經常帳占 GDP：19.5% 或 17.4%","note":"19.5% 是美國財政部匯率報告的算法（央行轉述）；Trading Economics 列 17.4%，推測分母用較早的 GDP 預估。2022 年比率的 GDP 分母為記憶值。","key":"A1"},{"item":"「其他投資」中貿易授信與國外存款各占多少","note":"央行只在新聞稿用文字說明主因，沒有拆分金額；「應收帳款將來收現會反轉成流入」是本站推論。","key":"A1"},{"item":"2013–2019 年順差主要經由壽險買國外債券流出","note":"數字是央行年表的；把這段期間歸給壽險業，是依央行歷年說明的記憶，未逐年查證。","key":"A1"},{"item":"台美投資備忘錄的分年時程、貿易協定的審議與生效進度","note":"備忘錄未公布分年投資時程；貿易協定依法送立法院審議，進度未確認。2,500 億、2,650 億美元都是多年期上限。","key":"A1"},{"item":"對外直接投資累計占比：美國 18.7% 或 18.3%（2018–2025 年）","note":"央行 2026-09-17 參考資料第 6 章兩次擷取得到不同數值，建議核對原檔。","key":"A1"},{"item":"聯準會 9/16 決議與經濟預測的細節","note":"來自媒體與券商整理（Fox Business、Charles Schwab），聯準會官網原件未開啟；標普 500 當日跌幅兩個來源不同（−0.5% 與約 −1%）。","key":"A1"},{"item":"歷史匯價與幾個歷史事件的記憶值","note":"2008、2011、2020–21、2022 年的匯價高低點，2015–16 與 2022–23 年出口連續負成長月數，2018 年對美出口占比等，報告標為記憶值；頁面未引用具體數字。","key":"A1"},{"item":"國際板債券流通餘額、外資借券餘額、存託憑證轉換金額、OBU 資產總額","note":"本次均未查到。境外資金匯回專法的 3,351 億元為銀行主管引述，非財政部官方結算數。加密資產跨境金流沒有可靠官方統計。","key":"A1"},{"item":"由 PDF 擷取的表格數字","note":"國際收支年表、出進口外匯收支、央行外幣流動性表都經工具轉寫；主要列已用恆等式與交叉來源驗算，仍建議對原檔抽查。2025 年 1、2 月外匯存底同值，可能是轉寫重複。","key":"A1"},{"item":"2026 年 7 月海關出超約 172 億美元","note":"由 8 月出口月增 9.4%、進口月增 3.4% 反推 7 月出口約 753 億、進口約 581 億美元，未查原始數，屬估計。","key":"A1"},{"item":"2026 年 8 月 M1B、M2 與證券劃撥存款","note":"央行尚未發布，依往例 9/24 前後公布。本頁貨幣面最新月份是 2026 年 7 月；7 月的死亡交叉是否延續要等這份資料。","key":"A2"},{"item":"2023 年 10 月 M1B、M2 年增率；2009 年全年平均","note":"2023-10 原始新聞稿未找到，研究報告由全年平均反推約 3.3%、5.6%（估計），圖上留空。2009 年 12 月新聞稿連結失效，圖上用官方的 1–11 月平均 15.31%、7.32%。","key":"A2"},{"item":"本國銀行平均資本適足率的小數位、LCR、NSFR","note":"央行金融穩定報告只能確認 2025 年底為「15.x%」，PDF 擷取缺字；流動性覆蓋比率與淨穩定資金比率的平均值同樣讀不到。資本面的放款空間估計因此只能當量級參考。","key":"A2"},{"item":"新青安、都更危老排除於銀行法 72-2 的函釋日期與文號","note":"央行 9/17 參考資料有寫「不計入限額」，但金管會函釋日期與文號未查到；各銀行個別比率也只確認「無人超過 28%、1 家在 27–28%」。","key":"A2"},{"item":"存放比 2000 年以來的長期數列","note":"只取得 2024、2025 年底官方值（72.31%、72.43%）與 2024–2026 年自算值。「2000 年前後接近九成」屬記憶、未查證，本頁未引用。","key":"A2"},{"item":"國富統計：每戶與每人平均淨值、家庭資產結構細項","note":"新聞稿附件與表 6 位於憑證錯誤的網域，無法讀取。本頁每人約 785 萬元、每戶約 1,960 萬元是用人口與戶數約數自算的估計，不是官方數字。","key":"A2"},{"item":"主計總處對 2026 年超額儲蓄、儲蓄率的預測","note":"數字在 2026-08-14 新聞稿附表 5，無法讀取。本頁用央行國際收支的經常帳順差替代；2024 年 4.01 兆元為金管會專網引述，研究報告未重查。","key":"A2"},{"item":"2026 年上市櫃現金股利的官方總額與各月分布","note":"只有銀行業者 2026-07-02 的估計值約 2.5 兆元，證交所未見官方統計。據此算出的殖利率約 1.6% 分子含上櫃、分母只有上市，屬估計。","key":"A2"},{"item":"購置住宅貸款 2026 年 7 月的絕對金額","note":"研究報告只確認 2025 年底 11.58 兆元與 2026-07 年增率 4.52%，自行推算約 11.7–11.8 兆元；本頁依全站共用數字採 11.89 兆元（房市分頁的來源）。","key":"A2"},{"item":"壽險業匯率避險比率","note":"研究報告引用 42.89%（2026-06，未重新查證），央行金融穩定報告 2025 年底為「50.x%」（缺字）；本頁依全站共用數字採 42.94%（2026 年中）。","key":"A2"},{"item":"上市融資餘額：央行記者會口徑與證交所口徑不一致","note":"央行記者會轉述 2026-06 底 8,035 億元、7 月底 6,735 億元；全站共用數字為 5,940 億元（9/18）、高點 6,313 億元（7/6）。口徑差異未釐清，本頁未引用前者。","key":"A2"},{"item":"外資今年是「匯出」還是「匯入」","note":"央行說明 7 月 M2 下降主因是外資淨匯出，證交所口徑今年賣超 1.41 兆元；但金管會口徑 1–8 月淨匯入 905 億美元。三者口徑不同，不能直接互相推論。","key":"A2"},{"item":"外國人新台幣存款 3,125 億元是哪一年以來最高","note":"中央社、經濟日報寫 2021 年 6 月以來最高，旺得富同日報導寫 2022 年 6 月以來，兩說不一致。","key":"A2"},{"item":"台股 ETF 與債券 ETF 的分項規模；退撫、勞保基金配置","note":"投信投顧公會分類頁只列 ETF 合計 10.34 兆元（另有主動式 0.99 兆元）；退撫基金與勞保基金的資產配置本次未取得。","key":"A2"},{"item":"央行簡報「1 年期 NCD」與其他建議複核的數字","note":"簡報的 1 年期 NCD 1.723%（2026-09）與 364 天期定存單 9/3 得標利率 1.643% 不同，數列定義未確認。另有經 PDF 擷取的數字待複核：7 天期定存單利率 0.825%、1–7 月銀行稅前盈餘約 4,241 億元，本頁未引用。","key":"A2"},{"item":"市值對 GDP 比約 505–520%（2026-08 月底）","note":"分母名目 GDP 未取得主計總處原始表，用記憶值（2026 年約 31–32 兆元）推算；分母用哪一版預測，結果可差十幾個百分點。扣掉台積電約 315% 同樣是估計。","key":"B1"},{"item":"三大法人以外的人今年約買超 1.61 兆元","note":"由三大法人合計（−1 兆 6,057 億元）反推，分不出散戶、壽險、政府基金、公司各是多少，屬估計；這群人沒有每日官方資料。","key":"B1"},{"item":"外資持股市值與比重的 2026 年最新值","note":"B1 報告未取得月值（證期局 ods 檔無法讀取），只粗估約 70 兆元。頁面引用 A1 報告的證交所週統計：9/11 為 72.09 兆元、占上市市值 48.04%；證期局上市櫃口徑 2025 年底為 45.4%，兩者口徑不同。","key":"B1"},{"item":"外資今年減持台積電約 1.9 兆元","note":"由持股減少約 91.7 萬張×今年 1–8 月成交均價約 2,110 元估算，不是實際成交金額；「台積電以外外資合計買超」是由此推得。","key":"B1"},{"item":"融資維持率：7 月底官方約 175%、民間約 143%／140.38%","note":"口徑不同（整戶與部位）。民間各家公式不同：仍在更新的一家 9/18 為 189.8%，且 7 月沒有跌破 140%，與財經M平方的 140.38% 不一致；各家 7 月最低值未查到。","key":"B1"},{"item":"台股 ETF 合計約 7.87 兆元、各月淨申購金額","note":"規模由研究報告逐檔加總（轉錄 240 檔，可能漏列小型 ETF；端點未標資料日）。各月淨申購、不重複受益人數、0050 年初規模未取得；「今年淨申購約 0.6–0.8 兆元」用的年初規模是記憶值。","key":"B1"},{"item":"不限用途款項借貸、股票質押、信貸與房貸流入股市的金額","note":"餘額都未取得，也未查到金管會或央行 2026 年的正式示警；只有證交所 7/29 聲明「整戶維持率仍遠高於 130%」的間接線索。","key":"B1"},{"item":"借券賣出餘額、證券總開戶數、8 月集中市場相關數據","note":"借券餘額與開戶數（含年輕族群占比）未取得，開戶數以「有交易戶數」替代。8 月的當沖占比、有交易戶數、定期定額到 9/20 尚未發布；5/29 單日成交值 1.917 兆元的原因未查。","key":"B1"},{"item":"壽險國內股票部位、勞動基金國內股票配置、國安基金持股","note":"只查到勞動基金整體規模 8 兆 8,955 億元（6/30）。報告沒有查到國安基金 2026 年 7 月進場的紀錄；是否仍持有 2025 年 4 月進場的部位未確認。","key":"B1"},{"item":"2026 年庫藏股、現金增資、IPO 籌資與現金股利總額","note":"未取得（證期局月報為壓縮檔）。「每年現金股利約 2 兆元、公司發還股東的錢多於募走的錢」是報告憑記憶的量級。","key":"B1"},{"item":"本益比與淨值比的長期序列、歷年當沖占比高點","note":"只取得近 60 個月本益比（第三方彙整證交所月報）。「2000 年以來淨值比多在 1.3–2.7 倍」「2021 年當沖占比曾到四成以上」都是記憶、未查證。","key":"B1"},{"item":"當沖降稅到 2027-12-31、高股息 ETF 換股月份、ETF 成分股上限","note":"當沖降稅期限未能重新讀取條文；0056、00878、00919 的換股月份與各檔單一成分股比重上限屬產品規格，報告憑記憶，應對照公開說明書。","key":"B1"},{"item":"上櫃成交值與融資、台指 VIX 讀數","note":"櫃買中心網站無法連線，上櫃資料用 Goodinfo 彙整值（1–5 月日均未取得）。VIX 21.22 為玩股網報價，期交所官方頁當時無法顯示數值；平靜期 VIX 12–18 是記憶值。","key":"B1"},{"item":"台積電 ADR 溢價約 12.4%（9/18）","note":"C2 報告用 9/18 匯率 31.808 算出 12.4%，C3 報告用 9/11 匯率算出 11.8%；兩地收盤時間不同。「ADR 發行額度限制使溢價長期偏高」為記憶、未查證。","key":"B1"},{"item":"外資買賣超的口徑與年度數字差異","note":"到 8 月底證交所 −1 兆 3,333 億、金管會上市股票 −1 兆 1,800 億元；舊頁面「至 7 月 2.28 兆」與兩者都不符。2025 年外資賣超本報告用 Goodinfo −5,995 億元，A1 報告為 −4,744 億元，差異未查明。","key":"B1"},{"item":"2008–2015 年各年底房貸、建築貸款餘額與年增率","note":"央行月報表 18 只回溯到 2016 年，統計資料庫未能讀取。頁面的年增率圖從 2017 年畫起；更早的走勢只有研究報告的記憶輪廓，未引用數值。","key":"B2"},{"item":"2008–2023 年各年全國買賣移轉棟數","note":"只確認 2001 年 25.9 萬、2016 年 24.5 萬、2024 年 35.1 萬、2025 年 26.1 萬棟；其餘年份因內政部不動產資訊平台無法連線，未引用。","key":"B2"},{"item":"家庭部門持有的房地產金額與占比","note":"主計總處國富統計表 6 為 Excel，未能讀取。研究報告只記得約占家庭資產三成多，屬記憶、未查證，頁面未引用數值。","key":"B2"},{"item":"上市股票總市值","note":"研究報告未能取得官方值，只給外推估計約 150 兆元；頁面改用本站共用數字 154.32 兆元（2026-09-18）。","key":"B2"},{"item":"全年房市成交總金額約 4 兆元（2025 年）","note":"研究報告以 26.1 萬棟 × 聯徵中心新增房貸樣本平均鑑估值約 1,500 萬元推算，未經實價登錄總額驗證，屬估計。","key":"B2"},{"item":"個人理財週轉金的定義與餘額","note":"央行只揭露年增率（2026-07 為 32.35%）。是否都以房屋擔保、餘額多少、家庭借款中週轉金占比都沒查到；金管會是否就借錢買股發過正式示警也未確認。","key":"B2"},{"item":"五大銀行新承做房貸部分月份與年度數字","note":"2025-06 至 12 與 2026-06 的月金額、利率，以及 2016–2023 年金額與平均利率，來自月報 PDF 文字擷取，只有部分數值經第二來源核對；2025 年平均利率 2.283% 待核。","key":"B2"},{"item":"集中度「約 20 年新低」","note":"出自媒體標題，原文未能開啟，屬估計。央行文件只確認 2024-06 高點 37.61% 與歷史高點 37.9%。","key":"B2"},{"item":"上一輪信用管制（2010–2016 年）的逐次內容與退場時程","note":"「最嚴到退場約 1.5–2 年、退場時房市已冷約 2 年」為研究報告憑記憶整理，未查證原始文件。","key":"B2"},{"item":"稅制細節：房地合一稅 2.0 長期稅率、平均地權條例修正","note":"持有 5–10 年 20%、逾 10 年 15%，以及 2023-07 起預售屋禁止轉售、私法人購屋許可制，官方頁面未能讀取，屬記憶內容。","key":"B2"},{"item":"內政部住宅價格指數原值與部分縣市負擔指標","note":"平台無法連線：指數原值、新北市與新竹縣市的房價所得比與貸款負擔率、新竹縣低度使用住宅比率、2025–26 年預售屋成交件數都未確認；負擔率分級門檻為記憶。","key":"B2"},{"item":"信義房價指數的兩處疑點","note":"官網台南季增率 +10.21% 疑為誤植，頁面未引用；金融穩定報告所載指數約 161（2025Q4）與官網 2026Q2 的 168.77 對不上，可能是指數回溯修正。","key":"B2"},{"item":"2024 年限貸令期間各銀行的具體措施","note":"排隊撥款、提高利率、降低成數等做法只有媒體整理，沒有官方逐家資料，屬估計。","key":"B2"},{"item":"全國年量 30 萬棟為榮枯分界","note":"業界慣用的經驗值，沒有官方定義，屬估計。","key":"B2"},{"item":"新青安寬限期 2028-08 起到期","note":"研究報告依 2023-08-01 上路日加 5 年推算；實際到期分布要看各月撥款量，屬估計。","key":"B2"},{"item":"2025 年經常帳／金融帳：修正值 1,844／1,594 億美元，首次發布 1,811.4／1,571.6 億美元","note":"B3 研究報告引的是央行 2026-02-26 首次發布值；全站共用數字與 A1 報告採 2026-08 修正後年表。本頁一律用修正值，準備資產 +200.4 億美元兩版相同。差異來自例行修正。","key":"B3"},{"item":"壽險業資產總額：38.7 兆元（全站共用，2026 年中）對 38.2 兆元（保險局，2026-04 月底）","note":"日期不同，不是衝突。國外投資 22.2 兆元、占比 66.03% 的分母是資金運用總額 33.6 兆元，不是總資產；媒體另有占總資產 58.7% 的算法。","key":"B3"},{"item":"壽險目前持有多少債券 ETF","note":"只有 2023-04 的舊資料（約 1.286 兆元、占可運用資金 4.2%）。報告正文估現況約四到五成、比較表寫四到六成，都未查證；保險局資金運用表沒有拆出這一項。","key":"B3"},{"item":"債券 ETF 歷史最高規模與 2025 年 5 月單月贖回金額","note":"只知道 2025 年 10 月曾「重回 3 兆元」。另外投信公會口徑（8 月底 2.81 兆元）與櫃買口徑（8/17 為 2.69 兆元）日期與範圍不同 新高（上半年 1,210 億美元），但外匯大多留在海外：貨款只有約 2% 立刻換成新台幣，同期金融帳淨流出 1,181 億美元。所以新台幣沒有大升，國內的錢是偏多而不是暴增（M2 年增 7.4%）。"},{"k":"誰在買股票","nodes":["fini","eq"],"t":"指數今年漲 62.9% 不是外資買出來的：外資賣超 1.41 兆元，買的是投信（+0.76 兆）與三大法人以外的人（約 +1.61 兆，估計），同時融資 5,940 億元、當沖占比約 41%。"},{"k":"集中","nodes":["eq","aidc"],"t":"漲幅高度集中：台積電一檔約貢獻漲點的四成、電子類約 87%；電子類成交占比 86%。指數的漲幅不等於多數股票的漲幅。"},{"k":"板塊","nodes":["rot"],"t":"板塊之間的差距是 2020 年以來最大（週報酬離散度 3.71%）。AI 供應鏈內部與塑化、金融等非電子板塊輪流表現，選板塊的影響比判斷大盤更大。"},{"k":"房市與內需","nodes":["re","hh","bank"],"t":"錢沒有往房市去：新增放款只有約 9% 到不動產，2025 年移轉棟數減少 25.5%；經常性薪資年增 3.32%，遠低於 GDP 的 12.93%。"},{"k":"最大的外部變數","nodes":["rate","fini"],"t":"利率與油價：Fed 9/16 升息到 3.75–4.00%、美國 10 年期公債約 5%、布蘭特 104 美元。大盤本益比 25.6 倍、外資持續賣超，這兩件事對利率最敏感。"}],"six":[{"t":"漲幅集中在一檔股票與一個產業","d":"台積電權重 41.48%，約貢獻今年漲點的四成；電子類占成交 85.6%。看大盤之前先看集中度。","inds":["tsmc_w","sec_share","mcap"],"go":"dest/b1-tsmc","nodes":["eq","aidc"]},{"t":"買方是國內資金，而且用了槓桿","d":"外資賣超 1.41 兆元，由投信 ETF 與國內投資人買走；融資、當沖、槓桿型 ETF、個人理財週轉金都在高檔。","inds":["inst","etf","margin","wm_loans","fut_oi"],"go":"dest/b1-lever","nodes":["eq","fini","bank"]},{"t":"需求還在成長，但成長不等於股價會漲","d":"出口、訂單、台積電營收都在創高；股價反映的是成長會不會再加速，以及市場願意給幾倍本益比。","inds":["orders","capex_csp","tsmc_rev","pe"],"go":"aidc/c3-price","nodes":["aidc","exp"]},{"t":"利率與油價正往不利的方向走","d":"Fed 重新升息、美國 10 年期公債約 5%、布蘭特破百；台灣央行不動，但已有 2 位理事主張升息。","inds":["fed","oil","cpi","policy_rate"],"go":"themes/c2-macro","nodes":["rate","fx"]},{"t":"匯率的風險在存量，不在順差","d":"外資部位相當於外匯存底的 309%，壽險有 22.2 兆元海外資產；這兩群人同時調整時，新台幣會劇烈波動。","inds":["fini_ratio","usdtwd","life_fx","fxdep"],"go":"inflow/a1-reserves","nodes":["fx","out","fini"]},{"t":"錢很多，但沒有流進房市","d":"M2 與放款都在加速，新增放款卻只有約 9% 去不動產；央行從 2026 年 3 月起逐季小幅放寬管制。","inds":["m2","loans","conc","credit_ctrl","transfers"],"go":"dest/b2-answer","nodes":["bank","re"]}]},"primer":{"intro":"看財經數據不需要先學會很多名詞，但有十四個觀念要先有。每個數字出現時，先問三件事：它是餘額還是變動量？跟什麼比？誰統計的、包含什麼？下面每個觀念都配一個這個網站裡的實際數字。","items":[{"id":"stockflow","zh":"存量與流量","en":"stock vs flow","one":"存量是某個時間點「有多少」，流量是一段期間「變動了多少」。","body":["存量就是餘額，例如外匯存底、房貸餘額、總市值。流量是一段期間內的進出，例如一季的經常帳順差、一年的外資買賣超、一個月的新承做房貸。兩種數字單位看起來一樣（都是幾兆、幾億），意義完全不同。","判斷一個流量大不大，要除以對應的存量或成交量；判斷一個存量會不會變，要看流量的方向有沒有持續。"],"ex":"外資今年以來賣超 1.41 兆元（流量），聽起來很大；但上市總市值是 154.32 兆元（存量），賣超不到 1%。房貸餘額 11.89 兆元是存量，一年淨增加約 0.51 兆元才是流進房市的流量。","trap":"拿流量和存量直接比大小，或把幾個存量相加當成「總資金」。家庭淨值 183.7 兆元裡已經包含股票與房地產，不能再和市值相加。","use":[{"t":"錢去哪裡・總覽：存量圖與流量圖為什麼要分開","go":"dest/b3-ov-stock"},{"t":"本地有多少：三個量級","go":"local/a2-howmuch"}],"inds":["mcap","fini_flow_twse","hloan"]},{"id":"yoy","zh":"水準、年增率、月增率","en":"level, year-over-year, month-over-month","one":"同一個數字有三種看法：現在多少、比去年同月多幾 %、比上個月多幾 %。","body":["台灣官方統計大多用年增率（和去年同月比），好處是自動消掉季節因素，例如農曆年、除權息旺季。月增率要用季節調整後的數字才有意義，否則只是在看季節。","年增率下降不等於衰退。年增率從 60% 降到 40%，金額仍在創新高，只是成長變慢。要同時看水準（金額）和年增率。"],"ex":"8 月出口 824 億美元是水準，年增 41.0% 是年增率。M2 為 70.22 兆元是水準，年增 7.42% 是年增率；央行的參考區間 2.5–6.5% 指的是年增率。","trap":"把年增率下降讀成「變差了」。先看金額有沒有下降，再看年增率。","use":[{"t":"出口與外銷訂單","go":"inflow/a1-exports"}],"inds":["exports","m2","tsmc_rev"]},{"id":"second","zh":"成長，與成長的變化","en":"first vs second derivative","one":"股價通常反映「成長率會不會再提高」，不是「有沒有成長」。","body":["營收還在成長是一階變化；成長率本身在上升還是下降，是二階變化。當所有人都已經知道營收在成長，這件事就已經在股價裡；股價接下來看的是成長率能不能比預期更高。","所以常見的情況是：營收創新高、年增率開始下降、股價先跌。這不矛盾。"],"ex":"台積電 2000 年各月營收年增 69%–168%，股價那一年跌了一半；2022 年營收成長 42.6%，本益比卻由 30.9 倍降到 12.6 倍。","trap":"看到「營收創新高」就認為股價會漲。要看年增率的方向，以及市場原本預期多少。","use":[{"t":"AIDC 檢查：營收成長不等於股價會漲","go":"aidc/c3-price"}],"inds":["tsmc_rev","rev_monthly","pe"]},{"id":"real","zh":"名目與實質","en":"nominal vs real","one":"名目是帳面數字，實質是扣掉物價上漲之後的數字。","body":["薪資年增 3% 但物價也漲 2%，實際多出來的購買力只有約 1%。利率也一樣：存款利率減掉通膨率，才是實質利率。實質利率接近零或為負時，錢放在定存會變薄，資金比較願意去買股票或房子。"],"ex":"7 月經常性薪資年增 3.32%，8 月 CPI 年增 2.04%，實質薪資成長約 1.3 個百分點。央行政策利率 2.00%，扣掉通膨後接近零。","trap":"只看名目數字下結論，例如「薪資創新高」。先扣掉物價。","use":[{"t":"薪資、超額儲蓄、現金股利","go":"local/a2-income"},{"t":"房市分頁：利率環境","go":"dest/b2-rate"}],"inds":["wages","cpi","policy_rate"]},{"id":"base","zh":"基期效應","en":"base effect","one":"年增率的高低，有一半取決於去年同期的數字。","body":["去年同月特別低，今年年增率就特別高；去年特別高，今年年增率就會下降，即使金額沒有變差。看到很高或很低的年增率，先回頭看去年同期發生什麼事。"],"ex":"2026 年出口年增超過 40%，代表 2027 年的比較基準很高；只要金額維持在高檔不再增加，年增率就會掉到接近 0。主計總處預測 GDP 成長率 2026 年 11.05%、2027 年 6.04%，其中就有基期的成分。","trap":"把基期造成的年增率下降讀成需求轉弱。分辨的方法是看金額本身，以及季調後的月增或季增。","use":[{"t":"傳到台灣的證據：官方預測已內建年增率下降","go":"aidc/c3-tw"}],"inds":["gdp","exports"]},{"id":"season","zh":"季節性","en":"seasonality","one":"有些數字每年固定時間會高或低，這不是訊號。","body":["農曆年前活期存款會增加、每年 6–9 月外資會把領到的股利匯出、第 4 季是電子業出貨旺季、報稅月份存款會減少。遇到有季節性的數字，和去年同月比，不要和上個月比。"],"ex":"央行口徑的外資資金 2026 年 6 月淨匯出約 170 億美元、7 月約 280 億美元，其中一部分是每年夏天固定發生的股利匯出。","trap":"把每年都會發生的季節變化當成資金撤出。","use":[{"t":"外資進出：股利匯出的季節性","go":"inflow/a1-fini"}],"inds":["fini_flow_cbc","m1b_gap"]},{"id":"scope","zh":"口徑","en":"definition and coverage","one":"同一件事由不同機關統計，定義不同，數字可以差很多，甚至方向相反。","body":["引用任何數字之前先問：誰統計的、包含哪些對象、期間是哪一段、是成交值還是淨額。新聞標題通常不會寫口徑，這是入門者最容易被誤導的地方。"],"ex":"外資今年「流出」還是「流入」？證交所口徑是賣超 1.41 兆元（只算集中市場買進減賣出）；金管會口徑是 1–8 月淨匯入 905 億美元（累計匯入減匯出，不扣獲利）；央行國際收支又是另一個數字。三個都正確，回答的是不同問題。","trap":"拿不同口徑的數字互相比較，或只引用對自己論點有利的那一個。","use":[{"t":"外資進出：四個口徑、四種答案","go":"inflow/a1-fini"},{"t":"來源與未確認：口徑衝突清單","go":"sources"}],"inds":["fini_flow_twse","fini_flow_fsc","fini_flow_cbc"]},{"id":"leadlag","zh":"領先、同時、落後指標","en":"leading, coincident, lagging","one":"有些數字先動、有些同步、有些最後才動；用落後的數字判斷轉折一定太晚。","body":["領先指標反映還沒發生的事，例如外銷訂單（接單在前、出貨在後）、PMI 的新訂單、雲端業者的資本支出指引。同時指標反映正在發生的事，例如出口、工業生產、月營收。落後指標要事情發生一陣子才會變，例如失業率、逾放比、房價。","股價本身就是領先指標。等到落後指標轉壞，股市通常早已反映。"],"ex":"失業率 3.33%、逾放比 0.14% 都在歷史低檔，但這兩個都是落後指標，不能用來判斷股市或景氣接下來的方向。三次歷史案例中，台積電股價都比月營收早轉向。","trap":"用「營收還很好」「失業率很低」來否定股價下跌的可能。","use":[{"t":"失效訊號儀表板：領先 8、同時 5、落後 2","go":"aidc/c3-dash"},{"t":"時間軸與日曆","go":"time"}],"inds":["orders","pmi","unemp","npl","signal"]},{"id":"expect","zh":"預期差","en":"expectations gap","one":"數字好不好，是和市場原本的預期比，不是和零比、也不是和去年比。","body":["價格已經包含大家的預期。財報成長 50%，如果市場原本預期 60%，股價會跌；衰退 10%，如果原本預期衰退 20%，股價會漲。所以看數據公布後的反應，比看數據本身更能知道市場原本怎麼想。"],"ex":"輝達上季營收 962 億美元、年增 106%，下季指引 1,080 億美元。這些數字本身很高，但股價反應取決於它比法人預估高多少；費城半導體指數距 52 週高點仍有 −18.7%。","trap":"只看數字絕對值好壞，就推論股價方向。","use":[{"t":"AIDC 需求端","go":"aidc/c3-demand"}],"inds":["nvda","sox_rel"]},{"id":"corr","zh":"相關不等於因果，以及多重比較","en":"correlation vs causation; multiple comparisons","one":"兩個數字一起動，不代表一個造成另一個；找得夠多，一定會找到看起來顯著的巧合。","body":["相關只說明過去一起動，沒有說明原因，也不保證未來繼續。更麻煩的是多重比較：同時檢查幾千組關係，光靠隨機就會有幾百組通過統計檢定。","可信的規律要同時滿足三件事：有說得通的機制、在不同時期都成立、強度大到扣掉交易成本還有意義。"],"ex":"本站用 345 週資料檢查了 3,024 組類股之間的領先落後關係，有 256 組通過顯著門檻，但純隨機預期就有約 151 組；最強的幾組相關係數只有 0.16–0.25，而且找不到經濟解釋。板塊的相關結構在 2020–22 與 2023–26 兩段之間的相似度只有 0.43。","trap":"在歷史資料裡找到一個「A 漲了 B 下週就漲」的規律就拿去用。","use":[{"t":"輪動探索器：自己操作相關矩陣與領先落後","go":"explorer"},{"t":"板塊之間有沒有相關性","go":"sectors/c1-corr"}],"inds":["rs_line","dispersion"]},{"id":"pe","zh":"股價＝盈餘 × 本益比","en":"price = earnings × multiple","one":"股價的變動可以拆成兩塊：公司賺多少，以及市場願意用幾倍的價格買。","body":["盈餘由營收和利潤率決定，看的是產業與公司。本益比由利率、成長預期與風險偏好決定，看的是整個市場的資金條件。利率上升時，同樣的盈餘，市場願意給的倍數會下降。","所以盈餘成長、股價卻下跌並不奇怪：本益比下降得比盈餘成長快就會發生。"],"ex":"大盤本益比 6 月底 31.78 倍、8 月底 25.62 倍：下降是因為上市公司獲利追上來，不是股價跌。2022 年台積電盈餘增加約三成、本益比減少約六成，股價腰斬。","trap":"只研究公司營收，不看利率與評價。","use":[{"t":"AIDC 檢查：機制與三個歷史案例","go":"aidc/c3-price"},{"t":"股市分頁：規模與成交","go":"dest/b1-size"}],"inds":["pe","fed","tsmc_rev"]},{"id":"marginal","zh":"邊際定價","en":"marginal pricing","one":"股價由最後一筆成交決定；市值增加幾十兆，不需要有幾十兆的錢流進來。","body":["每一筆買進都對應一筆賣出，錢只是從買方換到賣方手上，沒有「進到股市裡」。只要最後成交的那一小部分股票價格提高，所有沒交易的股票也用新價格重新計算市值。","所以要問的不是「流入多少錢」，而是「誰願意用更高的價格買、誰願意賣」。"],"ex":"上市總市值由 2025 年底 94.36 兆元增加到 154.32 兆元，多了約 60 兆元；同期各類投資人的淨買賣都只有 1 兆元上下，外資還是賣超 1.41 兆元。","trap":"認為「外資賣這麼多，指數怎麼可能漲」或「市值增加 60 兆＝有 60 兆資金進場」。","use":[{"t":"股市分頁：先拆問題","go":"dest/b1-frame"}],"inds":["mcap","inst","turnover"]},{"id":"ratio","zh":"比率要拆成分子和分母","en":"numerator vs denominator","one":"比率下降，可能是分子變小，也可能只是分母變大。","body":["很多指標是比率：不動產放款集中度、融資占市值比、存放比、外資部位相對外匯存底。比率變了，先把分子和分母分開看，才知道是哪一邊在動。"],"ex":"不動產放款集中度由 37.61% 降到 34.44%，不是因為不動產放款減少（15.35 兆元仍在增加），而是總放款這個分母成長得更快。外資部位相對外匯存底由 139% 升到 309%，是外資持股市值被股價帶高，外匯存底幾乎沒變。","trap":"看到比率改善就以為風險下降，或看到比率惡化就以為有人在加碼。","use":[{"t":"銀行端的上限：72-2 與集中度","go":"dest/b2-cap"},{"t":"外匯存底與 309%","go":"inflow/a1-reserves"}],"inds":["conc","fini_ratio","margin","ldr"]},{"id":"weight","zh":"平均數會藏住集中度","en":"averages hide concentration","one":"加權指數是按市值加權的，一檔占四成的股票就能決定指數。","body":["指數漲 63% 不代表多數股票漲 63%。市值加權指數裡，最大的幾檔決定方向；類股指數也一樣，常常只是一兩檔龍頭股的走勢。要知道多數股票的狀況，要看上漲家數、等權重平均、或中小型股指數。"],"ex":"台積電占加權指數 41.48%、前十大占 59.05%。櫃買指數相對加權指數的比值只有 0.71（2020 年初＝1），代表中小型股這幾年明顯落後大型權值股。","trap":"用大盤指數判斷自己手上股票的處境。","use":[{"t":"集中度：台積電一檔占四成","go":"dest/b1-tsmc"},{"t":"官方分類的限制","go":"sectors/c1-limits"}],"inds":["tsmc_w","otc_ratio","sec_share"]}]},"questions":{"intro":"從問題出發，而不是從指標出發。每一題告訴你：該看哪幾個數據、各自看什麼、怎麼判斷，以及現在的讀數拼起來是什麼樣子。「現在」那一段是作者根據讀數做的綜合判讀，屬於推論，不是預測。","items":[{"id":"q-fini","cat":"資金","q":"外資是不是在撤出台灣？","a":"賣股是真的，撤出台灣則不成立。外資今年賣超 1.41 兆元，但賣的主要是台積電，持股市值因股價上漲反而創高；金管會口徑 1–8 月仍是淨匯入。","steps":[{"ind":"fini_flow_twse","look":"今年以來與近一個月的買賣超","rule":"這只代表在集中市場買得多還是賣得多，不等於把錢匯出。"},{"ind":"fini_flow_cbc","look":"央行國際收支的證券投資（季）","rule":"這才是外資資金實際進出的定案數字；看連續幾季的方向。"},{"ind":"usdtwd","look":"賣超的同一段時間，新台幣有沒有明顯貶值","rule":"賣股又匯出，新台幣會貶；賣超很大但匯率沒動，代表錢還留在台灣。"},{"ind":"fut_oi","look":"外資台指期淨未平倉","rule":"要先扣掉槓桿型 ETF 的對手部位；扣掉後若仍是大額淨空單，才是看空。"},{"ind":"fini_ratio","look":"外資持有部位相對外匯存底","rule":"比率愈高，外資真的要走時對匯率的衝擊愈大；這是風險大小，不是方向。"}],"trap":"把金管會的「淨匯入」當成資金流入（它不扣獲利與股利匯出），或把證交所的賣超當成資金流出。","go":[{"t":"外資進出：四個口徑、四種答案","go":"inflow/a1-fini"},{"t":"誰在買、誰在賣","go":"dest/b1-who"}]},{"id":"q-crowd","cat":"股市","q":"股市現在擁不擁擠、槓桿高不高？","a":"偏擁擠，但還沒到強制賣出的狀態。融資在史上高檔、當沖近四成、槓桿型 ETF 擴張、個人借款年增三成；維持率與選擇權指標則顯示短期沒有恐慌。","steps":[{"ind":"margin","look":"融資餘額的水準，以及占市值的比率","rule":"餘額創高不一定危險；餘額增加得比市值快、且集中在中小型股，才是槓桿升高。"},{"ind":"maint","look":"整戶融資維持率","rule":"離 130% 追繳線愈近，下跌時被迫賣出的量愈大。"},{"ind":"turnover","look":"日均成交值與當沖占比","rule":"成交值先於指數到高點很常見；當沖占比高代表短線資金比重高。"},{"ind":"etf","look":"槓桿型與主動式 ETF 的規模變化","rule":"規模增加要拆成新申購和淨值上漲；只有新申購才是新的買盤。"},{"ind":"wm_loans","look":"個人理財週轉金貸款年增率","rule":"這是看不到用途的個人借款；年增率遠高於房貸時，央行也會提到它和股市的關係。"},{"ind":"pcr_vix","look":"選擇權 P/C 比與台指 VIX","rule":"VIX 低且 P/C 比正常，代表市場沒有在買保險；這是自滿程度，不是方向。"}],"trap":"只看融資餘額創新高就說過熱：市值變大，餘額本來就會變大，要看比率與集中在哪裡。","go":[{"t":"槓桿：融資、維持率、質押與借貸","go":"dest/b1-lever"},{"t":"練習：擁擠度 13 項檢查","go":"practice"}]},{"id":"q-liquid","cat":"資金","q":"台灣現在錢多不多？","a":"多，而且還在變多：M2 年增 7.42% 高於央行參考區間、放款年增近一成、央行定存單餘額減少。但錢多不等於股市漲，要看錢往哪裡去。","steps":[{"ind":"m2","look":"年增率相對 2.5–6.5% 參考區間","rule":"高於區間代表貨幣成長偏快；央行會不會因此收緊要看通膨。"},{"ind":"m1b_gap","look":"M1B 年增率減 M2 年增率","rule":"由負轉正代表活期的錢增加較快，通常和成交放大同時出現；它是同時指標。"},{"ind":"ncd","look":"央行定存單餘額的增減","rule":"餘額下降＝央行把錢放回銀行體系；上升＝收回。"},{"ind":"loans","look":"放款與投資年增率","rule":"放款成長快於存款成長，代表銀行正在創造信用。"},{"ind":"settle_dep","look":"證券劃撥存款餘額","rule":"這是已經停在交割戶、隨時可以買股的錢；連續減少代表買盤資金在消耗。"}],"trap":"把 M2 成長當成央行「印鈔」，或認為錢多股市就一定漲。","go":[{"t":"台灣本地有多少錢：三個量級","go":"local/a2-howmuch"},{"t":"央行定存單","go":"local/a2-ncd"}]},{"id":"q-lend","cat":"資金","q":"銀行還有沒有錢可以貸？","a":"有。存款比放款多，法定上限都還有空間；真正會先卡住的是資本適足率，以及央行對不動產放款的集中度要求。","steps":[{"ind":"ldr","look":"存放比","rule":"台灣長期在七成上下，是結構性的存款多於放款；理論上限約 83%（估計），愈接近愈吃緊。先確認口徑。"},{"ind":"excess","look":"超額準備與隔夜拆款利率","rule":"拆款利率明顯走高，代表銀行間短期資金變緊。"},{"ind":"r72","look":"銀行法 72-2 比率（上限 30%）","rule":"愈接近 30%，個別銀行愈會限縮建築與住宅放款。"},{"ind":"conc","look":"不動產放款集中度","rule":"央行實際盯的是這個數字；下降中代表不動產放款的管制壓力在減輕。"},{"ind":"npl","look":"逾放比","rule":"落後指標；在低檔不能證明放款品質沒問題。"}],"trap":"以為「銀行錢很多」就等於「房貸好貸」：不動產放款另外受央行與銀行法限制。","go":[{"t":"多少錢可以借貸：五道上限","go":"local/a2-lend"},{"t":"銀行端的上限與 2024 年限貸令","go":"dest/b2-cap"}]},{"id":"q-fx","cat":"匯率","q":"新台幣接下來偏升還是偏貶？看什麼？","a":"兩邊的力量都很大：順差創高是升值壓力，但出口商不急著換匯、美國升息、外資賣股是貶值壓力。今年新台幣在 31.25–32.45 區間，小貶約 1%。","steps":[{"ind":"usdtwd","look":"匯率水準與今年區間","rule":"央行壓低波動但不守特定價位；突然的大幅波動通常來自存量調整。"},{"ind":"fxsettle","look":"出口貨款立即換成新台幣的比例","rule":"比例上升代表企業開始把美元換回來，是升值壓力。"},{"ind":"fxdep","look":"外匯存款餘額","rule":"這是還沒換的美元；新台幣快速升值時，這筆錢可能同時想換，會放大升幅。"},{"ind":"fed","look":"台美利差","rule":"利差擴大，持有美元比較划算，企業與壽險更不急著換回新台幣。"},{"ind":"life_fx","look":"壽險避險比率","rule":"避險比率低，升值時壽險的匯損壓力大，可能被迫補避險而加速升值。"},{"ind":"reserves","look":"外匯存底的月增減","rule":"明顯增加代表央行在買美元阻升；減少代表在賣美元阻貶。"}],"trap":"認為順差大新台幣就一定升：決定匯率的是資金進出與民間未換的美元，不是貿易順差本身。","go":[{"t":"匯率：央行怎麼管，以及 2025 年 5 月的教訓","go":"inflow/a1-fx"},{"t":"新台幣升值為什麼會傷到壽險","go":"dest/b3-lifefx"}]},{"id":"q-house","cat":"房市","q":"房市是不是在轉弱？錢有沒有流進去？","a":"量已經明顯縮小、價格只小跌，錢流進去的速度很慢。建築貸款年增率轉負，代表建商端先轉向；央行從 2026 年 3 月起逐季小幅放寬。","steps":[{"ind":"transfers","look":"買賣移轉棟數年增率","rule":"量先於價；連續兩位數衰退後價格才會反映。"},{"ind":"cloan","look":"建築貸款年增率","rule":"建商端比購屋端早 1–2 年轉向；轉負代表推案與購地變保守。"},{"ind":"hloan","look":"購置住宅貸款年增率","rule":"4.5–6% 是近十年的常態區間；超過 8% 算過熱，低於 4.5% 算降溫。"},{"ind":"newmort","look":"五大銀行新承做房貸金額與利率","rule":"這是流量，比餘額更早反映冷熱。"},{"ind":"credit_ctrl","look":"央行信用管制的方向","rule":"放寬代表央行認為風險下降；注意是全面放寬還是只放寬第二戶。"},{"ind":"hprice","look":"房價指數（多種口徑）","rule":"價格最慢反應，而且各指數涵蓋範圍不同，要看同一個指數的趨勢。"}],"trap":"只看全國平均房價就下結論：量、建商端貸款和新承做房貸都更早反應。","go":[{"t":"多少錢流進房地產","go":"dest/b2-answer"},{"t":"央行信用管制時間線","go":"dest/b2-ctrl"}]},{"id":"q-cycle","cat":"景氣","q":"現在景氣在什麼位置？","a":"出口與製造業非常熱（GDP 兩位數成長、景氣信號連 8 個月紅燈），內需溫和。這種熱度有基期與產業集中的問題，官方已預測 2027 年成長率降到 6% 左右。","steps":[{"ind":"signal","look":"景氣對策信號分數與領先指標的方向","rule":"紅燈代表過熱而不是危險；要看領先指標是否連續數月下滑。"},{"ind":"orders","look":"外銷訂單年增率","rule":"領先出口 1–3 個月；年增率連續下降是最早的降溫訊號。"},{"ind":"pmi","look":"製造業 PMI 是否高於 50","rule":"高於 50 代表擴張；看新訂單與存貨兩個細項的方向。"},{"ind":"gdp","look":"年增率與季調後季增率","rule":"年增率受基期影響；季增率才看得出最近一季有沒有在加速。"},{"ind":"unemp","look":"失業率","rule":"落後指標；它開始上升時，景氣通常已經轉向一陣子。"},{"ind":"retail","look":"零售與餐飲營業額","rule":"用來確認出口的熱度有沒有傳到內需。"}],"trap":"用失業率很低、GDP 很高來判斷股市安全：這些是同時或落後指標，股市看的是領先指標的方向。","go":[{"t":"先備知識：領先、同時、落後","go":"primer"},{"t":"薪資、超額儲蓄、現金股利","go":"local/a2-income"}]},{"id":"q-rate","cat":"景氣","q":"通膨和利率會往哪裡走？為什麼這對股市重要？","a":"外部壓力偏向升：Fed 已重新升息、油價破百。台灣央行連 10 次不動，但 CPI 略高於 2%、M2 高於參考區間，已有 2 位理事主張升息。利率上升會壓低本益比。","steps":[{"ind":"cpi","look":"CPI 與核心 CPI 年增率相對 2%","rule":"持續高於 2% 會讓央行較難降息、較可能升息。"},{"ind":"oil","look":"油價水準與持續時間","rule":"布蘭特站上 100 美元並持續數週，通膨與升息的預期會升溫；回落到 100 美元以下則壓力減輕。"},{"ind":"fed","look":"聯準會利率與美國 10 年期公債殖利率","rule":"全球股票的評價以美債殖利率為基準；殖利率升，本益比有下降壓力。"},{"ind":"policy_rate","look":"央行理監事會的決議與投票分歧","rule":"有理事開始主張升息，是方向改變的早期訊號。"},{"ind":"pe","look":"大盤本益比","rule":"本益比愈高，對利率上升愈敏感。"}],"trap":"只看台灣央行的利率：影響台股評價更大的是美國利率。","go":[{"t":"同時影響多個板塊的總體因素排序","go":"themes/c2-macro"},{"t":"9/16 聯準會升息、9/17 央行不動","go":"inflow/a1-rates"}]},{"id":"q-aidc","cat":"AI","q":"AI 資料中心這條線還撐不撐得住？","a":"需求那一半仍成立（資本支出指引上修、營收創高）。股價那一半無法由需求推出：年增率在下降、部分大廠自由現金流轉負、半導體指數相對大盤轉弱。儀表板目前 0 個警訊、7 個留意。","steps":[{"ind":"capex_csp","look":"雲端大廠每季財報的資本支出指引","rule":"上修是正面；出現持平或下修、或管理層開始談投資回報，是最重要的轉向訊號。"},{"ind":"nvda","look":"輝達營收與下季指引相對預期","rule":"看指引的季增幅度是否縮小，以及股價對好消息的反應。"},{"ind":"tsmc_rev","look":"台積電月營收年增率與資本支出","rule":"金額創高但年增率連續下降，是二階變化轉弱。"},{"ind":"credit_spread","look":"AI 相關公司的舉債與現金流","rule":"建置靠舉債與供應商擔保的比重上升，代表資金來源變脆弱。"},{"ind":"sox_rel","look":"費城半導體指數相對大盤","rule":"相對強弱轉弱通常早於基本面數字。"},{"ind":"dram","look":"記憶體報價","rule":"漲幅極端時，出口與營收金額有一部分是漲價而不是出貨量。"}],"trap":"用「月營收還在創新高」來判斷股價：月營收是同時到落後指標，三次歷史上股價都更早轉向。","go":[{"t":"這個問題要拆成兩句話來檢查","go":"aidc/c3-split"},{"t":"失效訊號儀表板","go":"aidc/c3-dash"}]},{"id":"q-rotate","cat":"板塊","q":"現在是板塊輪動，還是資金撤出股市？","a":"目前比較像輪動：成交值縮小但指數回到高點附近、類股有漲有跌、櫃買相對強弱由低點回升。要翻成撤出，需要看到類股同向下跌、成交放大、融資快速減少與新台幣同步走貶。","steps":[{"ind":"dispersion","look":"類股報酬離散度","rule":"離散度高代表類股表現差很多，是輪動；全部同向下跌時離散度反而會降。"},{"ind":"sec_share","look":"各類股成交占比的變化","rule":"占比從一類移到另一類是輪動；總成交值一起縮才是離場。"},{"ind":"otc_ratio","look":"櫃買指數相對加權指數","rule":"中小型股相對轉強代表風險偏好還在；持續破底代表資金只願意留在大型股。"},{"ind":"margin","look":"融資餘額增減","rule":"輪動時融資大致持平；撤出時融資會快速下降。"},{"ind":"fini_flow_twse","look":"外資買賣超與同期匯率","rule":"外資賣超加上新台幣走貶，才是資金離開。"}],"trap":"用單日的漲跌下結論。至少看一週，而且幾個指標要同時成立。","go":[{"t":"是輪動還是撤出：怎麼分辨","go":"sectors/c1-exit"},{"t":"輪動探索器","go":"explorer"}]},{"id":"q-where","cat":"板塊","q":"錢現在在哪個板塊？下一個可能是誰？","a":"能回答的是「現在在哪」：5 月底之後資金由電子零組件與中小型股移向塑膠、航運、電腦週邊與金融。「下一個是誰」沒有可靠的統計規律，本站的週資料檢驗顯示類股動能與領先落後都不顯著。","steps":[{"ind":"rs_line","look":"類股指數除以加權指數的比值走勢","rule":"比值上升代表比大盤強；看轉折與創新高，不看單週。"},{"ind":"sec_share","look":"成交占比相對自己的歷史百分位","rule":"占比在歷史高檔代表資金已經很集中，再擠進去的空間有限。"},{"ind":"rev_monthly","look":"族群內多數公司的月營收年增率方向","rule":"輪動要有基本面跟上才走得久；只有股價動、營收沒動的通常是短線題材。"},{"ind":"etf","look":"高股息與主動式 ETF 的換股日與成分調整","rule":"這是「有人必須買或賣」的原因，會造成和基本面無關的短期輪動。"}],"trap":"在歷史資料裡找「A 漲完換 B」的固定順序：相關結構會變，兩段時期的相似度只有 0.43。","go":[{"t":"現在輪動到哪裡","go":"sectors/c1-now"},{"t":"錢為什麼換邊：十二類原因","go":"sectors/c1-causes"}]},{"id":"q-etf","cat":"股市","q":"ETF 這麼大，對個股和板塊有什麼影響？","a":"影響已經大到要另外追蹤：台股 ETF 約 7.87 兆元、占上市市值約 5%，主動式與槓桿型擴張最快。ETF 讓散戶的買盤在帳上變成「投信買超＋自營商避險賣超」，換股日會造成與基本面無關的買賣壓。","steps":[{"ind":"etf","look":"各類 ETF 規模與受益人數","rule":"拆成新申購與淨值上漲；受益人數增加才代表新的買盤。"},{"ind":"inst","look":"投信買超與自營商避險賣超","rule":"兩者常常是同一筆 ETF 申購的兩面，不要分開解讀。"},{"ind":"fut_oi","look":"外資期貨淨空單與投信淨多單","rule":"槓桿型 ETF 用期貨建立部位，外資常是對手方；兩者相減才是方向性部位。"},{"ind":"tsmc_w","look":"台積電權重","rule":"市值加權的 ETF 會把新申購的四成買進台積電，進一步提高集中度。"}],"trap":"看到「投信連續買超」就認為法人看好：很多時候只是 ETF 收到申購後的被動買進。","go":[{"t":"ETF：投信買超與自營商避險賣超是同一件事的兩面","go":"dest/b1-etf"},{"t":"市場結構類話題","go":"themes/c2-structure"}]},{"id":"q-gap","cat":"景氣","q":"出口這麼好，為什麼新台幣沒升、薪水沒感覺？","a":"因為賺到的錢大部分沒有進到國內流通。外匯留在海外與企業帳上，獲利分給股東多於分給員工；一般家庭感受到的主要是股票增值與股利。","steps":[{"ind":"ca","look":"經常帳順差的規模","rule":"順差是賺到的外匯總額，不代表這些錢進了國內。"},{"ind":"fa","look":"金融帳淨流出","rule":"淨流出幾乎等於順差，代表錢留在海外。"},{"ind":"fxsettle","look":"貨款立即換成新台幣的比例","rule":"只有約 2% 代表出口商幾乎都沒換。"},{"ind":"wages","look":"經常性薪資與總薪資年增率","rule":"總薪資（含獎金）遠高於經常性薪資，代表成長集中在發得出獎金的產業。"},{"ind":"excess_saving","look":"超額儲蓄","rule":"儲蓄大於國內投資的部分，就是流到海外的錢。"}],"trap":"把 GDP 成長率當成一般人的收入成長率。","go":[{"t":"順差這麼大，錢為什麼沒有留在國內","go":"inflow/a1-surplus"},{"t":"薪資、超額儲蓄、現金股利","go":"local/a2-income"}]},{"id":"q-other","cat":"資金","q":"除了股市、房市、銀行，錢還去了哪裡？","a":"最大的去向是海外，一年約 5 兆元：壽險業買海外債券、個人用複委託與基金買海外股票、企業到海外設廠。其次是政府基金與外幣存款；黃金、加密資產與 TISA 的金額都還很小。","steps":[{"ind":"life_fx","look":"壽險國外投資餘額與避險比率","rule":"壽險是最大的海外投資人；餘額不增反減代表保費收入轉向投資型。"},{"ind":"subbrok","look":"複委託成交值","rule":"這是成交值不是淨流出；要和去年同期比。"},{"ind":"funds","look":"境內外基金規模","rule":"拆成 ETF 與非 ETF、台股與海外。"},{"ind":"bond_etf","look":"債券 ETF 規模與淨申贖","rule":"規模縮水多半是債券價格下跌，不一定是贖回。"},{"ind":"fdi_out","look":"對外直接投資：核准與實際匯出","rule":"核准是上限與承諾，實際匯出通常小得多、而且分多年。"},{"ind":"fyp","look":"壽險初年度保費","rule":"保費是家庭儲蓄流向海外債券的第一站；看投資型與傳統型的比重。"}],"trap":"把各去向的規模相加：保費、壽險資產、海外債券其實是同一筆錢的三個階段。","go":[{"t":"錢的所有去向：規模比一比","go":"dest/b3-ov-stock"},{"t":"三塊之外，錢還去了哪裡","go":"dest/b3-map"}]}]},"path":{"intro":"整個網站的內容很多，不需要一次讀完，也不需要照目錄讀。這條路徑把內容切成 15 站，每站 10–15 分鐘，只要求看懂兩三個數字和它們之間的關係。每站最後有自我檢查題，答得出來再往下走；答不出來就回頭讀那一站列出的區塊。進度會記在這台裝置的瀏覽器裡。","stations":[{"id":"s0","t":"先學會看數字","min":15,"goal":"分得出存量與流量、水準與年增率，知道每個數字都要先問口徑。","read":[{"t":"先備知識：前三個觀念（存量與流量、年增率、成長的變化）","go":"primer"},{"t":"先備知識：口徑、領先落後、邊際定價","go":"primer"}],"cards":["mcap","exports"],"check":[{"q":"外資賣超 1.41 兆元算多嗎？要跟什麼比？","a":"它是流量，要除以對應的存量。上市總市值 154.32 兆元，賣超不到 1%；和全年成交值比更小。"},{"q":"出口年增率從 60% 降到 40%，是變差了嗎？","a":"金額仍在增加，只是成長變慢。要同時看金額與年增率；股價在意的是年增率的方向。"}]},{"id":"s1","t":"看懂首頁的關係圖","min":10,"goal":"知道 12 個節點分成哪三層，以及錢大致怎麼從出口走到股市。","read":[{"t":"總結：一段話總結與關係圖","go":"home"}],"cards":[],"check":[{"q":"從「AI 資料中心需求」走到「股市」，圖上有哪兩條路？","a":"一條是直接的：AI 相關公司占市值約三分之二，預期直接決定指數。另一條是間接的：出口 → 順差 → 央行與銀行體系的資金 → 國內投資人的買盤。"}]},{"id":"s2","t":"錢從哪來：順差很大，錢卻沒留在國內","min":15,"goal":"說得出流入台灣的錢有哪幾種，以及為什麼順差創高、新台幣卻沒升。","read":[{"t":"流入台灣的錢有哪幾種形式","go":"inflow/a1-forms"},{"t":"順差這麼大，錢為什麼沒有留在國內","go":"inflow/a1-surplus"}],"cards":["ca","fa","fxsettle"],"check":[{"q":"經常帳順差 1,210 億美元、金融帳淨流出 1,181 億美元，這兩個數字幾乎相等代表什麼？","a":"賺進來的外匯幾乎都由民間留在國外，央行只收下很小一部分；國內的新台幣沒有因此大增。"},{"q":"出口商收到美元後，立即換成新台幣的比例大約多少？","a":"約 2.2%。其餘存成外幣存款或留在海外。"}]},{"id":"s3","t":"外資的四個口徑，與匯率","min":15,"goal":"看到外資的新聞數字時，知道先問是哪個口徑；知道匯率的風險來自存量。","read":[{"t":"外資進出：四個口徑、四種答案","go":"inflow/a1-fini"},{"t":"外匯存底，以及 309% 代表什麼","go":"inflow/a1-reserves"},{"t":"匯率：央行怎麼管","go":"inflow/a1-fx"}],"cards":["fini_flow_twse","fini_flow_fsc","fini_ratio","usdtwd"],"check":[{"q":"證交所說外資賣超 1.41 兆元，金管會說淨匯入 905 億美元，誰對？","a":"都對。前者是集中市場買賣的差額，後者是累計匯入減匯出且不扣獲利；回答的是不同問題。"},{"q":"外資部位相當於外匯存底的比率由 139% 升到 309%，是外資加碼嗎？","a":"不是。主要是股價上漲讓外資持股市值變大，外匯存底幾乎沒變。它代表外資若要走，對匯率的衝擊變大。"}]},{"id":"s4","t":"本地有多少錢、銀行能借多少","min":15,"goal":"記得三個量級（30 兆、70 兆、184 兆），知道銀行放款被哪幾道上限限制。","read":[{"t":"台灣本地有多少錢：三個量級","go":"local/a2-howmuch"},{"t":"銀行有多少錢","go":"local/a2-bank"},{"t":"多少錢可以借貸：五道上限","go":"local/a2-lend"}],"cards":["m2","loans","ldr"],"check":[{"q":"M1B、M2、家庭淨值三個數字可以相加嗎？","a":"不行，是一層包一層：M1B 在 M2 裡面，存款又是家庭淨值的一部分。"},{"q":"銀行存款比放款多，多出來的錢在哪裡？","a":"停在央行定存單與債券等投資上。"}]},{"id":"s5","t":"央行怎麼收放新台幣","min":10,"goal":"看懂 M1B 與 M2 的交叉、央行定存單餘額增減各代表什麼。","read":[{"t":"M1B、M2 與黃金交叉／死亡交叉","go":"local/a2-m1bm2"},{"t":"央行定存單","go":"local/a2-ncd"},{"t":"利率：政策利率沒動，市場利率自己走高","go":"local/a2-rate"}],"cards":["m1b_gap","ncd","policy_rate"],"check":[{"q":"央行定存單餘額今年減少 0.85 兆元，是收緊還是放鬆？","a":"放鬆。定存單是央行用來收回新台幣的工具，餘額減少代表把錢放回銀行體系。"},{"q":"黃金交叉是買進訊號嗎？","a":"不是。它是同時或落後指標，反映活期資金增加較快，歷史上交叉之後股市漲跌都有。"}]},{"id":"s6","t":"股市：指數上漲不需要淨流入","min":15,"goal":"不再問「流入多少錢」，改問「誰在買、誰在賣、用什麼價格」。","read":[{"t":"先拆問題：會有多少錢流入台灣股市","go":"dest/b1-frame"},{"t":"誰在買、誰在賣","go":"dest/b1-who"},{"t":"集中度：台積電一檔占四成","go":"dest/b1-tsmc"}],"cards":["inst","tsmc_w","mcap"],"check":[{"q":"市值今年多了約 60 兆元，是有 60 兆元資金進場嗎？","a":"不是。每筆買進都有對應的賣出，只要最後成交價提高，所有沒交易的股票也用新價格計算。各類投資人的淨買賣都只有 1 兆元上下。"},{"q":"外資賣的股票是誰買走的？","a":"投信（主要是 ETF）與三大法人以外的國內投資人；台積電股東由 186 萬人增到 305 萬人。"}]},{"id":"s7","t":"股市的槓桿與擁擠","min":15,"goal":"知道 ETF、融資、期貨三個管道各自怎麼放大波動，會用檢查表自己檢查一次。","read":[{"t":"ETF：投信買超與自營商避險賣超","go":"dest/b1-etf"},{"t":"槓桿：融資、維持率、質押與借貸","go":"dest/b1-lever"},{"t":"期貨與選擇權部位","go":"dest/b1-deriv"},{"t":"練習：擁擠度檢查表","go":"practice"}],"cards":["etf","margin","fut_oi"],"check":[{"q":"外資期貨淨空單 7.6 萬口，代表外資強烈看空嗎？","a":"不代表。幾乎全是槓桿型 ETF 的對手部位，和投信淨多單相減後只剩約 1,000 口。"},{"q":"融資餘額創新高一定危險嗎？","a":"不一定。要看占市值的比率、集中在哪類股票，以及維持率離追繳線多遠。"}]},{"id":"s8","t":"房市與銀行的限制","min":15,"goal":"知道錢流進房市的管道與速度，以及央行用什麼工具管。","read":[{"t":"多少錢流進房地產","go":"dest/b2-answer"},{"t":"央行選擇性信用管制時間線","go":"dest/b2-ctrl"},{"t":"銀行端的上限：72-2 與集中度","go":"dest/b2-cap"}],"cards":["hloan","credit_ctrl","conc"],"check":[{"q":"不動產放款集中度由 37.61% 降到 34.44%，是不動產放款減少了嗎？","a":"不是。不動產放款仍在增加，是總放款這個分母成長得更快。"},{"q":"央行管房市主要靠升息嗎？","a":"不是，主要靠規定最多能貸幾成的選擇性信用管制；2020–2024 年七度收緊，2026 年 3 月與 9 月兩度放寬。"}]},{"id":"s9","t":"其他去向：壽險、海外、債券 ETF","min":10,"goal":"知道除了股市、房市、銀行，最大的去向是海外，而且很多去向其實是同一筆錢。","read":[{"t":"存量：每個去向現在放了多少錢","go":"dest/b3-ov-stock"},{"t":"哪些去向其實是同一筆錢","go":"dest/b3-ov-chain"},{"t":"壽險業：台灣最大的海外投資人","go":"dest/b3-life"}],"cards":["life_fx","subbrok","bond_etf"],"check":[{"q":"保費、壽險資產、海外債券三個數字可以相加嗎？","a":"不行，它們是同一筆錢的三個階段：家庭繳保費 → 壽險公司收下 → 拿去買海外債券。"}]},{"id":"s10","t":"板塊怎麼分、各靠什麼動","min":15,"goal":"知道三種分法各自的用途，能說出兩三個板塊的主要驅動因子。","read":[{"t":"板塊的三種分法","go":"sectors/c1-three"},{"t":"官方類股：今年表現、市值比重、成交占比","go":"sectors/c1-official"},{"t":"依「對什麼敏感」來分","go":"sectors/c1-sens"},{"t":"各板塊的驅動因子卡（挑 3 張看）","go":"sectors/c1-cards"}],"cards":["sec_share","rs_line"],"check":[{"q":"成交占比為什麼要除以市值比重來看？","a":"大的類股本來成交就多。除以市值比重之後大於 1，才代表資金相對集中在那裡。"},{"q":"類股指數大漲，代表那個產業景氣好嗎？","a":"不一定。類股指數常常由一兩檔龍頭股決定，而且同一個族群會被拆到好幾個官方類股。"}]},{"id":"s11","t":"錢為什麼換邊；是輪動還是撤出","min":15,"goal":"能把一次輪動歸到十二類原因之一；會用探索器看相關與相對強弱。","read":[{"t":"錢為什麼換邊：十二類原因","go":"sectors/c1-causes"},{"t":"板塊之間有沒有相關性","go":"sectors/c1-corr"},{"t":"是輪動還是撤出","go":"sectors/c1-exit"},{"t":"輪動探索器：先看「誰跟誰一起動」","go":"explorer"}],"cards":["dispersion","otc_ratio"],"check":[{"q":"本站的資料顯示，板塊之間的領先落後關係能當交易規則嗎？","a":"不能。3,024 組檢定中 256 組顯著，但隨機預期就有約 151 組；最強的相關係數只有 0.16–0.25，也沒有經濟解釋。"},{"q":"輪動和撤出，最簡單的分辨方法是什麼？","a":"輪動是類股有漲有跌、總成交值沒有大縮、融資大致持平；撤出是類股同向下跌、融資快速減少、外資賣超加上新台幣走貶。"}]},{"id":"s12","t":"熱門題材與總體因素的排序","min":10,"goal":"知道哪些題材對大盤影響最大、為什麼；知道排序是作者的評分，不是預測。","read":[{"t":"29 個題材的總排序","go":"themes/c2-rank"},{"t":"怎麼排的：六個維度、權重與限制","go":"themes/c2-method"},{"t":"同時影響多個板塊的總體因素","go":"themes/c2-macro"}],"cards":["fed","oil","tariff"],"check":[{"q":"新聞最多的題材，對大盤的影響也最大嗎？","a":"不是。資安、量子的新聞很多但排在最後；影響大盤的是市值權重大、對指數貢獻高的題材。"}]},{"id":"s13","t":"AIDC：需求成長不等於股價會漲","min":15,"goal":"能把問題拆成兩句話，知道儀表板裡哪些是領先指標。","read":[{"t":"這個問題要拆成兩句話來檢查","go":"aidc/c3-split"},{"t":"「營收還在成長」不等於「股價還會漲」","go":"aidc/c3-price"},{"t":"失效訊號儀表板","go":"aidc/c3-dash"}],"cards":["capex_csp","tsmc_rev","pe"],"check":[{"q":"2022 年台積電盈餘成長約三成，股價為什麼腰斬？","a":"股價＝盈餘 × 本益比。本益比減少約六成，超過盈餘的成長。"},{"q":"月營收是領先指標嗎？","a":"不是，是同時到落後指標。三次歷史案例中，股價都比月營收早轉向。"}]},{"id":"s14","t":"養成例行：每週 30 分鐘","min":10,"goal":"訂出自己每天、每週、每月各看什麼，並開始記錄自己的判讀。","read":[{"t":"時間軸與日曆：哪些數字多久看一次","go":"time"},{"t":"判讀與練習：例行與記錄範本","go":"practice"}],"cards":[],"check":[{"q":"為什麼要把自己的判讀寫下來？","a":"不寫下來，事後會不自覺地修改自己當時的想法。寫下「看到什麼、推論什麼、什麼情況代表我錯了」，一個月後回頭檢驗，判讀能力才會進步。"}]}]},"rooms":{"groups":[{"zh":"總覽","rooms":["home","path"]},{"zh":"地基","rooms":["primer","ask","dict"]},{"zh":"資金","rooms":["inflow","local","dest"]},{"zh":"板塊","rooms":["sectors","explorer","themes","aidc"]},{"zh":"方法","rooms":["time","practice","sources"]}],"rooms":{"home":{"zh":"總結","en":"Summary","q":"現在整體是什麼狀況，每一塊之間怎麼連？"},"path":{"zh":"學習路徑","en":"Learning path","q":"內容很多，要從哪裡開始、照什麼順序讀？","lede":"15 站、每站 10–15 分鐘。照順序走，每站只要看懂兩三個數字和它們的關係。"},"primer":{"zh":"先備知識","en":"Primer","q":"看數據之前，要先有哪些觀念？","lede":"十四個觀念，每個配一個台灣的實際數字。先有這些，後面的指標才讀得懂。","down":["ask","dict"]},"ask":{"zh":"我想知道…","en":"Question index","q":"我想知道某件事，該看哪些數據？","lede":"從問題找數據：每一題列出要看的指標、看什麼、怎麼判斷，以及現在的讀數拼起來的樣子。","up":["primer"],"down":["dict"]},"dict":{"zh":"數據辭典","en":"Indicator dictionary","q":"這個數字是什麼、怎麼判斷、跟誰有關？","lede":"74 個指標。每張卡回答五件事：它在量什麼、為什麼會動、怎麼判斷、現在多少、它影響誰又被誰影響。","up":["primer","ask"]},"inflow":{"zh":"錢從哪來","en":"External flows","q":"流入台灣的資金有哪幾種形式？","src":"A1","down":["local","dest"],"nodes":["exp","ca","out","fini","fx"]},"local":{"zh":"本地有多少","en":"Domestic money","q":"台灣本地有多少錢？銀行有多少、能借多少？","src":"A2","up":["inflow"],"down":["dest"],"nodes":["bank","hh"]},"dest":{"zh":"錢去哪裡","en":"Destinations","q":"多少錢去了股市、房市、海外與其他地方？","up":["inflow","local"],"down":["sectors"],"nodes":["eq","re","out"],"tabs":[{"id":"ov","zh":"總覽：規模比一比","src":"B3","file":"overview.html"},{"id":"eq","zh":"股市","src":"B1","file":"room.html"},{"id":"re","zh":"房市與銀行限制","src":"B2","file":"room.html"},{"id":"ot","zh":"海外・保險・其他","src":"B3","file":"room.html"}]},"sectors":{"zh":"板塊怎麼分","en":"Sectors and drivers","q":"台股可以怎麼分板塊？各靠什麼動？錢為什麼換邊？","src":"C1","up":["dest"],"down":["explorer","themes"],"nodes":["rot"]},"explorer":{"zh":"輪動探索器","en":"Rotation explorer","q":"板塊之間的相關、強弱與輪動，能不能自己動手看？","lede":"用 2019 年底到 2026-09-18 的週資料，自己操作六種圖：誰跟誰一起動、輪動圖、相對強弱線、成交占比、離散度、期間報酬排行。每張圖都附怎麼讀，以及作者用同一份資料算出來的發現。","up":["sectors"],"down":["aidc"],"nodes":["rot"]},"themes":{"zh":"熱門題材","en":"Hot themes","q":"現在熱門的題材有哪些？依影響程度怎麼排？","src":"C2","up":["sectors"],"down":["aidc"],"nodes":["rate","rot"]},"aidc":{"zh":"AIDC 檢查","en":"AI data-center thesis","q":"AI 資料中心建置，還是相關股價成長的原因嗎？","src":"C3","up":["themes","explorer"],"nodes":["aidc"]},"time":{"zh":"時間軸與日曆","en":"Horizons and calendar","q":"每個指標要回看多久？什麼時候公布？","lede":"三件事：每個指標更新得多快、至少要回看多久才不會誤判、接下來哪一天公布。"},"practice":{"zh":"判讀與練習","en":"Practice","q":"怎麼培養自己判讀的能力？","lede":"判讀能力來自固定節奏的觀察，加上把自己的推論寫下來、事後檢驗。這裡收了各主題的例行清單、檢查表、練習題與記錄範本。"},"sources":{"zh":"來源與未確認","en":"Sources and caveats","q":"這些數字從哪來？哪些還不確定？","lede":"核對紀錄、資料方法、各主題的主要來源，以及目前未確認或口徑衝突的項目。"}}},"explorer":{"data_note":"資料：28 個證交所官方類股指數，加上加權指數、櫃買指數與 3 個大分類，2019-12-30 至 2026-09-18 共 346 週的週收盤與週成交值（來源：鉅亨網圖表資料，5 個異常值已用證交所官方收盤值更正）。AI 族群是作者自己挑的 70 檔股票、分成 19 個等權重籃子，從 2022-12-26＝100 起算；籃子是事後挑選的，有存活者偏誤，只能用來看族群之間的相對順序，不能當成可以實現的報酬。所有報酬都是價格報酬，不含股利。","panels":{"corr":{"zh":"誰跟誰一起動","sub":"相關矩陣","how":"每一格是兩個類股「週報酬」的相關係數：+1 完全同向、−1 完全反向、0 沒有關係。預設先扣掉 28 個類股的平均報酬，因為所有類股都會跟著大盤一起漲跌；不扣的話幾乎整張圖都是高度正相關，看不出誰和誰比較像。紅色是同向、藍色是反向，排列順序已經把相似的類股排在一起。點任何一格，下方會出現這一對的滾動 26 週相關（看關係穩不穩定）與領先落後檢定。","find":["扣掉類股平均後，28 個類股大致分成三群：內需與防禦（食品、貿易百貨、觀光、營建、水泥、金融）、電子（半導體、電子零組件、電腦週邊、電機機械）、原物料（塑膠、油電燃氣、鋼鐵）。","最明顯的反向配對是電子零組件對內需類股：近 52 週的相關係數，對貿易百貨 −0.68、對觀光餐旅 −0.60、對食品 −0.59，對金融是 −0.48。意思是資金往電子零組件集中的那幾週，內需與金融相對落後，反過來也一樣。","相關結構不固定：把 2020–2022 與 2023–2026 兩段各算一張矩陣，兩張矩陣彼此的相關只有 0.43。例如電子零組件與貿易百貨由幾乎不相關（−0.06）變成明顯反向（−0.55）。切換上方的期間就能看到。"]},"rrg":{"zh":"輪動圖","sub":"相對強弱 × 強弱的變化","how":"橫軸是相對強弱的位置：類股除以基準的比值，相對它自己過去 26 週平均是高還是低（大於 100 代表比半年平均強）。縱軸是相對強弱的動能：橫軸數值和 4 週前相比在上升還是下降。右上是「領先」、右下「轉弱」、左下「落後」、左上「改善」；類股通常依順時針方向繞行。尾巴是最近幾週走過的路徑。這是簡化的算法，不是市面上付費軟體的原版公式，數值不能互相比較。","find":["這張圖回答的是「現在誰強、誰在轉弱」，不是「接下來誰會漲」。本站檢驗過類股動能：過去 13 週較強的類股，未來 4 週的排序相關只有 0.051（t 值 1.55），統計上不顯著。","拖動週數滑桿，可以回看 2026 年 5 月底到 7 月底那一段：電子零組件由右側快速移到左下，塑膠、航運、金融則由左側移到右側。"]},"rs":{"zh":"相對強弱線","sub":"類股 ÷ 基準","how":"把類股指數除以基準（預設加權指數），再把起點設成 100。線往上代表這段期間比基準強，往下代表比較弱；水平代表同步。看的是轉折和有沒有創新高，不是單週的漲跌。最多同時選 5 條。把基準改成「不扣」就是一般的累積報酬。","find":["以 2020 年初為 1，到 2026-09-18 半導體類的比值是 1.80、電子零組件 1.87、金融 0.68、櫃買指數 0.71：這幾年大型電子股大幅領先，中小型股與金融相對落後。","AI 族群的相對強弱線高點依序出現：代工 2023 年 7 月、電源 2023 年 8 月、重電 2024 年 4 月、機器人 2025 年 2 月、光通訊與測試介面 2026 年 4 月、PCB 與記憶體 2026 年 6 月、被動元件 2026 年 6 月底、散熱與機殼 2026 年 8 月底。"]},"share":{"zh":"成交占比","sub":"資金集中在哪裡","how":"某個類股的週成交值，占 28 個類股成交值合計的比重。它量的是「交易的注意力在哪裡」。要和這個類股自己的歷史比：圖上的灰色帶是 2020 年以來的第 10 到第 90 百分位。占比衝到歷史高檔，代表資金已經很集中，常出現在行情的後段；但高檔可以維持很久，不是賣出訊號。這個圖只適用官方類股。","find":["電子類（8 個電子次類股合計）成交占比 2021 年平均 59.9%、2026 年平均 86.3%，最高是 2026-05-11 當週的 90.2%；9/14 當週為 85.6%，在 2020 年以來的第 93 百分位。","歷史上單一類股成交占比的高點，都對應到那個板塊最熱的時候：航運 42.9%（2021-06-14 當週）、鋼鐵 17.4%（2021-06-28）、營建 7.1%（2024-04-29）、半導體 48.2%（2026-06-22）、電子零組件 28.6%（2026-07-06）。"]},"disp":{"zh":"離散度","sub":"類股之間差多少","how":"每一週把 28 個類股的週報酬排在一起算標準差。數值高，代表同一週裡類股的表現差很多（有人大漲、有人大跌），選對板塊的影響大；數值低，代表大家一起漲跌，看大盤就夠了。細線是每週的值，粗線是 26 週平均。","find":["年平均：2020 年 2.08%、2021 年 2.64%、2022 年 2.20%、2023 年 1.97%、2024 年 2.20%、2025 年 2.63%、2026 年 3.71%。2026 年是這份資料裡最高的一年。","離散度高不等於行情好或壞，它只代表板塊之間分歧大。全面性的急跌（類股同向下跌）反而會讓離散度下降。"]},"rank":{"zh":"期間報酬排行","sub":"每段時間誰領先","how":"每一欄是一段期間，每一格是那段期間的價格漲跌幅；紅色上漲、藍色下跌，顏色愈深幅度愈大。橫向看一個類股在不同時期的表現，直向看同一時期誰領先、誰落後。領先的名單每一期都不同，這就是輪動。","find":["AI 族群各半年的領先者：2023 上半年是重電、機殼、散熱、代工；2023 下半年是 PCB、機殼、ASIC、光通訊；2024 上半年是重電、散熱、機器人；2024 下半年是光通訊、測試介面；2025 下半年是記憶體、測試介面、光通訊；2026 年第 2 季是被動元件、矽晶圓與廠務、PCB、ASIC。","2026-06-29 到 07-27 的急跌中，前一季漲最多的跌最多（被動元件 −56%、測試介面 −31%、PCB −30%），台積電與代工廠幾乎沒跌（−1%、−3%）。漲幅最大的族群，回檔時的跌幅也最大。"]}},"caveats":["相關與領先落後都是用過去的資料算的，不保證未來成立。本站檢驗 3,024 組領先落後關係，256 組通過顯著門檻，但純隨機預期就有約 151 組；最強的相關係數只有 0.16–0.25，而且找不到經濟上的解釋。","類股指數是市值加權，常由一兩檔龍頭股決定（例如半導體類幾乎就是台積電）。要看族群的真實狀況，請搭配 AI 族群籃子（等權重）。","週資料看不到一週之內的事。單日急跌（例如 2026-07-17）在週資料裡會被平滑掉。"]},"verify":{"summary":"四道檢查：頁面數字對回研究底稿、74 個指標讀數重新對原始來源、探索器的發現用同一份資料重算、連結與畫面測試。查出的 8 處錯誤或不精確都已更正。","steps":[{"k":"第一道","d":"頁面數字 → 研究底稿。用程式把 8 個內容區塊裡約 2,900 個數字逐一比對研究底稿與共用數字表：全部找得到出處。起初對不上的 36 個，逐一檢查後都是單位換算或加總（例如底稿寫 56 兆 8,895 億元、頁面寫 56.89 兆元；百萬美元換成億美元），沒有憑空出現的數字。"},{"k":"第二道","d":"指標讀數 → 原始來源（2026-09-20 由獨立的查核程序重新打開來源頁面）。70 個外部指標中：50 個在官方或原始來源頁面讀到相符數字；9 個部分核對（主要數字有官方來源，其餘只在新聞或彙整網站讀到）；10 個只在二手來源讀到相符數字（官方檔案是 Excel、PDF 或需要送出表單，讀不到）；1 個今天讀不到（五大銀行新承做房貸，數字在央行 Excel 附表）。另外 4 個是本站用價格資料算的，已重算相符。每張指標卡上都標了自己的核對狀態。"},{"k":"更正","d":"這一輪查出並已更正：(1) SCFI 運價 3,662.18 點其實是 9/11 的讀數，9/18 為 3,687.83 點（上海航運交易所）；(2) 當沖占比已有 8 月數字 40.99%（證交所 9/7 公布），原頁面還停在 7 月的 38.98%；(3) 前十大權重合計應為 59.05%，原寫 59.06%；(4) 台積電 ADR 溢價「約 9.4%」的日期是 8/31，不是 9/1；(5) 金管會口徑的外資淨匯入，單月與累計數字含陸資，已註明。"},{"k":"第三道","d":"輪動探索器的發現 → 用同一份週資料重算。離散度、成交占比、相關結構的穩定度、領先落後檢定、動能檢定與各族群高點日期都重算相符。更正 3 處：「電子零組件對食品、金融的相關 −0.60 到 −0.68」不精確，實際是對貿易百貨 −0.68、觀光餐旅 −0.60、食品 −0.59、金融 −0.48；計算時扣掉的是 28 個類股的平均報酬，不是加權指數，文字已改；「航運與鋼鐵在 2026 年脫鉤」資料不支持，已換成資料支持的例子。"},{"k":"第四道","d":"連結與畫面。建置程式檢查所有指標連結、區塊連結、圖表與節點都存在；用瀏覽器實際打開每一頁、展開每個區塊，沒有程式錯誤；淺色、深色、手機寬度與右側留白都看過。"}],"note":"限制：第二道只重新核對了 74 張指標卡上的「目前讀數」。各房間內文裡更細的數字（歷年序列、個別公司營收、歷史案例）只對回研究底稿，沒有逐一重新打開來源；它們在研究階段各有來源連結，列在每個區塊下方。所有市場讀數都會過期，這一頁是 2026-09-18 收盤的快照。"}}</script>
