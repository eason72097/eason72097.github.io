<details class="blk" id="a2-howmuch" open>
  <summary><span class="h">台灣本地有多少錢：三個量級</span><span class="sum">隨時能動的 30.5 兆、全部的錢 70.2 兆、家庭淨值 183.7 兆元；一層包一層，不能相加。</span></summary>
  <div class="body">
    <p>直接回答「台灣本地的資金有多少」：要看問的是哪一層。隨時可以動用的錢（<a class="ind" data-ind="m1b_gap">M1B</a>）是 <span class="num">30.53 兆元</span>；把定存、外幣存款、郵局存款都算進來，全部的錢（<a class="ind" data-ind="m2">M2</a>）是 <span class="num">70.22 兆元</span>（兩者都是 2026-07 的日平均餘額）<span class="hd hd-off">官方</span>；再把房地產、股票、保單也算進來，<a class="ind" data-ind="wealth">家庭部門淨值</a>是 <span class="num">183.70 兆元</span>（2024 年底）<span class="hd hd-off">官方</span>。三個數字一層包一層，不能相加。</p>
    <div class="kpis">
      <div class="kpi"><span class="k">M1B（隨時能動的錢）</span><span class="v">30.53 兆元</span><span class="d">2026-07 日平均，年增 7.34%</span></div>
      <div class="kpi"><span class="k">M2（全部的錢）</span><span class="v">70.22 兆元</span><span class="d">2026-07 日平均，年增 7.42%</span></div>
      <div class="kpi"><span class="k">家庭部門淨值</span><span class="v">183.70 兆元</span><span class="d">2024 年底，年增 7.35%</span></div>
      <div class="kpi"><span class="k">對照：上市總市值</span><span class="v">154.32 兆元</span><span class="d">2026-09-18，證交所</span></div>
    </div>
    <h4>錢怎麼分層</h4>
    <p>央行依「多快能拿來花」把錢分成三層，每月統計一次 <span class="hd hd-sys">制度</span>：</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>名稱</th><th>包含什麼</th><th class="n">2026-07 日平均</th></tr></thead>
      <tbody>
        <tr><td class="name">M1A</td><td>大家手上的現金，加上企業與個人的支票存款、活期存款</td><td class="n">12.72 兆元</td></tr>
        <tr><td class="name">M1B</td><td>M1A 加上活期儲蓄存款（只有個人與非營利團體能開）。股票交割戶的錢（<a class="ind" data-ind="settle_dep">證券劃撥存款</a>）算在這一層</td><td class="n">30.53 兆元</td></tr>
        <tr><td class="name">M2</td><td>M1B 加上暫時不動的錢：定存、定期儲蓄存款、<a class="ind" data-ind="fxdep">外匯存款</a>、郵政儲金、外國人新台幣存款、附買回交易、貨幣市場基金</td><td class="n">70.22 兆元</td></tr>
      </tbody>
    </table></div>
    <h4>錢從哪裡長出來</h4>
    <p>M2 變多主要靠兩件事：<a class="ind" data-ind="loans">銀行放款</a>（銀行撥貸 100 元，借款人帳戶就多 100 元存款）與國外資金淨流入（出口商或外資把美元換成新台幣，見<a class="ind" data-ind="fini_flow_fsc">外資淨匯入</a>）。央行直接控制的只有「準備貨幣」（央行發出去的現金，加上銀行存在央行的準備金），2026-07 是 7.55 兆元；M2 約是它的 9.3 倍 <span class="hd hd-est">估計</span>（70.22÷7.55，研究報告自算），其餘是放款創造出來的存款。</p>
    <figure class="chart" data-chart="a2_pools"></figure>
    <div class="how"><span class="lbl">怎麼讀</span>（1）跟股市比：<a class="ind" data-ind="mcap">上市總市值</a> 154.32 兆元（2026-09-18）約是 M2 的 2.2 倍。（2）分清楚存量與流量：這一頁幾乎都是某一天的餘額，不會整筆「流進」股市或房市，會動的是每個月的變化量。（3）池子互相重疊：銀行的負債就是大家的存款，壽險的負債就是家庭的保單，圖上的長條只能比量級，不能加總。</div>
    <details class="sub"><summary>錢增加 12%，股市市值卻增加 91%，差在哪</summary><div class="body">
      <p>M2 由 2024 年平均 62.8 兆元增加到 2026-07 的 70.2 兆元，增加 12%；同一段時間上市總市值由 73.9 兆元（2024 年底）漲到 140.8 兆元（2026-07 底），增加 91%（央行月報）。股市多出來的市值不是等量的錢堆出來的：市值是最新成交價乘上全部股數，少量資金換手就能讓整體市值重估。細節見<a href="#/dest">錢去哪裡</a>的股市分頁。</p>
    </div></details>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/tw/cp-302-192753-27b47-1.html" target="_blank" rel="noopener">央行 115 年 7 月金融情況</a>、<a href="https://www.cbc.gov.tw/public/data/EBOOKXLS/001_EF01_A4L.pdf" target="_blank" rel="noopener">央行金融統計月報 重要金融指標</a>、<a href="https://www.stat.gov.tw/News_Content.aspx?n=2777&amp;s=236195" target="_blank" rel="noopener">主計總處 國富統計新聞稿</a></p>
  </div>
</details>

<details class="blk" id="a2-m1bm2">
  <summary><span class="h">M1B、M2 與黃金交叉／死亡交叉</span><span class="sum">1 月轉正、7 月又回到 −0.08 個百分點。它是同時或落後指標，要看連續幾個月的方向。</span></summary>
  <div class="body">
    <p>結論：2026 年 7 月 M1B 年增 7.34%、M2 年增 7.42%，<a class="ind" data-ind="m1b_gap">M1B 與 M2 年增率差</a>回到 −0.08 個百分點（媒體俗稱死亡交叉，不是央行的正式指標），結束連續 6 個月的正差距 <span class="hd hd-off">官方</span>。兩者都還在 7% 以上：錢的總量仍快速增加，只是活期的部分沒有再加速；央行說明主因是外資淨匯出。單月接近零的交叉資訊量很低，要看 8、9 月差距是否繼續往負值擴大 <span class="tag inf">推論</span>。</p>
    <h4>機制：差距為什麼會變</h4>
    <ul class="list">
      <li>定存解約轉活存：M1B 變大、<a class="ind" data-ind="m2">M2</a> 不變，差距轉正，代表錢從「暫時不動」移到「隨時可動」。</li>
      <li><a class="ind" data-ind="fini_flow_fsc">外資匯入</a>買股：新台幣先進「外國人新台幣存款」（算在 M2），買股後到了賣方的交割戶（算在 M1B），同時推升兩者；外資匯出則同時壓低兩者。</li>
      <li>股市成交熱絡：交割戶的錢（<a class="ind" data-ind="settle_dep">證券劃撥存款</a>）變多，直接墊高 M1B；<a class="ind" data-ind="turnover">成交值</a>縮小時相反。</li>
      <li>利率：<a class="ind" data-ind="policy_rate">政策利率</a>高的時候定存有吸引力，M1B 成長慢。</li>
    </ul>
    <figure class="chart" data-chart="a2_m1bm2"></figure>
    <div class="how"><span class="lbl">怎麼讀</span>（1）看兩條線的距離連續往哪個方向走：2023-08 是 −3.67、2024-03 收斂到 −0.57、2025-03 又到 −2.56，2026-01 轉正、3 月 +2.04、7 月 −0.08。（2）它是同時或落後指標：2026-01 轉正時，加權指數月均值已由 2025-04 的 19,558 點漲到 31,223 點。（3）讀央行新聞稿「主要係……」那一句，它直接說變動來自放款、外資還是匯率。</div>
    <h4>要看多久：放回 2008 年以來的尺度</h4>
    <p>只看最近兩三年，會以為 2026 年 3 月的 +2.04 個百分點很大。2009 年 11 月單月差距曾到 +22 個百分點（M1B 28.62%、M2 6.59%），2021 年平均 +7.6，2022-09 到 2025-12 則連續 40 個月為負 <span class="hd hd-off">官方</span>；放回這個尺度，2026 年只是一次溫和的翻正。</p>
    <figure class="chart" data-chart="a2_m1bm2_year"></figure>
    <div class="mis"><b>常見誤讀</b>　把死亡交叉當賣出訊號 → 2022-09 到 2025-12 連 40 個月差距為負，加權指數月均值卻由 2022 年平均 15,623 點升到 2025-12 的 28,070 點。央行官員 2026-02-26 也說交叉的參考意義已不如以往。</div>
    <details class="sub"><summary>M2 年增率高於央行參考區間（2.5%–6.5%），代表錢太多了嗎</summary><div class="body">
      <p>央行 2020 年起把 M2 成長的「參考區間」定在 2.5%–6.5%，屬於中長期監看指標，超出不代表一定要動作 <span class="hd hd-sys">制度</span>。2026 年 5 月起 M2 年增率高於上限（5 月 7.83%、6 月 8.13%、7 月 7.42%）。以現行區間回頭對照，2008 年以來全年平均超出的只有 2009、2021（8.72%）、2022（7.48%）三年。</p>
      <p>央行 9/17 的說明：主要反映 AI 相關產業帶動<a class="ind" data-ind="exports">出口</a>與投資、企業週轉金需求增加（AI 相關製造業上半年週轉金放款增加 9,113 億元）、<a class="ind" data-ind="wm_loans">個人理財週轉金</a>年增 27.60%，以及股市交易熱絡。央行預估 2026 全年 M2 年增 6.75%，而經濟成長率加 <a class="ind" data-ind="cpi">CPI</a> 年增率合計 13.51%，錢的成長沒有快過經濟 <span class="hd hd-off">官方</span>。</p>
    </div></details>
    <details class="sub"><summary>盲點：匯率會讓 M2 被動變動</summary><div class="body">
      <div class="blind"><b>盲點</b>　<span class="tag add">補充</span> <a class="ind" data-ind="fxdep">外匯存款</a> 9.59 兆元（2026-07 底）是用當月<a class="ind" data-ind="usdtwd">匯率</a>換算成新台幣。2025 年 5 月新台幣急升，外匯存款年增率掉到 −9.36%、6 月 −11.17%，把 M2 年增率壓到 3.3–3.4%，但大家手上的美元一塊都沒少。看到 M2 年增率下降，要先確認同月匯率有沒有大幅變動。</div>
    </div></details>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/public/data/EBOOKXLS/001_EF01_A4L.pdf" target="_blank" rel="noopener">央行金融統計月報 重要金融指標</a>、<a href="https://www.cbc.gov.tw/tw/lp-302-1.html" target="_blank" rel="noopener">央行各月金融情況新聞稿</a>、<a href="https://www.cbc.gov.tw/dl-227600-4c73575ef00a43c5bbfa0e9367497cbd.html" target="_blank" rel="noopener">央行 2026-09-17 參考資料：M2 之重要性與走勢</a>、<a href="https://news.cnyes.com/news/id/6354907" target="_blank" rel="noopener">鉅亨網 2026-02-26</a></p>
  </div>
</details>

<details class="blk" id="a2-bank">
  <summary><span class="h">銀行有多少錢：存款、放款與投資、存放比、體質</span><span class="sum">存款 69.4 兆、放款與投資 56.9 兆元；存款比放款多，多的錢停在央行定存單與債券。逾放比 0.14%。</span></summary>
  <div class="body">
    <p>直接回答「銀行有多少錢」：全體貨幣機構（本國銀行、外銀在台分行、信用合作社、農漁會信用部、郵局）的存款合計 <span class="num">69.40 兆元</span>；借出去的錢加上買進的債券、股票等證券（<a class="ind" data-ind="loans">放款與投資</a>）合計 <span class="num">56.89 兆元</span>（2026-07 底）<span class="hd hd-off">官方</span>。38 家本國銀行總資產 82.51 兆元、淨值 5.82 兆元。要分清楚：存款是銀行欠存戶的錢；銀行自己的錢只有淨值，約占資產的 7.0% <span class="hd hd-est">估計</span>（自算）。</p>
    <div class="kpis">
      <div class="kpi"><span class="k">存款</span><span class="v">69.40 兆元</span><span class="d">2026-07 底，年增 7.37%</span></div>
      <div class="kpi"><span class="k">放款與投資</span><span class="v">56.89 兆元</span><span class="d">年增 9.07%（6 月 8.80%）</span></div>
      <div class="kpi"><span class="k">其中：放款</span><span class="v">47.27 兆元</span><span class="d">年增 9.85%</span></div>
      <div class="kpi"><span class="k">其中：證券投資</span><span class="v">9.62 兆元</span><span class="d">年增 5.43%</span></div>
    </div>
    <h4>放款成長快過存款，而且不是借去買房</h4>
    <p>放款年增 9.85%、對民間部門債權年增 10.13%，高於 2016 年以來任何一個年底值。存款年增 7.37% 跟不上，代表銀行正在動用原本停在<a class="ind" data-ind="ncd">央行定存單</a>的閒置資金。成長來源不是房貸：不動產貸款年增率由 2024-09 的 9.41% 降到 2026-07 的 3.40%（<a class="ind" data-ind="hloan">購置住宅貸款</a> 4.52%、<a class="ind" data-ind="cloan">建築貸款</a> −0.19%），「其他放款」卻由 3 月的 9.86% 升到 14.31%，錢是借給企業（特別是 AI 供應鏈的週轉金）與<a class="ind" data-ind="wm_loans">個人理財週轉金</a>。</p>
    <h4>存放比：長期七成上下</h4>
    <p><a class="ind" data-ind="ldr">存放比</a>是放款除以存款：銀行每收 100 元存款借出去多少。台灣長期只有七成上下，存款遠多於放款需求，多的錢拿去買央行定存單、公債與海外債券；原因是<a class="ind" data-ind="excess_saving">超額儲蓄</a>長期偏高，不是銀行保守。本國銀行國內總分行口徑 2026-07 底是 76.9% <span class="hd hd-est">估計</span>，7 個月上升 1.5 個百分點。</p>
    <h4>體質：目前看不到信用風險訊號</h4>
    <p>本國銀行<a class="ind" data-ind="npl">逾放比</a> 0.14%（超過 3 個月沒正常還款的放款占比）、備抵呆帳覆蓋率 941.22%（2026-07 底，金管會）<span class="hd hd-off">官方</span>，是歷史低檔（2016 年底 0.27%、2020 年底 0.22%）。2025 年稅前盈餘 5,836 億元。平均資本適足率約 15%，小數位 <span class="hd hd-unc">未確認</span>。</p>
    <div class="how"><span class="lbl">怎麼讀</span>逾放比是落後指標：放款出問題到列入逾放要 3 個月以上，而且放款快速增加時分母變大，比率會自然變低。低只代表現在銀行不會因為呆帳而縮手，不代表未來安全。</div>
    <details class="sub"><summary>存款長什麼樣子（存款結構表）</summary><div class="body">
      <div class="tbl-wrap"><table>
        <thead><tr><th>存款種類（2026-07 底）</th><th class="n">餘額</th><th class="n">占比</th><th class="n">年增率</th></tr></thead>
        <tbody>
          <tr><td class="name">活期性存款（企業及個人）</td><td class="n">26.90 兆元</td><td class="n">38.8%</td><td class="n">6.28%</td></tr>
          <tr><td class="name">定期及定期儲蓄存款</td><td class="n">22.43 兆元</td><td class="n">32.3%</td><td class="n">7.00%</td></tr>
          <tr><td class="name"><a class="ind" data-ind="fxdep">外匯存款</a>（歷史新高）</td><td class="n">9.59 兆元</td><td class="n">13.8%</td><td class="n">10.97%</td></tr>
          <tr><td class="name">郵政儲金</td><td class="n">7.23 兆元</td><td class="n">10.4%</td><td class="n">0.05%</td></tr>
          <tr><td class="name">政府存款</td><td class="n">2.79 兆元</td><td class="n">—</td><td class="n">27.14%</td></tr>
          <tr><td class="name">外國人新台幣存款</td><td class="n">0.31 兆元</td><td class="n">—</td><td class="n">—</td></tr>
        </tbody>
      </table></div>
      <p>活期性存款占近四成；外匯存款是歷史新高，年增 10.97%，成長比新台幣存款快；郵政儲金幾乎不成長。以上為央行月報期底數 <span class="hd hd-off">官方</span>。</p>
    </div></details>
    <details class="sub"><summary>存放比的四種口徑：從 68.1% 到 76.9%</summary><div class="body">
      <div class="tbl-wrap"><table>
        <thead><tr><th>口徑</th><th class="n">存放比</th><th>時點</th><th>硬度</th></tr></thead>
        <tbody>
          <tr><td class="name">本國銀行全行（含國際金融業務分行 OBU、海外分行）</td><td class="n">72.43%</td><td>2025 年底</td><td><span class="hd hd-off">官方</span></td></tr>
          <tr><td class="name">本國銀行國內總分行（放款 43.37 兆÷存款 56.38 兆）</td><td class="n">76.9%</td><td>2026-07 底</td><td><span class="hd hd-est">估計</span></td></tr>
          <tr><td class="name">五類機構合計（含只收存款、幾乎不放款的郵局）</td><td class="n">69.6%</td><td>2026-07 底</td><td><span class="hd hd-est">估計</span></td></tr>
          <tr><td class="name">央行全體貨幣機構（47.27 兆÷69.40 兆）</td><td class="n">68.1%</td><td>2026-07 底</td><td><span class="hd hd-est">估計</span></td></tr>
        </tbody>
      </table></div>
      <p>存放比超過 100% 的銀行體系得向市場借錢來放款，資金一緊就脆弱；台灣剛好相反，問題是錢放不出去。三個估計值是研究報告用銀行局與央行的公開數字自算。媒體報的「存放比」常不說是哪一種；2026 年三種自算口徑都在上升，方向一致。2000 年以來的長期數列這次沒有取得 <span class="hd hd-unc">未確認</span>。</p>
    </div></details>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/public/data/EBOOKXLS/003_EF03_A4L.pdf" target="_blank" rel="noopener">央行月報 重要金融指標（續）</a>、<a href="https://www.banking.gov.tw/webdowndoc?file=/stat/index/11507.pdf" target="_blank" rel="noopener">銀行局 金融統計指標 115 年 7 月</a>、<a href="https://www.fsc.gov.tw/ch/home.jsp?id=96&amp;parentpath=0,2&amp;mcustomize=news_view.jsp&amp;dataserno=202609100001&amp;dtable=News" target="_blank" rel="noopener">金管會 2026-09-10 逾放新聞稿</a>、<a href="https://www.cbc.gov.tw/tw/dl-227628-74ae32c955584d8cbe77b43cb3b06fa6.html" target="_blank" rel="noopener">央行 2026-09-17 記者會簡報</a></p>
  </div>
</details>

<details class="blk" id="a2-lend">
  <summary><span class="h">多少錢可以借貸：五道上限與估計的剩餘空間</span><span class="sum">已借出 47.3 兆元；還能借多少要看哪一道上限先卡住，估計 1.7–9 兆元不等，最先吃緊的會是資本。</span></summary>
  <div class="body">
    <p>直接回答「多少錢可以借貸」：已經借出去的<a class="ind" data-ind="loans">放款</a>是 <span class="num">47.27 兆元</span>（2026-07 底）<span class="hd hd-off">官方</span>。還能再借多少沒有單一答案，要看哪一道上限先卡住。研究報告用公開數字推算的量級 <span class="hd hd-est">估計</span>：從流動性看約 7.3 兆元；從資本看約 9 兆元，但每年新增的資本只夠支撐約 3.3 兆元的放款增量；不動產放款限額約 2.5–3.8 兆元；從存放比看約 1.7–3.5 兆元。對照：現在一年的放款增量約 4.2 兆元。</p>
    <p>機制要先懂：銀行放款不是把存款搬出去，而是撥貸時在借款人帳上記一筆新存款。所以放款理論上可以一直創造存款，真正擋住它的是下面幾道監理上限，加上有沒有合格的借款人。</p>
    <figure class="chart" data-chart="a2_room"></figure>
    <div class="tbl-wrap"><table>
      <thead><tr><th>上限</th><th>規定 <span class="hd hd-sys">制度</span></th><th>最新讀數 <span class="hd hd-off">官方</span></th><th>估計還剩多少 <span class="hd hd-est">估計</span></th></tr></thead>
      <tbody>
        <tr><td class="name">1 存款準備金</td><td>依存款種類提存，例如活期存款 10.775%、定期存款 6.0%，平均約 6.9%</td><td><a class="ind" data-ind="excess">超額準備</a> 579 億元（2026-07）</td><td>幾乎為零；但這是央行用<a class="ind" data-ind="ncd">定存單</a>收走閒置資金的結果，不是真正的上限</td></tr>
        <tr><td class="name">2 流動準備</td><td>流動資產至少是新台幣負債的 10%</td><td>23.19%（2026-07）</td><td>超出法定的流動資產約 7.3 兆元</td></tr>
        <tr><td class="name">3 資本適足率</td><td>自有資本÷風險性資產至少 10.5%</td><td>約 15%（2025 年底，小數位未確認）</td><td>降到 12.5% 約可再放 9 兆元；每年新增資本只夠支撐約 3.3 兆元</td></tr>
        <tr><td class="name">4 <a class="ind" data-ind="r72">銀行法 72-2</a></td><td>建築放款不得超過存款加金融債的 30%</td><td>24.19%（2026-07 底）</td><td>到 30% 約 3.8 兆元；到銀行自我設限的 28% 約 2.5 兆元（只限不動產）</td></tr>
        <tr><td class="name">5 <a class="ind" data-ind="credit_ctrl">央行選擇性信用管制</a></td><td>規定特定房貸最多借幾成、有沒有寬限期</td><td>2026-09-18 起第二戶由 6 成放寬到 7 成</td><td>管的是每一筆能借幾成，不是總量</td></tr>
        <tr><td class="name">換個角度：<a class="ind" data-ind="ldr">存放比</a></td><td>不是法規，是結果</td><td>76.9%（國內總分行，自算）</td><td>到 80% 約 1.7 兆元；到理論上限約 83% 約 3.5 兆元</td></tr>
      </tbody>
    </table></div>
    <div class="note">判讀 <span class="tag inf">推論</span>：「銀行沒錢可借」在台灣幾乎不會發生；會發生的是「監理不讓借」（2024 年下半年的房貸排隊）或「銀行自己不敢借」（信用風險升高、<a class="ind" data-ind="npl">逾放比</a>上升時）。放款成長如果長期維持 10%，最先吃緊的是資本，不是存款；到時候會看到銀行發次順位金融債、現金增資或少配息。2026 年前 7 個月本國銀行資產增加 7.7%、淨值只增 4.1%，資本比率正在被稀釋。</div>
    <details class="sub"><summary>四個估計是怎麼算出來的（算式）</summary><div class="body">
      <ul class="list">
        <li><b>流動性</b>：實際流動準備 12.83 兆元（其中央行定存單 5.26 兆元，占 41.0%）減法定應提 5.54 兆元，約 7.3 兆元。假設央行願意讓定存單到期不續；實務上不會，因為 7.3 兆元約是 <a class="ind" data-ind="m2">M2</a> 的 10%。</li>
        <li><b>存放比</b>：本國銀行國內總分行存款 56.38 兆元、放款 43.37 兆元。回到 80%：0.80×56.38−43.37，約 1.7 兆元。理論上限：每 100 元存款先扣平均 6.9 元法定準備、再留 10 元流動準備，最多 83.1 元可放款，約 3.5 兆元。照 2026 年的上升速度，約 2–3 年會碰到 83%。</li>
        <li><b>72-2</b>：分母（存款加金融債）64.84 兆元×（30%−24.19%），約 3.8 兆元；以 28% 計約 2.5 兆元。這是全體平均的算術空間，實際是每家銀行各自適用。</li>
        <li><b>資本</b>：平均資本適足率約 15%，若降到 12.5%，風險性資產可擴張 15÷12.5−1，即 20%，相當於放款約 9 兆元。流量面：淨值 5.8 兆元、年賺約 0.6–0.7 兆元，假設保留一半，每年新增資本約 0.3 兆元；目標資本適足率 13%、放款平均風險權數 70% 時，可支撐 0.3÷0.13÷0.7，約 3.3 兆元，比現在一年約 4.2 兆元的放款增量少。假設多，只供量級參考。</li>
      </ul>
    </div></details>
    <details class="sub"><summary>72-2 為什麼從 2024 年的吃緊變成現在的寬鬆</summary><div class="body">
      <p>2024-09 全體平均到 26.82% 的波段高點；2024-08 時 33 家銀行有 21 家超過 26%，出現房貸排隊。到 2026-07 底降為 24.19%，連 14 個月下滑、是 2011 年 1 月以來最低；沒有任何銀行超過 28%，27–28% 只有 1 家（金管會數字，經濟日報 2026-08-26 轉述）。下降主要是分母（存款）長得快，不是房貸減少：分子不動產放款 15.69 兆元仍在月增。另外，2025 年 9 月起新承做的新青安房貸不計入分子；都更危老重建貸款（2026-07 為 8,659 億元，占<a class="ind" data-ind="cloan">建築貸款</a> 25.25%）也不計入。</p>
      <p>央行每季更新的<a class="ind" data-ind="conc">不動產放款集中度</a>（不動產貸款÷總放款）同樣在降：2024-06 高點 37.61%，2026-07 為 34.44%。央行 2024 年 8 月要求銀行自主控管不動產放款總量的做法，已在 2025-12-18 決議自 2026 年起回歸各銀行內部控管，但仍須按月申報。房貸與信用管制的完整時間線見<a href="#/dest">錢去哪裡</a>的房市分頁。</p>
    </div></details>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/public/data/EBOOKXLS/070_EF72_A4R.pdf" target="_blank" rel="noopener">央行月報 準備金表</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-192789-e5f32-1.html" target="_blank" rel="noopener">央行 2026-08-28 流動準備新聞稿</a>、<a href="https://money.udn.com/money/story/5613/9716341" target="_blank" rel="noopener">經濟日報 2026-08-26（72-2 比率）</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html" target="_blank" rel="noopener">央行 2026-09-17 理監事會決議</a></p>
  </div>
</details>

<details class="blk" id="a2-ncd">
  <summary><span class="h">央行怎麼把多出來的新台幣收回去：定存單</span><span class="sum">央行買美元會放出新台幣，再發定存單收回。餘額 6.57 兆元（2026-08），今年減 0.85 兆，代表央行在放錢。</span></summary>
  <div class="body">
    <p>結論：<a class="ind" data-ind="ncd">央行定存單</a>未到期餘額 <span class="num">6.57 兆元</span>（2026-08 底）<span class="hd hd-off">官方</span>，今年以來減少約 0.85 兆元，7 月的 6.47 兆元是近十年低點。餘額下降代表央行正在把錢放回銀行體系，銀行的閒置資金也正在被<a class="ind" data-ind="loans">放款</a>用掉；但 6 兆多元仍是很大的量，離用完很遠 <span class="tag inf">推論</span>。</p>
    <h4>流程：外匯存底和定存單是同一件事的兩面</h4>
    <ol class="steps">
      <li><a class="ind" data-ind="fxsettle">出口商把美元賣給銀行換新台幣</a>，或外資匯入美元買台股，新台幣有升值壓力。央行如果進場買美元，就得付出新台幣；這筆錢進到銀行在央行的準備金帳戶，<a class="ind" data-ind="reserves">外匯存底</a>也同時增加。</li>
      <li>放著不管，銀行準備金太多，銀行之間互借的利率會掉到接近零，放款與 <a class="ind" data-ind="m2">M2</a> 會膨脹。所以央行發行定期存單向銀行借回這些新台幣，付一點利息。這個動作叫沖銷（<span class="en">sterilization</span>）。</li>
      <li>反方向：外資賣股匯出要買美元，央行如果賣美元調節，就會收回新台幣，銀行資金變緊；央行就讓定存單到期不續發，把錢放回去。</li>
    </ol>
    <figure class="chart" data-chart="a2_ncd"></figure>
    <dl class="ev3">
      <div><dt>上升</dt><dd>央行在收錢，背景多是外資匯入、出口商賣匯、央行買匯阻升。2025 年 3 到 6 月新台幣急升，餘額由 7.30 兆增加到 7.87 兆元。</dd></div>
      <div><dt>下降</dt><dd>央行在放錢，背景是外資匯出、央行賣匯、繳稅，或放款需求強、銀行把錢拿回去用。央行 9/17 自述「持續透過減發存單及減收轉存款釋出資金」。</dd></div>
      <div><dt>判讀</dt><dd>外資在集中市場賣超 1.41 兆元（<a class="ind" data-ind="fini_flow_twse">證交所口徑</a>，至 9/18），M2 年增率卻由 5% 升到 8%：放款年增近 10% 在創造存款，央行又減發定存單把被抽走的新台幣補回去，所以隔夜拆款利率全年幾乎停在 0.82%。<span class="tag inf">推論</span></dd></div>
    </dl>
    <div class="mis"><b>常見誤讀</b>　「央行收走 6 兆元，所以市場缺錢」→ 那是銀行多到沒地方放才停在央行的錢，利率只有 1.2–1.6%，銀行隨時樂意換成利率 2–3% 的放款。同理，<a class="ind" data-ind="excess">超額準備</a>只有 579 億元（2026-07，約存款的 0.1%）不代表銀行沒錢。在台灣，看銀行還有多少閒置資金要看定存單餘額，不是超額準備。</div>
    <details class="sub"><summary>盲點：外資到底是「匯出」還是「匯入」，三個口徑三種答案</summary><div class="body">
      <div class="blind"><b>盲點</b>　<span class="tag add">補充</span> 央行說 7 月是外資淨匯出，證交所口徑今年大幅賣超；但<a class="ind" data-ind="fini_flow_fsc">金管會口徑</a> 1–8 月累計仍是淨匯入 905 億美元，方向相反。賣股拿到的錢不一定馬上匯走：外國人新台幣存款 7 月底有 3,125 億元，是 2021 或 2022 年以來最高（兩家媒體說法不一 <span class="hd hd-unc">未確認</span>）。外匯存底由 2025-12 的 6,025.5 億美元降到 2026-07 的 5,942.7 億美元，8 月回到 6,019 億美元。口徑差異見<a href="#/inflow">錢從哪來</a>。</div>
    </div></details>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/public/data/EBOOKXLS/027_EF25_A4L.pdf" target="_blank" rel="noopener">央行月報 中央銀行資產負債統計表</a>、<a href="https://www.cbc.gov.tw/tw/lp-1008-1.html" target="_blank" rel="noopener">央行 公開市場操作統計</a>、<a href="https://www.cbc.gov.tw/dl-227600-4c73575ef00a43c5bbfa0e9367497cbd.html" target="_blank" rel="noopener">央行 2026-09-17 參考資料</a></p>
  </div>
</details>

<details class="blk" id="a2-rate">
  <summary><span class="h">利率：政策利率沒動，市場利率自己走高</span><span class="sum">重貼現率 2.00% 連 10 次不動，但 10 年期公債殖利率由 1.357% 升到 1.907%，借錢已變貴。</span></summary>
  <div class="body">
    <p>結論：<a class="ind" data-ind="policy_rate">央行政策利率</a>（重貼現率，央行借錢給銀行的利率）自 2024-03-22 起停在 <span class="num">2.00%</span>，2026-09-17 理監事會第 10 次不動，其中 2 位理事主張升息 <span class="hd hd-off">官方</span>。但市場利率從 2025 年底以來已經上升 0.2–0.55 個百分點，企業與建商的借錢成本實際變貴了。只看政策利率會漏掉這一段。</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>利率（央行 9/17 簡報）<span class="hd hd-mkt">市場</span></th><th class="n">2025-12</th><th class="n">2026-09</th><th class="n">變動（百分點）</th></tr></thead>
      <tbody>
        <tr><td class="name">10 年期公債殖利率</td><td class="n">1.357%</td><td class="n">1.907%</td><td class="n">+0.550</td></tr>
        <tr><td class="name">5 年期公司債</td><td class="n">1.708%</td><td class="n">2.230%</td><td class="n">+0.522</td></tr>
        <tr><td class="name">1 個月期商業本票</td><td class="n">1.228%</td><td class="n">1.643%</td><td class="n">+0.415</td></tr>
        <tr><td class="name">1 年期 NCD（簡報用語）</td><td class="n">1.494%</td><td class="n">1.723%</td><td class="n">+0.229</td></tr>
        <tr><td class="name">重貼現率（政策利率）</td><td class="n">2.000%</td><td class="n">2.000%</td><td class="n">0</td></tr>
      </tbody>
    </table></div>
    <ul class="list">
      <li>最短的利率沒動：銀行之間互借一天的隔夜拆款利率 8 月平均 0.822%（7 月 0.824%），因為央行用減發<a class="ind" data-ind="ncd">定存單</a>把資金補回去（見<a class="ind" data-ind="excess">超額準備與銀行間利率</a>）。</li>
      <li>央行 364 天期定存單的得標利率逐月走高：4 月 1.285%、6 月 1.523%、8 月 1.626%、9/3 開標 1.643%。這是銀行願意把錢借給央行一年的價格，可以當成市場利率的月頻觀察點（和上表簡報的「1 年期 NCD」不是同一個數列）。</li>
      <li>存放款牌告：五大銀行一年期定存 1.70%、基準放款利率 3.265%（2026-07）。</li>
    </ul>
    <p>市場利率為什麼自己走高？可能的原因是<a class="ind" data-ind="loans">放款</a>需求強（年增近 10%）、外資匯出抽走資金，以及跟著美國利率上行（<a class="ind" data-ind="fed">聯準會</a> 9/16 升息 1 碼至 3.75–4.00%，美國 10 年期公債殖利率約 5%）。這是研究報告的推論，央行沒有這樣表述 <span class="tag inf">推論</span>。</p>
    <div class="how"><span class="lbl">怎麼讀</span>政策利率一季才決定一次，而且台灣央行常用別的工具代替利率：9/17 利率不動，同一次會議把第二戶房貸成數上限由 6 成放寬到 7 成（<a class="ind" data-ind="credit_ctrl">選擇性信用管制</a>）。每季要讀決議全文，平常每月看 364 天期定存單得標利率與 10 年期公債殖利率。歷次調整：2020-03 降到 1.125%，2022-03 起逐步調升，2023-03 到 1.875%、2024-03 到 2.000%。</div>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html" target="_blank" rel="noopener">央行 2026-09-17 理監事會決議</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-192823-eb386-1.html" target="_blank" rel="noopener">央行 2026-09-07 拆款市場新聞稿</a>、<a href="https://www.cbc.gov.tw/tw/cp-1008-162772-42520-1.html" target="_blank" rel="noopener">央行 364 天期定存單標售</a></p>
  </div>
</details>

<details class="blk" id="a2-wealth">
  <summary><span class="h">錢放在哪：國富統計與家庭資產結構</span><span class="sum">家庭淨值 183.7 兆元（2024 年底）多半是房地產與股票的帳面價值；隨時能動的只有 M1B 約 30 兆元。</span></summary>
  <div class="body">
    <p>結論：<a class="ind" data-ind="wealth">國富統計</a>是全國的資產負債表，用來回答「錢放在哪」。2024 年底家庭部門淨值 <span class="num">183.70 兆元</span>，一年增加 12.58 兆元（+7.35%）<span class="hd hd-off">官方</span>。但這是存量，增加的部分多半是股票與房地產漲價造成的帳面重估，不是存下來的新錢；其中隨時能動用的只有 <a class="ind" data-ind="m1b_gap">M1B</a> 約 30 兆元，而且 M1B 還包含企業的錢。</p>
    <div class="kpis">
      <div class="kpi"><span class="k">國富毛額</span><span class="v">330.11 兆元</span><span class="d">2024 年底，+3.20%</span></div>
      <div class="kpi"><span class="k">國富淨額（扣折舊）</span><span class="v">258.97 兆元</span><span class="d">2024 年底，+2.70%</span></div>
      <div class="kpi"><span class="k">家庭部門淨值</span><span class="v">183.70 兆元</span><span class="d">土地按市價，+7.35%</span></div>
      <div class="kpi"><span class="k">企業生產性固定資產毛額</span><span class="v">82.39 兆元</span><span class="d">2024 年底，+5.29%</span></div>
    </div>
    <p>換算每人約 785 萬元、每戶約 1,960 萬元 <span class="hd hd-est">估計</span>（研究報告用約 2,340 萬人、935 萬戶的約數自算）；官方的每戶、每人平均與家庭資產結構細項，這次讀不到主計總處的附表 <span class="hd hd-unc">未確認</span>。家庭的錢大致落在這些地方（以下含企業持有的部分）：活期性存款 26.90 兆元、定存 22.43 兆元、<a class="ind" data-ind="fxdep">外匯存款</a> 9.59 兆元、郵政儲金 7.23 兆元（2026-07 底），加上股票與保單；最大的負債是<a class="ind" data-ind="hloan">購置住宅貸款</a> 11.89 兆元（2026-07）。</p>
    <div class="how"><span class="lbl">怎麼讀</span>（1）拿家庭淨值年增率和<a class="ind" data-ind="wages">薪資</a>成長比：高出很多的部分就是<a class="ind" data-ind="hprice">房價</a>、股價重估。（2）看結構：金融資產比重越高，家庭財富對股市越敏感，股市漲跌對消費的影響也越大（財富效果）。（3）一年只有一筆，結構移動很慢，至少看 10 年。</div>
    <div class="blind"><b>盲點</b>　<span class="tag add">補充</span> 時間落後 16 個月以上。現在看到的是 2024 年底的存量，2024 年加權指數全年月均 21,383 點，2026-09-18 已收 47,180.75 點，家庭持股市值早已不同。另外，平均數被高資產家庭拉高，國富統計不提供中位數。</div>
    <div class="mis"><b>常見誤讀</b>　把 183.7 兆元當成可以拿來買股票的錢 → 房地產不能直接變現，保險與退休金準備鎖在機構裡。而且家庭的保險準備，就是壽險業拿去投資海外債券的那筆錢（<a class="ind" data-ind="life_fx">壽險國外投資</a>），同一筆錢有兩種記法，不能重複加總。</div>
    <p class="src">來源：<a href="https://www.stat.gov.tw/News_Content.aspx?n=2777&amp;s=236195" target="_blank" rel="noopener">主計總處 113 年底國富統計新聞稿（2026-04-29）</a>、<a href="https://www.stat.gov.tw/cp.aspx?n=2773" target="_blank" rel="noopener">國富統計表</a></p>
  </div>
</details>

<details class="blk" id="a2-inst">
  <summary><span class="h">主要機構的資產規模</span><span class="sum">本國銀行 82.5 兆＞壽險 38.7 兆＞投信基金 16.4 兆＞勞動基金 9.1 兆元；互相重疊，不能加總。</span></summary>
  <div class="body">
    <p>結論：台灣的錢大部分由幾類機構代管。規模由大到小是本國銀行 82.5 兆元、壽險業 38.7 兆元、<a class="ind" data-ind="funds">投信境內基金</a> 16.4 兆元（其中 ETF 約 11.3 兆元）、勞動基金 9.1 兆元、郵政儲金 7.2 兆元（2026 年 7–8 月）<span class="hd hd-off">官方</span>。它們不能加總：銀行的負債就是大家的存款，壽險的負債是家庭的保單，ETF 的持有人主要是家庭與壽險。要看的是每一類機構把錢拿去做什麼。</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>機構</th><th class="n">規模</th><th>時點</th><th>錢拿去做什麼</th></tr></thead>
      <tbody>
        <tr><td class="name">本國銀行（38 家）</td><td class="n">82.51 兆元</td><td>2026-07 底</td><td>國內放款 43.37 兆元；多的存款買<a class="ind" data-ind="ncd">央行定存單</a>、公債與海外債券。2025 年底為 76.6 兆元，7 個月增加 5.9 兆元</td></tr>
        <tr><td class="name">壽險業</td><td class="n">38.67 兆元</td><td>2026-07 底</td><td>約三分之二投到海外：國外投資 22.2 兆元，占資金運用的 66%（保險局口徑，2026-04 底）</td></tr>
        <tr><td class="name">投信境內基金</td><td class="n">16.45 兆元</td><td>2026-08 底</td><td>ETF 10.34 兆元加主動式 ETF 0.99 兆元，合計占 69%（占比自算）；國內股票型基金 1.82 兆元</td></tr>
        <tr><td class="name">勞動基金</td><td class="n">9.08 兆元</td><td>2026-07-31</td><td>1–7 月收益 1.96 兆元、收益率 25.03%。新制勞退約 24.8%（約 1.48 兆元）放在國內股票，約六成在國外</td></tr>
        <tr><td class="name">郵政儲金</td><td class="n">7.23 兆元</td><td>2026-07 底</td><td>年增 0.05%，幾乎不成長、也幾乎不放款；其中 1.62 兆元轉存央行</td></tr>
        <tr><td class="name">國安基金</td><td class="n">上限 5,000 億元</td><td>制度</td><td>目前不在場。2025-04 到 2026-01 護盤，實際買入成本只有 122.50 億元</td></tr>
      </tbody>
    </table></div>
    <ul class="list">
      <li><b>壽險</b>把保費（家庭的長期儲蓄）的三分之二投到海外，所以台灣的<a class="ind" data-ind="excess_saving">超額儲蓄</a>主要經由壽險、加上近年的<a class="ind" data-ind="bond_etf">債券 ETF</a> 流到國外。22 兆元的海外部位讓<a class="ind" data-ind="usdtwd">匯率</a>變動直接影響壽險損益，避險比率 42.94%（2026 年中），細節見<a class="ind" data-ind="life_fx">壽險國外投資與避險</a>。</li>
      <li><b>ETF</b> 已占境內基金近七成，是家庭資金進股市與債市的主要通道；<a class="ind" data-ind="etf">ETF 規模</a>的變化要和<a class="ind" data-ind="settle_dep">證券劃撥存款</a>一起看，兩者是同一批散戶資金。台股 ETF 與債券 ETF 的分項金額，公會頁面沒有列 <span class="hd hd-unc">未確認</span>。</li>
      <li><b>勞動基金</b>今年前 7 個月賺了近 2 兆元，規模突破 9 兆元；放在國內股票的部分是台股穩定的長期買盤，但六成的錢在海外。</li>
    </ul>
    <div class="how"><span class="lbl">怎麼讀</span>壽險有兩種口徑：央行月報的「國外資產÷總資產」是 56.7%（2026-07），保險局的「國外投資÷資金運用總額」是 66.03%（2026-04）。分母不同，媒體常引用的是後者。其他去向的規模比較見<a href="#/dest">錢去哪裡</a>。</div>
    <p class="src">來源：<a href="https://www.banking.gov.tw/webdowndoc?file=/stat/index/11507.pdf" target="_blank" rel="noopener">銀行局 金融統計指標</a>、<a href="https://www.cbc.gov.tw/public/data/EBOOKXLS/065_EF67_A4L.pdf" target="_blank" rel="noopener">央行月報 人壽保險公司資產負債統計表</a>、<a href="https://www.ib.gov.tw/ch/home.jsp?id=48&amp;parentpath=0,4" target="_blank" rel="noopener">保險局 保險市場重要指標</a>、<a href="https://www.sitca.org.tw/ROC/Industry/IN2001.aspx" target="_blank" rel="noopener">投信投顧公會</a>、<a href="https://www.blf.gov.tw/49200/49245/49247/210788/post" target="_blank" rel="noopener">勞動基金運用局 2026-08-03</a>、<a href="https://www.mof.gov.tw/multiplehtml/383" target="_blank" rel="noopener">財政部 國安基金新聞稿</a></p>
  </div>
</details>

<details class="blk" id="a2-income">
  <summary><span class="h">薪資、超額儲蓄、現金股利</span><span class="sum">GDP 成長 11%、經常性薪資只增 3.32%，差額留在企業與股東；一年 5–6 兆元的超額儲蓄多數流向海外。</span></summary>
  <div class="body">
    <p>結論：家庭每個月的現金流入主要是<a class="ind" data-ind="wages">薪資</a>，但今年景氣的好處大部分沒有走薪資這條路。2026 年 7 月經常性薪資 49,491 元、年增 3.32% <span class="hd hd-off">官方</span>，扣掉約 2% 的物價（<a class="ind" data-ind="cpi">CPI</a>），實質只增約 1 個百分點；同時 <a class="ind" data-ind="gdp">GDP</a> 全年成長預測在 11% 以上。差額留在企業盈餘與股東手上，這是超額儲蓄居高不下、股利成為家庭重要現金流的背景 <span class="tag inf">推論</span>。</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>2026-07（主計總處）</th><th class="n">經常性薪資</th><th class="n">年增</th><th class="n">總薪資</th><th class="n">年增</th></tr></thead>
      <tbody>
        <tr><td class="name">全體受僱員工</td><td class="n">49,491 元</td><td class="n">+3.32%</td><td class="n">71,165 元</td><td class="n">+8.25%</td></tr>
        <tr><td class="name">本國籍全時員工</td><td class="n">52,528 元</td><td class="n">+3.67%</td><td class="n">74,827 元</td><td class="n">+8.08%</td></tr>
        <tr><td class="name">本國籍全時員工中位數</td><td class="n">41,397 元</td><td class="n">+4.04%</td><td class="n">—</td><td class="n">—</td></tr>
      </tbody>
    </table></div>
    <p>經常性薪資是每月固定領的本薪與津貼；總薪資再加獎金與加班費。總薪資年增 8% 多半來自獎金，7 月又有年中獎金入帳，不能當成普遍加薪。</p>
    <h4>超額儲蓄：賺的錢沒在國內用掉的部分</h4>
    <p><a class="ind" data-ind="excess_saving">超額儲蓄</a>是國民儲蓄減國內投資：全國一年賺的錢扣掉消費後存下來的，再減掉國內蓋廠房、買設備、蓋房子用掉的。它在帳上約等於<a class="ind" data-ind="ca">經常帳順差</a>：<a class="ind" data-ind="exports">出口</a>大於進口賺進來的外匯，就是沒在國內花掉的所得。2025 年經常帳順差 1,844 億美元，以 1 美元約 31.5 元粗換算約 5.8 兆元；2026 上半年 1,210 億美元、約 3.8 兆元 <span class="hd hd-est">估計</span>。一年 5–6 兆元，約等於 <a class="ind" data-ind="m2">M2</a> 的 8%。</p>
    <p>這筆錢大部分沒有留在台灣的銀行體系：<a class="ind" data-ind="fa">金融帳</a>淨流出 2025 年是 1,594 億美元、2026 上半年 1,181 億美元，<a class="ind" data-ind="life_fx">壽險</a>、<a class="ind" data-ind="bond_etf">債券 ETF</a>、企業與個人把錢投到了海外；留下來的部分才變成 M2 成長與央行的<a class="ind" data-ind="reserves">外匯存底</a>。所以「出口很好，國內錢一定很多」只對一半。主計總處對 2026 年超額儲蓄的預測這次讀不到 <span class="hd hd-unc">未確認</span>；2024 年為 4.01 兆元（金管會亞洲資產管理中心專網引述，研究報告未重查）。</p>
    <details class="sub"><summary>現金股利：每年夏天回到股東手上的錢（2026 年約 2.5 兆元，估計）</summary><div class="body">
      <p>上市櫃公司多在 6–8 月除息、7–9 月發放，錢進到股東的交割戶（<a class="ind" data-ind="settle_dep">證券劃撥存款</a>，M1B 的一部分）；外資拿到股利後多半匯出，所以 7、8 月常見新台幣貶值壓力。2026 年發放總額約 2.5 兆元 <span class="hd hd-est">估計</span>（中國信託銀行主管 2026-07-02 的說法，證交所官方總額未確認）。拿它除以<a class="ind" data-ind="mcap">上市總市值</a> 154.32 兆元，現金殖利率約 1.6%（分子含上櫃、分母只有上市，實際更低；大盤殖利率見<a class="ind" data-ind="pe">本益比與殖利率</a>）：指數漲得比股利快，股利回流相對市值的分量變小。2026 上半年上市公司獲利成長 92.88%（證交所），明年夏天的股利會明顯放大。</p>
      <div class="mis"><b>常見誤讀</b>　把除息旺季當成「資金行情」→ 股利是公司帳上的錢轉到股東帳上，股價同步扣除，整個市場的錢沒有變多。淨效果要看股東拿到錢後再投入多少、外資匯出多少。</div>
    </div></details>
    <p class="src">來源：<a href="https://www.dgbas.gov.tw/News_Content.aspx?n=3602&amp;s=236702" target="_blank" rel="noopener">主計總處 2026 年 7 月薪資統計</a>、<a href="https://www.cbc.gov.tw/public/data/EBOOKXLS/007_EF07_A4L.pdf" target="_blank" rel="noopener">央行月報 國際收支欄</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-192740-6b688-1.html" target="_blank" rel="noopener">央行 2026-08-20 新聞稿</a>、<a href="https://udn.com/news/story/7239/9601382" target="_blank" rel="noopener">聯合報 2026-07-02（股利估計）</a></p>
  </div>
</details>

<details class="blk" id="a2-blind">
  <summary><span class="h">盲點與常見誤讀</span><span class="sum">九個最容易看錯的地方：錢多不等於股市漲、M2 不是印鈔、存量不是流量、口徑要先問清楚。</span></summary>
  <div class="body">
    <p>看到任何「資金很多」的說法，先問三件事：它是存量還是流量、是哪個口徑、是原因還是結果。以下九條是作者整理的判讀 <span class="tag inf">推論</span>，數字出處同前面各區塊。</p>
    <div class="mis"><b>誤讀 1</b>　「錢很多，所以股市一定漲」→ 2022 年 <a class="ind" data-ind="m2">M2</a> 年增 7.48%、也高於參考區間，台股月均指數卻由 2021 年的 16,938 點降到 15,623 點。<a class="ind" data-ind="mcap">上市市值</a>是最新成交價乘上全部股數，不是等量的錢堆出來的。</div>
    <div class="mis"><b>誤讀 2</b>　「M2 成長就是央行印鈔」→ 央行直接控制的準備貨幣約 7.6 兆元，M2 約是它的 9.3 倍，其餘是<a class="ind" data-ind="loans">銀行放款</a>創造的存款；2026 年 M2 加速，央行點名的是企業與個人的週轉金放款，以及股市交易熱絡。</div>
    <div class="blind"><b>盲點 3</b>　出口賺的錢多數沒留在國內。2025 年<a class="ind" data-ind="ca">經常帳順差</a> 1,844 億美元，同年<a class="ind" data-ind="fa">金融帳</a>淨流出 1,594 億美元；台灣是資金淨輸出國，M2 年增率長年只有 4–6%，遠低於<a class="ind" data-ind="exports">出口</a>成長。</div>
    <div class="blind"><b>盲點 4</b>　沒看到央行的沖銷。外資大量匯入時央行增發<a class="ind" data-ind="ncd">定存單</a>收回新台幣（2025 年 3–6 月收回 5,700 億元），匯出時減發（2026 年約 8,500 億元），所以<a class="ind" data-ind="excess">隔夜拆款利率</a>全年停在 0.82% 附近，外資進出對銀行間資金的影響大多被抵銷。</div>
    <div class="mis"><b>誤讀 5</b>　把<a class="ind" data-ind="settle_dep">證券劃撥存款</a>當成「一定會進場的錢」→ 2026-05 底創高 4.50 兆元，兩個月後指數回檔約 3,000 點，餘額就少了約 3,200 億元。它跟著成交量與股價走，是結果不是原因。</div>
    <div class="mis"><b>誤讀 6</b>　「央行沒升息，資金環境就沒變」→ <a class="ind" data-ind="policy_rate">政策利率</a>停在 2.00%，但 2025-12 到 2026-09，10 年期公債殖利率由 1.357% 升到 1.907%。</div>
    <div class="blind"><b>盲點 7</b>　口徑混用。<a class="ind" data-ind="ldr">存放比</a>有 72.4%、76.9%、69.6% 三種；「銀行放款」有 48.85 兆、47.27 兆、43.37 兆元三種；M2 年增率 2026-07 日平均 7.42%、期底 6.58%。引用時要寫口徑與時點。</div>
    <div class="mis"><b>誤讀 8</b>　「國安基金進場＝政府拿 5,000 億元買股票」→ 5,000 億元是額度上限。2025-04 到 2026-01 的護盤實際只買 122.50 億元（財政部 2026-07-13 公告），不到額度的 2.5%，也不到台股一天成交值的 2%。</div>
    <div class="blind"><b>盲點 9</b>　把存量當流量。<a class="ind" data-ind="wealth">家庭淨值</a> 183.7 兆元、<a class="ind" data-ind="life_fx">壽險海外投資</a> 22 兆元、定存單 6.6 兆元都不會整筆「流進」股市。先問這個數字的月變動是多少、跟<a class="ind" data-ind="turnover">成交值</a>比大不大。</div>
  </div>
</details>

</template>
<template id="tpl-B1-room"><div class="room-lede">
  <p class="verdict">「會有多少錢流入台灣股市」沒有單一數字可以回答，因為每筆成交都是一買一賣、金額相等。2026 年到 9/18，上市市值多了約 60 兆元，但沒有任何一類投資人的淨買賣超過 2 兆元：外資賣超 1.41 兆、自營商賣超 0.96 兆、投信買超 0.76 兆，其他所有人合計約買超 1.61 兆元（估計）。</p>
  <ul class="takeaways">
    <li><b>指數上漲不需要淨流入</b>：價格由最後幾筆成交決定，所有股票跟著重新定價；推高<a class="ind" data-ind="mcap">市值</a>的是獲利（上半年年增 92.88%），不是 60 兆元新錢。</li>
    <li><b>外資賣、國內買</b>：<a class="ind" data-ind="fini_flow_twse">外資賣超</a>幾乎都在台積電（<a class="ind" data-ind="tsmc_w">權重 41.48%</a>），由 ETF、零股與國內法人買走；2020 年起外資賣、指數漲已是常態。</li>
    <li><b>散戶的錢主要走 ETF</b>：<a class="ind" data-ind="inst">投信買超</a>與自營商避險賣超是同一件事的兩面；正 2 與主動式 <a class="ind" data-ind="etf">ETF</a> 擴張最快，連帶推高<a class="ind" data-ind="fut_oi">期貨未平倉</a>。</li>
    <li><b>槓桿密度不高，但集中在中小型股</b>：<a class="ind" data-ind="margin">融資</a>占上市市值 0.385%，上櫃約 1.8%；7 月被迫減掉的融資，七週內加回七成。</li>
    <li><b>交易熱度已過高峰</b>：9 月日換手 0.57%（6 月 0.94%），<a class="ind" data-ind="settle_dep">證券劃撥存款</a>連兩月減少，<a class="ind" data-ind="pe">本益比</a> 25.62 倍仍在近五年第 88 百分位。</li>
  </ul>
</div>

<details class="blk" id="b1-frame" open>
  <summary><span class="h">先拆問題：會有多少錢流入台灣股市？</span><span class="sum">沒有「淨流入 X 兆」這種數字；市值今年多 60 兆元，各類投資人的淨買賣都只有 1 兆元上下。</span></summary>
  <div class="body">
    <p>直接回答：股市沒有「今年淨流入多少」的官方數字。每一筆成交都是一買一賣、金額相等，流進來的錢永遠等於流出去的錢。可以量的是四件事：誰淨買誰淨賣、停在場邊還沒買的錢有多少、股票的供給有沒有增加、現在的部位擠不擠。2026 年到 9/18 的答案是：<a class="ind" data-ind="fini_flow_twse">外資賣超</a> 1.41 兆元、自營商賣超 0.96 兆元；買走這些股票的是投信（0.76 兆元，多數是散戶申購 <a class="ind" data-ind="etf">ETF</a>）與<a class="ind" data-ind="inst">三大法人</a>以外的人（約 1.61 兆元）。</p>
    <div class="kpis">
      <div class="kpi"><span class="k">上市市值增加</span><span class="v">+59.96 兆元</span><span class="d">94.36 → 154.32 兆（+63.5%），至 9/18</span></div>
      <div class="kpi"><span class="k">外資及陸資</span><span class="v">−1.4134 兆元</span><span class="d">證交所口徑，至 9/18</span></div>
      <div class="kpi"><span class="k">投信（含 ETF）</span><span class="v">+0.7636 兆元</span><span class="d">同上</span></div>
      <div class="kpi"><span class="k">自營商</span><span class="v">−0.9559 兆元</span><span class="d">其中避險 −0.898 兆</span></div>
      <div class="kpi"><span class="k">三大法人以外的人</span><span class="v">約 +1.61 兆元</span><span class="d">由三大法人合計反推 <span class="hd hd-est">估計</span></span></div>
    </div>
    <p>市值多了 60 兆元，各類投資人的淨買賣卻只有 1 兆元上下，原因是價格由邊際成交（<span class="en">marginal trade</span>，最後成交的那幾筆）決定：只要最後幾筆用更高的價格成交，所有已發行的股票就都用新價格計算市值。推動重新定價的是獲利與預期：本國上市公司（不含金融保險業）2026 上半年營收年增 32.83%、獲利年增 92.88%（證交所 8/17 新聞稿）<span class="hd hd-mkt">市場</span>。反方向也一樣：7/17 指數單日跌 6.47%，以前一日市值約 149 兆元推算，一天少了約 9.6 兆元 <span class="hd hd-est">估計</span>，當天三大法人賣超只有 2,617 億元。</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>要問的事</th><th>看哪些指標</th><th>性質</th></tr></thead>
      <tbody>
        <tr><td class="name">誰淨買、誰淨賣</td><td><a class="ind" data-ind="inst">三大法人買賣超</a>、<a class="ind" data-ind="fini_flow_twse">外資買賣超</a>；三者合計的相反數＝其他所有人（散戶、壽險、政府基金、一般公司）</td><td>流量</td></tr>
        <tr><td class="name">場邊還有多少可動用的錢</td><td><a class="ind" data-ind="settle_dep">證券劃撥存款</a>、<a class="ind" data-ind="m1b_gap">M1B</a>、<a class="ind" data-ind="margin">融資</a>與券商額度、<a class="ind" data-ind="etf">ETF 申購與定期定額</a></td><td>存量＋流量</td></tr>
        <tr><td class="name">股票的供給有沒有增加</td><td>IPO、現金增資（增加供給）；庫藏股、現金股利（把錢還給股東）。2026 年金額報告未取得 <span class="hd hd-unc">未確認</span></td><td>流量</td></tr>
        <tr><td class="name">現在的部位擠不擠</td><td>融資占市值、當沖占比、<a class="ind" data-ind="turnover">成交值占市值</a>、<a class="ind" data-ind="fut_oi">期貨未平倉</a>、<a class="ind" data-ind="tdcc">集保股權分散</a>、ETF 單月申購</td><td>存量＋比率</td></tr>
      </tbody>
    </table></div>
    <div class="how"><span class="lbl">怎麼讀</span>資金面指標回答的是：誰在買、用什麼錢買（自有資金、借來的錢，還是每月固定扣款）、買的人遇到下跌撐不撐得住。它們不能回答「還有多少錢會把指數推上去」。<span class="tag inf">推論</span></div>
    <details class="sub"><summary>股票的供給面：公司發還股東的錢，可能多於向股東募走的錢（金額未確認）</summary><div class="body">
      <p>IPO、現金增資、可轉債轉換會讓市場上的股票變多，需要新的錢來買；庫藏股與現金股利則是把錢還給股東。報告憑記憶的量級是每年現金股利約 2 兆元上下、IPO 與現金增資合計約數千億元 <span class="hd hd-unc">未確認</span>。如果屬實，這是台股不靠外部淨流入也能維持的結構原因之一。可確認的側面訊號：7–9 月幾乎每週都有新上市或創新板掛牌案；IPO 變密常出現在多頭的較晚階段。<span class="tag inf">推論</span></p>
    </div></details>
    <p class="src">來源：<a href="https://www.twse.com.tw/zh/trading/foreign/bfi82u.html" target="_blank" rel="noopener">證交所 三大法人買賣金額統計表</a>、<a href="https://www.sfb.gov.tw/ch/home.jsp?id=1011&amp;parentpath=0%2C4%2C109" target="_blank" rel="noopener">證期局 上市、櫃各年度市值</a>、<a href="https://www.twse.com.tw/zh/about/news/news/list.html" target="_blank" rel="noopener">證交所新聞稿</a></p>
  </div>
</details>

<details class="blk" id="b1-size">
  <summary><span class="h">規模與成交：市值、成交值、當沖、本益比</span><span class="sum">上市市值 154.32 兆元；日換手比 6 月少四成；本益比下降是因為獲利追上來，不是股價跌。</span></summary>
  <div class="body">
    <p><a class="ind" data-ind="mcap">上市總市值</a> 154.32 兆元（9/18），九個月多了約 60 兆元；但交易熱度已過高峰：9 月日均<a class="ind" data-ind="turnover">成交值</a>約 8,750 億元，除以市值是每天換手 0.57%，6 月高峰是 0.94%。<a class="ind" data-ind="pe">大盤本益比</a>從 6 月底的 31.78 倍降到 8 月底的 25.62 倍，原因是半年報的獲利把分母墊高，不是股價下跌。</p>
    <figure class="chart" data-chart="b1_mcap"></figure>
    <p>總市值是存量，等於所有掛牌股票「股數×收盤價」的加總，變動幾乎都來自價格，不是來自錢進來。2022 年市值少了 12 兆元，也不是有 12 兆元離開股市。</p>
    <details class="sub"><summary>市值對 GDP 比（巴菲特指標）：約 5 倍，但分母未確認，而且要先扣掉台積電</summary><div class="body">
      <p>上市加上櫃 8 月底約 161.82 兆元，除以名目 <a class="ind" data-ind="gdp">GDP</a>。報告沒有取得名目 GDP 原始表，用記憶值推算：2025 年底約 360–375%、2026 年 8 月底約 505–520% <span class="hd hd-unc">未確認</span>。這個比值跨國比較對台灣不公平：台積電營收幾乎都來自海外，市值卻全算進分子。比較有用的做法是跟自己的歷史比，並另算扣掉台積電的版本（約 315%，<span class="hd hd-est">估計</span>）。名目 GDP 在兩位數成長的年份會大幅上修，分母用哪一版，結果可以差十幾個百分點。</p>
    </div></details>
    <h4>成交值：要除以市值，而且近四成是當沖</h4>
    <div class="tbl-wrap"><table class="narrow">
      <thead><tr><th>月份</th><th class="n">日均成交值（億元）</th><th class="n">單日最高（億元）</th><th class="n">月底指數</th></tr></thead>

    <p class="src">上市（集中市場），研究報告由證交所每日市場成交資訊逐日加總 <span class="hd hd-mkt">市場</span>。證交所官方口徑：今年以來日均 1 兆 56 億元（至 9/18）。</p>
    <div class="how"><span class="lbl">怎麼讀</span>成交值是換手的速度，不是錢的數量，要除以市值：6 月日均 1.38 兆÷市值約 148 兆＝每天換手 0.94%；9 月 0.875 兆÷154 兆＝0.57%，約等於 2025 年 12 月（約 0.51%）。指數回到高檔、換手卻少四成，稱為價量背離：可能是追價意願下降，也可能是股票落到不常交易的人手上，單看這個數字分不出來。今年量的高峰（5 月下旬到 6 月）之後，就是 6/22 高點與 7/17 大跌。<span class="tag inf">推論</span></div>
    <details class="sub"><summary>當沖與上櫃：成交值約要打六折，短線資金集中在中小型股</summary><div class="body">
      <p>成交值有 40.99% 是當沖（8 月，月口徑，證交所 9/7 公布；7 月為 38.98%；9/18 單日約 31%），另有 7–9% 是 <a class="ind" data-ind="etf">ETF</a> 的成交。當沖是同一天、同一帳戶買進又賣出同一檔股票，只結算價差，不必準備全額交割款，所以同一筆本金一天能做出好幾倍的成交值，收盤後不留部位。看成交值時約打六折，才接近真正換了主人並持有過夜的金額。當沖賣出的證交稅減半（1.5‰）優惠到 2027-12-31 <span class="hd hd-sys">制度</span>，政策若不延長，成交值的結構會改變。</p>
      <p>上櫃市值只有上市的 7%，成交值卻占約兩成：8 月上櫃日均 2,106 億元÷上櫃市值 11.03 兆元＝每天換手 1.91%，上市同月 0.63%（上櫃為第三方彙整）。短線資金集中在中小型股，可對照<a class="ind" data-ind="otc_ratio">櫃買相對加權</a>。</p>
    </div></details>
    <h4>本益比：下降不一定是變便宜</h4>
    <p>大盤本益比＝總市值÷近四季稅後純益。8 月底 25.62 倍（股價淨值比 4.03 倍、殖利率 1.60%），高於近 60 個月中的 53 個月（約第 88 百分位；區間 9.39–31.78 倍、中位數 18.89 倍）<span class="hd hd-mkt">市場</span>。指數 7 月底到 8 月底漲 7.0%，本益比卻從 29.15 降到 25.62，因為 8 月中半年報公告完畢，分母換成新的四季。</p>
    <details class="sub"><summary>用本益比拆解今年的漲幅：到 8 月底約八成來自獲利、兩成來自評價提高</summary><div class="body">
      <p>研究報告的算法 <span class="hd hd-est">估計</span>：2025 年底到 2026 年 8 月底，指數 +59.3%；本益比由 23.22 升到 25.62（+10.3%）；兩者相除，隱含的近四季獲利約 +44.3%。同樣的算法放在 6 月底（31.78 倍）：指數同樣約 +59%，但當時隱含獲利只 +16%、評價 +37%，漲幅有三分之二靠評價；8 月財報進來之後，才由獲利追上。</p>
    </div></details>
    <div class="mis"><b>常見誤讀</b>　「本益比從 29 倍降到 25.6 倍，變便宜了」→ 先分清楚是股價跌（分子）還是獲利升（分母），再問現在的獲利是不是循環高點；獲利能不能延續，要到<a href="#/aidc">AIDC 檢查</a>與<a class="ind" data-ind="rev_monthly">月營收</a>去追。</div>
    <p class="src">來源：<a href="https://www.twse.com.tw/zh/trading/historical/fmtqik.html" target="_blank" rel="noopener">證交所 每日市場成交資訊</a>、<a href="https://www.twse.com.tw/zh/trading/day-trading/twtb4u.html" target="_blank" rel="noopener">證交所 當沖統計</a>、<a href="https://www.wantgoo.com/index/0000/price-to-earning-river" target="_blank" rel="noopener">玩股網 大盤本益比（彙整證交所月報）</a></p>
  </div>
</details>

<details class="blk" id="b1-who">
  <summary><span class="h">誰在買、誰在賣：三大法人與其他人</span><span class="sum">外資今年賣超 1.41 兆元，指數仍漲 62.9%；買走股票的是國內的散戶、ETF 與法人。</span></summary>
  <div class="body">
    <p>今年真正的淨買方在國內。<a class="ind" data-ind="inst">三大法人</a>合計賣超約 1.61 兆元（證交所口徑，至 9/18），代表三大法人以外的人（散戶、壽險、政府基金、一般公司）同期淨買進約 1.61 兆元 <span class="hd hd-est">估計</span>；再加上投信買超 0.76 兆元，其中很大一部分是散戶申購 <a class="ind" data-ind="etf">ETF</a>。「外資賣就會跌」這個經驗，從 2020 年起已經不成立。</p>
    <p>三大法人指外資及陸資、投信（國內基金公司，含 ETF）、自營商（券商自有資金，分自行買賣與避險）。買賣超＝買進金額−賣出金額，是流量，涵蓋集中市場所有有價證券（股票、ETF、權證等）。</p>
    <figure class="chart" data-chart="b1_inst_m"></figure>
    <h4>外資賣、指數漲：2020 年起的常態</h4>
    <figure class="chart" data-chart="b1_fini_year"></figure>
    <p>2008–2019 這 12 年，<a class="ind" data-ind="fini_flow_twse">外資年度買賣超</a>的方向與指數漲跌有 11 年相同（只有 2015 年例外）。2020、2021、2024、2025、2026 五個年度外資都賣超，指數卻都漲 20% 以上；2020 年到 2026/9 外資累計賣超約 4.66 兆元，同期指數從 11,997 漲到 47,181。報告整理的原因有四個：</p>
    <ul class="list">
      <li><b>國內買盤變大</b>：2020 年起盤中零股、定期定額、當沖降稅、ETF 普及，散戶與 ETF 成為穩定的淨買方；投信 2022–2026 連五年買超。</li>
      <li><b>被動調節不是看空</b>：台積電大漲後，在外資基金組合的比重超過限額，必須賣掉一部分；持股市值照樣增加。</li>
      <li><b>外資名下有很多與方向無關的帳戶</b>：外資券商的 ETF 造市、期現貨套利、借券放空回補，都記在外資買賣超。</li>
      <li><b>賣的集中在一檔</b>：今年外資減持台積電估約 1.9 兆元，比外資總賣超還多（見下一個區塊）。</li>
    </ul>
    <div class="how"><span class="lbl">怎麼讀</span>外資賣超要當真的情境，是同時出現全球性風險事件：方向相同且下跌的 2008、2011、2018、2022 年全是全球性熊市。單日數字雜訊很大（7/17 外資賣超 1,890 億元是史上最大單日，兩週後的 7/31 指數漲 3,186 點），日資料用 20–60 個交易日累計看。<span class="tag inf">推論</span></div>
    <details class="sub"><summary>同樣叫「外資」，口徑不同：賣超股票，金管會的帳卻是淨匯入 905 億美元</summary><div class="body">
      <p>到 8 月底，證交所口徑外資賣超 1 兆 3,333 億元，金管會上市股票口徑是 1 兆 1,800 億元，差約 1,500 億元：證交所那張表含 ETF、權證等所有上市有價證券，金管會只算股票。更容易混淆的是金管會同期的<a class="ind" data-ind="fini_flow_fsc">外資淨匯入</a> +905 億美元（含陸資；外資單計 903.31 億）<span class="hd hd-off">官方</span>：賣超股票，錢卻是淨匯入。這個口徑只算本金進出，不扣外資匯出的資本利得與股利，所以「外資賣超」不等於「錢離開台灣」；要看錢有沒有離開，到<a href="#/inflow">錢從哪來</a>看央行口徑與<a class="ind" data-ind="usdtwd">匯率</a>。</p>
      <p>存量與流量也要分開：外資 2024、2025 連兩年賣超合計約 1.29 兆元，持股比重卻從 38.47% 升到 45.4%（證期局，上市櫃合計，年底），因為外資手上的股票（台積電為主）漲得比大盤多。依證交所週統計，9/11 外資持有上市股票約 72.09 兆元、占上市市值 48.04%；今年賣超 1.41 兆元只約占其持股的 2%。</p>
    </div></details>
    <details class="sub"><summary>不在三大法人名單上的三類大戶：壽險、政府基金、國安基金</summary><div class="body">
      <ul class="list">
        <li><b>壽險公司</b>：不列入三大法人。報告的看法是股價大漲時壽險會實現資本利得來補避險成本，在高檔常是穩定的賣方；2026 年的國內股票部位與買賣 <span class="hd hd-unc">未確認</span>。壽險的主要部位在海外，見<a class="ind" data-ind="life_fx">壽險國外投資與避險</a>。</li>
        <li><b>政府基金</b>：整體勞動基金規模 8 兆 8,955 億元、上半年收益率 28.46%（6/30）<span class="hd hd-off">官方</span>；部分委外給投信代操，這些帳戶的買賣會出現在投信欄。國內股票配置比重未確認。</li>
        <li><b>國安基金</b>：可動用上限 5,000 億元 <span class="hd hd-sys">制度</span>；7 月大跌期間，報告沒有查到進場紀錄。</li>
      </ul>
      <p>這三類都不是追價的錢，作用在下跌時有沒有人買。某天三大法人合計大賣、指數卻沒跌，買方除了散戶，也可能是這一群；他們沒有每日資料。<span class="tag add">補充</span></p>
    </div></details>
    <p class="src">來源：<a href="https://www.twse.com.tw/zh/trading/foreign/bfi82u.html" target="_blank" rel="noopener">證交所 三大法人買賣金額統計表</a>、<a href="https://goodinfo.tw/tw/ShowBuySaleChart.asp?STOCK_ID=%E5%8A%A0%E6%AC%8A%E6%8C%87%E6%95%B8&amp;CHT_CAT=YEAR" target="_blank" rel="noopener">Goodinfo 三大法人買賣超年統計</a>、<a href="https://www.sfb.gov.tw/ch/home.jsp?id=1024&amp;parentpath=0,4,109" target="_blank" rel="noopener">證期局 外資及陸資投入我國股市概況表</a>、<a href="https://www.blf.gov.tw/49200/49245/49247/210788/post" target="_blank" rel="noopener">勞動基金運用局 2026-08-03 新聞稿</a></p>
  </div>
</details>

<details class="blk" id="b1-tsmc">
  <summary><span class="h">集中度：台積電一檔占四成</span><span class="sum">台積電占指數 41.48%；外資今年賣的、國內買的，幾乎都是這一檔。</span></summary>
  <div class="body">
    <p>加權指數有四成由一家公司決定：<a class="ind" data-ind="tsmc_w">台積電（2330）權重</a> 41.48%、前十大合計 59.05%（8/31，期交所）<span class="hd hd-mkt">市場</span>。台積電漲 1%，指數約漲 0.41%，所以「指數創高」和「多數股票在漲」是兩回事。今年資金面最核心的一句話是：外資賣台積電，國內用 <a class="ind" data-ind="etf">ETF</a> 與零股買走。</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>排名</th><th>公司（代號）</th><th class="n">權重</th><th>排名</th><th>公司（代號）</th><th class="n">權重</th></tr></thead>
      <tbody>
        <tr><td>1</td><td class="name">台積電（2330）</td><td class="n">41.48%</td><td>6</td><td class="name">富邦金（2881）</td><td class="n">1.34%</td></tr>
        <tr><td>2</td><td class="name">聯發科（2454）</td><td class="n">4.19%</td><td>7</td><td class="name">台光電（2383）</td><td class="n">1.31%</td></tr>
        <tr><td>3</td><td class="name">台達電（2308）</td><td class="n">3.18%</td><td>8</td><td class="name">南亞（1303）</td><td class="n">1.28%</td></tr>
        <tr><td>4</td><td class="name">鴻海（2317）</td><td class="n">2.33%</td><td>9</td><td class="name">南亞科（2408）</td><td class="n">1.12%</td></tr>
        <tr><td>5</td><td class="name">日月光投控（3711）</td><td class="n">1.74%</td><td>10</td><td class="name">欣興（3037）</td><td class="n">1.09%</td></tr>
      </tbody>
    </table></div>
    <h4>外資賣的就是它</h4>
    <p>外資持有台積電的比率從 2025-12-31 的 72.76% 降到 9/18 的 69.22%，減少約 91.7 萬張 <span class="hd hd-mkt">市場</span>。以今年 1–8 月成交均價約 2,110 元估算，約 1.9 兆元 <span class="hd hd-est">估計</span>，比外資在整個集中市場的賣超（1.41 兆元）還多，代表外資對台積電以外的股票合計是買超。即使減持，外資手上的台積電仍值約 44.2 兆元，單這一檔就占<a class="ind" data-ind="mcap">上市總市值</a>約 28.6%。這種因為比重超標而賣出的股票，由 ETF、零股與國內法人買走，對指數的壓力遠小於外資全面性撤出。<span class="tag inf">推論</span></p>
    <h4>誰買走了</h4>
    <p>台積電股東人數 305 萬人（2025 年底 186 萬人，見<a class="ind" data-ind="tdcc">集保股權分散</a>）；0050 規模 2.43 兆元，其中過半是台積電；6/22 單日台積電零股就成交 106.5 億元。台積電一張約 246 萬元，零股與 ETF 是散戶買得到它的主要管道。</p>
    <p>海外資金另有一個買台積電的管道：在美股買美國存託憑證（<span class="en">ADR</span>，1 單位＝5 股）。9/18 ADR 收 434.67 美元，折合每股約 2,765 元，比台北收盤 2,460 元貴約 12.4%，9/1 曾縮到約 9.4%（<a class="ind" data-ind="adr">ADR 溢價</a>，<span class="hd hd-est">估計</span>，兩地收盤時間不同）。溢價擴大、外資卻在台股賣超，代表海外資金偏好買 ADR、不把錢匯進台灣；溢價快速縮小才是海外熱度退的訊號。<span class="tag inf">推論</span></p>
    <div class="blind"><b>盲點</b>　<a class="ind" data-ind="margin">融資</a>、當沖、散戶人數這些資金面指標，反映的多半是其餘六成的中小型股；指數反映的多半是台積電。兩者可以長時間不同步：指數創高時，多數散戶的持股未必賺錢。<a class="ind" data-ind="pe">大盤本益比</a>也被這一檔主導。另外，部分高股息與主動式 ETF 有單一成分股比重上限（報告未逐檔查證），買 ETF 不完全等於買大盤。台積電股價背後的需求，見<a href="#/aidc">AIDC 檢查</a>與<a class="ind" data-ind="tsmc_rev">台積電月營收</a>。</div>
    <p class="src">來源：<a href="https://www.taifex.com.tw/cht/9/futuresQADetail" target="_blank" rel="noopener">期交所 加權指數成分股暨市值比重</a>、<a href="https://www.twse.com.tw/rwd/zh/fund/MI_QFIIS?date=20260918&amp;selectType=24&amp;response=json" target="_blank" rel="noopener">證交所 外資及陸資投資持股統計</a></p>
  </div>
</details>

<details class="blk" id="b1-etf">
  <summary><span class="h">ETF：投信買超與自營商避險賣超是同一件事的兩面</span><span class="sum">散戶買 ETF，帳上變成自營商避險賣超與投信買超；規模變大要拆成新申購與淨值上漲。</span></summary>
  <div class="body">
    <p>散戶的錢主要經 <a class="ind" data-ind="etf">ETF</a> 進到成分股。今年<a class="ind" data-ind="inst">投信買超</a> 7,636 億元、自營商避險賣超 8,980 億元，方向相反、量級接近，兩者很大一部分是同一件事：散戶在買 ETF。所以看到投信連續買超，不要解讀成法人看好；看到自營商避險大賣超，也不是利空。</p>
    <ol class="steps">
      <li>散戶在股市下單買 ETF。如果只是甲賣給乙，ETF 單位數沒變，成分股沒有任何買盤。</li>
      <li>買的人多於賣的人時，ETF 市價會高於淨值。造市的自營商賣出 ETF 給散戶，帳上記成「自營商避險賣超」。</li>
      <li>自營商手上的 ETF 不夠，就向投信申購新單位。現金申購（台股 ETF 多數採用）：投信拿這筆錢到市場買一籃子成分股，記成「投信買超」；實物申購（如 0050）：券商自己先買齊股票，交給投信換 ETF。</li>
      <li>不管哪一種，最後都有人真的去買成分股。所以要看的不是 ETF 成交量，而是發行單位數有沒有增加。</li>
    </ol>
    <div class="tbl-wrap"><table>
      <thead><tr><th>類別</th><th class="n">規模</th><th>說明</th></tr></thead>
      <tbody>
        <tr><td class="name">台股 ETF 合計</td><td class="n">約 7.87 兆元</td><td>約占上市市值 5.1%；研究報告逐檔加總 <span class="hd hd-est">估計</span></td></tr>
        <tr><td class="name">市值型 5 檔</td><td class="n">約 3.19 兆元</td><td>0050 單檔 2.43 兆元、受益人 356 萬</td></tr>
        <tr><td class="name">高股息 18 檔</td><td class="n">約 2.68 兆元</td><td>0056、00878、00919 三檔合計約 2.07 兆元</td></tr>
        <tr><td class="name">主動式 30 檔</td><td class="n">約 9,487 億元</td><td>2025 年 5 月才有第一檔，16 個月從 0 開始；其中台股 23 檔約 8,232 億元</td></tr>
        <tr><td class="name">台股正 2 四檔</td><td class="n">約 3,899 億元</td><td>用期貨做兩倍槓桿</td></tr>
        <tr><td class="name">整體 ETF（含債券 ETF）</td><td class="n">約 11 兆元</td><td>7 月底，證交所新聞稿 <span class="hd hd-mkt">市場</span>；債券部分見<a class="ind" data-ind="bond_etf">債券 ETF</a></td></tr>
        <tr><td class="name">定期定額</td><td class="n">364 億元／月</td><td>7 月；4 月為 291 億元。一年約 4,000–4,500 億元，約等於今年<a class="ind" data-ind="fini_flow_twse">外資賣超</a>的三成</td></tr>
      </tbody>
    </table></div>
    <div class="how"><span class="lbl">怎麼讀</span>規模變大有兩個來源：新申購與淨值上漲。新錢≈期末規模−期初規模×（1＋期間報酬率）。0050 今年淨值隨大盤漲約六成，年初每 1 兆元不必有任何申購就會變成 1.6 兆元；報告粗估現在的 2.43 兆元裡，約 0.6–0.8 兆元是今年的淨申購，其餘是漲出來的 <span class="hd hd-unc">未確認</span>（年初規模是記憶值）。各月淨申購金額報告未取得。</div>
    <details class="sub"><summary>高股息 ETF 換股：幾天內上千億元的買賣，與基本面無關</summary><div class="body">
      <p>高股息 ETF 按指數規則定期換成分股，規則與生效日都公開，市場會提前猜名單。量級示意 <span class="hd hd-est">估計</span>：00919 規模 6,095 億元、30 檔成分股，平均每檔約 200 億元；一次換掉 8–10 檔，就是 1,600–2,000 億元要在幾天內賣出、同時買進另一批，而被換進的中型股日成交值可能只有 20–50 億元。結果是納入前被搶買、生效後買盤消失，被剔除的有集中賣壓；從金融、傳產換到電子（或反向）時，板塊之間的<a class="ind" data-ind="rs_line">相對強弱</a>會在一兩週內改變。</p>
    </div></details>
    <details class="sub"><summary>槓桿型（正 2）ETF：用期貨做槓桿，要到期貨市場才看得到</summary><div class="body">
      <p>正 2 ETF 要維持 200% 曝險，主要靠買台指期：四檔約 3,899 億元，對應約 7,800 億元的期貨多單 <span class="hd hd-est">估計</span>；期交所 9/18 的投信期貨淨多單 75,110 口、名目 7,124.6 億元，兩個數字幾乎相同（見<a class="ind" data-ind="fut_oi">期貨未平倉</a>）。正 2 每天收盤前要再平衡，大漲日加買期貨、大跌日賣期貨，會放大尾盤波動；7/17 單日跌 6.47% 那天，這種機械式賣壓是跌勢的一部分。</p>
    </div></details>
    <div class="blind"><b>盲點</b>　受益人數不能跨檔加總，同一個人買五檔算五次（0050 的 356 萬人與 00878 的 167 萬人高度重疊）。主動式 ETF 由經理人決定買賣、換股不預告，對個股的影響比被動 ETF 更難預測；00981A 已有 98 萬受益人、規模 2,809 億元，大到足以影響中型股。</div>
    <p class="src">來源：<a href="https://www.twse.com.tw/zh/ETFortune/index" target="_blank" rel="noopener">證交所 ETF e添富</a>（2026-09-20 抓取，端點未標資料日）、<a href="https://www.twse.com.tw/staticFiles/news/news/tsecnews/8a8216d6a05b1e6901a05c1557960004.pdf" target="_blank" rel="noopener">證交所 2026-09-01 新聞稿</a>、<a href="https://www.sitca.org.tw/" target="_blank" rel="noopener">投信投顧公會</a></p>
  </div>
</details>

<details class="blk" id="b1-lever">
  <summary><span class="h">槓桿：融資、維持率、質押與借貸</span><span class="sum">融資 5,940 億元在史上高檔，但只占上市市值 0.385%；槓桿集中在上櫃中小型股，還有一塊看不到。</span></summary>
  <div class="body">
    <p><a class="ind" data-ind="margin">融資餘額</a>是投資人向券商借錢買股票、還沒還的金額（上市最高可借六成、上櫃五成 <span class="hd hd-sys">制度</span>）。9/18 上市融資 5,940 億元，7/6 的 6,313 億元是史上最高 <span class="hd hd-mkt">市場</span>。但除以市值只有 0.385%；2000 年網路泡沫高點 5,956 億元約占當時市值 4–5%，槓桿密度差十倍。要留意的是三件事：增速快（年增約 123%）、集中在中小型股（上櫃約 1.8%）、7 月被迫減掉的融資七週就加回七成。</p>
    <div class="tbl-wrap"><table class="narrow">
      <thead><tr><th>日期</th><th class="n">上市融資（億元）</th><th>事件</th></tr></thead>
      <tbody>
        <tr><td>2025-12-31</td><td class="n">3,434.1</td><td>去年底；占上市市值 0.364%</td></tr>
        <tr><td>2026-06-22</td><td class="n">6,050.4</td><td>首度超過 6,000 億元，也超過 2000 年高點 5,956 億元</td></tr>
        <tr><td>2026-07-06</td><td class="n">6,313.4</td><td>歷史最高；上櫃同一天到高點（2,145.6 億元）</td></tr>
        <tr><td>2026-07-17</td><td class="n">約 5,879</td><td>指數 −2,953.71 點；融資單日減 276 億元</td></tr>
        <tr><td>2026-07-30</td><td class="n">4,938.7</td><td>波段低點；24 天減少 1,375 億元（−21.8%）</td></tr>
        <tr><td>2026-09-18</td><td class="n">5,940.4</td><td>回到高點的 94%；上櫃 2,046.2 億元</td></tr>
      </tbody>
    </table></div>
    <div class="how"><span class="lbl">怎麼讀</span>（1）除以市值，上市與上櫃分開：上櫃融資占上櫃市值 1.76%（8 月底），是上市的 4.7 倍。上市的平均被台積電拉低：它占市值四成，融資只約 400 億元；扣掉它，上市其餘股票約 0.6%（兩個數字都是 <span class="hd hd-est">估計</span>）。（2）看增速：融資較去年底 +73.0%，同期市值 +63.5%，有加槓桿但幅度不大。（3）看下跌時減多少：7/6–7/30 指數跌約 14%、融資減 21.8%，減幅大於跌幅，代表有強制賣出與認賠。<span class="tag inf">推論</span></div>
    <details class="sub"><summary>融資維持率：7 月底官方約 175%、民間約 143%，口徑不同，可以同時為真</summary><div class="body">
    <dl class="ev3">
      <div><dt>機制</dt><dd>券商對每個信用帳戶計算<a class="ind" data-ind="maint">整戶擔保維持率</a>＝（融資擔保品市值＋融券擔保品與保證金）÷（融資金額＋融券標的市值）。低於 130% 會被追繳，補不足才由券商賣出擔保品（俗稱斷頭），形成「跌→賣→更跌」。用六成融資買進，起始約 166% <span class="hd hd-sys">制度</span>。</dd></div>
      <div><dt>現在</dt><dd>證交所：7/27 全市場整戶約 175% <span class="hd hd-off">官方</span>。同時民間資料商用「融資股票市值÷融資餘額」推估只有約 143%（CMoney）與 140.38%（財經M平方）<span class="hd hd-est">估計</span>，差 30 個百分點；CMoney 7/29 下架、M平方暫停更新。仍在更新的另一家 9/18 為 189.8%，而且這一家 7 月沒有跌破 140%，各家公式不同、不能混著比 <span class="hd hd-unc">未確認</span>。</dd></div>
      <div><dt>判讀</dt><dd>兩個數字可以同時為真：官方算帳戶，有現金與其他擔保品；民間算部位，只看融資買的股票。前者回答券商會不會出事，後者回答融資戶虧多少。民間版只跟同一來源的歷史比：落到 130–140%（2022-10、2025-04）都在波段低點附近，是恐慌程度的指標，不是預測工具。<span class="tag inf">推論</span></dd></div>
    </dl>
    </div></details>
    <div class="blind"><b>盲點</b>　融資只是有每日公開資料的槓桿。不限用途款項借貸（拿庫存股票向券商借錢，用途不限）、股票質押、信用貸款與房屋增貸（見<a class="ind" data-ind="wm_loans">個人理財週轉金貸款</a>與<a href="#/dest">房市與銀行限制</a>）、正 2 <a class="ind" data-ind="etf">ETF</a>、個股期貨、權證，都不在融資餘額裡，餘額報告都沒有取得 <span class="hd hd-unc">未確認</span>。間接線索：證交所 7/29 新聞稿特別說明不限用途借貸的整戶維持率「仍遠高於 130%」，但沒有揭露數值。所以融資占市值 0.4% 是下限，真實槓桿一定更高。<span class="tag add">補充</span></div>
    <p class="src">來源：<a href="https://www.twse.com.tw/zh/trading/margin/mi-margn.html" target="_blank" rel="noopener">證交所 融資融券餘額</a>、<a href="https://news.cnyes.com/news/id/6548756" target="_blank" rel="noopener">鉅亨網 2026-07-28</a>、<a href="https://money.udn.com/money/story/5607/9659168" target="_blank" rel="noopener">經濟日報 2026-07-29</a>、<a href="https://www.cna.com.tw/news/afe/202608030272.aspx" target="_blank" rel="noopener">中央社 2026-08-03</a>、<a href="https://www.istock.tw/post/twmarginrequirement" target="_blank" rel="noopener">愛玩股 融資維持率推估</a></p>
  </div>
</details>

<details class="blk" id="b1-settle">
  <summary><span class="h">證券劃撥存款與有交易戶數</span><span class="sum">停在交割戶的錢 4.18 兆元，6、7 月連兩月減少；餘額在高檔，但相對市值其實在下降。</span></summary>
  <div class="body">
    <p><a class="ind" data-ind="settle_dep">證券劃撥存款</a>是投資人股票交割專戶的活期存款加總，也就是已經轉進交割戶、隨時可以買股票的錢。7 月底 4 兆 1,823 億元 <span class="hd hd-off">官方</span>，比 5 月的歷史高點 4 兆 5,039 億元少約 3,200 億元，連兩個月減少。這個數字要看方向，而且要除以市值：7 月底約占上市市值 3.0%，2024 年底是 4.5%，股票漲得比場邊的現金快。</p>
    <figure class="chart" data-chart="b1_settle"></figure>
    <p>機制：賣股票的錢先落在交割戶，買股票也從這裡扣。所以餘額增加有兩種可能：有人把存款搬進來準備買，或剛賣股還沒領走。對照<a class="ind" data-ind="inst">三大法人</a>以外的人的淨買賣（圖的中間一格）：2026 年 1–7 月有 6 個月兩者方向相反。4、5 月主升段，這群人是淨賣方（−3,505、−3,063 億元），劃撥存款各增 3,742 與 2,010 億元；3、6、7 月外資大賣、他們各淨買 0.70–1.10 兆元，劃撥存款就減少。也就是說，6、7 月的減少有一部分是拿去買了外資賣出的股票，不全是撤出股市；但結果相同：停在場邊的現金變少了。<span class="tag inf">推論</span></p>
    <div class="how"><span class="lbl">怎麼讀</span>與 <a class="ind" data-ind="m1b_gap">M1B</a>、<a class="ind" data-ind="m2">M2</a> 一起看：活期資金成長快，交割戶的錢通常也增加。7 月 M1B 年增 7.34%、M2 年增 7.42%，央行說年增率下降主要是外資淨匯出。8 月底數字預計 9/24 前後公布：8 月指數反彈 7%，如果劃撥存款沒有回升，代表反彈靠的是既有持股者與 <a class="ind" data-ind="etf">ETF</a>，不是場外新錢。<span class="tag inf">推論</span></div>
    <p>證券總開戶數與年輕族群占比，報告未取得 <span class="hd hd-unc">未確認</span>。可以替代的是證交所每月公布的「有交易戶數」：4 月 570 萬 → 5 月 649 萬 → 6 月 693 萬 → 7 月 669 萬戶 <span class="hd hd-mkt">市場</span>。開戶數只增不減，有交易的才是實際在場內的人；兩個月多 124 萬戶的進場速度在 6 月到高點。同期自然人成交比重從 5 月的 53.3% 降到 7 月的 48.9%，大跌月份散戶縮手。</p>
    <div class="mis"><b>常見誤讀</b>　「劃撥存款創高＝資金行情還沒結束」→ 大家賣股、錢停在戶頭也會讓它增加，要配合<a class="ind" data-ind="turnover">成交值</a>與指數方向。另外這個數字含券商自營與交割清算專戶，成交值大的月份，在途交割款也會把餘額墊高。</div>
    <p class="src">來源：<a href="https://www.cbc.gov.tw/tw/lp-974-1.html" target="_blank" rel="noopener">中央銀行 證券劃撥存款餘額統計</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-192753-27b47-1.html" target="_blank" rel="noopener">中央銀行 7 月金融情況新聞稿</a>、<a href="https://www.twse.com.tw/staticFiles/news/news/tsecnews/8a8216d69fc76da0019fdb9fb4cb00b2.pdf" target="_blank" rel="noopener">證交所 7 月集中市場相關數據</a></p>
  </div>
</details>

<details class="blk" id="b1-deriv">
  <summary><span class="h">期貨與選擇權部位</span><span class="sum">外資期貨淨空單 7.6 萬口，幾乎全是正 2 ETF 的對手部位；扣掉之後只剩約 1,000 口。</span></summary>
  <div class="body">
    <p>9/18 外資在台指期（大台）的淨空單是 76,110 口（名目約 7,220 億元），看起來很大，但同一天投信淨多單是 75,110 口，兩者幾乎一比一 <span class="hd hd-mkt">市場</span>。<a class="ind" data-ind="fut_oi">期貨未平倉</a>要這樣讀：外資淨空單扣掉投信淨多單，才是外資超出 ETF 對手部位的空單。9/18 只剩約 1,000 口；6/22 約 9,094 口、7/17 約 10,974 口（研究報告計算）。</p>
    <figure class="chart" data-chart="b1_fut"></figure>
    <ul class="list">
      <li><b>正 2 ETF 的交易對手</b>：投信的多單主要來自槓桿型 <a class="ind" data-ind="etf">ETF</a>。賣期貨給它的常是外資券商，同時買進一籃子現股鎖住價差（期現貨套利），空單背後有等額現股，方向中性。今年外資淨空單從 2.5 萬口增到 7.6–9 萬口，與正 2 規模變大同步。</li>
      <li><b>現貨避險</b>：外資持有數十兆元台股，7,220 億元的淨空單只約 1%，避險的比例很低。</li>
      <li><b>季節性</b>：除權息旺季（6–9 月）外資習慣用期貨取代部分現股，空單偏高；這是市場慣常說法，報告未以數據驗證 <span class="hd hd-unc">未確認</span>。</li>
    </ul>
    <div class="how"><span class="lbl">怎麼讀</span>看變化，不看絕對口數。幾天內淨空單增加 1–2 萬口、投信多單沒有同步增加、現貨又同步賣超，才比較像方向性放空。7/17 外資現貨單日賣超 1,890 億元，期貨淨空單只增 1,736 口：那天的賣壓在現貨，不在期貨。2024 年以前正 2 規模小，當時「外資空單 3–4 萬口」的門檻不能沿用。<span class="tag inf">推論</span></div>
    <details class="sub"><summary>另外三個常被引用的數字：前十大交易人、散戶多空比、P/C 比與 VIX</summary><div class="body">
      <ul class="list">
        <li><b>前十大交易人</b>（9/18）：前五大買方占全市場未平倉 66.5%，基本上就是幾檔正 2 ETF；賣方較分散（前五大 43.9%）。買方集中在機械式操作的 ETF，下跌日它們必須賣，反而是波動來源。</li>
        <li><b>散戶多空比</b> <span class="hd hd-est">估計</span>：期交所不公布散戶部位，慣用「全市場未平倉−三大法人」反推，傳統上當反向指標。2024-07 微型台指上市後，散戶已從小台移到微台：9/11 微台散戶多空比 +45.2%，小台只有 +5.8%，只看小台會嚴重低估。要避開結算日（每月第三個週三）前後三天。</li>
        <li><b><a class="ind" data-ind="pcr_vix">選擇權 P/C 比與台指 VIX</a></b>：P/C 未平倉比 76.32%（近一個月 76–112%）。台指選擇權的大戶多半是賣方，賣權未平倉多，代表大戶敢賣出賣權、認為下檔有支撐，所以比值高於 100% 傳統上偏多，與美股的讀法相反。週選擇權天天到期，未平倉只有 3–9 萬口，單日值不要解讀，用 5 日或 10 日平均。台指 VIX 21.22（季線約 33；第三方報價）：7–8 月的恐慌已退。VIX 是同步指標，有用的時刻是極端高檔之後的回落，通常是賣壓竭盡的確認。</li>
      </ul>
    </div></details>
    <p class="src">來源：<a href="https://www.taifex.com.tw/cht/3/futContractsDate" target="_blank" rel="noopener">期交所 三大法人期貨部位</a>、<a href="https://www.taifex.com.tw/cht/3/largeTraderFutQry" target="_blank" rel="noopener">期交所 大額交易人</a>、<a href="https://www.taifex.com.tw/cht/3/pcRatio" target="_blank" rel="noopener">期交所 Put/Call 比</a>、<a href="https://www.wantgoo.com/index/vixtwn" target="_blank" rel="noopener">玩股網 台指 VIX</a></p>
  </div>
</details>

<details class="blk" id="b1-tdcc">
  <summary><span class="h">集保股權分散：誰手上的股票變多了</span><span class="sum">台積電股東九個月從 186 萬人增到 305 萬人；外資賣出的股票，分散到國內法人、ETF 與零股散戶。</span></summary>
  <div class="body">
    <p><a class="ind" data-ind="tdcc">集保股權分散表</a>每週公布每檔股票依持股張數分 15 級的人數與占比，用來看股票往大戶還是散戶手上移動。台積電今年的答案很清楚：股東人數從 2025-12-26 的 1,855,073 人增到 9/18 的 3,050,518 人，不到九個月多了 119.5 萬人（+64%）；持有 1,000 張以上的大戶持股比從 86.40% 降到 84.71% <span class="hd hd-mkt">市場</span>。</p>
    <div class="tbl-wrap"><table class="narrow">
      <thead><tr><th>資料日</th><th class="n">股東人數</th><th class="n">千張以上持股比</th><th class="n">收盤價（元）</th></tr></thead>
      <tbody>
        <tr><td>2025-12-26</td><td class="n">1,855,073</td><td class="n">86.40%</td><td class="n">1,510</td></tr>
        <tr><td>2026-03-27</td><td class="n">2,506,224</td><td class="n">—</td><td class="n">—</td></tr>
        <tr><td>2026-06-26</td><td class="n">2,879,938</td><td class="n">—</td><td class="n">—</td></tr>
        <tr><td>2026-07-31</td><td class="n">3,100,315</td><td class="n">84.63%</td><td class="n">2,425</td></tr>
        <tr><td>2026-09-11</td><td class="n">3,019,610</td><td class="n">84.82%</td><td class="n">2,410</td></tr>
        <tr><td>2026-09-18</td><td class="n">3,050,518</td><td class="n">84.71%</td><td class="n">2,460</td></tr>
      </tbody>
    </table></div>
    <ul class="list">
      <li><b>台積電的「大戶」不是個人</b>：1,481 個千張大戶主要是外資保管銀行帳戶、ADR 存託機構、政府基金、壽險與 <a class="ind" data-ind="etf">ETF</a>。同一天<a class="ind" data-ind="tsmc_w">外資持股比</a> 69.22%，剩下約 15 個百分點的千張大戶就是國內法人與 ETF。</li>
      <li><b>外資賣的去了哪</b>：外資持股比今年降 3.54 個百分點，千張大戶比同期只降 1.69 個百分點，代表外資賣出的部分約一半由國內的大帳戶買走，另一半分散到千張以下的持有人 <span class="hd hd-est">估計</span>。</li>
      <li><b>下跌時人數還在增加</b>：7/17 294 萬 → 7/24 304 萬 → 7/31 310 萬人，散戶逢跌買進；反彈到 9/11 人數減到 302 萬、大戶比回升；9/18 當週股價漲到 2,460 元，人數又增 3.1 萬。</li>
      <li><b>變化量小但金額大</b>：台積電市值約 63.8 兆元，0.1 個百分點就是約 640 億元。</li>
    </ul>
    <div class="how"><span class="lbl">怎麼讀</span>這張表對中小型股更有用：股本小、沒有外資的股票，400 張以上大戶比連續數週上升、股東人數下降，代表股票往少數大帳戶集中；反過來（大戶比降、人數暴增）常出現在股價急漲的較晚階段。個股要看 12–26 週的趨勢，單週變化沒有意義。<span class="tag inf">推論</span></div>
    <div class="mis"><b>常見誤讀</b>　把「大戶」想成個人主力 → 門檻是張數，不是金額：400 張台積電約 9.8 億元，持有者幾乎都是機構；400 張 20 元的股票才 800 萬元。高價股與低價股不能用同一個門檻比。</div>
    <div class="blind"><b>盲點</b>　集保分級看的是帳戶：同一人分散在多個帳戶會被拆小；ETF 與基金每檔算一戶；<a class="ind" data-ind="margin">融資</a>買進的股票放在券商融資專戶，會被算成一個超級大戶。資料以週五為準，週間的進出看不到；官方查詢只保留一年。</div>
    <p class="src">來源：<a href="https://www.tdcc.com.tw/portal/zh/smWeb/qryStock" target="_blank" rel="noopener">集保結算所 股權分散表查詢</a>、<a href="https://norway.twsthr.info/StockHolders.aspx?stock=2330" target="_blank" rel="noopener">神秘金字塔（彙整集保資料）</a></p>
  </div>
</details>

<details class="blk" id="b1-events">
  <summary><span class="h">2026 年發生了什麼：判讀時的座標</span><span class="sum">成交值先到高峰、指數 6/22 到高點、融資 7/6 才到高點、7/17 史上最大跌點，之後回到高點附近。</span></summary>
  <div class="body">
    <p>讀任何資金面數字，先確認它落在今年的哪一段。2026 年可以分成四段：1–2 月上漲、3 月外資大賣回檔、4–6 月主升段（<a class="ind" data-ind="turnover">成交值</a>、<a class="ind" data-ind="margin">融資</a>、有交易戶數同時創高）、6/22 高點到 7/30 低點回落 16.4% 之後反彈回到高點附近。各指標到高點的先後是：成交值（5 月底到 6 月）→ 指數（6/22）→ 融資（7/6）→ 7/17 大跌。</p>
    <div class="timeline">
      <div class="ev"><span class="dt">2025-12-31</span><span>去年收盤 28,963.60；上市市值 94.36 兆元；融資 3,434 億元</span></div>
      <div class="ev"><span class="dt">2026-03</span><span><a class="ind" data-ind="fini_flow_twse">外資單月賣超</a>今年最大（−9,682 億元）；指數月跌約 10%（35,414 → 31,723）</span></div>
      <div class="ev"><span class="dt">2026-05-29</span><span>單日成交值今年最大 1 兆 9,170 億元；5 月底<a class="ind" data-ind="settle_dep">證券劃撥存款</a>歷史高點 4 兆 5,039 億元</span></div>
      <div class="ev"><span class="dt">2026-06-22</span><span>指數收盤歷史高點 47,741.51；上市融資首度超過 6,000 億元（6/23 盤中高點 48,218）</span></div>
      <div class="ev"><span class="dt">2026-07-06</span><span>上市融資餘額歷史最高 6,313.4 億元</span></div>
      <div class="ev"><span class="dt">2026-07-13～16</span><span>美國重啟封鎖伊朗港口、布蘭特<a class="ind" data-ind="oil">原油</a>單日 +9.6%；IBM 財報後 −25%；韓國央行升息一碼、KOSPI −6.37%</span></div>
      <div class="ev"><span class="dt">2026-07-17</span><span>史上最大跌點 −2,953.71 點（−6.47%）；外資賣超 1,890.39 億元（史上最大單日）；跌停 134 檔；融資單日減 276 億元</span></div>
      <div class="ev"><span class="dt">2026-07-27～29</span><span><a class="ind" data-ind="maint">融資維持率</a>爭議：官方 175%、民間約 143%／140.38%，民間資料停更</span></div>
      <div class="ev"><span class="dt">2026-07-30</span><span>波段低點 39,933.30（自高點 −16.4%）；融資 4,938.7 億元</span></div>

      <div class="ev"><span class="dt">2026-08</span><span>外資單月買超 3,568 億元；半年報公告完畢，<a class="ind" data-ind="pe">本益比</a>由 29.15 降到 25.62 倍；8/10 注意暨處置新制上路</span></div>
      <div class="ev"><span class="dt">2026-09-18</span><span>47,180.75（今年 +62.9%）；上市市值 154.32 兆元；融資 5,940.4 億元</span></div>

    <div class="note"><b>到 9/18 的整體判讀</b> <span class="tag inf">推論</span>　<span class="pill watch">留意</span> 偏熱的項目：融資金額與增速、上櫃的槓桿密度與換手、當沖占比、有交易戶數與<a class="ind" data-ind="tdcc">台積電股東人數</a>、槓桿型與主動式 <a class="ind" data-ind="etf">ETF</a> 的擴張。<span class="pill calm">平穩</span> 不熱或已降溫的項目：融資占上市市值、成交值相對市值、<a class="ind" data-ind="fut_oi">外資期貨淨空單</a>、<a class="ind" data-ind="pcr_vix">台指 VIX</a>；證券劃撥存款中性偏弱。依據是各項與自己歷史的比較（13 項檢查表在<a href="#/practice">判讀與練習</a>）。合起來是「槓桿密度不高、新進場的人與新產品很多、交易熱度已過高峰」的組合，與 2000 年（融資占市值 4–5%）不像。7 月那次回落減掉的融資，七週內加回七成，代表市場的風險偏好沒有被那次下跌改變。這是現況的描述，不是對之後漲跌的預測。</div>
    <details class="sub"><summary>影響短線資金行為的五項制度</summary><div class="body">
      <ul class="list">
        <li><b>T+2 交割</b>：買進當天不必有錢，成交日之後第二個營業日上午 10 時前才扣款。行情熱時容易下超過能力的單；7/27 全市場違約金額 3,700 萬元。</li>
        <li><b>漲跌幅 ±10%</b>：跌停鎖住時賣不掉，融資戶無法停損，賣壓遞延到次日。</li>
        <li><b>收盤時間</b>：台股 13:30 收盤之後美股才開盤，隔夜的消息只能在次日開盤一次反映，跳空多。</li>
        <li><b>處置股新制（8/10 起）</b>：處置期間由 10 個營業日縮為 5 個、撮合改為約每 2 分鐘一次、高價股的注意標準放寬，對短線資金是放寬。</li>
        <li><b>期貨結算</b>：月契約每月第三個週三結算，前後幾天的部位數字會因換月跳動，要避開。</li>
      </ul>
    </div></details>

<details class="blk" id="b1-blind">
  <summary><span class="h">盲點與常見誤讀</span><span class="sum">八個最常見的讀錯方式，加上一個容易漏掉的盲點，都用今年的實際數字對照。</span></summary>
  <div class="body">
    <p>這一頁的數字最容易被讀反。共同的原因有三個：把存量當流量、不除以市值、混用口徑。</p>
    <div class="mis"><b>「外資大賣，所以要跌」</b>　→ 今年<a class="ind" data-ind="fini_flow_twse">外資賣超</a> 1.41 兆元、指數漲 62.9%；2020、2021、2024、2025 年也是外資賣、指數漲 20% 以上。賣的幾乎都是台積電，買的是國內。要當真的情境是同時出現全球性風險事件。</div>
    <div class="mis"><b>「市值增加 60 兆＝有 60 兆流進股市」</b>　→ <a class="ind" data-ind="mcap">市值</a>是重新定價的結果，沒有任何一類投資人淨買超過 2 兆元。到 8 月底指數 +59.3%，其中近四季獲利約 +44%、<a class="ind" data-ind="pe">本益比</a>只從 23.22 升到 25.62：漲幅主要是獲利撐出來的。</div>
    <div class="mis"><b>「ETF 規模暴增＝新錢暴增」</b>　→ 0050 的 2.43 兆元有一大部分是今年淨值上漲約六成帶來的；要看 <a class="ind" data-ind="etf">ETF</a> 的發行單位數。受益人數也不能跨檔加總。</div>
    <div class="mis"><b>「融資創歷史新高＝泡沫」</b>　→ <a class="ind" data-ind="margin">融資</a> 6,313 億元只占上市市值 0.41%，2000 年約 4–5%。也別反過來太放心：這個平均被台積電拉低，上櫃約 1.8%，7/17 有 134 檔跌停；質押、借貸、正 2 ETF 都不在融資餘額裡。</div>
    <div class="mis"><b>「成交值創新高，代表資金充沛」</b>　→ <a class="ind" data-ind="turnover">成交值</a>是速度不是存量，而且 37–39% 是當沖。今年單日最大量在 5/29、月均最大量在 6 月，之後是 6/22 高點與 7/17 大跌。</div>
    <div class="mis"><b>「外資期貨空單 8 萬口，外資在放空台股」</b>　→ 9/18 外資淨空 76,110 口、投信淨多 75,110 口，年初是 −25,059 與 +26,696，同樣一比一。要看<a class="ind" data-ind="fut_oi">外資空單超出投信多單的部分</a>有沒有突然增加。</div>
    <div class="mis"><b>「本益比從 29 倍降到 25.6 倍，變便宜了」</b>　→ 6 月底與 8 月底指數幾乎一樣（46,126 對 46,128），本益比卻從 31.78 降到 25.62，是半年報把分母換新。要問的是現在的獲利是不是循環高點。</div>
    <div class="mis"><b>「維持率 143%，快斷頭了」與「官方 175%，沒事」</b>　→ 口徑不同（部位與整戶），7 月底同時存在。看任何<a class="ind" data-ind="maint">維持率</a>先問公式，只跟同一來源的歷史比。</div>
    <div class="blind"><b>盲點</b>　今年最大的淨買方（<a class="ind" data-ind="inst">三大法人</a>以外的人）沒有每日資料，只能由三大法人合計反推，而且分不出散戶、壽險、政府基金各是多少；月資料可看自然人成交比重與有交易戶數。另外，賣股的錢有沒有離開台灣，股市資料看不出來，要到<a href="#/inflow">錢從哪來</a>看央行口徑與<a class="ind" data-ind="usdtwd">匯率</a>。<span class="tag add">補充</span></div>
    <p>每天、每週要看哪幾個數，見<a href="#/practice">判讀與練習</a>的「如果只能盯八個數」與「股市擁擠度檢查」；各指標的定義與回看長度在<a href="#/dict">數據辭典</a>。</p>
  </div>
</details>
