<details class="blk" id="c1-sens">
<summary><span class="h">依「對什麼敏感」來分：八個維度與敏感度矩陣</span><span class="sum">同一個變數，有人受惠有人受害；矩陣是作者依機制評的典型方向，匯率、房市管制、風險偏好三欄有實例佐證。</span></summary>
<div class="body">
<p>要推想「某個總體變數動了，錢會往哪邊移」，最有用的分法是看每個板塊對什麼敏感。因為每個產業的收入與成本結構不同：收美元、付台幣的出口商怕台幣升值；借錢蓋房的建商怕利率與房貸管制；成本是燃油的航空怕油價上漲。把這些整理成八個維度，就能解釋多數的板塊分化。<span class="tag inf">推論</span></p>
<div class="tbl-wrap"><table>
<thead><tr><th>維度</th><th>一邊</th><th>另一邊</th><th>白話機制</th></tr></thead>
<tbody>
<tr><td class="name">市場在哪</td><td>外銷：電子、紡織製鞋、工具機、自行車</td><td>內需：營建、食品、觀光餐飲、電信、百貨、金融多數</td><td>外銷看全球需求與匯率；內需看薪資、利率、政策</td></tr>
<tr><td class="name"><a class="ind" data-ind="signal">景氣</a>敏感度</td><td>循環：半導體、記憶體、面板、航運、鋼鐵、塑化</td><td>防禦：電信、食品、便利商店、瓦斯</td><td>循環股獲利隨景氣大起大落；防禦股獲利穩、下跌時跌得少</td></tr>
<tr><td class="name"><a class="ind" data-ind="fed">利率</a></td><td>受害：營建、高股息與電信、高評價成長股、還在虧損的生技</td><td>受惠：銀行利差；壽險新買債券的收益率（但舊債券評價受損）</td><td>利率是所有資產的折現率，也是借錢的成本</td></tr>
<tr><td class="name"><a class="ind" data-ind="usdtwd">匯率</a>（台幣升值）</td><td>受害：毛利低的外銷代工、紡織製鞋、工具機、壽險</td><td>受惠：進口原料的內需（食品、油電燃氣、造紙、水泥）、航空、營建</td><td>出口商收美元、付台幣；壽險約六七成資產在海外</td></tr>
<tr><td class="name">原物料／<a class="ind" data-ind="scfi">運價</a></td><td>油價：塑化、台塑化、航空（成本）；鋼價：鋼鐵；運價：貨櫃、散裝</td><td>下游用料者方向相反</td><td>賺的是「售價減原料」的價差，不是價格本身</td></tr>
<tr><td class="name">政策</td><td colspan="2">營建對<a class="ind" data-ind="credit_ctrl">央行信用管制</a>；重電對台電與美國電網投資；軍工對國防預算；生技對藥證與美國藥價；綠能對躉購費率與電價；半導體對<a class="ind" data-ind="tariff">美國關稅</a>與出口管制</td><td>政策改一次，可以讓一個族群的獲利預期整段重估</td></tr>
<tr><td class="name"><a class="ind" data-ind="otc_ratio">市值大小</a></td><td>大型權值：臺灣 50</td><td>中小型：中型 100、櫃買指數</td><td>外資與被動資金買大型股；投信、散戶、融資資金偏好中小型</td></tr>
<tr><td class="name">風格</td><td>成長：本益比高、靠未來獲利</td><td>價值／高股息：靠現金股利</td><td>利率上升或避險情緒升高時，資金從成長移往價值；行情熱時相反</td></tr>
</tbody>
</table></div>
<figure class="chart" data-chart="c1_sens"></figure>
<div class="how"><span class="lbl">怎麼讀</span>每一欄是「該因子上升或發生」時，對該板塊股價的典型方向：+2 強烈受惠、+1 受惠、0 大致無關或好壞互抵、−1 受害、−2 強烈受害。<b>這是作者依機制打的分數＝推論，不是統計結果</b>；方向在多數年份成立，但幅度與時點要看當時的評價與預期。</div>
<h4>哪幾欄有實例佐證</h4>
<ul class="list">
<li><b>匯率欄</b>：2025-05-05 是新台幣連兩個交易日急升的第二天（5/2 收 31.064 元、單日升值 3.07%）。當天加權 −1.23%，收美元的外銷代工與壽險下跌，進口原料的內需類上漲，見下圖。<span class="hd hd-mkt">市場</span></li>
</ul>
<figure class="chart" data-chart="c1_fx"></figure>
<ul class="list">
<li><b>房市管制欄</b>：央行 2024 年 9 月第七度調整選擇性信用管制後，2024-09-20 建材營造類 −6.26%，同日加權 +0.53%；2026-09-17 把第二戶房貸成數上限由 6 成放寬到 7 成，9/18 建材營造 +2.45%。<span class="hd hd-mkt">市場</span></li>
<li><b>風險偏好欄</b>：近 52 週各類股對加權指數的 beta（大盤一週漲 1%，該類股平均漲幾 %）：電子零組件 1.64、電腦及週邊 1.16、櫃買 1.16、半導體 1.13；金融 0.25、營建 0.16、食品 −0.04、油電燃氣 −0.54。大盤熱的時候錢往高 beta 的電子中小型跑，防禦股幾乎不動。<span class="hd hd-est">估計</span></li>
<li><b>其餘欄位</b>（AI 資本支出、油價、運價、利率）是依成本與收入結構推導的。反例：2026 年 SCFI 運價年增約兩倍（9/18 為 3,688 點），航運類指數今年只漲 18.8%；可能是市場不相信事件造成的高運價能持久，而且<a class="ind" data-ind="oil">油價</a>同步墊高成本。<span class="tag inf">推論</span></li>
</ul>
<p class="src">來源：<a href="https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20250505&amp;type=IND&amp;response=json" target="_blank" rel="noopener">證交所 2025-05-05 類股指數</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-181423-cc30d-1.html" target="_blank" rel="noopener">央行 2025-05-02 新聞稿</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-192864-4319f-1.html" target="_blank" rel="noopener">央行 2026-09-17 理監事會決議</a>；beta 為研究報告以週資料試算。</p>
</div>
</details>

<details class="blk" id="c1-cards">
<summary><span class="h">各板塊的驅動因子卡（16 張）</span><span class="sum">每個板塊的股價最後都回到「它靠什麼賺錢」；每張卡列出要看的數據、領先或落後、常見誤讀。</span></summary>
<div class="body">
<p>驅動因子就是「會改變這個板塊獲利預期的東西」，要從它靠什麼賺錢推出來：賺價差的看報價與原料，賺加工費的看訂單與產能利用率，賺利差的看利率，靠標案的看在手訂單。很多數據是跨板塊共用的：<a class="ind" data-ind="rev_monthly">月營收</a>（每月 10 日前）、<a class="ind" data-ind="exports">出口</a>（每月 7–9 日）、<a class="ind" data-ind="orders">外銷訂單</a>（每月 20 日前後）、<a class="ind" data-ind="pmi">製造業 PMI</a>（月初）、<a class="ind" data-ind="signal">景氣對策信號</a>（每月 27 日前後）、<a class="ind" data-ind="fed">聯準會與美債殖利率</a>、<a class="ind" data-ind="policy_rate">央行理監事會</a>（3、6、9、12 月）。各卡只寫該板塊特有的部分；「領先或落後」是作者的判讀。<span class="tag inf">推論</span> 標題後的數字是官方類股指數今年以來（至 2026-09-18）的漲跌幅。</p>
<details class="sub"><summary>半導體（晶圓代工、IC 設計、封測）｜半導體類 +74.5%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　晶圓代工賺「每片晶圓售價 × 產能利用率」，IC 設計賺晶片售價減代工與封測成本，封測賺加工費。</li>
<li><b>看哪些數據</b>　<a class="ind" data-ind="capex_csp">雲端大廠資本支出</a>、<a class="ind" data-ind="nvda">輝達財報</a>、<a class="ind" data-ind="tsmc_rev">台積電月營收</a>與法說、<a class="ind" data-ind="sox_rel">費城半導體指數</a>；報價用美元、成本用台幣，<a class="ind" data-ind="usdtwd">台幣升值</a>會壓毛利率。</li>
<li><b>領先或落後</b>　資本支出與法說展望領先營收一到數季；月營收公布時貨已出，屬同時偏落後。</li>
<li><b>常見誤讀</b>　把半導體類指數當成半導體族群：台積電約占 75%，它不動時，IC 設計與設備股大漲，指數也沒反應。</li>
</ul></div></details>
<details class="sub"><summary>AI 伺服器供應鏈｜電子零組件 +116.1%、電腦及週邊 +50.4%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　下游組裝廠賺組裝與系統整合費，毛利率個位數、靠量；中游零組件（散熱、電源、滑軌、PCB）賺規格升級帶來的單價上升；上游載板、玻纖布、銅箔賺產能稀缺。</li>
<li><b>看哪些數據</b>　雲端大廠資本支出與展望（1、4、7、10 月下旬）、輝達新平台出貨時程、外銷訂單「資訊通信產品」（7 月年增 89.5%）、各廠月營收。</li>
<li><b>領先或落後</b>　資本支出展望領先；外銷訂單是接單，領先出貨；月營收同時。</li>
<li><b>常見誤讀</b>　組裝廠營收暴增不等於獲利暴增：昂貴的 GPU 算進營收，毛利率反而被稀釋。「AI 概念股」名單越拉越長，通常是題材擴散的後段。</li>
</ul></div></details>
<details class="sub"><summary>報價循環型電子（記憶體、面板、被動元件、矽晶圓）｜光電 +93.8%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　產能短期固定，售價由供需決定；報價漲 10%，獲利可能漲 50%，反之亦然。</li>
<li><b>看哪些數據</b>　<a class="ind" data-ind="dram">記憶體報價</a>（現貨每日、合約每月或每季）、面板報價（每月上下旬）、大廠資本支出與減產、庫存天數。高頻寬記憶體排擠一般 DRAM 產能；2026 年 1–8 月台灣對南韓貿易入超 421.2 億美元，主要是進口高階記憶體。</li>
<li><b>領先或落後</b>　現貨價領先合約價，合約價領先營收；庫存天數出自季報，落後。</li>
<li><b>常見誤讀</b>　循環股本益比最低時，往往是獲利最高、景氣快反轉的時候。看報價方向與股價淨值比，會比看本益比有用。</li>
</ul></div></details>
<details class="sub"><summary>網通／光通訊｜通信網路 +26.8%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　交換器與光收發模組隨資料中心頻寬升級（400G→800G→1.6T）而量價齊升；傳統網通看電信商標案與庫存循環。</li>
<li><b>看哪些數據</b>　資料中心網路設備商財報（Arista、博通）、CPO 與矽光子導入時程（GTC、OFC、OCP 峰會）、智邦（2345）月營收。</li>
<li><b>領先或落後</b>　美國客戶財報與展會的導入時程領先；月營收同時。大立光（3008）的 CPO 產品 2027 年中才量產，題材比營收早很多。</li>
<li><b>常見誤讀</b>　類股指數只漲 26.8%，因為裡面有電信三雄這種防禦股。媒體已寫「CPO 概念股增至 200 檔」，名單變長就是警訊。</li>
</ul></div></details>
<details class="sub"><summary>金融（壽險、銀行、證券要分開看）｜金融保險 +51.1%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　壽險收保費去投資，賺投資報酬減保單成本；銀行賺存放款利差與手續費、扣掉呆帳；證券賺經紀手續費與融資利息。</li>
<li><b>看哪些數據</b>　每月 10 日前後金控自結獲利。壽險看股市、美債殖利率、台幣匯率與<a class="ind" data-ind="life_fx">避險成本</a>；銀行看利率與放款成長；證券看<a class="ind" data-ind="turnover">日均成交值</a>與<a class="ind" data-ind="margin">融資餘額</a>。</li>
<li><b>領先或落後</b>　成交值與匯率每日可見，同步反映在獲利；自結獲利次月才公布，落後。</li>
<li><b>常見誤讀</b>　「升息對金融股有利」只對銀行利差成立，壽險短期是債券評價損失。13 家上市金控前 8 月獲利 5,789 億元、年增近六成，主要來自股市資本利得與成交量，兩者都會循環。</li>
</ul></div></details>
<details class="sub"><summary>營建｜建材營造 −4.5%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　買地、蓋房、賣房。多數建商完工交屋才認列營收，今年的營收是兩三年前賣掉的預售屋。</li>
<li><b>看哪些數據</b>　<a class="ind" data-ind="credit_ctrl">央行信用管制</a>（理監事會 3、6、9、12 月）、<a class="ind" data-ind="transfers">建物買賣移轉棟數</a>（2026 年 1–8 月 15.10 萬棟、年減 2.0%）、<a class="ind" data-ind="hprice">房價指數</a>、<a class="ind" data-ind="hloan">購置住宅貸款</a>與<a class="ind" data-ind="cloan">建築貸款</a>。細節見<a href="#/dest">錢去哪裡</a>的房市分頁。</li>
<li><b>領先或落後</b>　管制與利率是政策變數，領先；移轉棟數同時；建商營收落後兩三年。</li>
<li><b>常見誤讀</b>　營收暴增是過去賣的房子交屋，不代表現在房市熱；入帳高峰年的高殖利率，隔年沒案子交屋就掉下來。</li>
</ul></div></details>
<details class="sub"><summary>航運（貨櫃／散裝／航空）｜航運 +18.8%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　貨櫃賺「運價 × 艙位」，散裝賺日租金，航空賺票價、載客率與貨運，最大成本是燃油。</li>
<li><b>看哪些數據</b>　<a class="ind" data-ind="scfi">SCFI</a>（每週五；9/18 為 3,688 點、年增約兩倍）、散裝的 BDI（9/18 為 3,370 點、年增 53%）、美國線長約（每年 5 月換約）、新船交付量、<a class="ind" data-ind="oil">油價</a>。</li>
<li><b>領先或落後</b>　即期運價每週更新，但股價常比運價更早見頂，因為市場在猜高運價能撐多久；公司實收還要看長約比重。</li>
<li><b>常見誤讀</b>　低本益比不等於便宜：2021–22 年本益比三四倍之後，獲利連續腰斬。運價漲而股價不漲，多半是市場認為運價撐不久。</li>
</ul></div></details>
<details class="sub"><summary>鋼鐵｜鋼鐵 +4.2%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　鋼價減原料（鐵礦砂、焦煤、廢鋼）的價差，乘上出貨量。</li>
<li><b>看哪些數據</b>　中鋼（2002）月盤與季盤價（每月上中旬開下月盤）、中國鋼材出口量與價格、鐵礦砂與焦煤價、下游營建與汽車需求、各國反傾銷稅與<a class="ind" data-ind="tariff">美國鋼鋁關稅</a>。</li>
<li><b>領先或落後</b>　原料價與中國出口價領先盤價，盤價領先營收約一個月。</li>
<li><b>常見誤讀</b>　盤價調漲常常只是反映成本，不是需求轉強。中鋼 10 月月盤每公噸調漲 500–600 元，理由是煉焦煤每公噸大漲 50 美元；要看價差，不要看價格。</li>
</ul></div></details>
<details class="sub"><summary>塑化｜塑膠 +170.3%、油電燃氣 +70.9%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　產品售價減原料（石腦油、乙烯、乙烷）的利差；台塑化（6505）另賺煉油利差。</li>
<li><b>看哪些數據</b>　油價、乙烯與石腦油利差（每週報價）、中國新增產能、六輕歲修、台塑四寶月營收。</li>
<li><b>領先或落後</b>　利差每週可見，領先月營收；中國產能開出是慢變數，決定利差的長期水準。</li>
<li><b>常見誤讀</b>　塑膠類 +170.3% 不是塑化景氣回升，而是南亞（1303）被當成 AI 材料股重新評價（上半年 EPS 5.17 元、電子材料營收占比 57%）。油價上漲也不一定有利：短期有低價庫存利益，長期若轉嫁不出去，利差反而縮小。</li>
</ul></div></details>
<details class="sub"><summary>水泥｜水泥 −1.1%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　水泥售價減煤電成本；台泥（1101）、亞泥（1102）的中國營收比重高，台泥另有儲能與歐洲低碳水泥布局。</li>
<li><b>看哪些數據</b>　中國水泥價格與房地產開工、煤價、台灣營建需求與公共工程、月營收。</li>
<li><b>領先或落後</b>　中國房地產開工與煤價領先獲利；月營收同時。</li>
<li><b>常見誤讀</b>　把水泥當成穩定配息的「定存股」：獲利其實跟著中國房地產循環走。台泥 2026 年 8 月被 MSCI 剔除成分股。</li>
</ul></div></details>
<details class="sub"><summary>重電與電機｜電機機械 +28.4%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　變壓器、配電盤等設備的標案與外銷訂單；看「在手訂單 × 交期 × 毛利率」。</li>
<li><b>看哪些數據</b>　台電強韌電網計畫的招標進度（政府電子採購網）、美國電網更新與 AI 資料中心用電帶來的變壓器缺貨（同業在手訂單）、銅與矽鋼片成本、對美關稅與匯率。</li>
<li><b>領先或落後</b>　標案與在手訂單領先營收數季；營收認列集中在下半年與第四季。</li>
<li><b>常見誤讀</b>　電機機械類指數不等於重電，要直接看華城（1519）、士電（1503）、中興電（1513）、亞力（1514）的股價。重電的高毛利來自缺貨期的議價力，同業擴產完成後會回落。</li>
</ul></div></details>
<details class="sub"><summary>生技醫療｜生技醫療 +21.5%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　新藥公司多數還在虧損，價值＝臨床成功機率 × 潛在市場；學名藥與委託製造賺製造與通路；醫材賺出貨量。</li>
<li><b>看哪些數據</b>　臨床解盲、美國 FDA 審查期限、授權案（公開資訊觀測站重大訊息）、利率與風險偏好、美國藥價與藥品關稅政策。</li>
<li><b>領先或落後</b>　多數是事件，結果事前無法得知；利率與風險偏好是同步的環境變數。</li>
<li><b>常見誤讀</b>　「解盲成功」不等於拿到藥證，更不等於賣得動。個股事件遠比總體經濟重要，類股指數也被少數幾檔主導。</li>
</ul></div></details>
<details class="sub"><summary>觀光餐飲與內需消費｜觀光餐旅 −3.8%、食品 −4.8%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　來客數 × 客單價，減掉食材、人事、租金。</li>
<li><b>看哪些數據</b>　<a class="ind" data-ind="wages">薪資</a>與消費者信心、<a class="ind" data-ind="retail">零售與餐飲營業額</a>（每月 23 日前後）、出國與來台旅客人次、基本工資（每年第三季審議）、進口食材成本與匯率。</li>
<li><b>領先或落後</b>　消費者信心領先，營業額同時，薪資落後。</li>
<li><b>常見誤讀</b>　把 GDP 高成長等同內需股會漲：今年成長來自出口與 AI 投資，7 月消費者信心指數反而降到 64.58。防禦股的功能是下跌時少跌（2024-08-05 大盤 −8.35%，食品 −3.93%）。</li>
</ul></div></details>
<details class="sub"><summary>汽車與電動車｜汽車 −7.6%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　整車代理與銷售：和泰車（2207）靠豐田銷量加車貸租賃；另有售後維修零件外銷、電動車供應鏈零組件。</li>
<li><b>看哪些數據</b>　新車掛牌數（每月初）、日圓與台幣匯率（進口成本）、進口車關稅與貨物稅政策、美國售後零件需求。</li>
<li><b>領先或落後</b>　掛牌數同時；關稅與貨物稅政策領先，因為消費者會先觀望。</li>
<li><b>常見誤讀</b>　「電動車概念股」多數營收仍以傳統車零件或其他電子產品為主，電動車占比要逐家查。</li>
</ul></div></details>
<details class="sub"><summary>紡織製鞋｜紡織纖維 −7.5%、運動休閒 −23.2%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　替國際運動品牌代工，賺「接單量 × 產能利用率」；產地在越南、印尼、中國。</li>
<li><b>看哪些數據</b>　品牌客戶財報的庫存與訂單展望（耐吉 3、6、9、12 月下旬）、美國零售銷售、美國對產地國的關稅、台幣匯率、月營收。</li>
<li><b>領先或落後</b>　品牌的庫存與訂單展望領先代工廠營收；月營收同時。</li>
<li><b>常見誤讀</b>　把世界盃這類賽事年當成確定利多：品牌備貨通常提前半年以上反映。運動休閒是今年最弱的類股，下跌原因本次沒有查到直接來源。<span class="hd hd-unc">未確認</span></li>
</ul></div></details>
<details class="sub"><summary>綠能（太陽能／風電／儲能）｜綠能環保 +30.7%</summary><div class="body"><ul class="list">
<li><b>靠什麼賺錢</b>　電廠開發商賺 20 年售電現金流，工程商賺建置，模組與電池廠賺製造（長期面對中國產能過剩），儲能賺台電輔助服務。</li>
<li><b>看哪些數據</b>　每年公告的躉購費率、離岸風電選商、利率（專案融資成本）、電價、企業綠電採購需求。</li>
<li><b>領先或落後</b>　政策公告領先；利率同步影響評價；售電收入穩定，落後。</li>
<li><b>常見誤讀</b>　把綠能環保類指數當成太陽能與風電的代表：9/18 這一類成交最大的是聯友金屬-創，太陽能電池廠還留在光電類。</li>
</ul></div></details>
<p class="src">來源：證交所類股指數、央行 2026-09-17 參考資料、<a href="https://news.cnyes.com/news/id/6607074" target="_blank" rel="noopener">鉅亨網 2026-09-15（金控獲利）</a>、<a href="https://www.businesstoday.com.tw/article/category/183008/post/202608270004/" target="_blank" rel="noopener">今周刊 2026-08-27（南亞）</a>、<a href="https://udn.com/news/story/7241/9735591" target="_blank" rel="noopener">聯合新聞網 2026-09-05（中鋼盤價）</a>。</p>
</div>
</details>

<details class="blk" id="c1-causes">
<summary><span class="h">錢為什麼換邊：十二類原因</span><span class="sum">三層：獲利預期變了、評價用的利率匯率變了、有人必須買或賣；入門者最常漏掉第三層。</span></summary>
<div class="body">
<p>股價反映的是「預期的變化」，資金會流向預期改善最多、而且還沒被買滿的地方。現在台股的輪動原因可以歸成三層十二類。以 2026 年來說，最常看到的是：月營收帶動的基本面換手（南亞）、漲多後的獲利了結與落後補漲（9/11 對 9/18）、ETF 與 MSCI 這類照規則的買賣（6 月、8 月）、題材從龍頭擴散到二三線（CPO）。<span class="tag inf">推論</span></p>
<ul class="list">
<li><b>第一層　獲利預期變了</b>：① 基本面換手、⑧ 美股與龍頭事件、⑨ 原物料與運價。</li>
<li><b>第二層　同一筆獲利值多少錢變了</b>：⑤ 匯率、⑥ 利率與央行、⑦ 政策與地緣政治。</li>
<li><b>第三層　基本面沒變，但有人必須買、有人必須賣</b>：② 評價差距、③ 法人行為、④ 被動資金、⑩ 籌碼與制度、⑪ 季節性、⑫ 題材擴散。台股短中期的輪動，有很大比例是這一層造成的。</li>
</ul>
<details class="sub"><summary>① 基本面換手（月營收、財報、獲利預估修正）</summary><div class="body"><ul class="list">
<li><b>機制</b>　每月 10 日前全市場公布上月<a class="ind" data-ind="rev_monthly">營收</a>，法人據此上修或下修獲利預估；被上修的吸走資金，被下修的被賣出。台灣有月營收制度，這種換手比只有季報的美股頻繁。</li>
<li><b>怎麼辨認</b>　月營收年增率與連續創高的月數、財報毛利率方向、法說會展望；可事先追蹤。</li>
<li><b>案例</b>　南亞（1303）2026 年上半年 EPS 5.17 元、超過前三年總和，7 月營收年增 44.5%，電子材料營收占比升到 57%。資金把它從塑化循環股改當成 AI 材料股，一年漲約 700%，塑膠類今年 +170.3%。</li>
</ul></div></details>
<details class="sub"><summary>② 評價差距與漲多休息（獲利了結、落後補漲）</summary><div class="body"><ul class="list">
<li><b>機制</b>　某族群漲多、本益比拉高後，只要沒有新的好消息，持有者就會先賣一部分，換到同樣有題材但還沒漲、或穩定配息的地方。不需要任何壞消息。</li>
<li><b>怎麼辨認</b>　<a class="ind" data-ind="rs_line">相對強弱線</a>創高後轉折；族群內龍頭不漲、二三線補漲；<a class="ind" data-ind="sec_share">成交占比</a> ÷ 市值比重過高。</li>
<li><b>案例</b>　2026-09-11 加權 −1.61%、電子零組件 −2.16%，金融保險 +1.12%、航運 +1.04% 逆勢上漲，總成交值降到 7,622 億元。一週後 9/18 反過來：電子零組件 +3.26%、金融 −0.96%，成交值回到 1.14 兆元。</li>
</ul></div></details>
<details class="sub"><summary>③ 法人行為（外資、投信、MSCI 調整）</summary><div class="body"><ul class="list">
<li><b>機制</b>　外資以大型權值股為主，跟著美元與全球風險情緒進出；投信偏好中小型成長股，季底有績效壓力。MSCI 每年 2、5、8、11 月調整成分，被動基金必須在生效日收盤前買賣完畢。</li>
<li><b>怎麼辨認</b>　<a class="ind" data-ind="inst">三大法人買賣超</a>、<a class="ind" data-ind="fut_oi">外資期貨未平倉</a>、MSCI 公布日與生效日（事先可知）。</li>
<li><b>案例</b>　2026 年 8 月（8/13 公布、8/31 收盤生效）新增 6 檔：記憶體的南亞科（2408）、華邦電（2344）、群聯（8299）與 PCB／載板 3 檔；剔除台泥（1101）、陽明（2609）等 6 檔。8/10 南亞科、華邦電已先漲停；8/31 成交值 1 兆 2,017 億元。</li>
</ul></div></details>
<details class="sub"><summary>④ 被動資金（高股息 ETF 換股、0050 納入剔除）</summary><div class="body"><ul class="list">
<li><b>機制</b>　ETF 照規則買賣，不看價格。高股息 ETF 把殖利率下降（常因股價漲多）的股票賣掉，換進殖利率高的；最大三檔合計約 2.07 兆元，換股一次就是幾百億元單向買賣。</li>
<li><b>怎麼辨認</b>　各 ETF 的審核月份與公告、<a class="ind" data-ind="etf">ETF 規模</a>、納入與剔除股在公告到生效之間的成交量。</li>
<li><b>案例</b>　2026 年 6 月：00919 公布 18 進 18 出，聯電（2303）約 58 萬張被清倉，納入的凱基金（2883）隔日漲停。同月 0050 新增南電、創意等 4 檔，刪除中鋼（2002）、台塑（1301）、和泰車（2207）等：鋼鐵、塑化、汽車的龍頭被 AI 供應鏈擠出前 50 大。</li>
</ul></div></details>
<details class="sub"><summary>⑤ 匯率</summary><div class="body"><ul class="list">
<li><b>機制</b>　台幣升值時，出口商同一筆美元營收換回的台幣變少，毛利率低的代工廠最受傷；壽險的海外資產折回台幣縮水、避險成本上升。買進口原料、收台幣的內需產業成本下降。貶值時相反。</li>
<li><b>怎麼辨認</b>　<a class="ind" data-ind="usdtwd">美元兌新台幣</a>、<a class="ind" data-ind="fini_flow_twse">外資買賣超</a>與匯入匯出、<a class="ind" data-ind="life_fx">壽險避險比率</a>。</li>
<li><b>案例</b>　2025-05-02 新台幣收 31.064 元、單日升值 3.07%，央行說明是預期心理加上外資匯入與出口商拋匯。下一個交易日 5/5 加權 −1.23%，金融保險 −2.40%、其他電子 −2.98%；油電燃氣 +4.85%、食品 +3.81%。</li>
</ul></div></details>
<details class="sub"><summary>⑥ 利率與央行（聯準會、台灣央行信用管制）</summary><div class="body"><ul class="list">
<li><b>機制</b>　利率上升，未來獲利折現後變少（高本益比成長股最受傷），房貸與建商融資變貴，類似債券的高股息與電信股吸引力下降；銀行利差受惠。台灣央行近年很少動利率，主要工具是針對房市的信用管制。</li>
<li><b>怎麼辨認</b>　<a class="ind" data-ind="fed">聯準會會議與美債殖利率</a>、<a class="ind" data-ind="policy_rate">央行理監事會</a>與<a class="ind" data-ind="credit_ctrl">信用管制</a>；日期固定。</li>
<li><b>案例</b>　2024-09-20 央行加嚴管制後，建材營造單日 −6.26%、同日加權 +0.53%。2026 年 9 月聯準會升息 1 碼：台股 9/10–9/15 先連跌四天（47,183 → 45,511 點），結果確定後 9/16 起連漲三天回到 47,180 點。</li>
</ul></div></details>
<details class="sub"><summary>⑦ 政策與地緣政治（關稅、出口管制、國防預算、電價）</summary><div class="body"><ul class="list">
<li><b>機制</b>　政策直接改變某些公司的成本或市場；地緣事件改變整體的風險偏好。要分辨「只打到特定板塊」（輪動）與「打到全部」（撤出）。</li>
<li><b>怎麼辨認</b>　<a class="ind" data-ind="tariff">美國關稅公告</a>、國防預算、電價審議；事後看是不是所有類股同向。</li>
<li><b>案例</b>　2026-07-24 美國公布 301 條款關稅方案，台灣列在最低的 10% 級距、多數電子產品不受影響，媒體點名機械與傳產受惠；大盤沒有大波動，資金在傳產之間重新分配（僅讀到新聞摘要）<span class="hd hd-unc">未確認</span>。對照 2025-04-07 對等關稅：加權 −9.70%、多數類股跌 9% 以上，那是撤出。</li>
</ul></div></details>
<details class="sub"><summary>⑧ 美股與產業龍頭事件（輝達、博通、美光、雲端大廠）</summary><div class="body"><ul class="list">
<li><b>機制</b>　台灣電子股是美國科技公司的供應商，客戶的財報與展望就是台廠未來兩季的訂單。事件前常有人先買進，事件後依結果重分配。</li>
<li><b>怎麼辨認</b>　<a class="ind" data-ind="nvda">輝達</a>（2、5、8、11 月下旬）、博通與美光（3、6、9、12 月）、<a class="ind" data-ind="capex_csp">四大雲端服務商</a>（1、4、7、10 月下旬）的財報日；<a class="ind" data-ind="sox_rel">費城半導體指數</a>、<a class="ind" data-ind="adr">台積電 ADR</a>。</li>
<li><b>案例</b>　2025-02-03 春節後開盤（休市期間發生 DeepSeek 事件）：加權 −3.53%，其他電子 −7.01%、電子零組件 −6.13%、半導體 −4.94%，資訊服務 +2.37%、數位雲端 +2.44%：硬體受害、軟體受惠。</li>
</ul></div></details>
<details class="sub"><summary>⑨ 原物料與運價循環</summary><div class="body"><ul class="list">
<li><b>機制</b>　油、鋼、運價由全球供需與突發事件決定。上漲時相關公司的獲利彈性大，但市場會猜「能撐多久」，股價常比價格更早見頂。</li>
<li><b>怎麼辨認</b>　<a class="ind" data-ind="oil">布蘭特油價</a>、<a class="ind" data-ind="scfi">SCFI</a>（每週五）、BDI、鐵礦砂、乙烯利差、中鋼盤價。</li>
<li><b>案例</b>　2026 年 2 月中東衝突後，布蘭特油價由約 69 美元漲到 4 月高點 138 美元（央行 9/17 資料；9/18 期貨報價 103.87 美元）；SCFI 9/18 較去年同期約高兩倍。油電燃氣類今年 +70.9%，航運類只有 +18.8%，用油的汽車類 −7.6%。</li>
</ul></div></details>
<details class="sub"><summary>⑩ 籌碼與制度（融資斷頭、處置股、當沖）</summary><div class="body"><ul class="list">
<li><b>機制</b>　融資是借錢買股；整戶維持率低於 130%，券商會強制賣出（俗稱斷頭），賣壓與基本面無關，集中在散戶偏好的中小型熱門股。處置股是交易所把短期漲太多的股票改成每 5 或 20 分鐘撮合一次，資金會換到同族群還沒被處置的股票。<span class="hd hd-sys">制度</span></li>
<li><b>怎麼辨認</b>　<a class="ind" data-ind="margin">融資餘額</a>、<a class="ind" data-ind="maint">融資維持率</a>、處置與注意股公告、當沖比率。</li>
<li><b>案例</b>　2025 年 4 月：上市融資餘額由 4/1 的 2,990 億元降到 4/11 的 2,140 億元（−28%）。現在（9/18）是 5,940 億元，今年以來 +73%、高於加權的 +62.9%；下次急跌時，被迫賣出的力量也會較大。</li>
</ul></div></details>
<details class="sub"><summary>⑪ 季節性與事件日曆</summary><div class="body"><ul class="list">
<li><b>機制</b>　有些買賣照日曆發生：除權息、投信季底作帳（為了季底績效拉抬持股）、指數調整生效日、期貨結算日、長假前減碼。知道日期，才分得出這是日曆造成的波動，還是真的有事。</li>
<li><b>怎麼辨認</b>　事先查<a href="#/time">時間軸與日曆</a>。</li>
<li><b>案例</b>　2026-08-31（MSCI 生效日）成交值 1.2 兆元、尾盤震盪。2026-09-18 是 9 月第三個週五（臺灣 50 指數季度調整依規則的生效日），總成交值 1.14 兆元是 9 月第二高。9/25–9/28 台股連休四天，9/21–9/24 是長假前最後四個交易日。</li>
</ul></div></details>
<details class="sub"><summary>⑫ 題材敘事擴散（從龍頭到二三線）</summary><div class="body"><ul class="list">
<li><b>機制</b>　題材起初只有少數有營收的龍頭在漲；接著資金嫌龍頭貴，去找同族群還沒漲的二線；再來是勉強相關的三線股。越後面，股價越不靠營收；新聞熱度常在第二、第三階段才最高。</li>
<li><b>怎麼辨認</b>　概念股名單越來越長；龍頭不再創高，低價小型股漲停變多；漲幅榜上 EPS 極低的公司變多。</li>
<li><b>案例</b>　2026 年的 CPO：先是本業在光通訊的聯亞（3081）、上詮（3363）；再擴散到大立光（3008；8 月下旬 4 天漲約 31%，量產要到 2027 年中）；最後連 LED 廠都以轉型題材上漲（9/11–9/18 週漲幅榜上的光鼎，第二季 EPS 0.02 元）。</li>
</ul></div></details>
<p class="src">來源：證交所各日類股指數與融資統計；<a href="https://udn.com/news/story/7251/9688478" target="_blank" rel="noopener">聯合新聞網 2026-08-13（MSCI）</a>、<a href="https://udn.com/news/story/123006/9548670" target="_blank" rel="noopener">聯合新聞網 2026-06-05（四大 ETF 成分股調整）</a>、<a href="https://www.cbc.gov.tw/tw/cp-302-181429-e46a9-1.html" target="_blank" rel="noopener">央行 2025-05-05 匯市說明</a>、<a href="https://www.gvm.com.tw/article/132704" target="_blank" rel="noopener">遠見（大立光 CPO）</a>。部分新聞只讀到搜尋結果摘要，見<a href="#/sources">來源與未確認</a>。</p>
</div>
</details>

<details class="blk" id="c1-corr">
<summary><span class="h">板塊之間有沒有相關性？找得出來嗎？</span><span class="sum">找得出來：扣掉類股平均後分成三群、電子零組件與內需類股反向；但結構會變、領先落後很弱，不能當交易規則。</span></summary>
<div class="body">
<p>有，而且用公開資料就算得出來。本站用 2019-12-30 至 2026-09-18 共 345 週、28 個官方類股指數的週報酬計算 <span class="hd hd-est">估計</span>，結論是：相關性可以告訴你「哪些板塊其實同進同出」，但它會隨時間改變，也找不到可靠的「誰先動、誰後動」，不能當交易規則。<span class="tag inf">推論</span> 你可以到<a href="#/explorer">輪動探索器</a>切換期間，自己重算一次。</p>
<h4>怎麼找：三個步驟</h4>
<ol class="steps">
<li><b>先看原始漲跌，會發現看不出輪動。</b>各類股與加權指數的相關係數在 0.24–0.92 之間，多數高於 0.4（半導體 0.92、電子零組件 0.85、金融 0.67、食品 0.43），大家一起漲跌。</li>
<li><b>扣掉共同的部分再算。</b>把每個類股的週報酬減去 28 個類股的平均週報酬（不用加權指數，是因為台積電占加權指數四成，減掉它幾乎等於減掉台積電），得到「超額報酬」，再算彼此的相關係數，類股就分成三群：<b>內需防禦</b>（食品、貿易百貨、觀光、營建、水泥、其他、金融）、<b>電子</b>（半導體、電子零組件、電腦週邊、電機機械）、<b>原物料</b>（塑膠、油電燃氣、鋼鐵）。群內同進同出。</li>
<li><b>找反向的配對。</b>最明顯的是電子零組件對內需類股：近 52 週的相關係數，對貿易百貨 −0.68、對觀光餐旅 −0.60、對食品 −0.59，對金融是 −0.48。意思是資金往電子零組件集中的那幾週，內需與金融相對落後，反過來也一樣。</li>
</ol>
<h4>三個限制</h4>
<ul class="list">
<li><b>結構不固定。</b>2020–22 與 2023–26 兩段各算一個相關矩陣，兩個矩陣彼此的相關只有 0.43。例如電子零組件與貿易百貨在 2020–22 年幾乎不相關（−0.06），2023–26 年變成明顯反向（−0.55）；金融與塑膠則由同向（+0.32）變成反向（−0.25）。</li>
<li><b>週頻的領先落後關係很弱。</b>3,024 組檢定中有 256 組超過顯著門檻，但純粹隨機也預期約 151 組；最大的相關係數絕對值只有 0.16–0.25，而且找不到經濟上的解釋。</li>
<li><b>類股動能不顯著。</b>過去 13 週較強的類股，未來 4 週是否續強？排序相關只有 0.051（t＝1.55），統計上不顯著。</li>
</ul>
<details class="sub"><summary>補充：為什麼半導體對誰都是負相關（台積電權重的算術效果）</summary><div class="body"><p>加權指數四成是台積電，它大漲的那一週，其他類股「相對大盤」自然都輸，所以半導體對其他類股的超額報酬相關全是負的（−0.26 到 −0.59）。改用各類股等權平均當基準後，半導體與電子零組件變成 +0.40（同向），電子零組件對金融仍是 −0.42、對食品 −0.53。所以真正的反向關係是「整個電子」對「金融加內需傳產」；電子內部（台積電對中小型電子）的反向比較弱，而且常常只是權重效應。（研究報告試算，近 104 週）<span class="hd hd-est">估計</span></p></div></details>
<div class="how"><span class="lbl">怎麼用</span>相關性告訴你哪些板塊其實同進同出：電子零組件、<a class="ind" data-ind="otc_ratio">櫃買中小型</a>、電機機械裡的 AI 股屬於同一群，同時持有的分散效果很有限。不要把相關當因果，也不要以為它固定。想知道「現在」誰強誰弱，要看下一區塊的<a class="ind" data-ind="rs_line">相對強弱線</a>。</div>
<p class="src">來源：本站以類股指數週資料計算（<a href="#/explorer">輪動探索器</a>可重現）；原始相關係數與等權基準為研究報告試算。</p>
</div>
</details>

<details class="blk" id="c1-now">
<summary><span class="h">現在輪動到哪裡：離散度與相對強弱線</span><span class="sum">2026 年離散度 3.71% 是樣本最高；5/25 當週之後，錢由電子零組件與中小型股移向塑膠、航運、電腦週邊與金融。</span></summary>
<div class="body">
<p>2026 年是 2020 年以來輪動最劇烈的一年，而且 5 月底出現過一次明顯的換邊。<span class="pill watch">留意</span> 依據有兩個：類股報酬的離散度創樣本新高，以及各條相對強弱線在 2026-05-25 當週同時轉折。<span class="tag inf">推論</span></p>
<h4>輪動有多劇烈：離散度</h4>
<p><a class="ind" data-ind="dispersion">類股報酬離散度</a>是同一週各類股報酬率的標準差：高，代表各走各的，選對與選錯板塊差很多。2026 年（至 9/18）平均 3.71%，2020–2025 各年只有 1.97–2.64%。成交也最集中：電子類<a class="ind" data-ind="sec_share">成交占比</a> 2021 年平均 59.9%、2026 年平均 86.3%。單一類股占比的歷史高點：航運 42.9%（2021-06-14 當週）、鋼鐵 17.4%（2021-06-28）、營建 7.1%（2024-04-29）、半導體 48.2%（2026-06-22）、電子零組件 28.6%（2026-07-06）。</p>
<figure class="chart" data-chart="c1_disp"></figure>
<h4>誰變強、誰變弱：相對強弱線</h4>
<p>把類股指數除以加權指數（2020 年初＝1），就是<a class="ind" data-ind="rs_line">相對強弱線</a>，線往上＝跑贏大盤。2026-05-25 當週是轉折點：電子零組件相對大盤見到高點，金融與傳產整體見到低點。之後 13 週變強的是塑膠（南亞）、航運、電腦及週邊、金融；變弱的是電子零組件與<a class="ind" data-ind="otc_ratio">櫃買中小型</a>；半導體持平、仍在歷史高檔。營建、食品還在相對低點，沒有證據顯示已經輪到它們。<span class="tag inf">推論</span></p>
<figure class="chart" data-chart="c1_rs"></figure>
<details class="sub"><summary>十條相對強弱線的讀數（位置、高低點、近 13 週與 52 週變化）</summary><div class="body">

<details class="blk" id="c1-exit">
<summary><span class="h">是輪動還是撤出：怎麼分辨</span><span class="sum">輪動是錢留在股市換位置，撤出是錢離開股市；同時看成交值、漲跌家數、類股是否同向、櫃買、融資、外資與匯率。</span></summary>
<div class="body">
<p>輪動是錢留在股市裡換位置；撤出是錢離開股市（變成現金、匯出、還掉融資）。兩者要看的東西不同：輪動時要找錢去了哪裡；撤出時所有板塊都會跌，只有跌多跌少。分辨的方法是同時看六件事，不要只看指數。<span class="tag inf">推論</span></p>
<div class="tbl-wrap"><table>
<thead><tr><th>觀察項</th><th>輪動</th><th>撤出</th></tr></thead>
<tbody>
<tr><td class="name"><a class="ind" data-ind="turnover">大盤成交值</a></td><td>持平或放大</td><td>急縮（沒人買），或恐慌爆量大跌</td></tr>
<tr><td class="name">漲跌家數</td><td>漲跌互見，有明確的上漲類股</td><td>下跌家數壓倒性多、跌停家數多</td></tr>
<tr><td class="name">類股相對強弱</td><td>有類股逆勢上漲</td><td>全部類股同向下跌，只有防禦股跌得少</td></tr>
<tr><td class="name"><a class="ind" data-ind="otc_ratio">櫃買相對加權</a></td><td>不一定</td><td>櫃買跌得比加權重（中小型與融資部位先被賣）</td></tr>
<tr><td class="name"><a class="ind" data-ind="margin">融資餘額</a></td><td>緩步變動</td><td>連續大減（被強制賣出）</td></tr>
<tr><td class="name"><a class="ind" data-ind="fini_flow_twse">外資</a>與<a class="ind" data-ind="usdtwd">匯率</a></td><td>外資買賣超不一定</td><td>外資大賣超、台幣同步貶值、<a class="ind" data-ind="fut_oi">外資期貨淨空單</a>增加</td></tr>
</tbody>
</table></div>
<h4>四個有日期的例子</h4>
<div class="tbl-wrap"><table>
<thead><tr><th>日期</th><th class="n">加權</th><th class="n">總成交值</th><th>類股表現</th><th>判讀</th></tr></thead>
<tbody>
<tr><td class="name">2025-04-07</td><td class="n">−9.70%</td><td class="n">—</td><td>多數類股跌 9% 以上（接近跌停）；通信網路 −5.90%、貿易百貨 −7.99% 相對抗跌；之後不到兩週融資 −28%</td><td><span class="pill alert">撤出</span>　系統性，槓桿被迫出場</td></tr>
<tr><td class="name">2026-09-15</td><td class="n">−0.77%</td><td class="n">6,347 億元</td><td>32 類只有生技、資訊服務、油電燃氣、運動休閒、居家生活 5 類小漲；成交值是 9 月最低</td><td><span class="pill watch">觀望</span>　沒人追也沒人賣，等聯準會結果</td></tr>
<tr><td class="name">2026-09-11</td><td class="n">−1.61%</td><td class="n">7,622 億元</td><td>電子 −1.93%；金融 +1.12%、航運 +1.04%、數位雲端 +1.17%</td><td><span class="pill neutral">輪動</span>　電子獲利了結，部分資金移到金融</td></tr>
<tr><td class="name">2026-09-18</td><td class="n">+1.93%</td><td class="n">1 兆 1,423 億元</td><td>電子 +2.44%、電子零組件 +3.26%；金融 −0.96%、航運 −0.45%；上漲 748 家、下跌 251 家；外資買超 870 億元</td><td><span class="pill neutral">回流加反向輪動</span>　錢從金融回到電子，量增價漲</td></tr>
</tbody>
</table></div>
<p>目前（9/18）的讀法：量增價漲、上漲家數約是下跌的三倍、外資買超，是資金回流加上反向輪動，不是撤出。<span class="pill calm">平穩</span> 要留意的是槓桿：上市融資餘額 5,940 億元、今年以來 +73%，高於指數的 +62.9%；下次若出現撤出，被迫賣出的力量會比 2025 年 4 月（當時由 2,990 億元降到 2,140 億元）大。<span class="pill watch">留意</span><span class="tag inf">推論</span></p>
<div class="how"><span class="lbl">怎麼練</span>把上面的表變成每天收盤後 5 分鐘的固定動作，寫下「今天錢從哪裡到哪裡、我猜是第幾類原因」，兩週後回頭對答案。每日、每週、每月的練習路徑、記錄範本與檢查表放在<a href="#/practice">判讀與練習</a>。</div>
<p class="src">來源：<a href="https://www.twse.com.tw/rwd/zh/afterTrading/FMTQIK?date=20260918&amp;response=json" target="_blank" rel="noopener">證交所 市場成交資訊</a>、各日類股指數與大盤統計、<a href="https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20250411&amp;selectType=MS&amp;response=json" target="_blank" rel="noopener">信用交易統計</a>。</p>
</div>
</details>

<details class="blk" id="c1-blind">
<summary><span class="h">盲點與常見誤讀</span><span class="sum">最常見的錯：把類股指數當族群、只看漲跌不看相對強弱、忽略 ETF 與日曆、用單日下結論。</span></summary>
<div class="body">
<p>下面九條是入門者最容易看錯的地方；前面各區塊已有細節，這裡只留檢查用的一句話。</p>
<div class="blind"><b>盲點</b>　看到新聞才追題材。新聞與社群最熱的時候，多半已是題材擴散的第二、第三階段。檢查：龍頭股是不是已經不創高？概念股名單是不是越來越長？<span class="tag add">補充</span></div>
<div class="mis"><b>常見誤讀</b>　把類股指數當成族群 → 半導體類約 75% 是台積電、塑膠類幾乎是南亞、電機機械類不等於重電、綠能環保類不含太陽能電池廠。要看族群，就自己挑代表股放在一起看。</div>
<div class="blind"><b>盲點</b>　只看上市、不看上櫃。很多 AI 中小型龍頭在櫃買（信驊、旺矽、台燿、聯亞、群聯、環球晶；代號見族群表）。今年櫃買 +49.4%、加權 +62.9%，是大型權值股贏中小型的一年，要看<a class="ind" data-ind="otc_ratio">櫃買相對加權</a>才看得出來。<span class="tag add">補充</span></div>
<div class="mis"><b>常見誤讀</b>　只看漲跌、不看相對強弱 → 大盤漲 2% 時某類股只漲 1%，其實是輸。輪動要用<a class="ind" data-ind="rs_line">相對強弱線</a>看。</div>
<div class="blind"><b>盲點</b>　忽略照規則、不看價格的買賣。<a class="ind" data-ind="etf">0050 有 2.4 兆元、三檔高股息 ETF 合計 2.07 兆元</a>；它們的換股日與 MSCI 生效日都查得到，見<a href="#/time">時間軸與日曆</a>。<span class="tag add">補充</span></div>
<div class="mis"><b>常見誤讀</b>　把相關性當因果，或以為相關性固定 → 航運與鋼鐵 2021 年同進同出，2026 年幾乎脫鉤。</div>
<div class="blind"><b>盲點</b>　類股指數是價格指數、不含股息。金融、電信、高股息類每年約 4–6% 的股息沒有算進漲幅，和電子比報酬時會低估它們。<span class="tag add">補充</span></div>
<div class="mis"><b>常見誤讀</b>　用單日下結論 → 單日常是事件造成的雜訊；相對強弱線連續 2–4 週同方向，才比較像真的輪動。</div>
<div class="blind"><b>盲點</b>　集中度本身就是風險因子。<a class="ind" data-ind="tsmc_w">台積電一檔占 41.48%</a>，任何跟它有關的事件（法說、關稅、地緣政治、外資調節）都會同時決定大盤方向，與其他所有板塊的相對表現。<span class="tag add">補充</span></div>
</div>
</details>

</template>
<template id="tpl-C2-room"><div class="room-lede">
<p class="verdict">截至 2026-09-18，依「對大盤與資金的影響力」排序，台股熱門題材前三名是台積電／先進製程（97 分）、電路板材料 PCB／CCL／載板（86 分）、AI 伺服器代工（82 分），三者都在同一條 AI 資料中心硬體鏈上。分數是作者用六個維度打的，不是漲跌預測。<span class="tag inf">推論</span></p>
<ul class="takeaways">
<li><b>主線只有一條</b>：台積電、AI 伺服器代工、電路板材料、自研晶片（ASIC）、記憶體五塊合計約占加權指數市值 57%<span class="hd hd-est">估計</span>，需求都來自<a class="ind" data-ind="capex_csp">雲端大廠資本支出</a>，所以同漲同跌。</li>
<li><b>非電子只有金融排進前五</b>：金融類今年 +51.1%、9 月至 9/18 +8.2%，權重約 8.3%<span class="hd hd-est">估計</span>，是電子以外唯一能明顯影響指數的板塊。</li>
<li><b>新聞多不等於影響大</b>：資安、量子、營建的新聞很多，但市值權重與<a class="ind" data-ind="sec_share">成交占比</a>都小，排在 25 名之後。</li>
<li><b>漲的原因是 AI，跌的原因多半是總體</b>：AI 資本支出疑慮、<a class="ind" data-ind="oil">油價</a>、<a class="ind" data-ind="tariff">關稅</a>、<a class="ind" data-ind="fed">聯準會升息</a>任何一項惡化，會先反映在權重 41.48% 的<a class="ind" data-ind="tsmc_w">台積電</a>。</li>
<li><b>其他因素</b>：市場結構（主動式 ETF、當沖與處置）與交易制度（指數調整、籌資、除息）會放大波動；8 月漲最多的 AI 零件股，9 月至 9/18 全數回跌。</li>
</ul>
</div>

<summary><span class="h">29 個題材的總排序：誰對大盤影響最大</span><span class="sum">前三名都在 AI 資料中心硬體鏈；金融第 4，是前五名唯一的非電子；資安、量子新聞多但排最後。</span></summary>

<p class="src">總分與層級為作者評分<span class="tag inf">推論</span>；現況欄整理自公司公告與報導<span class="tag src">整理</span>，類股漲跌幅為<span class="hd hd-mkt">市場</span>讀數。同分者並列。</p>
<div class="how"><span class="lbl">怎麼讀</span>層級看影響範圍：主線決定指數方向，次主線決定類股輪動，短線靠單一事件帶動、容易退燒，冷門是今年負報酬或個位數報酬的族群。熱度只看近兩週盤面與新聞，不計分。熱度高但分數低（資安、營建、面板）＝話題多、對大盤影響小；分數高但熱度普通（金融）＝少上新聞，卻實際影響指數。</div>
<h4>三個層級各是什麼</h4>
<ul class="list">
<li><b>主線</b>：<a class="ind" data-ind="tsmc_w">台積電（41.5%）</a>＋AI 伺服器代工（約 5.0%）＋PCB／CCL／載板（約 4.2%）＋ASIC（約 5.0%）＋記憶體（約 1.7%）<span class="hd hd-est">估計</span>。需求來源相同，所以同漲同跌：7/17 半導體類跌 7.71%，食品類只跌 0.31%。</li>
<li><b>次主線</b>：台積電橫盤時，資金會在這些族群之間移動。8 月半導體類只漲 2.7%，電子零組件 +25.1%、光電 +38.4%、生技 +17.9%。</li>
<li><b>短線</b>：權重合計不到 3%<span class="hd hd-est">估計</span>，靠單一事件帶動，常進處置名單（交易所對短期漲跌過大的股票限制撮合）。</li>
<li><b>冷門</b>：電動車、觀光內需食品、鋼鐵水泥今年是負報酬或個位數報酬，和大盤 +62.9% 脫節。</li>
</ul>
<p>官方類股怎麼分、每一類靠什麼賺錢，見<a href="#/sectors">板塊怎麼分</a>；「AI 資料中心還是不是成長原因」的完整檢查見<a href="#/aidc">AIDC 檢查</a>。</p>
</div>

<details class="blk" id="c2-method">
<summary><span class="h">怎麼排的：六個維度、權重與限制</span><span class="sum">六項各打 1–5 分，和指數直接相關的兩項占 45%；這是作者的評分，換一組權重名次會變。</span></summary>
<div class="body">
<p>每個題材用六個維度各打 1–5 分，加權後乘以 20 換成 100 分。因為問的是「影響程度」，和指數直接相關的市值權重（25%）與指數貢獻（20%）合計占 45%。維度、權重、分級門檻都是作者設定的<span class="tag inf">推論</span>；換一組權重，名次會變，所以請把分數當成分級距的工具，不要比較個位數的差距。</p>
<div class="tbl-wrap"><table>
<thead><tr><th>維度</th><th>量什麼</th><th class="n">權重</th><th>5 分</th><th>1 分</th><th>資料</th></tr></thead>
<tbody>
<tr><td class="name">市值權重</td><td>代表股在加權指數的權重合計</td><td class="n">25%</td><td>≥10%</td><td>&lt;0.5%</td><td>期交所 8/31 成分股權重前 60 名</td></tr>
<tr><td class="name">成交比重</td><td>占上市成交值的大約比重</td><td class="n">15%</td><td>≥15%</td><td>&lt;0.5%</td><td>證交所週統計的<a class="ind" data-ind="sec_share">類股成交占比</a>；題材層級是拆估</td></tr>
<tr><td class="name">指數貢獻</td><td>今年至 9/18 貢獻的漲跌點數</td><td class="n">20%</td><td>≥3,000 點</td><td>&lt;50 點或負值</td><td>台積電用個股計算，其餘用類股指數估計</td></tr>
<tr><td class="name">營收動能</td><td>代表公司 8 月營收年增率（取中間值）</td><td class="n">15%</td><td>≥+100%</td><td>負成長</td><td>公司<a class="ind" data-ind="rev_monthly">月營收</a></td></tr>
<tr><td class="name">成熟度</td><td>離「進營收」還有多遠</td><td class="n">15%</td><td>已反映在營收</td><td>只有題材、沒有營收</td><td>依公司說法與法人報告判斷</td></tr>
<tr><td class="name">擴散範圍</td><td>被帶動的類股或次產業數</td><td class="n">10%</td><td>≥6 個</td><td>1 個</td><td>依新聞與類股表現判斷</td></tr>
</tbody></table></div>
<p>總分＝六項分數各乘上權重後加總，再乘以 20。例：台積電六項是 5、5、5、4、5、5，算出來是 97 分。成交比重看資金現在在不在這個題材；營收動能與成熟度區分「有業績」和「只有題材」；擴散範圍看會不會帶動輪動。</p>
<figure class="chart" data-chart="c2_scores"></figure>
<h4>指數貢獻怎麼算</h4>
<p>貢獻點數 ≈ 年初指數 × 年初權重 × 期間報酬率。台積電年初權重約 42.4%，今年由 1,550 元漲到 2,460 元（+58.7%），貢獻約 7,210 點，占今年漲點 18,217 點的 39.6%<span class="hd hd-est">估計</span>。換算下來，台積電每漲跌 1 元，加權指數約動 7.9 點；這和媒體對 7/17 的統計吻合（台積電跌 180 元、貢獻跌點約 1,430 點）。集中度的細節見<a class="ind" data-ind="tsmc_w">台積電權重</a>。</p>
<figure class="chart" data-chart="c2_contrib"></figure>
<div class="how"><span class="lbl">怎麼讀</span>電子類約占今年漲點的 87%、金融約 7.7%、其餘傳產約 5.2%。扣掉台積電後，其他股票今年平均報酬約 +66%，比台積電的 +58.7% 還高：今年是整條 AI 硬體鏈一起漲。類股層級的拆分誤差可能到 ±20%，只適合分級距。</div>
<h4>這套方法的限制</h4>
<ul class="list">
<li>權重資料日是 2026-08-31，9 月漲跌後會小幅變動。</li>
<li>上櫃公司（信驊、世界先進、雙鴻、台燿等）不在加權指數內，市值權重與指數貢獻會低估這些題材；中小型股強弱請看<a class="ind" data-ind="otc_ratio">櫃買相對加權</a>。</li>
<li>題材會重疊（南亞同時是塑化股與 AI 材料股，鴻海同時是 AI 伺服器與蘋果供應鏈），權重不重複加總。</li>
<li>除台積電與南亞外，個股今年報酬沒有逐檔查證，指數貢獻以類股指數代理；ASIC 的 4 分是推估，改成 3 分總分為 68、名次不變。</li>
<li>量子、電動車、綠能儲能、觀光內需只查到類股指數層級，熱度是依類股表現推論。</li>
</ul>
</div>
</details>

<details class="blk" id="c2-cards">
<summary><span class="h">題材短卡：在炒什麼、誰受惠、怎麼驗證、風險</span><span class="sum">29 張卡依名次排列；前 19 張固定四段，其餘一到兩句。點開想看的就好。</span></summary>
<div class="body">
<p>每張卡固定四段：在炒什麼（機制）、誰受惠、用什麼數據驗證、風險或反方。共同的驗證工具只有三個：每月 10 日前公布的<a class="ind" data-ind="rev_monthly">月營收</a>、類股相對大盤的強弱（<a class="ind" data-ind="rs_line">相對強弱線</a>）、有沒有進處置名單。公司名單與營收數字整理自公司公告與報導<span class="tag src">整理</span>；「風險或反方」是作者判讀<span class="tag inf">推論</span>。券商目標價與供需缺口屬於<span class="hd hd-est">估計</span>；部分股票代號未逐一重查（見<a href="#/sources">來源與未確認</a>）。</p>
<details class="sub"><summary>1｜台積電／先進製程（97 分，主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：全球 AI 晶片幾乎都在台積電用 3 奈米、2 奈米生產，再用 CoWoS 封裝；產能不夠，能同時量增與漲價。一檔占指數 41.48%。</li>
<li><b>誰受惠</b>：台積電（2330）；設備材料有家登（3680）、中砂（1560）。</li>
<li><b>怎麼驗證</b>：<a class="ind" data-ind="tsmc_rev">台積電月營收</a>（8 月年增 53.3%）、<a class="ind" data-ind="adr">ADR 溢價</a>（9/18 約 12.4%）。</li>
<li><b>風險或反方</b>：財測匯率假設 32 元、9/18 為 31.808，<a class="ind" data-ind="usdtwd">台幣升值</a>會壓毛利率；今年 +58.7% 輸給大盤。</li>
</ul></div></details>
<details class="sub"><summary>2｜PCB／CCL／載板／玻纖布（86 分，主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：AI 伺服器訊號越來越快，電路板底材（銅箔基板 CCL）、玻纖布與 ABF 載板都要升級；高階產能少，缺料又漲價。</li>
<li><b>誰受惠</b>：台光電（2383）、台燿（6274）、聯茂（6213）、欣興（3037）。</li>
<li><b>怎麼驗證</b>：月營收（8 月台光電年增 129.85%、聯茂 +97.93%）。</li>
<li><b>風險或反方</b>：電子零組件類今年 +116.1%，漲最多、也最多人追；9/17「CPO 會讓板材降規」說法讓聯茂跌停；欣興因產地標示遭搜索，牽涉<a class="ind" data-ind="tariff">關稅</a>的原產地認定。</li>
</ul></div></details>
<details class="sub"><summary>3｜AI 伺服器／機櫃代工（82 分，主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：輝達把 GPU、交換器、電源、液冷整合成整櫃出售，台灣代工廠負責組裝測試。一櫃售價是過去伺服器的數十倍，但代工毛利率低。</li>
<li><b>誰受惠</b>：鴻海（2317）、廣達（2382）、緯創（3231）、緯穎（6669）。</li>
<li><b>怎麼驗證</b>：月營收（8 月廣達年增 177.5%、緯創 +166.5%）；<a class="ind" data-ind="nvda">輝達財測</a>；<a class="ind" data-ind="capex_csp">雲端廠資本支出</a>。</li>
<li><b>風險或反方</b>：基期太高，2027 年難複製；緯創發海外存託憑證籌資、股本稀釋約 8%；電腦及週邊類 9 月至 9/18 −2.3%。</li>
</ul></div></details>
<details class="sub"><summary>4｜金融股（78 分，次主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：金控三個獲利來源同時成長：放款利差（升息有利）、壽險賣股實現獲利、證券經紀手續費（日均<a class="ind" data-ind="turnover">成交值</a>超過 1 兆元）。</li>
<li><b>誰受惠</b>：富邦金（2881）、國泰金（2882）、中信金（2891）、永豐金（2890）。</li>
<li><b>怎麼驗證</b>：每月金控獲利（富邦金前 8 月稅後 1,202.6 億元）；新台幣急升會有<a class="ind" data-ind="life_fx">壽險匯損</a>；<a class="ind" data-ind="fed">美債殖利率</a>。</li>
<li><b>風險或反方</b>：9/18 大盤漲 893 點、金融類 −0.96%，資金回頭買電子時會被賣出；獲利很大一塊來自賣股票。</li>
</ul></div></details>
<details class="sub"><summary>5｜記憶體漲價循環（77 分，主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：三大原廠把產能優先做 AI 用的高頻寬記憶體（HBM），一般型 DRAM、NAND 供給被排擠，合約價連漲數季，台廠做的正是這類產品。</li>
<li><b>誰受惠</b>：南亞科（2408）、華邦電（2344）、旺宏（2337）、群聯（8299）。</li>
<li><b>怎麼驗證</b>：<a class="ind" data-ind="dram">記憶體報價</a>（集邦估第 3 季一般型 DRAM 合約價季增 13–18%，漲幅收斂）。</li>
<li><b>風險或反方</b>：對國際消息最敏感：7/17 海力士 ADR −13%，南亞科、華邦電跌停；宏碁已說漲太多、需求下滑。</li>
</ul></div></details>
<details class="sub"><summary>6｜ASIC／雲端自研晶片（72 分，主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：Google、Amazon、Meta、微軟各自設計專用 AI 晶片（ASIC），找聯發科、創意、世芯協助設計與投片，一樣在台積電生產。</li>
<li><b>誰受惠</b>：聯發科（2454）、創意（3443）、世芯-KY（3661）。</li>
<li><b>怎麼驗證</b>：世芯、創意月營收是否連續放大（專案量產當月才跳升）；聯發科 8 月年增 44.08%。</li>
<li><b>風險或反方</b>：營收認列不平均，專案遞延就整季落空（世芯前 7 月年減 13.78%）；評價靠 2027 年獲利，升息最不利。</li>
</ul></div></details>
<details class="sub"><summary>7｜液冷散熱（69 分，次主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：單顆 AI 晶片功耗上千瓦，風扇不夠，要用水冷板貼在晶片上、靠冷卻液帶走熱；一櫃散熱零件價值比氣冷高數倍。</li>
<li><b>誰受惠</b>：奇鋐（3017）、雙鴻（3324）、健策（3653）、富世達（6805）、高力（8996）。</li>
<li><b>怎麼驗證</b>：月營收（奇鋐 8 月年增 54.34%）；輝達下一代機櫃第 4 季是否如期放量。</li>
<li><b>風險或反方</b>：評價已高；雙鴻 8 月營收月減；高力 9/14 起被處置；外資調高目標價是券商估計，不是訂單。</li>
</ul></div></details>
<details class="sub"><summary>8｜先進封裝／測試／設備（65 分，次主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：把 GPU 與 HBM 並排封裝（CoWoS）是 AI 晶片的產能瓶頸。下一步把圓形晶圓改成方形面板來做（面板級封裝 FOPLP，台積電稱 CoPoS），面板廠的舊產線用得上。</li>
<li><b>誰受惠</b>：日月光投控（3711）、京元電（2449）、群創（3481）。</li>
<li><b>怎麼驗證</b>：台積電法說的 CoWoS 產能；日月光月營收（7 月年增 43.15%）。</li>
<li><b>風險或反方</b>：CoPoS 估 2028 年才量產（僅標題）；設備股營收年增約 15%，低於股價熱度。</li>
</ul></div></details>
<details class="sub"><summary>9｜電源架構：800V 高壓直流、備援電池（63 分，次主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：一櫃 AI 伺服器耗電上百千瓦，48V 供電的銅線太粗，輝達推動改用 800V 高壓直流（HVDC），另加電池備援模組（BBU）。</li>
<li><b>誰受惠</b>：台達電（2308）、光寶科（2301）、貿聯-KY（3665）。</li>
<li><b>怎麼驗證</b>：台達電月營收（8 月年增 35%、歷史第三高）；800V 媒體稱 2027 年第 1 季量產（僅標題）。</li>
<li><b>風險或反方</b>：9/9 公布營收、9/10 股價跌逾 6%，好消息沒帶來上漲；台達電是第三大權值股（3.18%）。</li>
</ul></div></details>
<details class="sub"><summary>10｜被動元件漲價（58 分，次主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：AI 伺服器每台用的積層陶瓷電容（MLCC）、鉭電容數量是一般伺服器的數倍，日韓廠把產能轉去高階品，中低階供給變緊、開始漲價。</li>
<li><b>誰受惠</b>：國巨（2327）、華新科（2492）、禾伸堂（3026）、信昌電（6173）。</li>
<li><b>怎麼驗證</b>：國巨月營收（8 月年增 51.80%）；村田、三星電機的報價。</li>
<li><b>風險或反方</b>：華新科、禾伸堂 8–9 月進處置名單；族群 9 月在修正，外資目標價有升有降（僅標題）。</li>
</ul></div></details>
<details class="sub"><summary>11｜航運（貨櫃）（55 分，次主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：2/28 美伊開戰後，荷莫茲海峽與紅海風險讓船繞道、保費上升，加上港口壅塞，貨櫃運價大漲；運價直接就是貨櫃公司的營收。</li>
<li><b>誰受惠</b>：長榮（2603）、陽明（2609）、萬海（2615）。受害：燃油成本上升的航空公司。</li>
<li><b>怎麼驗證</b>：每週五的<a class="ind" data-ind="scfi">運價指數 SCFI</a>（9/18 為 3,687.83 點、連 8 週上漲）。</li>
<li><b>風險或反方</b>：航運類今年只漲 18.8%，市場把它當成戰爭造成的一次性獲利；停火或十一長假後運價可能回落。</li>
</ul></div></details>
<details class="sub"><summary>12｜矽光子／CPO／光通訊（53 分，次主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：機櫃之間資料量太大，銅線不夠，改用光纖。現在的營收來自可插拔光模組（800G 升級到 1.6T）；把光收發元件封裝在交換器晶片旁的 CPO 今年下半年才小量。</li>
<li><b>誰受惠</b>：聯亞（3081）、全新（2455）、波若威（3163）、智邦（2345）。</li>
<li><b>怎麼驗證</b>：月營收（聯亞 8 月年增 180.9%、智邦 +61.16%）。</li>
<li><b>風險或反方</b>：研究機構認為 CPO 大量生產要到 2028–2029 年，時程爭論會反覆出現；多檔在處置名單。</li>
</ul></div></details>
<details class="sub"><summary>13｜成熟製程＋矽晶圓漲價（51 分，次主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：AI 把先進製程與封裝產能用滿，連帶排擠成熟製程與後段封測；晶圓代工廠與矽晶圓廠趁機把過去兩年跌掉的價格漲回來。</li>
<li><b>誰受惠</b>：聯電（2303）、力積電（6770）、世界先進（5347）、合晶（6182）、環球晶（6488）。</li>
<li><b>怎麼驗證</b>：聯電、世界先進法說的平均售價與產能利用率；合晶矽晶圓調漲約一成。</li>
<li><b>風險或反方</b>：漲幅遠小於記憶體，營收年增只有一到兩成，股價較像補漲；中國成熟製程持續擴產。</li>
</ul></div></details>
<details class="sub"><summary>13｜重電／電力基建（51 分，次主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：台電強韌電網計畫、半導體廠與資料中心擴建、美國電網更新，讓變壓器與配電盤訂單排到好幾年後。</li>
<li><b>誰受惠</b>：華城（1519）、士電（1503）、中興電（1513）、亞力（1514）、東元（1504）。</li>
<li><b>怎麼驗證</b>：月營收（8 月華城年增 12.50%、士電 −0.38%、亞力 −26.52%）；台電標案節奏。</li>
<li><b>風險或反方</b>：題材談了三年，營收成長已降到個位數；台電今年估虧損逾 711 億元，資本支出可能被壓縮。</li>
</ul></div></details>
<details class="sub"><summary>13｜油價／塑化（51 分，次主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：油價大漲時，煉油廠的低價庫存增值、煉油利差擴大；下游塑膠原料因中國產能過剩漲不上去，所以受惠的主要是台塑化。</li>
<li><b>誰受惠</b>：台塑化（6505）。南亞（1303）今年 +295% 靠的是電子材料（CCL、玻纖布、銅箔），不是塑膠本業。</li>
<li><b>怎麼驗證</b>：<a class="ind" data-ind="oil">布蘭特原油</a>（9/2 為 95 美元、9/18 為 103.87 美元）；油電燃氣類 9 月至 9/18 +15.9%。</li>
<li><b>風險或反方</b>：停火消息一出就會反轉；台塑、台化本業仍受中國供給過剩壓抑。</li>
</ul></div></details>
<details class="sub"><summary>13｜邊緣 AI／AI PC／品牌（51 分，短線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：原本的說法是 AI 功能帶動換機；實際發生的是記憶體與晶片成本暴漲，品牌廠被迫漲價。</li>
<li><b>誰受惠</b>：華碩（2357）、宏碁（2353）、微星（2377）、技嘉（2376）；是否受惠要看漲價能否轉嫁。</li>
<li><b>怎麼驗證</b>：華碩月營收（8 月年增 51.2%）；宏碁 9/19 稱第 4 季 PC 估漲 5–20%、需求已開始下滑。</li>
<li><b>風險或反方</b>：營收成長有一部分來自漲價與伺服器業務，不是 AI PC 出貨量；需求下滑的風險在 2027 年上半年。</li>
</ul></div></details>
<details class="sub"><summary>17｜生技醫療（50 分，次主線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：和景氣、AI 關係小的族群，資金在電子股休息時會移過來。龍頭藥華藥靠單一新藥在美、日、台擴大適應症。</li>
<li><b>誰受惠</b>：藥華藥（6446）、保瑞（6472）、美時（1795）、台康生技（6589）。</li>
<li><b>怎麼驗證</b>：類股相對大盤的強弱（8 月 +17.9%、9 月至 9/18 −8.0%）；藥華藥 5 月營收年增 108.47%（查得到的最新月份）。</li>
<li><b>風險或反方</b>：漲跌和電子股資金進出高度相關，不是照基本面的節奏走。</li>
</ul></div></details>
<details class="sub"><summary>18｜蘋果新機／折疊機（48 分，短線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：每年 9 月的固定題材；今年不同的是第一支折疊 iPhone（iPhone Duo，10/23 開賣），基本款延到明年春季。</li>
<li><b>誰受惠</b>：大立光（3008）、玉晶光（3406）、富世達（6805）、新日興（3376）、鴻海（2317）。</li>
<li><b>怎麼驗證</b>：10/23 折疊機銷售；大立光月營收何時轉正（8 月年減 16.23%）。</li>
<li><b>風險或反方</b>：「發表前漲、開賣後跌」的季節性很強；首日銷量年增有一部分是因為今年只賣 Pro。</li>
</ul></div></details>
<details class="sub"><summary>19｜機器人／人形機器人（45 分，短線）</summary><div class="body"><ul class="list">
<li><b>在炒什麼</b>：兩件事混在一起：工業自動化景氣回升（已在營收上），與人形機器人量產（還在送樣與審廠）。</li>
<li><b>誰受惠</b>：上銀（2049）、所羅門（2359）、樺漢（6414）、亞德客-KY（1590）、新唐（4919）。</li>
<li><b>怎麼驗證</b>：上銀月營收（8 月年增 42.30%）；特斯拉計畫 2026 年生產約 5 萬部 Optimus。</li>
<li><b>風險或反方</b>：特斯拉 9/16–17 審的是中國供應商，台廠受惠有限；人形機器人的營收貢獻仍接近零。</li>
</ul></div></details>
<details class="sub"><summary>20｜觀光／內需／食品（42 分，冷門）</summary><div class="body"><p>靠國內消費、和出口景氣脫鉤；代表股統一（1216）、統一超（2912）、晶華（2707）。今年觀光類 −3.8%、食品 −4.8%，沒有明顯催化；驗證看<a class="ind" data-ind="retail">零售與餐飲營業額</a>。</p></div></details>
<details class="sub"><summary>21｜面板／光電轉型（40 分，短線）</summary><div class="body"><p>面板本業低成長，股價動能來自賣舊廠、轉做面板級封裝（FOPLP）與光互連；友達（2409）、群創（3481）、富采（3714）。7/28 友達以 197 億元把廠房賣給廣達（僅標題）；9/18 外資賣超友達 5.2 萬張、群創 2.3 萬張。成交量大但市值小；9 月面板報價未查到。</p></div></details>
<details class="sub"><summary>21｜低軌衛星（40 分，短線）</summary><div class="body"><p>做衛星上的射頻元件與電路板，出貨跟著發射量走；昇達科（3491）、華通（2313）、啟碁（6285）。Starlink 8 月發射 261 顆；SpaceX 掛牌前已大漲一輪，事件落地之後降溫。</p></div></details>
<details class="sub"><summary>23｜鋼鐵／水泥（39 分，冷門）</summary><div class="body"><p>看中國減產與國際鋼價；中鋼（2002）、豐興（2015）、台泥（1101）。中鋼 10 月盤價調漲（熱軋每噸 +600 元），但鋼鐵類今年只 +4.2%、水泥 −1.1%；留意美國 301「結構性產能過剩」關稅。</p></div></details>
<details class="sub"><summary>24｜軍工／無人機（37 分，短線）</summary><div class="body"><p>政府預算加上美國要求不用中國供應鏈；雷虎（8033）、漢翔（2634）、中光電（5371）。8/13 美國無人機 232 關稅台灣 15% 不疊加，8/14 無人機 634 億元預算放行、當天 9 檔漲停，事件過後降溫。</p></div></details>
<details class="sub"><summary>25｜電動車／車用（36 分，冷門）</summary><div class="body"><p>國內車市萎縮；和泰車（2207）、裕日車（2227）。汽車類今年 −7.6%，裕日估今年車市恐跌破 42 萬輛。這一項近期新聞查證不足。</p></div></details>
<details class="sub"><summary>25｜營建（36 分，短線）</summary><div class="body"><p>9/17 央行把第二戶房貸成數上限由 6 成放寬到 7 成（<a class="ind" data-ind="credit_ctrl">選擇性信用管制</a>），9/18 營建類 +2.45%、3 檔漲停；京城（2524）、華固（2548）。類股今年仍 −4.5%，股價反應可能大於基本面；房市細節見<a href="#/dest">錢去哪裡</a>的房市分頁。</p></div></details>
<details class="sub"><summary>27｜綠能／儲能（31 分，短線）</summary><div class="body"><p>電價與缺電議題的延伸；森崴能源（6806）、雲豹能源（6869）。綠能環保類今年 +30.7%、9/18 單日 +3.75%，但催化事件未查到。</p></div></details>
<details class="sub"><summary>28｜資安／資訊服務（26 分，短線）</summary><div class="body"><p>黃仁勳稱資安是 AI 下一個商機，資訊服務類 9/14–18 週 +4.6%（全市場第一）、週轉率 15.97%；精誠（6214）、零壹（3029）。但類股 9/18 成交值只有 24.7 億元，占大盤 0.2%。</p></div></details>
<details class="sub"><summary>29｜量子運算（20 分，短線）</summary><div class="body"><p>只查到 IBM 的國外新聞，沒查到台股成形的族群與成交熱度，目前沒有台股營收。</p></div></details>
</div>
</details>

<details class="blk" id="c2-structure">
<summary><span class="h">市場結構類話題：錢用什麼方式進出</span><span class="sum">主動式 ETF、高股息 ETF 退燒、當沖與處置、台積電權重與 ADR：不是產業，但會放大所有題材的波動。</span></summary>
<div class="body">
<p>這四項談的不是「哪個產業有訂單」，而是「錢用什麼方式進出」，所以不放進排名；但它們會放大或壓抑所有題材的波動。讀數整理自證交所與報導<span class="tag src">整理</span>，「風險」欄是作者判讀<span class="tag inf">推論</span>。</p>
<div class="tbl-wrap"><table>
<thead><tr><th>話題</th><th>機制</th><th>最新讀數</th><th>風險或反方</th></tr></thead>
<tbody>
<tr><td class="name">主動式 ETF 熱潮</td><td>經理人選股、每天公布持股的 <a class="ind" data-ind="etf">ETF</a>，2025 年 5 月才開放；散戶與外資會跟著買</td><td>00981A 規模 2,782.10 億元、00403A 1,534.72 億元（9/19）；9/18 <a class="ind" data-ind="fini_flow_twse">外資買超</a>張數前兩名就是這兩檔</td><td>持股集中在 AI 供應鏈的中大型股，下跌時會一起被贖回；00403A 5/12 掛牌溢價逾 5%，4 個交易日內跌破發行價</td></tr>
<tr><td class="name">高股息 ETF 退燒</td><td>過去三年的散戶主流，今年報酬落後市值型與主動式</td><td>7 月 0050 受益人單月增 32.45 萬人、0056 增 9.1 萬人；9/18 外資同步賣超 00919 與 0050；規模變化未查到</td><td>金融、電信等高殖利率股少了一個固定買盤；配息含資本利得，行情反轉時配息會縮水</td></tr>
<tr><td class="name">當沖與處置股</td><td>當沖占比高、短期暴漲的股票多 → 處置公告變多 → 處置期間改成隔一段時間才撮合一次，可能要預收款券</td><td>9/18 <a class="ind" data-ind="turnover">當沖</a>占上市成交金額 31.33%（8 月全月 40.99%、7 月 38.98%）；8/1–9/18 上市處置 48 筆、38 檔，川湖、大立光、欣興、健策都進過</td><td>處置期間想賣不一定賣得掉；撮合間隔的現行分鐘數未確認</td></tr>
<tr><td class="name">台積電權重與 ADR 溢價</td><td>一檔占四成；<a class="ind" data-ind="adr">ADR</a>（在美國掛牌的存託憑證）比台北股價貴多少，反映海外資金比本地樂觀或悲觀</td><td><a class="ind" data-ind="tsmc_w">權重</a> 41.48%（8/31）；每 1 元約 7.9 點<span class="hd hd-est">估計</span>；ADR 溢價 8/31 約 9.4%、9/18 約 12.4%</td><td>指數漲不代表手上的股票漲；溢價快速縮小常發生在外資撤出時</td></tr>
</tbody></table></div>
<p>ETF 為什麼會讓「投信買超、自營商賣超」同時變大，以及<a class="ind" data-ind="inst">三大法人</a>數字怎麼讀，見<a href="#/dest">錢去哪裡</a>的股市分頁。</p>
</div>
</details>

<details class="blk" id="c2-macro">
<summary><span class="h">同時影響多個板塊的總體因素排序</span><span class="sum">第 1 名是 AI 資本支出疑慮；戰事油價、通膨、升息是同一條因果鏈，關稅是另一條。</span></summary>
<div class="body">
<p>依影響程度排，前四名是：AI 資本支出與「放緩、泡沫、融資」疑慮（15 分）、美伊戰事與油價（14 分）、美國關稅（14 分）、聯準會與全球升息（13 分）。評分用三項各 1–5 分：影響廣度、今年已造成的最大盤面衝擊、未來三個月的事件密度<span class="tag inf">推論</span>。</p>
<div class="note">第 2、4 名其實在同一條因果鏈上：戰事推高<a class="ind" data-ind="oil">油價</a> → <a class="ind" data-ind="cpi">物價</a>升溫 → 各國央行升息（<a class="ind" data-ind="fed">聯準會</a>）→ 折現率上升，市場願意給的<a class="ind" data-ind="pe">本益比</a>（也就是評價）下降，本益比高的科技股跌最多。<a class="ind" data-ind="tariff">關稅</a>是另一條獨立的線。</div>
<div class="tbl-wrap"><table>
<thead><tr><th class="n">名次</th><th>因素</th><th class="n">合計</th><th>對股市</th><th>最新狀態（查證日 9/19–20）</th></tr></thead>
<tbody>
<tr><td class="n">1</td><td class="name">AI 資本支出與放緩、泡沫、融資疑慮<small>廣度 5・衝擊 5・密度 5</small></td><td class="n">15</td><td>雙向</td><td>四大<a class="ind" data-ind="capex_csp">雲端廠資本支出</a> 2026 年約 7,450–7,500 億美元、較 2025 年翻倍；9 月中旬 Anthropic、OpenAI、xAI 執行長表態支持放慢前沿 AI；CoreWeave 9/18 發 30 億美元可轉債、股價 −4.16%（<a class="ind" data-ind="credit_spread">融資條件</a>）</td></tr>
<tr><td class="n">2</td><td class="name">美伊戰事與油價<small>5・5・4</small></td><td class="n">14</td><td>不利</td><td>2/28 開戰；7/13–14 布蘭特單日 +9.6%；8/31 起再度交火；9/18 布蘭特 103.87 美元。3 月外資賣超 9,682 億元是今年單月最大（和開戰時間重疊，因果是推論）</td></tr>
<tr><td class="n">2</td><td class="name">美國關稅（232、301、對等）<small>5・4・5</small></td><td class="n">14</td><td>不利為主</td><td>見下一個區塊</td></tr>
<tr><td class="n">4</td><td class="name">聯準會與全球升息<small>5・4・4</small></td><td class="n">13</td><td>不利（評價）</td><td>9/16 升 1 碼至 3.75–4.00%，三年來首次；日銀 9/18 升到 1.25%。韓國央行 7/16 升息當天韓股 −6.37%，隔天台股跌 2,953.71 點</td></tr>
<tr><td class="n">5</td><td class="name">外資動向與新台幣匯率<small>5・4・3</small></td><td class="n">12</td><td>雙向</td><td><a class="ind" data-ind="fini_flow_twse">外資</a>今年以來賣超 1.4134 兆元（證交所口徑，至 9/18）；9/18 單日買超 869.9 億元、<a class="ind" data-ind="usdtwd">新台幣</a>升到 31.808；<a class="ind" data-ind="fut_oi">外資台指期</a>淨空單 76,110 口，7/24 以來最低</td></tr>
<tr><td class="n">6</td><td class="name">美中關係：川習會、出口管制<small>4・2・5</small></td><td class="n">11</td><td>雙向</td><td>何立峰 9/19–23 訪美，川習會預期在其後一週；AI 晶片出口管制的最新變化未查到</td></tr>
<tr><td class="n">7</td><td class="name">兩岸與地緣政治<small>5・1・2</small></td><td class="n">8</td><td>不利（極端情境）</td><td>近期沒有查到直接衝擊台股的事件</td></tr>
<tr><td class="n">8</td><td class="name">台灣央行：利率與房市管制<small>3・2・2</small></td><td class="n">7</td><td>有利（股市）</td><td>9/17 <a class="ind" data-ind="policy_rate">政策利率</a>第 10 次不動、放寬<a class="ind" data-ind="credit_ctrl">第二戶房貸</a>到 7 成；2 位理事主張升息</td></tr>
<tr><td class="n">8</td><td class="name">電力供應與電價<small>3・1・3</small></td><td class="n">7</td><td>不利（成本）</td><td>9/18 決定凍漲到 12 月，應有調幅 12.83%；台電全年估虧損逾 711 億元</td></tr>
<tr><td class="n">8</td><td class="name">11/28 地方選舉<small>3・1・3</small></td><td class="n">7</td><td>有利（政策）</td><td>媒體分析央行不升息的考量含選舉因素；選後的 12 月是電價與利率可能補調整的時間</td></tr>
</tbody></table></div>
<h4>台灣自己的總體數字：外熱內溫</h4>
<div class="kpis">
<div class="kpi"><span class="k"><a class="ind" data-ind="gdp">GDP 年增率</a></span><span class="v">12.93%</span><span class="d">2026 第 2 季，主計總處</span></div>
<div class="kpi"><span class="k"><a class="ind" data-ind="cpi">CPI 年增率</a></span><span class="v">2.04%</span><span class="d">8 月；核心 2.3%</span></div>
<div class="kpi"><span class="k"><a class="ind" data-ind="unemp">失業率</a></span><span class="v">3.33%</span><span class="d">7 月，季調</span></div>
<div class="kpi"><span class="k"><a class="ind" data-ind="signal">景氣對策信號</a></span><span class="v">41 分</span><span class="d">7 月；紅燈連 8 個月</span></div>
<div class="kpi"><span class="k"><a class="ind" data-ind="pmi">製造業 PMI</a></span><span class="v">54.7</span><span class="d">8 月，S&amp;P Global</span></div>
<div class="kpi"><span class="k"><a class="ind" data-ind="retail">零售業營業額</a></span><span class="v">+7.7%</span><span class="d">7 月年增</span></div>
</div>
<div class="how"><span class="lbl">怎麼讀</span>GDP 是兩位數成長、景氣燈號連 8 個月紅燈，但零售只增 7.7%，內需類股今年多為負報酬：成長集中在 AI 出口，這就是央行說的「外熱內溫」。對題材的意義有兩個：內需題材缺少總體數據支持；CPI 在 2% 之上加上景氣過熱，讓央行較難降息。六個數字都是<span class="hd hd-off">官方</span>統計（PMI 為民間調查），判讀是作者<span class="tag inf">推論</span>。</div>
</div>
</details>

<details class="blk" id="c2-tariff">
<summary><span class="h">關稅現況：稅率不高，風險在原產地與赴美投資</span><span class="sum">對等關稅 15% 不疊加、強迫勞動 301 關稅 10%；半導體 232 新方案與 301 產能過剩調查還沒定案。</span></summary>
<div class="body">
<p>到 2026-09-20 為止，台灣拿到的稅率在各國中偏低：對等關稅 15% 且不疊加、強迫勞動 301 關稅 10% 且不疊加、232 條款各項都取得最優惠待遇<span class="hd hd-sys">制度</span>。還沒定案的有兩件：美國商務部長 9 月初說的新半導體關稅方案<span class="hd hd-unc">未確認</span>，以及 301「結構性產能過剩」調查。以下時間線全部整理自行政院「臺美關稅談判」專區<span class="tag src">整理</span>。</p>
<div class="note">三種稅各管各的：對等關稅按國家別課一般商品；232 條款以國家安全為由、按產業別課（半導體、無人機、多晶矽）；301 條款針對特定行為課（強迫勞動、產能過剩）。完整機制見<a class="ind" data-ind="tariff">關稅指標卡</a>。</div>
<div class="timeline">
<div class="ev"><span class="dt">2026-01-14</span><span>美國於 1/14–15 公布半導體 232 條款：特定先進晶片與含該晶片的伺服器、顯示卡課 25%，但 AI 資料中心、研發、消費與車用電子等有廣泛豁免；赴美投資可換免稅配額，配額外適用最優惠稅率 15%。</span></div>
<div class="ev"><span class="dt">2026-02-12</span><span>臺美簽署對等貿易協定：對等關稅由「32%＋原稅率」降為 15% 且不疊加，2,072 項產品豁免。</span></div>
<div class="ev"><span class="dt">2026-07-23</span><span>美國對 60 國公布強迫勞動 301 稅率：台灣 10% 且不疊加（日、韓、瑞士 12.5%），2,231 項豁免。台北時間 7/24 加權指數跌 1,195.97 點，因果未確認。</span></div>
<div class="ev"><span class="dt">2026-08-07</span><span>多晶矽 232 關稅：依投資備忘錄適用優惠待遇。</span></div>
<div class="ev"><span class="dt">2026-08-13</span><span>無人機 232 關稅：台、歐、日、韓、瑞士 15% 不疊加，其他國家 25–100%。</span></div>
<div class="ev"><span class="dt">2026-09 初</span><span>美國商務部長表示正在擬定新的半導體關稅方案、在美製造者可豁免；行政院表示將爭取沿用最惠待遇。細節未確認。</span></div>
<div class="ev"><span class="dt">待公布</span><span>301「結構性產能過剩」調查：媒體預期川習會之後才宣布<span class="hd hd-est">估計</span>。</span></div>
</div>
<dl class="ev3">
<div><dt>機制</dt><dd>關稅由美國進口商繳，再透過砍價、轉單、漲價分攤出去；所以豁免範圍比名目稅率重要。</dd></div>
<div><dt>現在</dt><dd>1–8 月<a class="ind" data-ind="exports">出口</a>年增 44.2%（財政部），已公布的關稅沒有擋住 AI 相關出口。</dd></div>
<div><dt>判讀</dt><dd>風險不在稅率，而在兩件事：原產地認定變嚴（欣興案就是碰到這條線，未來可能要交料號清單、追多層供應商）；豁免和赴美投資綁在一起，台積電美國廠進度會變成談判條件（<a class="ind" data-ind="fdi_out">對外直接投資</a>）。<span class="tag inf">推論</span></dd></div>
</dl>
</div>
</details>

<details class="blk" id="c2-perf">
<summary><span class="h">類股表現：資金從哪裡移到哪裡</span><span class="sum">8 月買 AI 材料與零件；9 月至 9/18 這些族群回跌，資金轉到油電燃氣、金融與半導體。</span></summary>
<div class="body">
<p>最近兩個月的方向很清楚：8 月（大盤 +7.0%）台積電橫盤，資金買波動更大的 AI 材料與零件；9 月至 9/18（大盤 +2.3%）<a class="ind" data-ind="oil">油價</a>破百加上<a class="ind" data-ind="fed">升息</a>預期，8 月的贏家全數回跌，資金轉到油電燃氣、金融與相對落後的半導體。漲跌幅是用證交所類股指數計算的<span class="hd hd-mkt">市場</span>讀數；「為什麼換邊」是作者<span class="tag inf">推論</span>。</p>
<figure class="chart" data-chart="c2_rotate"></figure>
<ul class="list">
<li><b>8 月</b>：7 月底急跌到 39,933 點後，資金沒有回去買台積電（半導體類只漲 2.7%），而是買南亞、台玻、CCL、散熱、被動元件、光學與代工。<a class="ind" data-ind="fini_flow_twse">外資</a> 8 月買超 3,568 億元；8/31 MSCI 季度調整，尾盤成交 3,064 億元、歷史第二大。</li>
<li><b>9 月至 9/18</b>：9/17 的 CCL 降規恐慌是這波回跌最劇烈的一天；9/18 升息落地，外資單日買超 869.9 億元，買的是南亞科、台積電、聯發科。</li>
<li><b>成交結構</b>：半導體占週成交值由 9/4 當週 36.17% 升到 9/18 當週 39.36%，電子零組件由 24.94% 降到 21.88%（<a class="ind" data-ind="sec_share">類股成交占比</a>）。</li>
</ul>
<figure class="chart" data-chart="c2_ytd"></figure>
<div class="how"><span class="lbl">怎麼讀</span>三種情況各代表什麼（強弱可用<a class="ind" data-ind="rs_line">相對強弱線</a>看）：(1) 半導體類漲幅大於大盤＝主線在走，指數會動；(2) 半導體類小於大盤、電子零組件與光電大於大盤＝主線休息、中小型股輪動，指數不太動但個股很熱、處置股變多；(3) 金融與油電燃氣領漲、電子領跌＝避險式輪動，通常伴隨利率或油價事件。9 月屬於第 3 種。</div>
<div class="note">類股指數是市值加權的價格指數（不含配息）：塑膠類幾乎等於南亞、油電燃氣幾乎等於台塑化、玻璃陶瓷幾乎等於台玻。今年<a class="ind" data-ind="dispersion">類股報酬離散度</a>平均 3.71%，高於 2020–2025 各年的 1.97–2.64%，代表類股之間的差距比往年大。互動圖在<a href="#/explorer">輪動探索器</a>。</div>

<details class="blk" id="c2-other">
<summary><span class="h">你可能沒想到的其他因素</span><span class="sum">指數調整與作帳、外資期現貨、隔夜傳導、匯率、籌資與抽籤、融資、選舉、除息與稅制。</span></summary>
<div class="body">
<p>除了產業題材與總體因素，還有八個交易面與制度面的因素，會讓股價在沒有基本面消息時大幅波動<span class="tag add">補充</span>。以第一項為例：被動基金在指數調整日必須在收盤那一盤買賣，8/31 尾盤就成交了 3,064 億元。機制與實例整理自報導<span class="tag src">整理</span>，數字多為<span class="hd hd-mkt">市場</span>讀數。</p>

<thead><tr><th>因素</th><th>機制與實例</th><th>怎麼觀察</th></tr></thead>
<tbody>
<tr><td class="name">指數調整與季底作帳</td><td>MSCI、富時、0050 換股日，被動基金必須在收盤買賣；季底投信要拚績效。8/31 MSCI 調整把盤中跌 880 點拉到只跌 203 點</td><td>MSCI 調整日（2、5、8、11 月底）；季底<a class="ind" data-ind="inst">投信買超</a>榜</td></tr>
<tr><td class="name">外資現貨與期貨要一起看</td><td>外資常一邊賣現貨、一邊放空期貨；空單回補時現貨也會急買。7/17 單日賣超 1,890.4 億元（史上最大）；9/18 買超 869.9 億元，同時台指期淨空單減 2,564 口</td><td><a class="ind" data-ind="fini_flow_twse">外資買賣超</a>、<a class="ind" data-ind="fut_oi">期貨未平倉</a></td></tr>
<tr><td class="name">美股與韓股的隔夜傳導</td><td>台股開盤反映的是前一晚費城半導體、輝達、美光、海力士的漲跌。7/16 海力士 ADR −13%，7/17 台股記憶體跌停</td><td><a class="ind" data-ind="adr">台積電 ADR</a>、<a class="ind" data-ind="sox_rel">費城半導體</a></td></tr>

<details class="blk" id="c2-blind">
<summary><span class="h">盲點與常見誤讀</span><span class="sum">分數不是漲跌預測；新聞熱度不等於影響力；類股指數常常只是一檔股票。</span></summary>
<div class="body">
<p>這一頁最容易被誤用的地方，是把「影響力排序」當成「買進順序」。下面八條是讀題材時最常見的錯誤與沒查到的缺口。</p>
<div class="mis"><b>常見誤讀</b>　分數高＝接下來會漲 → 分數量的是對大盤與資金的影響力；97 分的台積電今年 +58.7%，反而輸給大盤的 +62.9%。</div>
<div class="mis"><b>常見誤讀</b>　新聞多＝影響大 → 資訊服務類 9/14–18 週漲幅全市場第一，但 9/18 成交值只有 24.7 億元、占大盤 0.2%（看<a class="ind" data-ind="sec_share">類股成交占比</a>）。</div>
<div class="mis"><b>常見誤讀</b>　塑膠類 +170.3%＝塑化景氣好 → 那幾乎是南亞一檔，靠的是電子材料；類股指數是市值加權，常常只代表一兩檔股票。</div>
<div class="mis"><b>常見誤讀</b>　營收創新高＝股價會漲 → 台達電 8 月營收歷史第三高，公布後股價跌逾 6%；電腦及週邊類 9 月至 9/18 −2.3%。股價反映的是「和預期差多少」。</div>
<div class="mis"><b>常見誤讀</b>　指數漲＝我的股票漲 → <a class="ind" data-ind="tsmc_w">台積電一檔占 41.48%</a>；7/17 半導體類跌 7.71%，食品類只跌 0.31%。</div>
<div class="blind"><b>盲點</b>　到目前為止，漲的原因是 AI 訂單，急跌的觸發點（7/17、9/11–15）是利率、油價、韓國升息這些外部因素，不是台灣供應鏈的訂單出問題；7/28–29 大跌的原因未確認。<span class="tag inf">推論</span></div>
<div class="blind"><b>盲點</b>　同一套說法會反覆出現（CPO 讓板材降規、AI 發展放慢、記憶體漲過頭）。判斷有沒有變化，看的是訂單與營收數字，不是說法出現的次數；<a class="ind" data-ind="nvda">輝達財測</a>與<a class="ind" data-ind="tsmc_rev">台積電營收</a>目前仍在加速。</div>
<div class="blind"><b>盲點</b>　這次沒查到的項目：9 月面板報價、AI 晶片出口管制的最新變化、集邦第 4 季記憶體合約價預估。面板報價和你的本業直接相關，建議另外補。</div>
</div>
</details>

<template id="tpl-C3-room"><div class="room-lede">
<p class="verdict">截至 2026-09-18：AI 資料中心（AIDC）的建置需求還在擴大，這一半有數據支持；「所以相關股價會繼續漲」這一半不能由前一半推出，價格面有多項讀數偏離常態。本頁示範怎麼檢查這個命題，不預測股價。</p>
<ul class="takeaways">
<li><b>需求還在成長</b>：四大<a class="ind" data-ind="capex_csp">雲端大廠資本支出</a>指引 7 月仍在上修，<a class="ind" data-ind="nvda">輝達</a>下季營收指引 1,080 億美元，<a class="ind" data-ind="tsmc_rev">台積電</a> 8 月營收年增 53.3%。</li>
<li><b>股價是另一件事</b>：股價＝每股盈餘×本益比。建置只影響前半段；本益比看利率、資金與預期已反映多少。台積電 7/16 上修展望，隔天指數跌 6.47%。</li>
<li><b>成長的成分在變</b>：金額裡有一大塊是<a class="ind" data-ind="dram">記憶體漲價</a>，建置越來越靠發債（見<a class="ind" data-ind="credit_spread">融資條件</a>），年增率已開始下降。</li>
<li><b>歷史上的順序</b>：2000、2018–19、2022 三次，都是利率或融資條件先變、龍頭財測再變、股價先跌，月營收年增率過 2–15 個月才轉負。</li>
<li><b>怎麼追</b>：15 個失效訊號現在 0 個警訊、7 個留意。最該盯：大廠第一次下修指引、信用利差急升、輝達財測不如預期、<a class="ind" data-ind="fed">美債殖利率</a>站穩 5%。</li>
</ul>
</div>

<details class="blk" id="c3-split" open>
<summary><span class="h">這個問題要拆成兩句話來檢查</span><span class="sum">需求還在成長：是。股價會不會因此再漲：無法由前一句推出，價格面有多項讀數偏離常態。</span></summary>
<div class="body">
<p>「AIDC 建置還會是相關股價成長的原因嗎？」這句話包了兩個問題，目前的答案不一樣。<b>A．AI 資料中心（AI data center，AIDC）的建置需求還在成長嗎？</b>是，2026 年 7–9 月公布的數字還在上修。<b>B．所以相關股價還會因此上漲嗎？</b>不能從 A 直接推出來。今年 7 月已經發生過一次：台積電（2330）7/16 上修全年展望，隔天加權指數單日跌 6.47%；6/22 到 7/30 指數收盤價回檔 16.4%，同一段時間營收、出口、財測全部在創高。</p>
<div class="tbl-wrap"><table>
<thead><tr><th>問題</th><th>性質</th><th>目前的答案</th><th>依據（日期）</th></tr></thead>
<tbody>
<tr><td class="name">A　需求還在不在成長</td><td>基本面：訂單、營收、出口</td><td>還在成長，而且在上修</td><td>四大雲端 2026 年<a class="ind" data-ind="capex_csp">資本支出</a>指引合計約 7,200–7,450 億美元 <span class="hd hd-est">估計</span>；<a class="ind" data-ind="nvda">輝達（NVIDIA）</a>下季營收指引 1,080 億美元（8/26）；<a class="ind" data-ind="tsmc_rev">台積電 8 月營收</a>年增 53.3%；台灣 8 月<a class="ind" data-ind="exports">出口</a>年增 41.0% <span class="hd hd-off">官方</span></td></tr>
<tr><td class="name">B　股價還會不會因此上漲</td><td>評價與資金面：本益比、利率、誰在買賣</td><td>無法由 A 推出；本頁不預測</td><td>台積電本益比 28.52 倍（9/18；2022 年 1 月高點約 30.9 倍）<span class="hd hd-mkt">市場</span>；<a class="ind" data-ind="fed">聯準會</a> 9/16 升息、美國 10 年期公債殖利率碰到 5%；美股半導體 ETF 距高點 −18.7%（見<a class="ind" data-ind="sox_rel">費半相對強弱</a>）；9 月多檔個股營收創高、當天下跌</td></tr>
</tbody>
</table></div>
<p>機制只有一條：<b>股價＝每股盈餘×本益比</b>。<a class="ind" data-ind="pe">本益比</a>（P/E）是市場願意為每 1 元盈餘付幾元。AIDC 建置影響的是前半段，而且還要看是誰賺到，營收大不等於賺得多。後半段由利率、資金流向、以及好消息已經被反映多少來決定。所以檢查要分三層，每一層看的數據不同：</p>
<div class="tbl-wrap"><table>
<thead><tr><th>層</th><th>要回答什麼</th><th>現在的讀數（2026-09）</th><th>燈號</th></tr></thead>
<tbody>
<tr><td class="name">需求層</td><td>雲端大廠的錢還在不在花、花不花得起：資本支出指引、自由現金流、發債</td><td>指引上修；但 Alphabet、亞馬遜、甲骨文的自由現金流轉負，建置開始靠發債（見<a class="ind" data-ind="credit_spread">融資條件</a>）；TrendForce 估<a class="ind" data-ind="dram">記憶體</a>占 2026 年資本支出 47% <span class="hd hd-est">估計</span></td><td><span class="pill calm">平穩</span>其中兩項留意</td></tr>
<tr><td class="name">傳導層</td><td>錢流到台灣哪些環節；是出貨量增加還是漲價墊高營收；毛利有沒有跟上</td><td>追蹤的 19 家零組件公司有 17 家 8 月<a class="ind" data-ind="rev_monthly">月營收</a>年增超過 30%；但 9 月出現多檔營收創高、當天股價下跌</td><td><span class="pill calm">平穩</span></td></tr>
<tr><td class="name">價格層</td><td>本益比到哪裡、資金擁不擁擠、利率往哪走</td><td>台積電 28.52 倍；台光電（2383）約 76 倍、川湖（2059）約 69 倍、欣興（3037）約 65 倍；<a class="ind" data-ind="sec_share">電子類成交占比</a> 85.6%（9/14 當週）；聯準會升息；費半已先回檔</td><td><span class="pill watch">留意</span></td></tr>
</tbody>
</table></div>
<p>燈號的依據：需求層與傳導層的金額都還在創高、指引都還在上修，所以列平穩；價格層沒有任何一項觸發警戒門檻，但同時有四、五項偏離常態，所以列留意。這是研究報告作者的判讀，不是事實。<span class="tag inf">推論</span></p>
<div class="note">本頁正方、反方都列，兩邊的證據都成立。它不是投資建議，也不預測股價；目的是讓你之後看到新數據時，先分清楚它是在回答 A（需求）還是 B（股價），再對照下面的<b>失效訊號儀表板</b>。板塊之間的輪動見<a href="#/sectors">板塊怎麼分</a>與<a href="#/explorer">輪動探索器</a>，誰在買賣見<a href="#/dest">錢去哪裡</a>的股市分頁。</div>

<details class="blk" id="c3-demand">
<summary><span class="h">需求端：雲端大廠、輝達、博通、美光</span><span class="sum">指引還在上修、下半年比上半年多；但三家大廠自由現金流轉負，市場開始看花下去有沒有營收。</span></summary>
<div class="body">
<p>需求端最近一季的讀數都還在往上。Alphabet（Google 母公司）、亞馬遜（Amazon）、Meta 上修 2026 年<a class="ind" data-ind="capex_csp">資本支出</a>指引，微軟（Microsoft）的下修來自會計變更；<a class="ind" data-ind="nvda">輝達</a>下季營收指引 1,080 億美元。要留意的是錢的來源：Alphabet、亞馬遜、甲骨文（Oracle）的<a class="ind" data-ind="credit_spread">自由現金流</a>（營運現金流減資本支出）已經轉負，建置開始靠發債與增資。</p>
<p>機制：雲端大廠（cloud service provider，CSP）花錢買伺服器、蓋機房，這筆資本支出（capital expenditure，capex）就是台灣 AI 供應鏈營收的源頭；Alphabet 第 2 季約 60% 買伺服器、40% 是機房與網通。看三件事：指引比上一季上修還是下修；資本支出占營運現金流多少；不夠的部分靠什麼補。</p>
<figure class="chart" data-chart="c3_capex"></figure>
<div class="tbl-wrap"><table>

<p>合計：四大 2026 年指引合計 7,200–7,450 億美元 <span class="hd hd-est">估計</span>（TMT Finance，8/18）。上半年實際合計 3,007 億，指引隱含下半年約 4,190–4,440 億，比上半年再多四成左右。年增率各家口徑不同：一個來源估四大年增約 78%；TrendForce 估全球主要 CSP 2026 年年增 98%、2027 年再增 50%。</p>
<div class="how"><span class="lbl">怎麼讀</span>資本支出÷營運現金流超過 100%，代表當期賺的現金不夠付建置，差額要靠借錢或增資。Alphabet 第 2 季約 115%、亞馬遜近四季約 105%、甲骨文單季約 124%、Meta 約 98%（報告自行計算）。這個比率要和<a class="ind" data-ind="credit_spread">信用利差</a>一起看：現金不夠不是問題，借不到才是。</div>
<p>市場的反應已經分化。同樣是上修資本支出，Alphabet 財報隔日收跌 7.38%；微軟盤後漲約 7–9%（Azure 成長加速到 43%）、亞馬遜盤後漲 9.15%（AWS 成長加速到 37%）。市場現在看的不是花多少，而是花下去有沒有對應的營收加速、現金流撐不撐得住。<span class="tag inf">推論</span></p>

<p>廣度：台積電與代工廠以外的 19 家零組件公司裡，17 家年增超過 30%，例外是華通（+6.9%）與嘉澤（+19.6%）。月增為負的有鴻海、英業達、台達電、雙鴻、勤誠、嘉澤；單月月減多半是出貨節奏，要連看 2–3 個月。代工廠營收最大，但營收裡含大量代購的 GPU 與記憶體，毛利率只有個位數；年增最高的也不是營收最大的公司。這一點到股價那一段會再出現。</p>
<p>總體數據同步：8 月出口的電子零組件 322.2 億美元（+58.0%）、資通與視聽產品 331 億（+41.8%），兩類合計占總出口 79.3%；對美國 236.7 億（+20.7%），年增只有整體的一半，要追是 2025 年提前拉貨墊高基期，還是真的放緩。7 月<a class="ind" data-ind="orders">外銷訂單</a> 979.4 億美元（+61.9%），資訊通信類 +89.5%，8 月數字 9/22 公布。<span class="hd hd-off">官方</span></p>

<p>份量有多重：台積電占加權指數 41.48%（8/31，見<a class="ind" data-ind="tsmc_w">台積電權重</a>）。研究報告把前 40 大權值股中的 21 檔歸為 AI 硬體鏈，合計約 65.1%；對照 10 檔金控合計約 6.6%。<span class="hd hd-est">估計</span>（自行加總，分類有主觀成分）<span class="tag add">補充</span></p>

<details class="blk" id="c3-pro">
<summary><span class="h">正方：為什麼說 AIDC 仍是成長原因（7 點）</span><span class="sum">共同點是金額還在創高、指引還在上修。它們回答的是問題 A（需求），不是問題 B（股價）。</span></summary>
<div class="body">
<p>正方的七項證據都站得住，共同點是「金額還在創高、指引還在上修」。讀的時候記得：它們回答的是問題 A。</p>
<ol class="steps">
<li><b><a class="ind" data-ind="capex_csp">資本支出</a>指引還在上修，而且下半年比上半年多</b>：四大上半年實際 3,007 億、指引隱含下半年 4,190–4,440 億美元；Alphabet 說 2027 年「顯著增加」、亞馬遜說 AWS 2027 年產能大致已被預訂（7 月財報季）。</li>
<li><b>最上游供不應求，供應商自己也在加碼</b>：<a class="ind" data-ind="tsmc_rev">台積電（2330）</a>資本支出上修到 600–640 億美元、CoWoS 緊到限制客戶成長（7/16）；<a class="ind" data-ind="nvda">輝達</a>對供應商的供給與產能承諾 2,790 億美元（8/26）；美光稱吃緊延續到 2027 年之後。</li>
<li><b>機櫃單價上升，代工廠營收跟著放大</b>：TrendForce 估 2027 年 NVL72 機櫃出貨量年增逾 50%、產值逾 7,100 億美元（+214%），新一代 Vera Rubin 機櫃單價約為 GB300 的兩倍 <span class="hd hd-est">估計</span>；廣達（2382）、緯創（3231）8 月營收年增 177%、166%。</li>
<li><b>GPU 與自研晶片（ASIC，雲端大廠自己設計的專用晶片）同時成長，不是互相取代</b>：博通 AI 營收單季 167 億美元（+221%）；超微（AMD）資料中心營收 +107%；緯穎（6669）稱 GPU 與 ASIC 專案同步成長。</li>
<li><b>買家從四大雲端擴散到新雲端、主權、企業</b>：輝達「AI 雲、工業、企業」客戶單季 403 億美元（+138%），占資料中心營收 45%；甲骨文已簽約未認列的營收 6,640 億、CoreWeave 在手訂單 1,042 億美元（這是存量，不是當期營收）；Azure +43%、AWS +37%、Google Cloud +82%。</li>
<li><b>規格升級讓每台機櫃用到的台灣零件更值錢</b>：水冷機櫃價格約為氣冷的 4 倍，2026 年 AI 伺服器液冷滲透率約 76% <span class="hd hd-unc">未確認</span>（二手）；台光電（2383）高階銅箔基板（CCL，電路板的底材）出貨提高、8 月營收年增 130%；欣興（3037）稱 ABF 載板持續供不應求。</li>
<li><b>總體數據同步確認</b>：8 月<a class="ind" data-ind="exports">出口</a> +41.0%、電子零組件 +58.0%；7 月<a class="ind" data-ind="orders">外銷訂單</a>資訊通信類 +89.5%；主計總處把 2026 年<a class="ind" data-ind="gdp">經濟成長率</a>預測上修到 11.05%。<span class="hd hd-off">官方</span></li>
</ol>
</div>
</details>

<details class="blk" id="c3-con">
<summary><span class="h">反方：十個風險</span><span class="sum">年增率在下降、金額有一大塊是記憶體漲價、建置開始靠舉債、供應商替客戶擔保、本益比回到 2022 年初。</span></summary>
<div class="body">
<p>反方的重點不是「需求是假的」，而是三件事：成長的成分在變（越來越多來自漲價而不是台數、越來越靠借錢而不是自有現金）、年增率開始下降、價格已經反映很多。前九點是基本面風險，第十點是價格面。</p>
<ol class="steps">
<li><b>年增率在下降</b>（金額創高，但年增率的變化，也就是二階導數，已轉負）：<a class="ind" data-ind="nvda">輝達</a>本季營收年增 106%，對 2028 會計年度的說法約 +70%；TrendForce 估 CSP <a class="ind" data-ind="capex_csp">資本支出</a> 2026 年 +98% → 2027 年 +50%；主計總處預測 <a class="ind" data-ind="gdp">GDP</a> 由上半年 14.15% 降到第 4 季 5.37%；8 月對美<a class="ind" data-ind="exports">出口</a> +20.7%，只有整體的一半。</li>
<li><b>金額成長有一大塊是記憶體漲價，不是台數</b>：TrendForce 估記憶體（DRAM＋NAND）占 CSP 資本支出 2026 年 47% → 2027 年 68%，伺服器 DRAM 合約價 2026 年估漲約 270% <span class="hd hd-est">估計</span>；亞馬遜上修指引的理由之一就是記憶體成本。見<a class="ind" data-ind="dram">記憶體報價</a>。<span class="tag add">補充</span></li>
<li><b>雲端大廠自由現金流轉負、開始大舉融資</b>：Alphabet −59 億、亞馬遜近四季 −76 億、甲骨文單季 −54 億美元；Meta 明說要提高負債比重；高盛估 2027 年逾三分之一資本支出要靠發債 <span class="hd hd-est">估計</span>（二手引述）。見<a class="ind" data-ind="credit_spread">融資條件</a>。</li>
<li><b>循環融資：供應商用自己的資產負債表支撐客戶</b>。輝達為 OpenAI 的機房租約提供 1,050 億美元信用支持、持有未上市公司等股權投資 990 億美元、承諾買下夥伴賣不掉的雲端產能，收款天數由 45 天拉長到 60 天；博通與 Apollo、Blackstone 為 Anthropic 的部署做了首批 350 億美元的融資平台。</li>
<li><b>投資報酬率與折舊的質疑</b>：美國國家經濟研究局 2026 年 2 月研究稱約 90% 企業回報 AI 對生產力沒有影響（維基百科轉述）；微軟把機房耐用年限由 15 年拉長到 25 年，帳面折舊變小、現金一樣要付；標普點出 AI「現金轉化程度相對較低」。</li>
<li><b>模型效率事件</b>：2025-01-27 DeepSeek 事件，輝達單日跌約 17%；台股春節後開盤日 2025-02-03 跌 3.53%，到 2/7 幾乎補回。</li>
<li><b>電力、變壓器、機房外殼讓出貨遞延</b>：TrendForce 估 2030 年全球資料中心電力缺口 268GW <span class="hd hd-est">估計</span>；CoreWeave 簽約電力 4.2GW、實際上線 1.5GW。對台廠的意義：訂單不會消失，但認列時間往後推，月營收會出現「不是需求不好」的月減。</li>
<li><b>設計改變造成台廠之間的份額重分配</b>：較受惠 ASIC 趨勢的說法有緯穎（6669）、智邦（2345）、金像電（2368）、雙鴻（3324）；較綁輝達機櫃的有鴻海（2317）、廣達（2382）、緯創（3231）、奇鋐（3017）、川湖（2059）。TrendForce 稱 Google 2027 年可能把部分封裝轉到英特爾（Intel）的 EMIB-T。</li>
<li><b>關稅與出口管制</b>：2026 年 1 月美國依 232 條款對特定先進運算晶片課 25%，供美國資料中心等用途者豁免；輝達的展望完全不計中國資料中心營收；7/24 對台 10% 關稅的細節與是否疊加 <span class="hd hd-unc">未確認</span>。見<a class="ind" data-ind="tariff">美國關稅</a>與<a href="#/themes">熱門題材</a>。</li>
<li><b>評價、集中度與利率</b>：見下圖與下面兩段。</li>
</ol>
<figure class="chart" data-chart="c3_pe"></figure>
<p>第十點的讀法：代工廠<a class="ind" data-ind="pe">本益比</a>約 15–20 倍，零組件與載板 37–78 倍，台積電（2330）28.52 倍（2022 年 1 月高點約 30.9 倍、同年 10 月低點約 12.6 倍）；大盤 8 月底 25.62 倍（6 月底 31.78 倍）。市場付高倍數買的是有訂價權、毛利率高、規格還在升級的環節，不是營收最大的環節。高倍數也代表：成長率只要比預期慢一點，倍數收縮的幅度會比盈餘下修大得多。<span class="hd hd-mkt">市場</span> <span class="tag inf">推論</span></p>
<p>集中度：<a class="ind" data-ind="tsmc_w">台積電權重</a> 41.48%（8/31）、<a class="ind" data-ind="sec_share">電子類成交占比</a> 85.6%（9/14 當週；媒體引述的長期平均約 70%）。利率與資金：<a class="ind" data-ind="fed">聯準會</a> 9/16 升息 1 碼至 3.75–4.00%，美國 10 年期公債殖利率 9/15–16 碰到 5%；<a class="ind" data-ind="sox_rel">費半相對強弱</a>轉弱，美股半導體 ETF（SOXX）距 52 週高點 −18.7%、同日 S&amp;P 500 ETF 只有 −2.3%，韓國 KOSPI 距 6 月高點 −26.5%，而加權指數距收盤高點只差 1.2%；7 月<a class="ind" data-ind="fini_flow_twse">外資</a>賣超 7,389 億元、<a class="ind" data-ind="inst">投信</a>買超 2,569 億元（今年以來外資賣超 1.41 兆元、投信買超 0.76 兆元，證交所口徑，至 9/18）；<a class="ind" data-ind="adr">台積電 ADR 溢價</a>約 +11.8% <span class="hd hd-est">估計</span>。國際上的同類資產已先轉弱，台股還在高點附近，這個落差要追。外資大賣而指數不跌，代表本地資金在接；能接多久，要看<a href="#/local">本地有多少錢</a>。</p>
</div>
</details>

<details class="blk" id="c3-price">
<summary><span class="h">「營收還在成長」不等於「股價還會漲」</span><span class="sum">股價＝盈餘×本益比。2022 年台積電盈餘增三成、本益比少六成，股價腰斬；三次歷史都是股價比月營收早轉向。</span></summary>
<div class="body">
<p>營收成長要變成股價上漲，中間隔著三關，每一關都可能斷：營收要變成盈餘（看毛利率）、盈餘要乘上本益比（看預期與利率）、還要有人願意買（看資金）。2000、2018–19、2022 三次修正，股價都比<a class="ind" data-ind="rev_monthly">月營收</a>年增率早 2–15 個月轉向。</p>
<ol class="steps">
<li><b>營收成長不一定等於盈餘成長</b>。代工廠的營收被 GPU 與記憶體單價墊高，那一塊接近代收代付，毛利金額未必等比例增加。台達電（2308）第 2 季營收季增 14.93%，毛利率卻季減 1.36 個百分點（二手）；<a class="ind" data-ind="nvda">輝達</a>也預告毛利率由 75% 降到 71–72%。</li>
<li><b>盈餘成長不一定等於股價上漲</b>。<a class="ind" data-ind="pe">本益比</a>反映兩件事：市場對未來幾年成長的預期，以及無風險利率。成長率由 +100% 降到 +50% 仍然很高，但只要低於市場原先的預期（這個差距就是「預期差」），倍數就會縮；<a class="ind" data-ind="fed">利率</a>上升時，越遠期的獲利折現後越不值錢，高本益比的股票受影響最大。</li>
<li><b>還有資金面</b>：<a class="ind" data-ind="fini_flow_twse">外資</a>要不要賣、投信與 <a class="ind" data-ind="etf">ETF</a> 有沒有錢接、<a class="ind" data-ind="margin">融資</a>有沒有被迫賣出。2026 年 7 月外資賣超 7,389 億元，投信買超 2,569 億元接不住，指數由 6/30 到 7/30 跌 13.4%。</li>
</ol>
<div class="note">用工程的說法：營收金額是位置，年增率是一階導數，年增率的變化是二階導數。股價反映的是對未來的預期，所以對二階導數、以及它和原先預期的差距最敏感。金額創新高、年增率仍為正，都可以和股價下跌同時存在。<span class="tag inf">推論</span></div>
<figure class="chart" data-chart="c3_2022"></figure>
<h4>眼前的例子：2026 年的「好消息、壞反應」</h4>
<div class="tbl-wrap"><table>
<thead><tr><th>日期</th><th>基本面消息</th><th>股價反應</th></tr></thead>
<tbody>
<tr><td>7/16–17</td><td><a class="ind" data-ind="tsmc_rev">台積電（2330）</a>上修全年成長到「略高於 40%」、資本支出到 600–640 億美元</td><td>7/17 加權指數 45,624.98 → 42,671.27（−6.47%）；當日導火線 <span class="hd hd-unc">未確認</span></td></tr>
<tr><td>7/22 起</td><td>Alphabet 營收與雲端優於預期，但上修<a class="ind" data-ind="capex_csp">資本支出</a>、自由現金流轉負</td><td>Alphabet 隔日 −7.38%；台股 7/27 到 7/30 跌 8.5%</td></tr>
<tr><td>7/29–30</td><td>微軟、亞馬遜財報後盤後分別漲約 8%、9%</td><td>7/31 加權指數單日 +7.98%（時間吻合，因果是推論）</td></tr>
<tr><td>9/8</td><td>川湖（2059）8 月營收年增 344%，連六個月創高</td><td>盤中跌近 9%；外資評語是「符合預期」</td></tr>
<tr><td>9/8</td><td>緯穎（6669）8 月營收創單月新高</td><td>當日收跌 6.02%，三大法人連七日賣超</td></tr>
<tr><td>9/10 前後</td><td>台達電 8 月營收創同期新高</td><td>股價下跌；分析指市場在意毛利率下滑，且本益比約 55 倍</td></tr>
</tbody>
</table></div>
<div class="how"><span class="lbl">怎麼讀</span>好消息出來股價反而跌的次數變多，代表好消息已經在價格裡。這不等於行情結束（7/30 之後指數又漲了 18%），而是股價對「符合預期」已經沒有反應，要「超出預期」才會漲。</div>
<h4>三個歷史案例：當時先出現哪些訊號</h4>
<details class="sub"><summary>2000 年電信與光纖泡沫：指數見頂比營收年增率轉負早約 15 個月</summary><div class="body">
<dl class="ev3">
<div><dt>先出現的訊號</dt><dd>聯準會 1999–2000 年持續升息，2000-03-21 再升一次並出現殖利率曲線倒掛；2000-03-20《Barron's》逐家計算網路公司的現金還能燒多久；美國電信業五年投入逾 5,000 億美元鋪光纖，大多靠舉債與設備商融資，買家的自由現金流是負的，產能成長遠超過需求。</dd></div>
<div><dt>股價反應</dt><dd>加權指數收盤高點 10,202.20（2000-02-17）到收盤低點 3,446.26（2001-10-03），跌約 66%；2000 年全年 −43.85%。台積電股價（未還原權值）由 2 月高點 222 元跌到 12 月低點 74.5 元。<span class="hd hd-mkt">市場</span></dd></div>
<div><dt>營收何時才轉負</dt><dd>台積電 2000 年每個月營收年增率都在 +69% 到 +168% 之間（全年 +127.3%，含合併世大），到 2001 年 5 月才轉負（−21.8%），8 月最深 −43.8%。<span class="hd hd-off">官方</span></dd></div>
</dl>
<p>和現在比：相同的是建置由少數大買家驅動、開始靠舉債、供應商提供融資或擔保、央行在升息。不同的是當年的買家本業不賺錢，現在四大雲端本業現金流很強（亞馬遜近四季營運現金流 1,614 億美元）、雲端營收在加速。但新雲端與模型公司這一層的體質，比較像當年的新創電信商。<span class="tag inf">推論</span></p>
</div></details>
<details class="sub"><summary>2018–2019 年雲端資本支出消化期：大客戶一句「轉趨謹慎」就成立</summary><div class="body">
<dl class="ev3">
<div><dt>先出現的訊號</dt><dd>輝達 2018-11-15 給的下季營收指引只有 27.0 億美元，理由是加密貨幣熱潮後通路庫存過多；2019-01-28 再下修到 22.0 億，並說資料中心有若干案子在季末沒有成交，因為「客戶轉趨謹慎」。同時有聯準會升息縮表與美中貿易戰。<span class="hd hd-off">官方</span></dd></div>
<div><dt>股價反應</dt><dd>加權指數 2018-10-01 收 11,051.80，10-26 收 9,489.18（−14.1%），其中 10-11 單日 −6.31%；台積電 9 月高點 268 元到 10 月低點 217 元（−19%）。</dd></div>
<div><dt>營收何時才轉負</dt><dd>台積電月營收年增率 2019 年 1–5 月連五個月為負，3 月最差（−23.1%），6 月轉正。股價低點落在 2018 年 10 月到 2019 年 1 月，早於營收最差的月份。</dd></div>
</dl>
<p>教訓：消化期不需要需求消失，只要大客戶說先緩一緩就成立，持續約 2–3 季；股價領先營收約 1–2 季。當時雲端資本支出年增率降到接近零的數列，報告標為記憶、未查證 <span class="hd hd-unc">未確認</span>。</p>
</div></details>
<details class="sub"><summary>2022 年庫存修正：每個月營收都成長，股價腰斬</summary><div class="body">
<dl class="ev3">
<div><dt>先出現的訊號</dt><dd>聯準會 2022 年 3 月起快速升息，美國 10 年期殖利率由年初約 1.5% 升到 10 月約 4.2%；消費電子庫存升高、記憶體報價年中轉跌、輝達與美光 6–8 月預警。這一段報告標為記憶、未逐項查證 <span class="hd hd-unc">未確認</span>。</dd></div>
<div><dt>股價反應</dt><dd>加權指數收盤高點 18,526.35（2022-01-04）到 12,666.12（2022-10-25），−31.6%；台積電 688 元到 370 元（−46%），本益比由約 30.9 倍降到約 12.6 倍。<span class="hd hd-mkt">市場</span></dd></div>
<div><dt>營收何時才轉負</dt><dd>2022 年每個月營收年增率都是正的（+18.5% 到 +65.3%），全年 +42.6%。用本益比回推，近四季每股盈餘約由 22 元升到 29 元 <span class="hd hd-est">估計</span>。</dd></div>
</dl>
<p>這次下跌幾乎全部來自本益比收縮，而且發生在盈餘還在成長的時候。今天的相似處：聯準會剛升息、10 年期殖利率碰 5%、台積電本益比 28.5 倍回到 2022 年初的水準。不同處：2022 年手機與 PC 的終端需求正在轉弱，現在 AI 需求仍供不應求。<span class="tag inf">推論</span></p>
</div></details>
<h4>三次的共同順序</h4>
<ol class="steps">
<li>利率或融資條件先變：升息、<a class="ind" data-ind="credit_spread">信用利差</a>擴大、借錢的管道關閉。</li>
<li>龍頭公司的下一季財測，或客戶的一句「轉趨謹慎」先變；這時營收數字還很好看。</li>
<li>股價先跌，跌的是本益比。</li>
<li>月營收年增率過 2–15 個月才轉負；等它轉負時，股價通常已經跌完大半，甚至開始回升。</li>
</ol>
<p>所以月營收是同時到落後的指標。想提早知道，要看下一個區塊的領先指標。</p>
</div>
</details>

<details class="blk" id="c3-dash">
<summary><span class="h">失效訊號儀表板：15 個指標</span><span class="sum">領先 8、同時 5、落後 2。現在 0 個警訊、7 個留意；領先指標有 3 個以上到警訊，股價那一半才算有失效風險。</span></summary>
<div class="body">
<p>現在（2026-09-18）15 個指標裡警訊 0 個、留意 7 個、平穩 8 個。判讀規則：<b>領先指標 8 個裡有 3 個以上同時到警訊</b>，才算問題 B（股價）出現失效風險；<b>同時指標開始轉弱</b>，才算問題 A（需求）出現失效。不要只看單一指標。門檻都是研究報告建議的數值 <span class="hd hd-est">估計</span>，燈號是作者判讀 <span class="tag inf">推論</span>，請依自己的觀察調整。</p>
<div class="tbl-wrap"><table>
<thead><tr><th>指標</th><th>類別</th><th>警戒門檻</th><th>現在讀數（日期）</th><th>燈號</th></tr></thead>
<tbody>
<tr><td class="name">L1　<a class="ind" data-ind="capex_csp">四大雲端資本支出指引</a>的修正方向</td><td>領先</td><td>任一家因非會計因素下修全年指引＝留意；兩家以上、或出現「2027 年持平／放緩」＝警訊</td><td>3 家上修、1 家持平（扣除會計變更）；Alphabet 稱 2027 年顯著增加（7 月）</td><td><span class="pill calm">平穩</span></td></tr>

<tr><td class="name">L3　美國公司債<a class="ind" data-ind="credit_spread">信用利差</a></td><td>領先</td><td>投資級升破 1.2%、高收益升破 4.5%</td><td>投資級 0.78%、高收益 2.70%（9/17）</td><td><span class="pill calm">平穩</span></td></tr>

<p>燈號依據：沿用研究報告的判讀，改寫成本站三種語意（沒有觸發門檻＝平穩；偏離常態或接近門檻＝留意；觸發門檻＝警訊）。兩處和報告不同：L6 報告列平穩並加註「對下游毛利是壓力」，本頁改列留意，因為 +270% 屬極端值，而且它就是「金額不等於台數」的來源，但失效門檻並未觸發；L7 報告評在留意與警訊之間，比值相對 200 日均線的位置沒有讀數，本頁先列留意。信用利差的門檻是報告依記憶中的歷史水準抓的，請在 FRED 圖上核對。<span class="tag inf">推論</span></p>
<p>讀數的硬度：L1、L2、L4、C1–C4、G1、G2 來自公司財報與政府統計 <span class="hd hd-off">官方</span>；L3、L5、L7、L8、C5 是交易所與報價 <span class="hd hd-mkt">市場</span>；L6 與 ADR 溢價是研調機構或自行換算 <span class="hd hd-est">估計</span>。</p>
<div class="how"><span class="lbl">怎麼讀</span>最該盯的四個：L1（第一次有雲端大廠下修指引）、L3（信用利差由低點快速走高）、L4（輝達財測低於預期，或收款天數再拉長）、L5（10 年期殖利率站穩 5%）。歷史上這幾類訊號都比月營收早 2–15 個月。節奏：每月 10 日前看 C1–C3；每月 7–9 日與 20 日前後看 C4；每天花一分鐘看 L3、L5、L7、C5；每季財報季（1、4、7、10 月底與 2、5、8、11 月下旬）更新 L1、L2、L4。</div>
<p>另有五項沒有固定數列、要靠新聞追：AI 機櫃出貨預估的修正方向、ABF 載板與銅箔基板的報價與交期、電力設備交期與併網排隊、企業採用率與生產力調查、CoWoS 的稼動與份額。可勾選的版本放在<a href="#/practice">判讀與練習</a>，近期日期見<a href="#/time">時間軸與日曆</a>。</p>

<details class="blk" id="c3-rotate">
<summary><span class="h">AIDC 主線之內，資金怎麼輪動</span><span class="sum">資金跟著最缺貨、最能漲價的環節走；2025 年零組件大勝代工廠，2026 年第 3 季反過來。</span></summary>
<div class="body">
<p>「AI 概念股」不是一起漲跌的一群。2025 年電子零組件類 +69.4%，營收最大的電腦及週邊類（代工廠）只有 +12.3%；2026 年第 3 季至今反過來，代工廠 +15.8%、電子零組件 −11.2%。這段期間資金沒有離開台股，而是從最貴的環節移到較便宜的環節與非電子。<span class="hd hd-mkt">市場</span> <span class="tag inf">推論</span></p>
<figure class="chart" data-chart="c3_stage"></figure>
<ul class="list">
<li><b>前面漲最多、本益比最高的，回檔最深</b>：6/30 到 7/30 電子零組件 −30.5%、光電 −27.0%，是大盤（−13.4%）的兩倍以上；金融 −0.2%，航運與營建小漲。</li>
<li><b>第 3 季至今是補漲，加上資金暫時停放</b>：代工廠 +15.8%（媒體稱為「老 AI」）、金融 +16.0%、航運 +15.6%、塑膠 +33.1%。</li>
<li><b>類股名稱會誤導</b>：塑膠類今年以來 +170.3%，不是因為塑膠景氣。南亞（1303）有銅箔基板、玻纖布等電子材料事業，並持有南亞科（2408）與南電（8046）；成分股貢獻的拆解 <span class="hd hd-unc">未確認</span>。<span class="tag add">補充</span></li>
<li><b>主線很強時，非主線不是輪到上漲，而是資金被調走</b>：2025 年未含電子股指數只有 +1.9%，水泥 −18.2%、航運 −10.8%。</li>
</ul>
<h4>題材擴散的五條常見路徑</h4>
<ol class="steps">
<li><b>跟著瓶頸走</b>：哪個環節最缺、最有漲價能力，資金就去哪。GPU → CoWoS 封裝 → 高頻寬記憶體（HBM）→ 液冷 → 銅箔基板與玻纖布 → ABF 載板 → <a class="ind" data-ind="dram">DRAM／NAND</a> → 電力與變壓器 → 測試介面。瓶頸解除的環節，股價通常比營收早轉弱。</li>
<li><b>龍頭到二三線</b>：龍頭本益比拉高後（台光電（2383）約 76 倍），資金找同一個故事、倍數較低的公司。後期特徵是股本小、基本面只沾到邊的公司漲最多。</li>
<li><b>從已反映的營收，到預期中的規格升級</b>：早期漲的是營收真的跳升的公司；後期漲的是下一代規格（共同封裝光學 CPO、800V 高壓直流供電、M9–M10 板材、玻璃基板），營收在 1–2 年後，對利率更敏感。</li>
<li><b>上游與下游來回</b>：拉開的評價差距本身就是輪動的理由（代工廠約 15 倍對零組件 37–78 倍）。</li>
<li><b>外溢到非電子分類</b>：南亞（塑膠類）、華新（1605，電器電纜類）因電子材料或持股沾上題材。</li>
</ol>
<div class="timeline">
<div class="ev"><span class="dt">2026-02</span><span>電路板與銅箔基板：AI 伺服器板材升級、低軌衛星</span></div>
<div class="ev"><span class="dt">2026-04</span><span>液冷散熱（奇鋐（3017）、雙鴻（3324）、健策（3653））：液冷滲透率與水冷板單價</span></div>
<div class="ev"><span class="dt">2026-05-29</span><span>代工廠集體漲停（鴻海（2317）+9.89%）：戴爾（Dell）財報 AI 伺服器年增 757%；當日外資買超 803.56 億元</span></div>
<div class="ev"><span class="dt">2026-07-03</span><span>銅箔基板下半年漲價題材：玻纖布缺料、M9–M10 升級</span></div>
<div class="ev"><span class="dt">2026-07 中下旬</span><span>全面回檔，零組件最重：Alphabet 資本支出遭質疑、<a class="ind" data-ind="fini_flow_twse">外資</a>單月賣超 7,389 億元</span></div>
<div class="ev"><span class="dt">2026-09-01</span><span>探針卡、聯發科（2454）概念股：輝達認購聯發科可轉債；MSCI 季度調整生效</span></div>
<div class="ev"><span class="dt">2026-09-08</span><span>光通訊全面下跌（聯亞（3081）−6.68%），川湖（2059）、緯穎（6669）營收創高卻下跌；測試介面的穎崴（6515）逆勢上漲</span></div>
<div class="ev"><span class="dt">2026-09-18</span><span>記憶體相關個股帶動指數 +1.93%</span></div>
</div>
<p>2023–2025 年的順序（代工廠與散熱 → 重電與 CoWoS 設備 → 液冷、機殼滑軌、電源 → 電路板、ASIC、光通訊 → 記憶體、測試介面、ABF 載板）在報告裡標為記憶、未查證 <span class="hd hd-unc">未確認</span>，請用股價自行驗證。要驗證，<a href="#/explorer">輪動探索器</a>有站方做的 19 個 AI 族群籃子（台積電、封測、測試介面、ASIC、伺服器組裝、散熱、電路板與銅箔基板、電源、記憶體、重電等），可以直接看<a class="ind" data-ind="rs_line">相對強弱線</a>與<a class="ind" data-ind="dispersion">離散度</a>。輪動的一般原因（評價差、事件、利率、籌碼、政策）在<a href="#/sectors">板塊怎麼分</a>有完整說明。</p>
</div>
</details>

<details class="blk" id="c3-diy">
<summary><span class="h">可以自己動手做的探索</span><span class="sum">可以探索，資料都是公開的。八個練習各對應前面一個判讀；第 2、3、4 項在輪動探索器已有現成的圖。</span></summary>
<div class="body">
<p>「有辦法探索嗎？」可以，用到的都是公開資料。下面八個探索各對應前面的一個判讀；其中第 2、3、4 項在<a href="#/explorer">輪動探索器</a>已經有現成的圖，其餘要自己建表。含陷阱的完整版本放在<a href="#/practice">判讀與練習</a>。</p>
<ol class="steps">
<li><b>各族群<a class="ind" data-ind="rev_monthly">月營收</a>年增率，看誰先轉折</b>：自訂 6–8 個籃子，每籃算「營收加總後」的年增率，再取三個月平均；另畫年增率減去三個月前的年增率，看加速或減速。陷阱是基期、農曆年、記憶體漲價墊高代工廠營收。</li>
<li><b>族群相對大盤的<a class="ind" data-ind="rs_line">強弱線</a></b>：族群指數÷加權指數。加權指數<a class="ind" data-ind="tsmc_w">四成是台積電</a>，「相對大盤」幾乎等於「相對台積電」，建議同時用未含電子股指數當分母。</li>
<li><b><a class="ind" data-ind="sec_share">成交占比</a>是否過度集中</b>：電子類成交金額÷各大類加總，再拆半導體、電子零組件、電腦及週邊。占比逼近 85% 而指數漲不動，代表擁擠；股價上漲本身也會推高占比，要用 5 日或 20 日平均。</li>
<li><b>扣掉大盤後的相關性</b>：各族群報酬先減掉大盤，再算 60 日滾動相關係數。平常各有各的消息、相關性不高；如果突然一起升到接近 1 而且同步下跌（像 2026 年 7 月），代表市場賣的是「AI」這個共同因子，或單純在降槓桿。</li>
<li><b><a class="ind" data-ind="capex_csp">雲端大廠指引</a>修正表</b>：公司×季度，記錄當季資本支出、全年指引上下緣、修正方向、營運現金流、自由現金流、新增舉債、對下一年的用詞，外加財報隔日股價反應。</li>
<li><b>「好消息、壞反應」日誌</b>：追蹤 20–30 檔個股，記錄營收創高或指引上修後，隔日相對大盤為負的比例。比例升高，代表預期已經飽和。</li>
<li><b><a class="ind" data-ind="pe">本益比</a>對營收年增率的散佈圖</b>：右下角（成長高、倍數低）多半是低毛利的代工；左上角（成長普通、倍數很高）是市場在預付未來的規格升級。證交所本益比遇除權會失真。</li>
<li><b><a class="ind" data-ind="adr">台積電 ADR 溢價</a>對<a class="ind" data-ind="fini_flow_twse">外資買賣超</a></b>：溢價＝ADR 價格×匯率÷5÷台積電收盤價−1。溢價擴大而外資在台股賣超，代表海外資金偏好買 ADR、不願匯入台灣；兩者同步回落，代表海外熱度整體降溫。</li>
</ol>
<p class="src">資料入口：<a href="https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20260918&amp;type=IND&amp;response=json" target="_blank" rel="noopener">證交所類股指數</a>、<a href="https://www.twse.com.tw/rwd/zh/afterTrading/BFIAMU?date=20260918&amp;response=json" target="_blank" rel="noopener">類股成交金額</a>、<a href="https://www.twse.com.tw/rwd/zh/afterTrading/BWIBBU_d?date=20260918&amp;selectType=ALL&amp;response=json" target="_blank" rel="noopener">個股本益比</a>、<a href="https://openapi.twse.com.tw/v1/opendata/t187ap05_L" target="_blank" rel="noopener">上市公司月營收</a>、<a href="https://investor.tsmc.com/english/monthly-revenue/2026" target="_blank" rel="noopener">台積電月營收</a>、<a href="https://fred.stlouisfed.org/series/BAMLC0A0CM" target="_blank" rel="noopener">FRED 信用利差</a>。證交所對頻繁連線會擋，連續抓取請每次間隔 3–5 秒。</p>
</div>
</details>

<details class="blk" id="c3-blind">
<summary><span class="h">盲點與常見誤讀</span><span class="sum">月營收是同時到落後指標；金額不等於台數；利差低不等於安全；輝達同時是客戶的股東、擔保人與供應商。</span></summary>
<div class="body">
<p>這一頁最容易讀錯的地方，是把回答問題 A 的數字拿去回答問題 B。下面九條，前五條是常見誤讀，後四條是沒問到但不看會誤判的事。</p>
<div class="mis"><b>常見誤讀</b>　營收創新高，所以股價會漲 → <a class="ind" data-ind="rev_monthly">月營收</a>是同時到落後指標。2000 年與 2022 年<a class="ind" data-ind="tsmc_rev">台積電（2330）</a>每個月營收年增率都是正的，股價仍然腰斬；2000 年指數見頂比營收年增率轉負早約 15 個月。</div>
<div class="mis"><b>常見誤讀</b>　<a class="ind" data-ind="capex_csp">資本支出</a>金額創新高就是利多 → 股價反應的是比預期多還是少、錢從哪來。微軟「下修 150 億美元」是會計變更，不是少花；Alphabet 上修後隔日跌 7.38%。</div>
<div class="mis"><b>常見誤讀</b>　<a class="ind" data-ind="nvda">輝達</a>的供給承諾 2,790 億美元證明需求 → 那是輝達對供應商的承諾，不是客戶對輝達的承諾；需求轉弱時，它會變成存貨損失的來源。</div>
<div class="mis"><b>常見誤讀</b>　<a class="ind" data-ind="credit_spread">信用利差</a>低＝安全；AI 是產業趨勢，跟<a class="ind" data-ind="fed">利率</a>無關 → 利差低只表示壞消息還沒被定價，它用來看轉折，不是看水準。三個歷史案例最先變的都是利率或融資條件，而台股 AI 股的邊際買家與評價基準都在美國。</div>
<div class="mis"><b>常見誤讀</b>　<a class="ind" data-ind="dram">記憶體漲價</a>全是 AI 利多 → 對南亞科（2408）、華邦電（2344）是利多，對代工廠與品牌廠是成本。</div>
<div class="blind"><b>盲點</b>　金額不等於台數。TrendForce 估記憶體占雲端大廠資本支出 2026 年 47%、2027 年 68%；NVL72 機櫃 2027 年出貨量估 +50%、產值卻 +214%，差距主要是單價。對代工廠是營收放大、毛利率被稀釋。<span class="hd hd-est">估計</span> <span class="tag add">補充</span></div>
<div class="blind"><b>盲點</b>　輝達同時是客戶的股東、擔保人與供應商（1,050 億美元租約信用支持、990 億美元股權投資），營收的一部分來自它自己支持的客戶。<span class="tag add">補充</span></div>
<div class="blind"><b>盲點</b>　口徑。各家會計年度不同（微軟到 6 月、甲骨文到 5 月）；資本支出含不含融資租賃各家不一；合資與表外融資（Meta 與 BlackRock）會讓帳上資本支出低估實際建置；客戶預付款會美化營運現金流。證交所本益比遇除權會失真（緯穎（6669）9/2 除權後顯示 6.84 倍，不能用）。<span class="tag add">補充</span></div>
<div class="blind"><b>盲點</b>　<a class="ind" data-ind="gdp">GDP</a> 成長 11% 不代表股市安全。股市領先 GDP，不是反過來；而且這 11% 高度集中在 AI 出口與相關投資，非科技產業與內需的感受差很多（標普也點出這一點）。<span class="tag add">補充</span></div>
<div class="note">資料限制：研究做到一半搜尋額度用完，後半段只能直接讀已知網址。2018–19 年與 2022 年案例的部分背景、2023–2025 年的輪動順序、信用利差門檻的歷史依據，都是記憶、未查證，本頁已逐處標示；完整清單見<a href="#/sources">來源與未確認</a>。</div>
