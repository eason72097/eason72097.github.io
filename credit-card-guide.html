<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信用卡速查指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&display=swap" rel="stylesheet">
<style>
/* ── 🟤 溫暖敘事 Warm Narrative ── */
:root {
  --bg:#f5f3ef; --bg-sub:#eae7e0; --ink:#1c1c28; --ink-soft:#6a6878;
  --accent:#b85a2b; --accent2:#3a7ca5; --card:#ffffff; --border:#d8d4cb;
  --core-c:#b85a2b; --core-bg:rgba(184,90,43,.1);
  --keep-c:#3a7ca5; --keep-bg:rgba(58,124,165,.1);
  --eval-c:#b88a2b; --eval-bg:rgba(184,138,43,.1);
  --cut-c:#999;     --cut-bg:rgba(153,153,153,.08);
  --hover-lift:0 4px 16px rgba(28,28,40,.07);
  --reserve:0px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101018; --bg-sub:#1a1a28; --ink:#e0ddd6; --ink-soft:#9090a0;
  --accent:#d9884a; --accent2:#5aa0cc; --card:#1c1c2e; --border:#2e2e40;
  --core-c:#d9884a; --core-bg:rgba(217,136,74,.15);
  --keep-c:#5aa0cc; --keep-bg:rgba(90,160,204,.15);
  --eval-c:#d4a840; --eval-bg:rgba(212,168,64,.15);
  --cut-c:#777;     --cut-bg:rgba(119,119,119,.12);
  --hover-lift:0 4px 16px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#101018; --bg-sub:#1a1a28; --ink:#e0ddd6; --ink-soft:#9090a0;
  --accent:#d9884a; --accent2:#5aa0cc; --card:#1c1c2e; --border:#2e2e40;
  --core-c:#d9884a; --core-bg:rgba(217,136,74,.15);
  --keep-c:#5aa0cc; --keep-bg:rgba(90,160,204,.15);
  --eval-c:#d4a840; --eval-bg:rgba(212,168,64,.15);
  --cut-c:#777;     --cut-bg:rgba(119,119,119,.12);
  --hover-lift:0 4px 16px rgba(0,0,0,.3);
}
@media(min-width:1280px){
  :root[data-reserve="on"]{ --reserve:340px; }
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Helvetica Neue",Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
h1,h2,h3{font-family:"Fraunces","Noto Serif TC",serif;text-wrap:balance}
.wrap{max-width:min(1100px,calc(100vw - var(--reserve) - 48px));margin:0 auto;padding:0 24px}

/* ── Topbar ── */
.topbar{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:10px 0;
}
.topbar-inner{
  display:flex;align-items:center;justify-content:space-between;
  max-width:min(1100px,calc(100vw - var(--reserve) - 48px));
  margin:0 auto;padding:0 24px;
}
.topbar-brand{font-weight:600;font-size:.95rem;color:var(--ink);text-decoration:none}
.topbar-actions{display:flex;gap:8px;align-items:center}
.btn-icon{
  background:none;border:1px solid var(--border);border-radius:8px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink-soft);font-size:1rem;
  transition:border-color .2s,color .2s;
}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}

/* ── Hero ── */
.hero{padding:48px 0 24px;text-align:center}
.hero h1{font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:700;margin-bottom:8px}
.hero h1 .accent{color:var(--accent)}
.hero .sub{color:var(--ink-soft);font-size:.92rem}
.hero .sub a{color:var(--accent2);text-decoration:none}
.hero .sub a:hover{text-decoration:underline}
.hero .verified{
  display:inline-block;margin-top:12px;padding:4px 14px;border-radius:6px;
  background:var(--bg-sub);color:var(--ink-soft);font-size:.78rem;
}

/* ── Tabs ── */
.tab-bar{
  display:flex;gap:4px;padding:8px 0 16px;
  border-bottom:2px solid var(--border);margin-bottom:24px;
  overflow-x:auto;
}
.tab-btn{
  padding:8px 20px;border:none;border-radius:8px 8px 0 0;
  background:transparent;color:var(--ink-soft);font-size:.92rem;
  font-weight:500;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-2px;
  transition:all .2s;
}
.tab-btn:hover{color:var(--ink);background:var(--bg-sub)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--bg-sub)}
.tab-panel{padding-bottom:48px}

/* ── Chips ── */
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.chip-label{font-size:.78rem;color:var(--ink-soft);margin-right:4px;white-space:nowrap}
.chip{
  padding:4px 12px;border:1px solid var(--border);border-radius:20px;
  background:transparent;color:var(--ink-soft);font-size:.8rem;
  cursor:pointer;transition:all .2s;white-space:nowrap;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.counter{font-size:.8rem;color:var(--ink-soft);margin-left:auto;white-space:nowrap}

/* ── Credit Card Cards ── */
.cc-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;
}
.cc-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:20px;transition:box-shadow .25s,transform .25s;
}
.cc-card:hover{box-shadow:var(--hover-lift);transform:translateY(-2px)}
.cc-card.hide{display:none}
.cc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.cc-bank{font-size:.78rem;color:var(--ink-soft);letter-spacing:.04em}
.cc-badge{font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:4px}
.cc-name{font-family:"Fraunces",serif;font-size:1.15rem;font-weight:600;margin-bottom:6px}
.cc-mission{font-size:.85rem;color:var(--ink-soft);margin-bottom:12px;line-height:1.5}
.cc-reward-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600;margin-bottom:2px}
.cc-reward{font-size:.85rem;line-height:1.6;margin-bottom:10px}
.cc-meta{display:flex;gap:16px;font-size:.78rem;color:var(--ink-soft);flex-wrap:wrap}
.cc-details{margin-top:12px;border-top:1px solid var(--border);padding-top:8px}
.cc-details summary{font-size:.82rem;color:var(--accent);cursor:pointer;font-weight:500}
.cc-details summary:hover{text-decoration:underline}
.cc-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:10px;font-size:.82rem}
.cc-detail-grid .dl{display:block;font-size:.7rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px}
.cc-link{display:inline-block;margin-top:10px;font-size:.82rem;color:var(--accent2);text-decoration:none}
.cc-link:hover{text-decoration:underline}

/* ── Card status colors (via data-status) ── */
.cc-card[data-status="core"]{border-left:3px solid var(--core-c)}
.cc-card[data-status="keep"]{border-left:3px solid var(--keep-c)}
.cc-card[data-status="eval"]{border-left:3px solid var(--eval-c)}
.cc-card[data-status="cut"]{border-left:3px solid var(--cut-c);opacity:.75}

/* ── Scene Table ── */
.search-box{
  display:flex;gap:8px;margin-bottom:12px;
}
.search-input{
  flex:1;padding:8px 14px;border:1px solid var(--border);border-radius:8px;
  background:var(--card);color:var(--ink);font-size:.88rem;
  outline:none;transition:border-color .2s;max-width:360px;
}
.search-input:focus{border-color:var(--accent)}
.scene-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scene-table{width:100%;border-collapse:collapse;font-size:.85rem}
.scene-table th{
  text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);
  font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);font-weight:600;white-space:nowrap;
}
.scene-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.scene-table tr:hover td{background:var(--bg-sub)}
.scene-table tr.hide{display:none}
.scene-name{font-weight:500;white-space:nowrap}
.scene-reward{color:var(--accent);font-weight:600;white-space:nowrap}
.scene-cond{font-size:.8rem;color:var(--ink-soft);min-width:200px;max-width:340px}
.scene-alt{font-size:.8rem;color:var(--ink-soft)}
.scene-tip{
  margin-top:16px;padding:12px 16px;border-radius:8px;
  background:var(--bg-sub);font-size:.85rem;color:var(--ink-soft);
  border-left:3px solid var(--accent);
}

/* ── Benefits ── */
.benefit-group{margin-bottom:24px}
.benefit-group-title{
  font-size:1rem;font-weight:600;margin-bottom:10px;
  padding-bottom:6px;border-bottom:1px solid var(--border);
  color:var(--accent);
}
.benefit-row{
  padding:12px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;margin-bottom:8px;
}
.benefit-feature{font-weight:600;font-size:.9rem;margin-bottom:4px}
.benefit-detail{font-size:.82rem;color:var(--ink-soft);line-height:1.7}
.benefit-detail .sep{color:var(--border);margin:0 2px}

/* ── Footer ── */
.footer{
  text-align:center;padding:32px 0 40px;color:var(--ink-soft);
  font-size:.78rem;border-top:1px solid var(--border);margin-top:24px;
}
.footer a{color:var(--accent2);text-decoration:none}
.footer a:hover{text-decoration:underline}

/* ── Responsive ── */
@media(max-width:600px){
  .wrap{padding:0 14px}
  .topbar-inner{padding:0 14px}
  .hero{padding:32px 0 16px}
  .cc-grid{grid-template-columns:1fr}
  .cc-detail-grid{grid-template-columns:1fr}
  .tab-btn{padding:8px 14px;font-size:.85rem}
  .scene-cond{min-width:160px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important}
}
</style>
</head>

  <!-- Tab 3: Benefits -->
  <div class="tab-panel" id="tab-benefits" hidden>
    <div id="benefits-list"></div>
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    資料來源：各銀行官網 · 查證日 2026/9/10 · Built by Eason<br>
    <a href="/">← 回生活基地</a>
  </div>
</footer>

<script>
// ── App logic ──
(function(){
const root = document.documentElement;
const $=id=>document.getElementById(id);

/* ── Theme ── */
let theme=null;
try{theme=localStorage.getItem('cc-theme')}catch(e){}
function applyTheme(t){
  if(t)root.setAttribute('data-theme',t);else root.removeAttribute('data-theme');
  const dk=t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches);
  $('btn-theme').textContent=dk?'☀':'◑';
  $('btn-theme').title=dk?'切換淺色':'切換深色';
}
applyTheme(theme);
$('btn-theme').onclick=()=>{
  const dk=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
  theme=dk?'light':'dark';
  try{localStorage.setItem('cc-theme',theme)}catch(e){}
  applyTheme(theme);
};

/* ── Reserve ── */
let reserve='on';
try{reserve=localStorage.getItem('cc-reserve')||'on'}catch(e){}
function applyReserve(v){
  root.setAttribute('data-reserve',v);
  $('btn-reserve').style.opacity=v==='on'?1:.45;
  $('btn-reserve').title=v==='on'?'關閉右側留白':'開啟右側留白';
}
applyReserve(reserve);
$('btn-reserve').onclick=()=>{
  reserve=reserve==='on'?'off':'on';
  try{localStorage.setItem('cc-reserve',reserve)}catch(e){}
  applyReserve(reserve);
};

/* ── Tabs ── */
const tabs=document.querySelectorAll('.tab-btn');
const panels=document.querySelectorAll('.tab-panel');
tabs.forEach(btn=>{
  btn.onclick=()=>{
    tabs.forEach(t=>t.classList.remove('active'));
    panels.forEach(p=>p.hidden=true);
    btn.classList.add('active');
    $(btn.dataset.tab).hidden=false;
  };
});

/* ── Tab 1: Credit Cards ── */
let cardStatusFilter='all', cardBankFilter='all';

function renderCards(){
  const grid=$('card-grid');
  let shown=0, total=CARDS.length;
  const items=CARDS.map(c=>{
    const show=(cardStatusFilter==='all'||c.status===cardStatusFilter)
      &&(cardBankFilter==='all'||c.bank===cardBankFilter);
    if(show) shown++;
    const s=STATUS_MAP[c.status];
    return `<div class="cc-card${show?'':' hide'}" data-status="${c.status}" data-bank="${c.bank}" data-id="${c.id}">
      <div class="cc-head">
        <span class="cc-bank">${c.bank}</span>
        <span class="cc-badge" style="color:${s.color};background:${s.bg}">${s.label}</span>
      </div>
      <div class="cc-name">${c.name}</div>
      <div class="cc-mission">${c.mission}</div>
      <div class="cc-reward-label">最佳回饋</div>
      <div class="cc-reward">${c.best}</div>
      <div class="cc-meta">
        <span>基本：${c.basic}</span>
        <span>年費：${c.fee}</span>
      </div>
      <details class="cc-details">
        <summary>展開詳情</summary>
        <div class="cc-detail-grid">
          <div><span class="dl">免年費</span>${c.waiver}</div>
          <div><span class="dl">扣款帳戶</span>${c.debit}</div>
          <div><span class="dl">必要設定</span>${c.setup}</div>
          <div><span class="dl">方案期間</span>${c.period}</div>
        </div>
        <a class="cc-link" href="${c.url}" target="_blank" rel="noopener">官網方案頁 →</a>
      </details>
    </div>`;
  });
  grid.innerHTML=items.join('');
  $('card-count').textContent=`顯示 ${shown} / ${total} 張`;
}

// Status chips
document.querySelectorAll('#status-chips .chip').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('#status-chips .chip').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    cardStatusFilter=btn.dataset.v;
    renderCards();
  };
});

// Bank chips
const bankChips=$('bank-chips');
bankChips.innerHTML=`<button class="chip on" data-v="all">全部</button>`+BANKS.map(b=>`<button class="chip" data-v="${b}">${b}</button>`).join('');
bankChips.querySelectorAll('.chip').forEach(btn=>{
  btn.onclick=()=>{
    bankChips.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    cardBankFilter=btn.dataset.v;
    renderCards();
  };
});

renderCards();

/* ── Tab 2: Spending Scenes ── */
let sceneCatFilter='all', sceneSearch='';

function renderScenes(){
  const tbody=$('scene-tbody');
  let shown=0;
  const rows=SCENES.map(s=>{
    const matchCat=sceneCatFilter==='all'||s.cat===sceneCatFilter;
    const matchSearch=!sceneSearch||s.scene.toLowerCase().includes(sceneSearch)||s.primary.toLowerCase().includes(sceneSearch);
    const show=matchCat&&matchSearch;
    if(show) shown++;
    return `<tr class="${show?'':'hide'}">
      <td class="scene-name">${s.scene}</td>
      <td><strong>${s.primary}</strong></td>
      <td class="scene-reward">${s.reward}</td>
      <td class="scene-cond">${s.cond}</td>
      <td class="scene-alt">${s.alt}</td>
    </tr>`;
  });
  tbody.innerHTML=rows.join('');
  $('scene-count').textContent=`顯示 ${shown} / ${SCENES.length} 筆`;
}

// Scene cat chips
const sceneChips=$('scene-chips');
sceneChips.innerHTML=SCENE_CATS.map(c=>`<button class="chip${c.key==='all'?' on':''}" data-v="${c.key}">${c.label}</button>`).join('');
sceneChips.querySelectorAll('.chip').forEach(btn=>{
  btn.onclick=()=>{
    sceneChips.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    sceneCatFilter=btn.dataset.v;
    renderScenes();
  };
});

$('scene-search').oninput=e=>{
  sceneSearch=e.target.value.toLowerCase();
  renderScenes();
};

renderScenes();

/* ── Tab 3: Benefits ── */
function renderBenefits(){
  const container=$('benefits-list');
  const groups={};
  BENEFITS.forEach(b=>{
    if(!groups[b.group])groups[b.group]=[];
    groups[b.group].push(b);
  });
  const groupLabels={旅遊:"✈️ 旅遊相關",交通:"🚗 交通與加值",保費:"💰 保費與稅費",海外:"🌏 海外相關",生活:"🏠 生活"};
  let html='';
  for(const[g,items]of Object.entries(groups)){
    html+=`<div class="benefit-group">
      <h3 class="benefit-group-title">${groupLabels[g]||g}</h3>
      ${items.map(b=>`<div class="benefit-row">
        <div class="benefit-feature">${b.feature}</div>
        <div class="benefit-detail">${b.detail.replace(/｜/g,'<span class="sep">｜</span>')}</div>
      </div>`).join('')}
    </div>`;
  }
  container.innerHTML=html;
}

renderBenefits();

/* ── Back to hub ── */
const backBtn=$('btn-back');
if(backBtn) backBtn.onclick=()=>location.href='/';

})();

</script>
